    <style>
        .wordbook-page {
            max-width: 1180px;
            margin: 0 auto;
        }

        .wordbook-hero {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            padding: 30px 34px;
            color: #fff;
            background:
                radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.24), transparent 34%),
                linear-gradient(135deg, #283593 0%, #1565c0 48%, #00796b 100%);
            box-shadow: 0 16px 36px rgba(38, 50, 56, 0.20);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .wordbook-hero::after {
            content: '';
            position: absolute;
            right: -70px;
            bottom: -100px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 26px solid rgba(255, 255, 255, 0.08);
        }

        .wordbook-hero__copy {
            position: relative;
            z-index: 1;
            max-width: 720px;
        }

        .wordbook-hero__eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.78;
            margin-bottom: 8px;
        }

        .wordbook-hero h2 {
            margin: 0;
            font-size: 38px;
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .wordbook-hero p {
            margin: 10px 0 0;
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.9;
        }

        .wordbook-hero__badge {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            width: 168px;
            min-height: 132px;
            padding: 16px 12px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.22);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .wordbook-hero__review {
            margin-top: 12px;
            white-space: nowrap;
        }

        .wordbook-hero__badge-value {
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
            margin-top: 8px;
        }

        .wordbook-hero__badge-label {
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 0.08em;
            opacity: 0.8;
        }

        .wordbook-stat-card {
            position: relative;
            height: 100%;
            border-radius: 15px !important;
            padding: 16px 16px 14px;
            overflow: hidden;
        }

        .wordbook-stat-card::after {
            content: '';
            position: absolute;
            right: -18px;
            top: -22px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(21, 101, 192, 0.06);
        }

        .wordbook-stat-card__icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: rgba(21, 101, 192, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .wordbook-stat-card__value {
            font-size: 27px;
            line-height: 1;
            font-weight: 800;
            color: #263238;
        }

        .wordbook-stat-card__label {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #455a64;
        }

        .wordbook-stat-card__sub {
            margin-top: 3px;
            font-size: 11px;
            color: #90a4ae;
        }

        .wordbook-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 10px 0;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .wordbook-tab {
            appearance: none;
            border: none;
            background: transparent;
            border-radius: 12px 12px 0 0;
            padding: 12px 15px 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #607d8b;
            cursor: pointer;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .wordbook-tab:hover {
            background: #eceff1;
            color: #37474f;
        }

        .wordbook-tab.active {
            color: #1565c0;
            background: #e3f2fd;
            box-shadow: inset 0 -3px 0 #1565c0;
        }

        .wordbook-tab__count {
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            background: #ff7043;
            color: #fff;
            font-size: 10px;
            line-height: 20px;
            text-align: center;
        }

        .wordbook-panel {
            height: 100%;
            border-radius: 15px !important;
            padding: 18px;
        }

        .wordbook-panel--next {
            background: linear-gradient(180deg, #fffdf4 0%, #ffffff 100%);
        }

        .wordbook-panel__head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .wordbook-panel__title {
            font-size: 15px;
            font-weight: 800;
            color: #263238;
        }

        .wordbook-panel__title.small {
            font-size: 13px;
        }

        .wordbook-panel__sub {
            margin-top: 2px;
            font-size: 11px;
            color: #90a4ae;
        }

        .wordbook-today-stat {
            border-radius: 12px;
            background: #f5f7fa;
            padding: 12px 10px;
            text-align: center;
        }

        .wordbook-today-stat__value {
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
            color: #1565c0;
        }

        .wordbook-today-stat__label {
            margin-top: 5px;
            font-size: 11px;
            font-weight: 600;
            color: #607d8b;
        }

        .wordbook-table {
            border-radius: 10px;
            overflow: hidden;
        }

        .wordbook-table a {
            color: #1565c0;
            text-decoration: none;
            font-weight: 600;
        }

        .wordbook-table a:hover {
            text-decoration: underline;
        }

        .wordbook-empty-inline {
            padding: 18px 12px;
            border-radius: 12px;
            background: #f5f7fa;
            color: #78909c;
            font-size: 12px;
            text-align: center;
        }

        .wordbook-history {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .wordbook-history__item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f2f4;
        }

        .wordbook-history__item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .wordbook-history__title {
            font-size: 12px;
            font-weight: 600;
            color: #37474f;
        }

        .wordbook-history__meta {
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            font-size: 10px;
            color: #90a4ae;
        }

        .wordbook-mini-trophy {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff8e1;
            border: 2px solid #ffe082;
        }

        .wordbook-mini-trophy.tier-silver {
            background: #eceff1;
            border-color: #b0bec5;
        }

        .wordbook-mini-trophy.tier-bronze {
            background: #fbe9e7;
            border-color: #ffab91;
        }

        .wordbook-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .wordbook-toolbar__title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: #263238;
        }

        .wordbook-toolbar__actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .wordbook-empty {
            padding: 44px 20px;
            border: 1px dashed #cfd8dc;
            border-radius: 16px;
            text-align: center;
            background: #fafafa;
        }

        .wordbook-empty__title {
            margin-top: 10px;
            font-size: 17px;
            font-weight: 800;
            color: #37474f;
        }

        .wordbook-empty__text {
            margin-top: 5px;
            font-size: 12px;
            color: #78909c;
        }

        .wordbook-review-summary {
            max-width: 620px;
            margin: 24px auto;
            padding: 30px 24px;
            border: 1px solid #cfd8dc;
            border-radius: 18px;
            text-align: center;
            background: linear-gradient(180deg, #f7fbfb 0%, #ffffff 100%);
        }

        .wordbook-review-summary h3 {
            margin: 10px 0 0;
            font-size: 24px;
            font-weight: 800;
            color: #263238;
        }

        .wordbook-review-summary p {
            margin: 7px 0 0;
            font-size: 13px;
            line-height: 1.7;
            color: #607d8b;
        }

        .wordbook-review-session {
            max-width: 760px;
            margin: 8px auto 0;
        }

        .wordbook-review-progress {
            font-size: 13px;
            font-weight: 800;
            color: #00695c;
        }

        .wordbook-review-card {
            position: relative;
            border-radius: 20px !important;
            padding: 26px 26px 24px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 137, 123, 0.08), transparent 46%),
                #ffffff;
            box-shadow: 0 12px 28px rgba(38, 50, 56, 0.09) !important;
        }

        .wordbook-review-card__source {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #90a4ae;
            text-transform: uppercase;
            min-height: 15px;
        }

        .wordbook-review-card__jp {
            margin-top: 18px;
            font-size: clamp(34px, 6vw, 54px);
            line-height: 1.24;
            font-weight: 800;
            color: #1a237e;
            word-break: break-word;
        }

        .wordbook-review-card__reading {
            margin-top: 5px;
            font-size: 15px;
            color: #1e88e5;
        }

        .wordbook-review-card__answer-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #26a69a;
        }

        .wordbook-review-card__en {
            margin: 7px auto 0;
            max-width: 560px;
            font-size: clamp(20px, 3vw, 28px);
            line-height: 1.45;
            font-weight: 700;
            color: #004d40;
            word-break: break-word;
        }

        .wordbook-review-stats {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0 4px;
        }

        .wordbook-review-stat {
            min-width: 92px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f5f7fa;
        }

        .wordbook-review-stat__value {
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
            color: #00695c;
        }

        .wordbook-review-stat__label {
            margin-top: 4px;
            font-size: 10px;
            color: #78909c;
        }

        .wordbook-trophy {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 13px;
            height: 100%;
            border-radius: 15px !important;
            padding: 15px;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .wordbook-trophy:not(.locked):hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(38, 50, 56, 0.10) !important;
        }

        .wordbook-trophy.locked {
            background: #fafafa;
        }

        .wordbook-trophy.locked .wordbook-trophy__icon {
            filter: grayscale(1);
            opacity: 0.55;
        }

        .wordbook-trophy.locked .wordbook-trophy__title,
        .wordbook-trophy.locked .wordbook-trophy__desc {
            color: #90a4ae;
        }

        .wordbook-trophy__icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff8e1;
            border: 2px solid #ffe082;
        }

        .wordbook-trophy.tier-silver .wordbook-trophy__icon {
            background: #eceff1;
            border-color: #b0bec5;
        }

        .wordbook-trophy.tier-bronze .wordbook-trophy__icon {
            background: #fbe9e7;
            border-color: #ffab91;
        }

        .wordbook-trophy__body {
            flex: 1;
            min-width: 0;
        }

        .wordbook-trophy__title {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 5px;
            font-size: 14px;
            font-weight: 800;
            color: #37474f;
        }

        .wordbook-trophy__desc {
            margin-top: 3px;
            font-size: 11px;
            line-height: 1.5;
            color: #607d8b;
        }

        .wordbook-trophy__meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 5px;
            font-size: 10px;
            color: #90a4ae;
        }

        .wordbook-trophy__tier {
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .wordbook-graduated-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 2px;
            border-bottom: 1px solid #f0f2f4;
            font-size: 12px;
        }

        .wordbook-graduated-item:last-child {
            border-bottom: none;
        }

        .wordbook-graduated-item__jp {
            font-weight: 700;
            color: #37474f;
        }

        .wordbook-graduated-item__en {
            color: #78909c;
        }

        .wordbook-graduated-item__date {
            margin-left: auto;
            font-size: 10px;
            color: #b0bec5;
            white-space: nowrap;
        }

        @media (max-width: 960px) {
            .wordbook-hero {
                flex-direction: column;
                align-items: stretch;
            }

            .wordbook-hero__badge {
                width: 100%;
                min-height: 0;
                padding: 12px 16px;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 10px;
                text-align: left;
            }

            .wordbook-hero__badge-value,
            .wordbook-hero__badge-label {
                margin-top: 0;
            }

            .wordbook-hero__badge-value {
                font-size: 26px;
            }

            .wordbook-hero__review {
                margin-top: 0;
                margin-left: auto;
            }
        }

        @media (max-width: 600px) {
            .wordbook-hero {
                padding: 24px 22px;
                border-radius: 18px;
            }

            .wordbook-hero h2 {
                font-size: 31px;
            }

            .wordbook-tab {
                padding: 10px 11px;
                font-size: 12px;
            }

            .wordbook-panel {
                padding: 15px;
            }

            .wordbook-review-card {
                padding: 22px 16px 20px;
            }

            .wordbook-review-card__jp {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">My Word Book</h1>

    <v-app id="App">
        <template>

            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Japanese Language > My Word Book</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" fluid class="pa-5 wordbook-page">

                        <section class="wordbook-hero">
                            <div class="wordbook-hero__copy">
                                <div class="wordbook-hero__eyebrow">Japanese Learning</div>
                                <h2>My Word Book</h2>
                                <p>Collect tricky words, review them with cards, and keep your study record and trophies in one place.</p>
                            </div>
                            <div class="wordbook-hero__badge">
                                <v-icon size="44">mdi-notebook-outline</v-icon>
                                <div class="wordbook-hero__badge-value">{{ Weak_Words.length }}</div>
                                <div class="wordbook-hero__badge-label">Tricky words</div>
                                <v-btn small rounded color="white" class="primary--text wordbook-hero__review"
                                    :disabled="!Weak_Words.length" @click="Start_Review(Weak_Words)">
                                    <v-icon left small>mdi-play</v-icon>Quick review
                                </v-btn>
                            </div>
                        </section>

                        <v-row dense class="mt-2">
                            <v-col v-for="stat in Overview_Stats" :key="stat.key" cols="6" sm="4" :md="true">
                                <v-card outlined class="wordbook-stat-card">
                                    <div class="wordbook-stat-card__icon">
                                        <v-icon :color="stat.color">{{ stat.icon }}</v-icon>
                                    </div>
                                    <div class="wordbook-stat-card__value">{{ stat.value }}</div>
                                    <div class="wordbook-stat-card__label">{{ stat.label }}</div>
                                    <div class="wordbook-stat-card__sub">{{ stat.sub }}</div>
                                </v-card>
                            </v-col>
                        </v-row>

                        <v-card outlined class="mt-4" style="border-radius: 18px; overflow: hidden;">
                            <div class="wordbook-tabs">
                                <button v-for="tab in Tabs" :key="tab.value" type="button"
                                    :class="['wordbook-tab', { active: Selected_Tab === tab.value }]"
                                    @click="Active_Tab = tab.value">
                                    <v-icon small>{{ tab.icon }}</v-icon>
                                    <span>{{ tab.label }}</span>
                                    <span v-if="tab.value === 'weak' && Weak_Words.length" class="wordbook-tab__count">{{ Weak_Words.length }}</span>
                                </button>
                            </div>

                            <v-card-text class="pa-4 pa-md-5">

                                <!-- Overview -->
                                <div v-if="Active_Tab === 'overview'">
                                    <v-row dense>
                                        <v-col cols="12" md="7">
                                            <v-card outlined class="wordbook-panel">
                                                <div class="wordbook-panel__head">
                                                    <div>
                                                        <div class="wordbook-panel__title">Today's Study</div>
                                                        <div class="wordbook-panel__sub">{{ Today_Label }}</div>
                                                    </div>
                                                    <v-icon color="indigo">mdi-calendar-today</v-icon>
                                                </div>

                                                <v-row dense>
                                                    <v-col v-for="item in Today_Items" :key="item.key" cols="3">
                                                        <div class="wordbook-today-stat">
                                                            <div class="wordbook-today-stat__value">{{ item.value }}</div>
                                                            <div class="wordbook-today-stat__label">{{ item.label }}</div>
                                                        </div>
                                                    </v-col>
                                                </v-row>

                                                <v-divider class="my-4"></v-divider>

                                                <div class="d-flex align-center">
                                                    <div class="flex-grow-1">
                                                        <div class="wordbook-panel__title small">Studied Pages</div>
                                                        <div class="wordbook-panel__sub">{{ Plural(Source_Rows.length, 'page') }}</div>
                                                    </div>
                                                    <v-btn small text color="primary" @click="Active_Tab = 'weak'">View tricky words</v-btn>
                                                </div>

                                                <v-simple-table v-if="Source_Rows.length" dense class="wordbook-table mt-2">
                                                    <template v-slot:default>
                                                        <thead>
                                                            <tr>
                                                                <th class="text-left">Page</th>
                                                                <th class="text-center">Cards</th>
                                                                <th class="text-center">Tricky</th>
                                                                <th class="text-center">Reviews</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <tr v-for="page in Source_Rows" :key="page.url">
                                                                <td>
                                                                    <a :href="Page_Url(page.url)">{{ page.title || page.url }}</a>
                                                                </td>
                                                                <td class="text-center">{{ page.flips }}</td>
                                                                <td class="text-center">{{ page.weakAdded }}</td>
                                                                <td class="text-center">{{ page.reviews }}</td>
                                                            </tr>
                                                        </tbody>
                                                    </template>
                                                </v-simple-table>
                                                <div v-else class="wordbook-empty-inline">
                                                    No study records yet. Flip a word card to get started.
                                                </div>
                                            </v-card>
                                        </v-col>

                                        <v-col cols="12" md="5">
                                            <v-card outlined class="wordbook-panel wordbook-panel--next">
                                                <div class="wordbook-panel__head">
                                                    <div>
                                                        <div class="wordbook-panel__title">Next Trophy</div>
                                                        <div class="wordbook-panel__sub">{{ Unlocked_Count }} / {{ Trophies.length }} unlocked</div>
                                                    </div>
                                                    <v-icon color="amber darken-3">mdi-trophy-outline</v-icon>
                                                </div>

                                                <template v-if="Next_Trophy">
                                                    <div class="d-flex align-center">

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js" integrity="sha384-smVS78N63G0uFpVH9bKdb+2YIW7Q9eFrle79imo+AWW6YLluQxAEK7kxLOt1bNex" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.7.2/dist/vuetify.js" integrity="sha384-IufsRL4FQ+k4aWgxYvH6I1RoIrzL8Ynna+E/AavDQE9hD+UBZQLSTX2+7pPQWNsr" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha384-fJU6sGmyn07b+uD1nMk7/iSb4yvaowcueiQhfVgQuD98rfva8mcr1eSvjchfpMrH" crossorigin="anonymous"></script>
    <script src="Asset/Javascript/Common.js?v=1.05"></script>
    <script src="Asset/Javascript/Word.js"></script>

    <script>
        let vue = new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Common],
            data: {
                Active_Tab: 'overview',
                Weak_Words: [],
                Graduated_Words: [],
                Stats: {},
                History: [],
                Trophies: [],
                Unlocked_Ids: [],
                Search_Text: '',
                Source_Filter: 'all',
                Sort_Mode: 'newest',
                Trophy_Filter: 'all',
                Review_Shuffle: true,
                Review_Finished: false,
                Review_Queue: [],
                Review_Index: 0,
                Review_Revealed: false,
                Review_Answered: 0,
                Review_Correct: 0,
                Snackbar: false,
                Snackbar_Text: '',
                Tabs: [
                    { value: 'overview', label: 'Overview', icon: 'mdi-view-dashboard-outline' },
                    { value: 'weak', label: 'Tricky Words', icon: 'mdi-bookmark-multiple-outline' },
                    { value: 'trophies', label: 'Trophies', icon: 'mdi-trophy-outline' }
                ],
                Sort_Options: [
                    { text: 'Newest first', value: 'newest' },
                    { text: 'Oldest first', value: 'oldest' },
                    { text: 'Most mistakes', value: 'hardest' },
                    { text: 'Japanese order', value: 'alpha' }
                ]
            },
            computed: {
                Selected_Tab() {
                    // The review session renders in the same area as the tabs,
                    // so keep "Tricky Words" highlighted while reviewing.
                    return this.Active_Tab === 'review' ? 'weak' : this.Active_Tab;
                },
                Today() {
                    return window.FUM_WordBook.Get_Today(this.Stats);
                },
                Accuracy() {
                    const total = Number(this.Stats.totalReviews) || 0;
                    if (!total) return 0;
                    return Math.round(((Number(this.Stats.totalCorrect) || 0) / total) * 100);
                },
                Current_Streak() {
                    return window.FUM_WordBook.Get_Display_Streak(this.Stats);
                },
                Today_Label() {
                    return new Date().toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
                    });
                },
                Today_Items() {
                    const today = this.Today;
                    return [
                        { key: 'flips', label: 'Cards', value: today.flips || 0 },
                        { key: 'weakAdded', label: 'Added', value: today.weakAdded || 0 },
                        { key: 'reviews', label: 'Reviews', value: today.reviews || 0 },
                        { key: 'graduated', label: 'Graduated', value: today.graduated || 0 }
                    ];
                },
                Overview_Stats() {
                    const stats = this.Stats || {};
                    return [
                        {
                            key: 'flips',
                            label: 'Cards flipped',
                            value: Number(stats.totalFlips) || 0,
                            sub: 'Today: ' + (this.Today.flips || 0),
                            icon: 'mdi-cards-outline',
                            color: 'indigo'
                        },
                        {
                            key: 'weak',
                            label: 'Tricky words',
                            value: this.Weak_Words.length,
                            sub: 'Total added: ' + (Number(stats.totalWeakAdded) || 0),
                            icon: 'mdi-bookmark-outline',
                            color: 'deep-orange'
                        },
                        {
                            key: 'graduated',
                            label: 'Graduated words',
                            value: Number(stats.totalGraduated) || 0,
                            sub: 'Total reviews: ' + (Number(stats.totalReviews) || 0),
                            icon: 'mdi-school-outline',
                            color: 'teal'
                        },
                        {
                            key: 'streak',
                            label: 'Day streak',
                            value: this.Current_Streak + (this.Current_Streak === 1 ? ' day' : ' days'),
                            sub: 'Best: ' + (Number(stats.bestStreak) || 0) + ((Number(stats.bestStreak) || 0) === 1 ? ' day' : ' days'),
                            icon: 'mdi-fire',
                            color: 'orange'
                        },
                        {
                            key: 'accuracy',
                            label: 'Review accuracy',
                            value: this.Accuracy + '%',
                            sub: (Number(stats.totalCorrect) || 0) + ' / ' + (Number(stats.totalReviews) || 0) + ' correct',
                            icon: 'mdi-target',
                            color: 'green'
                        }
                    ];
                },
                Source_Options() {
                    const counts = {};
                    this.Weak_Words.forEach(function (word) {
                        if (!word.source) return;
                        counts[word.source] = (counts[word.source] || 0) + 1;
                    });
                    const options = [{ text: 'All pages', value: 'all' }];
                    Object.keys(counts).sort().forEach(function (source) {
                        options.push({ text: source + ' (' + counts[source] + ')', value: source });
                    });
                    return options;
                },
                Filtered_Weak() {
                    let rows = (this.Weak_Words || []).slice();
                    const query = (this.Search_Text || '').trim().toLowerCase();
                    if (query) {
                        rows = rows.filter(function (word) {
                            return [word.japanese, word.reading, word.english, word.source]
                                .join(' ').toLowerCase().indexOf(query) !== -1;
                        });
                    }
                    if (this.Source_Filter !== 'all') {
                        rows = rows.filter(function (word) { return word.source === this.Source_Filter; }, this);
                    }
                    if (this.Sort_Mode === 'newest') {
                        rows.sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
                    } else if (this.Sort_Mode === 'oldest') {
                        rows.sort(function (a, b) { return (a.addedAt || 0) - (b.addedAt || 0); });
                    } else if (this.Sort_Mode === 'hardest') {
                        rows.sort(function (a, b) { return (b.wrongCount || 0) - (a.wrongCount || 0); });
                    } else {
                        rows.sort(function (a, b) { return (a.japanese || '').localeCompare(b.japanese || '', 'ja'); });
                    }
                    return rows;
                },
                Source_Rows() {
                    const pages = (this.Stats && this.Stats.pages) || {};
                    return Object.keys(pages).map(function (url) {
                        const page = pages[url] || {};
                        return {
                            url: url,
                            title: page.title || url,
                            flips: Number(page.flips) || 0,
                            weakAdded: Number(page.weakAdded) || 0,
                            reviews: Number(page.reviews) || 0,
                            visits: Number(page.visits) || 0,
                            lastVisit: Number(page.lastVisit) || 0
                        };
                    }).filter(function (page) {
                        return page.flips > 0 || page.weakAdded > 0 || page.reviews > 0;
                    }).sort(function (a, b) {
                        return (b.lastVisit || 0) - (a.lastVisit || 0);
                    });
                },
                Recent_History() {
                    return (this.History || []).slice(0, 8).map(function (event) {
                        return Object.assign({}, event, { info: this.History_Info(event) });
                    }, this);
                },
                Next_Trophy() {
                    const locked = this.Trophies.filter(function (trophy) { return !trophy.unlocked; });
                    if (!locked.length) return null;
                    return locked.slice().sort(function (a, b) { return b.progress - a.progress; })[0];
                },
                Unlocked_Count() {
                    return this.Trophies.filter(function (trophy) { return trophy.unlocked; }).length;
                },
                Trophy_Progress() {
                    if (!this.Trophies.length) return 0;
                    return Math.round((this.Unlocked_Count / this.Trophies.length) * 100);
                },
                Filtered_Trophies() {
                    if (this.Trophy_Filter === 'unlocked') {
                        return this.Trophies.filter(function (trophy) { return trophy.unlocked; });
                    }
                    if (this.Trophy_Filter === 'locked') {
                        return this.Trophies.filter(function (trophy) { return !trophy.unlocked; });
                    }
                    return this.Trophies;
                },
                Current_Review_Word() {
                    if (!this.Review_Queue.length) return null;
                    return this.Review_Queue[this.Review_Index] || null;
                },
                Review_Progress() {
                    if (!this.Review_Queue.length) return 0;
                    return Math.round((this.Review_Answered / this.Review_Queue.length) * 100);
                },
                Review_Accuracy() {
                    if (!this.Review_Answered) return 0;
                    return Math.round((this.Review_Correct / this.Review_Answered) * 100);
                }
            },
            created() {
                this.Refresh_All(false);
                if (window.FUM_WordBook) {
                    window.addEventListener(window.FUM_WordBook.Change_Event, this.On_Store_Change);
                }
            },
            beforeDestroy() {
                if (window.FUM_WordBook) {
                    window.removeEventListener(window.FUM_WordBook.Change_Event, this.On_Store_Change);
                }
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            },
            methods: {
                Notify(text) {
                    this.Snackbar_Text = text;
                    this.Snackbar = true;
                },
                Plural(count, singular, plural) {
                    const value = Number(count) || 0;
                    return value + ' ' + (value === 1 ? singular : (plural || singular + 's'));
                },
                Refresh_All(notify) {
                    if (!window.FUM_WordBook) return;
                    this.Stats = window.FUM_WordBook.Get_Stats();
                    this.Weak_Words = window.FUM_WordBook.Get_Weak();
                    this.Graduated_Words = window.FUM_WordBook.Get_Graduated();
                    this.History = window.FUM_WordBook.Get_History();

                    const previous = this.Unlocked_Ids || [];
                    this.Trophies = window.FUM_WordBook.Get_Trophies();
                    const unlocked = this.Trophies.filter(function (trophy) { return trophy.unlocked; }).map(function (trophy) {
                        return trophy.id;
                    });

                    if (notify) {
                        const newly = unlocked.filter(function (id) { return previous.indexOf(id) === -1; });
                        if (newly.length) {
                            const names = this.Trophies.filter(function (trophy) {
                                return newly.indexOf(trophy.id) !== -1;
                            }).map(function (trophy) {
                                return trophy.title;
                            });
                            this.Notify('Trophy unlocked: ' + names.join(' / '));
                        }
                    }
                    this.Unlocked_Ids = unlocked;
                },
                Reset_Filters() {
                    this.Search_Text = '';
                    this.Source_Filter = 'all';
                    this.Sort_Mode = 'newest';
                },
                Shuffle(rows) {
                    const out = rows.slice();
                    for (let i = out.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        const tmp = out[i];
                        out[i] = out[j];
                        out[j] = tmp;
                    }
                    return out;
                },
                Start_Review(words) {
                    let queue = Array.isArray(words) && words.length ? words.slice() : this.Weak_Words.slice();
                    if (!queue.length) {
                        this.Notify('No tricky words yet. Add some with the bookmark mark on a word card.');
                        this.Active_Tab = 'weak';
                        return;
                    }
                    if (this.Review_Shuffle) queue = this.Shuffle(queue);

                    this.Review_Queue = queue;
                    this.Review_Index = 0;
                    this.Review_Revealed = false;
                    this.Review_Answered = 0;
                    this.Review_Correct = 0;
                    this.Review_Finished = false;
                    this.Active_Tab = 'review';
                },
                Answer_Review(correct) {
                    const word = this.Current_Review_Word;
                    if (!word) return;

                    window.FUM_WordBook.Record_Review(word.id, !!correct);
                    this.Review_Answered += 1;
                    if (correct) this.Review_Correct += 1;
                    this.Refresh_All(true);

                    if (this.Review_Index + 1 >= this.Review_Queue.length) {
                        this.Review_Finished = true;
                    } else {
                        this.Review_Index += 1;
                        this.Review_Revealed = false;
                    }
                },
                Finish_Review() {
                    this.Review_Finished = true;
                },
                Restart_Review() {
                    this.Review_Finished = false;
                    this.Start_Review(this.Weak_Words);
                },
                On_Store_Change() {
                    this.Refresh_All(true);
                },
                Speak(text, lang) {
                    if (!text || !window.speechSynthesis) return;
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang;
                    utterance.rate = 0.85;
                    const voices = window.speechSynthesis.getVoices();
                    const prefix = (lang || '').split('-')[0];
                    for (let i = 0; i < voices.length; i++) {
                        if (voices[i].lang && voices[i].lang.indexOf(prefix) === 0) {
                            utterance.voice = voices[i];
                            break;
                        }
                    }
                    window.speechSynthesis.speak(utterance);
                },
                Format_Date(timestamp) {
                    if (!timestamp) return '';
                    return new Date(timestamp).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });
                },
                Format_DateTime(timestamp) {
                    if (!timestamp) return '';
                    return new Date(timestamp).toLocaleString('en-US', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                },
                History_Info(event) {
                    if (event.type === 'weak') {
                        return { icon: 'mdi-bookmark-plus-outline', color: 'deep-orange', text: 'Added as tricky' };
                    }
                    if (event.type === 'review') {
                        return event.correct
                            ? { icon: 'mdi-check-circle-outline', color: 'teal', text: 'Correct in review' }
                            : { icon: 'mdi-refresh', color: 'amber darken-2', text: 'Missed in review' };
                    }
                    if (event.type === 'graduated') {
                        return { icon: 'mdi-school-outline', color: 'green', text: 'Graduated from tricky list' };
                    }
                    return { icon: 'mdi-cards-outline', color: 'indigo', text: 'Flipped a card' };
                },
                Tier_Color(tier) {
                    if (tier === 'gold') return 'amber darken-3';
                    if (tier === 'silver') return 'blue-grey darken-1';
                    return 'deep-orange darken-2';
                },
                Tier_Label(tier) {
                    if (tier === 'gold') return 'Gold';
                    if (tier === 'silver') return 'Silver';
                    return 'Bronze';
                },
                Page_Url(url) {
                    if (!url) return '#';
                    return './' + url;
                }
            }
        });
    </script>
