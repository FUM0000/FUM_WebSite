<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-B89KY0993B');
    </script>

    <link rel="icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../../Asset/CSS/Common.css?v=1.1" rel="stylesheet" />

    <title>Learning Points</title>
    <meta name="robots" content="index, follow">

    <style>
        .LP_SectionTitle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.08), rgba(25, 118, 210, 0.02));
            border-left: 3px solid #1976D2;
            border-radius: 0 8px 8px 0;
            margin: 0 0 14px;
            max-width: 720px;
        }
        .LP_SectionTitle .v-icon {
            color: #1976D2;
        }
        .LP_SectionTitle span {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .LP_Card {
            display: flex;
            flex-direction: column;
            border-radius: 14px !important;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.07) !important;
            overflow: hidden;
            max-width: 720px;
            margin: 0;
        }
        .LP_TopNav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 10px 16px 6px !important;
        }
        .LP_Count {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1976D2;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .LP_Progress {
            flex: 1;
        }
        .LP_Stage {
            flex-grow: 1;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px ;
        }
        .LP_Point {
            display: flex;
            gap: 18px;
            align-items: center;
            width: 100%;
        }
        .LP_PointBadge {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.05rem;
            color: white;
            background: linear-gradient(135deg, #1976D2, #42A5F5);
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
        }
        .LP_PointIcon {
            flex-shrink: 0;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(25, 118, 210, 0.08);
        }
        .LP_PointIcon .mdi {
            color: #1976D2;
            font-size: 28px;
        }
        .LP_PointText {
            flex: 1;
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(0, 0, 0, 0.8);
        }
        .LP_Highlight {
            color: #D32F2F;
            font-weight: 700;
        }
        .LP_Nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px 14px !important;
        }
        .LP_Dots {
            display: flex;
            gap: 7px;
            align-items: center;
        }
        .LP_Dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: #B0BEC5;
            padding: 0;
            transition: all 0.25s ease;
        }
        .LP_Dot:hover {
            background: #78909C;
            transform: scale(1.2);
        }
        .LP_Dot.Active {
            width: 26px;
            border-radius: 8px;
            background: #1976D2;
        }
        .slide-enter-active,
        .slide-leave-active {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .slide-left-enter {
            opacity: 0;
            transform: translateX(48px);
        }
        .slide-left-leave-to {
            opacity: 0;
            transform: translateX(-48px);
        }
        .slide-right-enter {
            opacity: 0;
            transform: translateX(-48px);
        }
        .slide-right-leave-to {
            opacity: 0;
            transform: translateX(48px);
        }
        @media (max-width: 600px) {
            .LP_Point {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
            .LP_Stage {
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>

    <v-app id="App">
        <template>

            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Japanese Language > Basic > Learning Points</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" class="lp-page">

                        <section class="hero-shell">
                            <div class="hero-grid">
                                <div class="hero-copy">
                                    <h1>Learning Points</h1>
                                    <p class="hero-lead">
                                        Key principles for learning Japanese pronunciation and listening effectively.
                                    </p>
                                </div>
                            </div>
                        </section>

                        <v-row>
                            <v-col cols="12">
                                <div class="LP_SectionTitle">
                                    <v-icon small>mdi-lightbulb-outline</v-icon>
                                    <span>Points to Keep in Mind</span>
                                </div>

                                <v-card class="LP_Card" @click.native="Active = 1">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_Points" :disabled="Page_Points === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_Points + 1 }} / {{ List_Points.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_Points">
                                            <span class="d-none d-sm-inline">{{ Page_Points === List_Points.length - 1 ? 'Next Section' : 'Next' }}</span>
                                            <v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_Points" mode="out-in">
                                            <div :key="Page_Points" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_Points + 1 }}</div>
                                                <div class="LP_PointIcon" v-html="List_Points[Page_Points].icon"></div>
                                                <div class="LP_PointText" v-html="List_Points[Page_Points].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_Points" :key="'p'+i" class="LP_Dot"
                                                :class="{ Active: Page_Points === i }" @click="Go_Points(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                            </v-col>

                            <v-col cols="12" id="LP_Section2">
                                <div class="LP_SectionTitle" style="margin-top: 64px;">
                                    <v-icon small>mdi-music-note-sixteenth-dotted</v-icon>
                                    <span>Five Points for Beautiful Pronunciation</span>
                                </div>

                                <v-card class="LP_Card" @click.native="Active = 2">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_FivePoints" :disabled="Page_FivePoints === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_FivePoints + 1 }} / {{ List_FivePoints.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_FivePoints"
                                            :disabled="Page_FivePoints === List_FivePoints.length - 1">
                                            <span class="d-none d-sm-inline">Next</span><v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_FivePoints" mode="out-in">
                                            <div :key="Page_FivePoints" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_FivePoints + 1 }}</div>
                                                <div class="LP_PointIcon" v-html="List_FivePoints[Page_FivePoints].icon"></div>
                                                <div class="LP_PointText" v-html="List_FivePoints[Page_FivePoints].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_FivePoints" :key="'f'+i" class="LP_Dot"
                                                :class="{ Active: Page_FivePoints === i }" @click="Go_FivePoints(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                            </v-col>
                        </v-row>

                        <div style="height: 160px;"></div>

                    </v-container>
                </transition>
            </v-main>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer></main-footer>

        </template>
    </v-app>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <script src="../../Asset/Javascript/Common.js?v=1.03"></script>

    <script>

        let vue = new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Common],
            data: {
                Active: 1,
                Page_Points: 0,
                Page_FivePoints: 0,
                Direction_Points: 'slide-left',
                Direction_FivePoints: 'slide-left',
                List_Points: [
                    {
                        icon: `<i class="mdi mdi-sleep"></i>`,
                        text: `You don't need to memorize anything today. <span class="LP_Highlight">Relax</span> and try to <span class="LP_Highlight">understand</span>.`
                    },
                    {
                        icon: `<i class="mdi mdi-brain"></i>`,
                        text: `If you can afford to understand them, you can try to memorize them.`
                    },
                    {
                        icon: `<i class="mdi mdi-volume-high"></i>`,
                        text: `Learning by <span class="LP_Highlight">sound</span> is more efficient than learning letters, etc.`
                    },
                    {
                        icon: `<i class="mdi mdi-head-lightbulb-outline"></i>`,
                        text: `<span class="LP_Highlight">The key to memory</span> is to understand the structure of the <span class="LP_Highlight">brain</span> and challenge yourself to remember <span class="LP_Highlight">continuously</span>.`
                    },
                    {
                        icon: `<i class="mdi mdi-hand-pointing-up"></i>`,
                        text: `If you pay attention to the following <span class="LP_Highlight">Five points</span>, you'll be able to pronounce beautiful Japanese.`
                    },
                ],
                List_FivePoints: [
                    {
                        icon: `<i class="mdi mdi-ear-hearing"></i>`,
                        text: `Listen carefully to the sound of the words. Imitate and practice its <span class="LP_Highlight">melody</span> and <span class="LP_Highlight">rhythm</span>.`
                    },
                    {
                        icon: `<i class="mdi mdi-image-outline"></i>`,
                        text: `Picture the images of the words in your mind and speak by <span class="LP_Highlight">connecting sounds</span> so that the sound is not interrupted.`
                    },
                    {
                        icon: `<i class="mdi mdi-volume-high"></i>`,
                        text: `<span class="LP_Highlight">A vowel sound pronounced with consonants</span> is pronounced <span class="LP_Highlight">louder</span> than the consonant's part.`
                    },
                    {
                        icon: `<i class="mdi mdi-volume-low"></i>`,
                        text: `<span class="LP_Highlight">A sound with no consonants, meaning only a vowel</span> is pronounced <span class="LP_Highlight">less loudly</span>.`
                    },
                    {
                        icon: `<i class="mdi mdi-arrow-up-bold"></i>`,
                        text: `Basically, the accent is at the <span class="LP_Highlight">beginning</span> of the word. However, it is a very <span class="LP_Highlight">weak</span> accent.`
                    },
                ]
            },
            computed: {
                Progress_Points() {
                    return (this.Page_Points + 1) / this.List_Points.length * 100;
                },
                Progress_FivePoints() {
                    return (this.Page_FivePoints + 1) / this.List_FivePoints.length * 100;
                },
                SlideName_Points() {
                    return this.Direction_Points;
                },
                SlideName_FivePoints() {
                    return this.Direction_FivePoints;
                },
            },
            methods: {
                Go_Points(i) {
                    const next = Math.max(0, Math.min(this.List_Points.length - 1, i));
                    this.Direction_Points = next >= this.Page_Points ? 'slide-left' : 'slide-right';
                    this.Page_Points = next;
                },
                Prev_Points() {
                    this.Active = 1;
                    this.Go_Points(this.Page_Points - 1);
                },
                Next_Points() {
                    this.Active = 1;
                    if (this.Page_Points < this.List_Points.length - 1) {
                        this.Go_Points(this.Page_Points + 1);
                    } else {
                        this.Active = 2;
                        this.Scroll_To_Section2();
                    }
                },
                Go_FivePoints(i) {
                    const next = Math.max(0, Math.min(this.List_FivePoints.length - 1, i));
                    this.Direction_FivePoints = next >= this.Page_FivePoints ? 'slide-left' : 'slide-right';
                    this.Page_FivePoints = next;
                },
                Prev_FivePoints() {
                    this.Active = 2;
                    this.Go_FivePoints(this.Page_FivePoints - 1);
                },
                Next_FivePoints() {
                    this.Active = 2;
                    this.Go_FivePoints(this.Page_FivePoints + 1);
                },
                Handle_Key(e) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        if (this.Active === 1) {
                            if (this.Page_Points < this.List_Points.length - 1) {
                                this.Go_Points(this.Page_Points + 1);
                            } else {
                                this.Active = 2;
                                this.Scroll_To_Section2();
                            }
                        } else if (this.Page_FivePoints < this.List_FivePoints.length - 1) {
                            this.Go_FivePoints(this.Page_FivePoints + 1);
                        }
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        if (this.Active === 2) {
                            if (this.Page_FivePoints > 0) {
                                this.Go_FivePoints(this.Page_FivePoints - 1);
                            } else {
                                this.Active = 1;
                                this.Scroll_To_Section1();
                            }
                        } else if (this.Page_Points > 0) {
                            this.Go_Points(this.Page_Points - 1);
                        }
                    }
                },
                Scroll_To_Section2() {
                    const el = document.getElementById('LP_Section2');
                    if (el) {
                        window.scrollTo({
                            top: el.getBoundingClientRect().top + window.pageYOffset - 72,
                            behavior: 'smooth'
                        });
                    }
                },
                Scroll_To_Section1() {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                },
            },
            mounted() {
                this.$nextTick(() => {
                    window.addEventListener('keydown', this.Handle_Key);
                });
            },
            beforeDestroy() {
                window.removeEventListener('keydown', this.Handle_Key);
            },
        })

    </script>

</body>

</html>
