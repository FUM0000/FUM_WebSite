<body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Database</h1>

    <v-app id="App">
        <template>
            
            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Plant > Vegetable > Database</main-system-bar>
            
            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" fluid fill-height class="pa-5">
                        
                    <v-row justify="center">
                        <v-col xs="12" md="6">
                            <v-card>
                                <v-card-title>
                                    Nutritional value per 100g
                                    <v-spacer></v-spacer>
                                    <v-text-field v-model="Search_Nutrition" append-icon="mdi-magnify" label="Search_Nutrition" single-line hide-details></v-text-field>
                                </v-card-title>
                                <v-data-table :headers="Headers_Nutrition" :items="Desserts_Nutrition" :search="Search_Nutrition" item-key="vegetable"
                                    multi-sort :sort-by="['parts_of_speech']" :sort-asc="[true]" show-select dense
                                    :mobile-breakpoint="0" :items-per-page="-1"></v-data-table>
                            </v-card>
                        </v-col>
                    </v-row>
                    
                    <v-row justify="center">
                        <v-col xs="12" md="6">
                            <v-card>
                                <v-card-title>
                                    Growing environment
                                    <v-spacer></v-spacer>
                                    <v-text-field v-model="Search_Growing" append-icon="mdi-magnify" label="Search_Growing" single-line hide-details></v-text-field>
                                </v-card-title>
                                <v-data-table :headers="Headers_Growing" :items="Desserts_Growing" :search="Search_Growing" item-key="vegetable"
                                    multi-sort :sort-by="['parts_of_speech']" :sort-asc="[true]" show-select dense
                                    :mobile-breakpoint="0" :items-per-page="-1"></v-data-table>
                            </v-card>
                        </v-col>
                        </v-row>

                    </v-container>
                </transition>
            </v-main>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer></main-footer>
            
        </template>
    </v-app>


    
    
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js" integrity="sha384-smVS78N63G0uFpVH9bKdb+2YIW7Q9eFrle79imo+AWW6YLluQxAEK7kxLOt1bNex" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.7.2/dist/vuetify.js" integrity="sha384-IufsRL4FQ+k4aWgxYvH6I1RoIrzL8Ynna+E/AavDQE9hD+UBZQLSTX2+7pPQWNsr" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha384-fJU6sGmyn07b+uD1nMk7/iSb4yvaowcueiQhfVgQuD98rfva8mcr1eSvjchfpMrH" crossorigin="anonymous"></script>
    <script src="../../Asset/Javascript/Common.js?v=1.04"></script>
    
    
    <script>

        let vue = new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Common],
            data: {
                //// Nutrition
                Search_Nutrition: '',
                Headers_Nutrition: [
                    { text: 'Vegetable', value: 'vegetable' },
                    { text: 'Energy(kcal)', value: 'energy' },
                    { text: 'Protein(g)', value: 'protein' },
                    { text: 'Fat(g)', value: 'fat' },
                    { text: 'Carbohydrates(g)', value: 'carbohydrates' },
                    { text: 'Potassium(mg)', value: 'potassium' },
                    { text: 'Calcium(mg)', value: 'calcium' },
                    { text: 'Magnesium(mg)', value: 'magnesium' },
                ],
                Desserts_Nutrition: [],
                //// Growing
                Search_Growing: '',
                Headers_Growing: [
                    { text: 'Vegetable', value: 'vegetable' },
                    { text: 'Optimum Germination Temperature(℃)', value: 'germination' },
                    { text: 'Appropriate(℃)', value: 'appropriate' },
                    { text: 'Soil(pH)', value: 'soil' },
                    { text: 'Spacing(cm)', value: 'space' },
                ],
                Desserts_Growing: [],
            },
            created: function () {
                let vegetable = [
                    "Burdock",
                    "Chrysanthemum",
                    "Eggplant",
                    "Konegi",
                    "Mini Tomato",
                    "Onion",
                    "Spinach"
                ];
                // Nutrition
                let energy = [
                    "50", 
                    "25", 
                    "17", 
                    "26", 
                    "30", 
                    "30", 
                    "23"
                ];
                let protein = [
                    "1.5", 
                    "2.7", 
                    "1.0", 
                    "2.0", 
                    "1.1", 
                    "0.8", 
                    "2.6"
                ];
                let fat = [
                    "0.2", 
                    "0.5", 
                    "0.1", 
                    "0.3", 
                    "0.1", 
                    "0.1", 
                    "0.5"
                ];
                let carbohydrates = [
                    "13.7", 
                    "4.5", 
                    "4.5", 
                    "5.4", 
                    "7.2", 
                    "7.3", 
                    "4.0"
                ];
                let potassium = [
                    "210", 
                    "270", 
                    "180", 
                    "320", 
                    "290", 
                    "110", 
                    "490"
                ];
                let calcium = [
                    "48", 
                    "120", 
                    "20", 
                    "100", 
                    "12", 
                    "18", 
                    "69"
                ];
                let magnesium = [
                    "40", 
                    "24", 
                    "16", 
                    "17", 
                    "13", 
                    "7", 
                    "40"
                ];
                // Growing
                let germination = [
                    "20~25", 
                    "15~20", 
                    "20~30", 
                    "15~25", 
                    "25~30", 
                    "15~20", 
                    "15~20"
                ];
                let appropriate = [
                    "20~25", 
                    "15~20", 
                    "16~28", 
                    "15~25", 
                    "21~26", 
                    "15~20", 
                    "15~20"
                ];
                let soil = [
                    "6.5~7.0",
                    "6.0~6.5",
                    "6.0~6.5",
                    "6.0~7.0",
                    "6.0~6.5",
                    "6.0~6.5",
                    "6.0~6.5"
                ];
                let space = [
                    "03~08, 10~15",
                    "10~15",
                    "50",
                    "01",
                    "40~50",
                    "12~15",
                    "05~08"
                ];

                for (let i = 0; i < vegetable.length; i++) {
                    // Nutrition
                    let row_nutrition = {
                        vegetable: vegetable[i],
                        energy: energy[i],
                        protein: protein[i],
                        fat: fat[i],
                        carbohydrates: carbohydrates[i],
                        potassium: potassium[i],
                        calcium: calcium[i],
                        magnesium: magnesium[i]
                    };
                    this.Desserts_Nutrition.push(row_nutrition);
                    // Growing
                    let row_growing = {
                        vegetable: vegetable[i],
                        germination: germination[i],
                        appropriate: appropriate[i],
                        soil: soil[i],
                        space: space[i],
                    };
                    this.Desserts_Growing.push(row_growing);
                }
            },
        })

        // Javascript --------------------------------------------------------------------

    </script>

</body>

</html>
