<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="author" content="F U M">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-B89KY0993B');
  </script>

  <link rel="icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">

  <link href="../../Asset/CSS/Common.css?v=1.2" rel="stylesheet" />

  <title>Video Editor</title>
  <meta name="robots" content="index, follow">
</head>

<body>
  <v-app id="App" v-cloak>
    <template>
      <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Service > Video Editor</main-system-bar>

      <v-main id="Main">
        <transition name="Fade_Page">
          <v-container v-show="Ready_Page" fluid class="pa-5">

            <!-- ▼ Drop Zone ▼ -->
            <v-row justify="center">
              <v-col cols="12" md="8">
                <div class="Drop_Zone" :class="{ 'drop-active': Drag_Active }" @dragenter.prevent="Drag_Enter"
                  @dragover.prevent @dragleave.prevent="Drag_Leave" @drop.prevent="Dropped">
                  <v-icon size="56" color="grey">mdi-tray-arrow-down</v-icon>
                  <div class="Drop_Title">Drop video files here</div>
                  <div class="Drop_Subtitle">or</div>
                  <v-btn color="primary" rounded @click="Pick_Files">
                    <v-icon left>mdi-video</v-icon>
                    Choose Files
                  </v-btn>
                  <div class="Drop_Subtitle">MP4 / M4V</div>
                </div>
                <input ref="Input_File" type="file" accept=".mp4,.m4v" multiple class="Hidden_Input"
                  @change="Picked">
                <v-alert v-if="Message" type="warning" dense text class="mt-3" dismissible @input="Message = ''">
                  {{ Message }}
                </v-alert>
              </v-col>
            </v-row>
            <!-- ▲ Drop Zone ▲ -->


            <template v-if="Current_Video">
              <!-- ▼ Player ▼ -->
              <v-row justify="center" class="mt-4">
                <v-col cols="12" md="8">
                  <v-card>
                    <v-card-text class="pb-2">
                      <div class="Player_Frame" ref="Player_Frame" @dblclick="Toggle_Fullscreen">
                        <div class="Stage" ref="Stage" :style="Stage_Style">
                          <div class="Stage_Inner" ref="Stage_Inner" :style="Inner_Style">
                            <video ref="Video" :key="Current_Video.url" class="Stage_Video" :src="Current_Video.url"
                              preload="metadata" playsinline @loadedmetadata="Loaded_Metadata"
                              @timeupdate="Update_Time" @play="Playing = true" @pause="Playing = false"
                              @ended="Ended" @error="Failed"></video>
                          </div>

                          <!-- 切り抜き枠は画面上で水平固定。回転は動画側だけが受ける -->
                          <div v-if="Crop_Enabled" class="Crop_Overlay">
                            <div class="Crop_Box" :style="Crop_Box_Style" @pointerdown="Crop_Drag('move', $event)"
                              @dblclick.stop="">
                              <span class="Crop_Handle Crop_NW" @pointerdown.stop="Crop_Drag('nw', $event)"></span>
                              <span class="Crop_Handle Crop_NE" @pointerdown.stop="Crop_Drag('ne', $event)"></span>
                              <span class="Crop_Handle Crop_SW" @pointerdown.stop="Crop_Drag('sw', $event)"></span>
                              <span class="Crop_Handle Crop_SE" @pointerdown.stop="Crop_Drag('se', $event)"></span>
                            </div>
                          </div>

                          <!-- 傾きはプレビュー上のグリップをドラッグして調整できる -->
                          <div class="Rotate_Overlay">
                            <div class="Rotate_Grip" :class="{ 'Rotate_Grip_Active': Rotate_Angle }"
                              title="Drag to tilt the video" @pointerdown="Rotate_Drag">
                              <v-icon small>mdi-rotate-3d-variant</v-icon>
                            </div>
                          </div>

                          <div v-if="!Playing" class="Player_Center_Icon" @click="Toggle_Play">
                            <v-icon size="72" color="rgba(255, 255, 255, 0.85)">mdi-play-circle-outline</v-icon>
                          </div>

                          <div v-if="Failed_Playing" class="Player_Message">
                            This browser cannot decode the video codec of this file.
                          </div>
                        </div>
                      </div>
                    </v-card-text>

                    <v-card-text class="pt-0">
                      <v-slider class="Seek_Slider" :value="Current_Time" :min="Seek_Min" :max="Seek_Max" :step="0.01"
                        hide-details thumb-label="always" :disabled="!Duration" @start="Scrubbing = true"
                        @change="Seek_End" @end="Scrubbing = false" />

                      <div class="Time_Row">
                        <v-icon small class="mr-1">mdi-clock-outline</v-icon>
                        <span class="Selectable">{{ Format_Time(Current_Time) }}</span>
                        <span class="mx-1">/</span>
                        <span class="Selectable">{{ Format_Time(Duration) }}</span>
                        <span class="mx-3">|</span>
                        <span class="Selectable">{{ Current_Video.width }} x {{ Current_Video.height }}</span>
                        <v-spacer></v-spacer>
                        <span class="Selectable">{{ Aspect_Ratio }}</span>
                      </div>

                      <div class="Control_Row">
                        <v-btn icon :disabled="!Current_Video" @click="Toggle_Play">
                          <v-icon v-if="Playing" large>mdi-pause</v-icon>
                          <v-icon v-else large>mdi-play</v-icon>
                        </v-btn>

                        <v-btn icon :disabled="Current_Index <= 0" @click="Step_Video(-1)">
                          <v-icon>mdi-skip-previous</v-icon>
                        </v-btn>
                        <v-btn icon :disabled="Current_Index >= Videos.length - 1" @click="Step_Video(1)">
                          <v-icon>mdi-skip-next</v-icon>
                        </v-btn>

                        <v-btn icon :color="Muted ? 'error' : ''" @click="Toggle_Mute">
                          <v-icon v-if="Muted || Volume === 0" large>mdi-volume-off</v-icon>
                          <v-icon v-else-if="Volume < 0.5" large>mdi-volume-medium</v-icon>
                          <v-icon v-else large>mdi-volume-high</v-icon>
                        </v-btn>
                        <v-slider class="Volume_Slider" v-model="Volume" min="0" max="1" step="0.01" hide-details
                          @input="Apply_Volume"></v-slider>

                        <v-select v-model="Speed" :items="Speeds" class="Speed_Select mr-2" dense hide-details
                          @change="Apply_Speed"></v-select>

                        <v-btn icon :color="Loop ? 'primary' : ''" @click="Loop = !Loop; Apply_Loop()">
                          <v-icon>mdi-repeat</v-icon>
                        </v-btn>

                        <v-btn icon @click="Toggle_Fullscreen">
                          <v-icon>mdi-fullscreen</v-icon>
                        </v-btn>
                      </div>

                      <div class="Screenshot_Row">
                        <v-btn color="success" rounded :disabled="!Current_Video.width" @click="Capture_Screenshot">
                          <v-icon left>mdi-camera</v-icon>
                          Screenshot
                        </v-btn>
                        <span class="Screenshot_Hint ml-3">
                          Stops on the current frame and saves it as PNG
                        </span>
                      </div>
                    </v-card-text>
                  </v-card>
                  <canvas ref="Canvas" class="Hidden_Canvas"></canvas>
                </v-col>
              </v-row>
              <!-- ▲ Player ▲ -->


              <!-- ▼ Info + Playlist ▼ -->
              <v-row justify="center">
                <v-col cols="12" md="4">
                  <v-card class="fill-height">
                    <v-card-title>Information</v-card-title>
                    <v-card-text>
                      <table class="Info_Table">
                        <tbody>
                          <tr>
                            <th>File</th>
                            <td class="Selectable">{{ Current_Video.name }}</td>
                          </tr>
                          <tr>
                            <th>Size</th>
                            <td class="Selectable">{{ Format_Size(Current_Video.size) }}</td>
                          </tr>
<tr>
                              <th>Duration</th>
                              <td class="Selectable">{{ Format_Time(Duration) }}</td>
                            </tr>
                            <tr>
                              <th>Clip</th>
                              <td class="Selectable">{{ Clip_Range }}</td>
                            </tr>
                          <tr>
                            <th>Resolution</th>
                            <td class="Selectable">{{ Current_Video.width }} x {{ Current_Video.height }}</td>
                          </tr>
                          <tr>
                            <th>Ratio</th>
                            <td class="Selectable">{{ Aspect_Ratio }}</td>
                          </tr>
                          <tr>
                            <th>Crop</th>
                            <td class="Selectable">{{ Crop_Label }}</td>
                          </tr>
                          <tr>
                            <th>Rotate</th>
                            <td class="Selectable">{{ Rotate_Label }}</td>
                          </tr>
                          <tr>
                            <th>Rate</th>
                            <td class="Selectable">{{ Speed }} x</td>
                          </tr>
                        </tbody>
                      </table>

                      <div class="Info_Keys">
                        <div><b>Space</b> Play / Pause</div>
                        <div><b>&larr; &rarr;</b> Seek 5 seconds</div>
                        <div><b>&uarr; &darr;</b> Volume</div>
                        <div><b>S</b> Screenshot</div>
                        <div><b>F</b> Fullscreen</div>
                      </div>
                    </v-card-text>
                  </v-card>
                </v-col>

                <v-col cols="12" md="4">
                  <v-card class="fill-height">
                    <v-card-title>
                      Playlist
                      <v-spacer></v-spacer>
                      <span class="text-caption grey--text">{{ Videos.length }} file(s)</span>
                      <v-btn icon small class="ml-1" :disabled="!Videos.length" @click="Clear_Videos">
                        <v-icon small>mdi-delete-sweep</v-icon>
                      </v-btn>
                    </v-card-title>
                    <v-card-text>
                      <div v-if="!Videos.length" class="Playlist_Empty">
                        No videos yet. Drop files above.
                      </div>
                      <div class="Playlist_Scroll">
                        <div v-for="(video, index) in Videos" :key="video.url" class="Playlist_Item"
                          :class="{ 'playlist-active': index === Current_Index }" @click="Select_Video(index)">
                          <video class="Playlist_Thumb" :src="video.url" preload="metadata" muted playsinline
                            @click.stop="Select_Video(index)"></video>
                          <div class="Playlist_Meta">
                            <div class="Playlist_Name Selectable">{{ video.name }}</div>
                            <div class="Playlist_Sub">{{ Format_Size(video.size) }}</div>
                          </div>
                          <v-btn icon x-small class="Playlist_Delete" @click.stop="Remove_Video(index)">
                            <v-icon x-small>mdi-close</v-icon>
                          </v-btn>
                        </div>
                      </div>
                    </v-card-text>
                  </v-card>
                </v-col>
              </v-row>
              <!-- ▲ Info + Playlist ▲ -->


              <!-- ▼ Trim ▼ -->
              <v-row justify="center" class="mt-4">
                <v-col cols="12" md="8">
                  <v-card>
                    <v-card-title>
                      <v-icon small class="mr-1">mdi-content-cut</v-icon>
                      Trim
                      <v-spacer></v-spacer>
                      <v-btn small text class="mr-1" :disabled="!Trim_Enabled || !Duration || Busy" @click="Set_Trim_Start">
                        Set In
                      </v-btn>
                      <v-btn small text class="mr-1" :disabled="!Trim_Enabled || !Duration || Busy" @click="Set_Trim_End">
                        Set Out
                      </v-btn>
                      <v-switch v-model="Trim_Enabled" inset hide-details class="mt-0"></v-switch>
                    </v-card-title>
                    <v-card-text>
                      <v-slider v-model="Trim_Start" :min="0" :max="Trim_End" :step="0.01" label="Trim Start"
                        color="primary" thumb-label :disabled="!Duration || Busy" @end="Normalize_Trim">
                        <template v-slot:append>
                          <input type="number" class="Trim_Num_Input" v-model="Trim_Start_Text" step="0.01" min="0"
                            :disabled="!Duration" @focus="Focus_Trim_Input('Trim_Start', $event)"
                            @change="Commit_Trim_Start" @blur="Commit_Trim_Start">
                        </template>
                      </v-slider>

                      <v-slider v-model="Trim_End" :min="Trim_Start" :max="Duration" :step="0.01" label="Trim End"
                        color="primary" thumb-label :disabled="!Duration || Busy" @end="Normalize_Trim">
                        <template v-slot:append>
                          <input type="number" class="Trim_Num_Input" v-model="Trim_End_Text" step="0.01" min="0"
                            :disabled="!Duration" @focus="Focus_Trim_Input('Trim_End', $event)"
                            @change="Commit_Trim_End" @blur="Commit_Trim_End">
                        </template>
                      </v-slider>

                      <div class="Export_Hint">
                        <span>Only the selected range is played back and exported.</span>
                        <v-spacer></v-spacer>
                        <span>Clip <b>{{ Format_Time(Clip_Duration) }}</b></span>
                      </div>
                    </v-card-text>
                  </v-card>
                </v-col>
              </v-row>
              <!-- ▲ Trim ▲ -->


              <!-- ▼ Crop & Rotate ▼ -->
              <v-row justify="center" class="mt-4">
                <v-col cols="12" md="8">
                  <v-card>
                    <v-card-title>
                      <v-icon small class="mr-1">mdi-crop</v-icon>
                      Crop &amp; Rotate
                      <v-spacer></v-spacer>
                      <v-btn small text :disabled="Busy" @click="Reset_Crop_Rotate">Reset</v-btn>
                    </v-card-title>
                    <v-card-text>

                      <!-- Crop -->
                      <div class="Export_Label">Crop</div>
                      <v-switch v-model="Crop_Enabled" label="Crop the frame" inset hide-details class="mt-0"
                        :disabled="Busy" @change="Crop_Changed"></v-switch>

                      <v-row dense class="mt-1">
                        <v-col cols="6" sm="3">
                          <v-text-field v-model.number="Crop_X" label="X" type="number" dense outlined hide-details
                            :min="0" :disabled="!Crop_Enabled || Busy" @change="Crop_Changed"></v-text-field>
                        </v-col>
                        <v-col cols="6" sm="3">
                          <v-text-field v-model.number="Crop_Y" label="Y" type="number" dense outlined hide-details
                            :min="0" :disabled="!Crop_Enabled || Busy" @change="Crop_Changed"></v-text-field>
                        </v-col>
                        <v-col cols="6" sm="3">
                          <v-text-field v-model.number="Crop_W" label="Width" type="number" dense outlined hide-details
                            :min="16" :disabled="!Crop_Enabled || Busy" @change="Crop_Changed"></v-text-field>
                        </v-col>
                        <v-col cols="6" sm="3">
                          <v-text-field v-model.number="Crop_H" label="Height" type="number" dense outlined hide-details
                            :min="16" :disabled="!Crop_Enabled || Busy" @change="Crop_Changed"></v-text-field>
                        </v-col>
                      </v-row>

                      <v-checkbox v-model="Crop_Lock_Ratio" label="Keep aspect ratio" dense hide-details
                        class="mt-1 mb-0" :disabled="!Crop_Enabled || Busy" @change="Crop_Ratio_Changed"></v-checkbox>

                      <div class="Export_Hint">
                        <v-icon x-small class="mr-1">mdi-information-outline</v-icon>
                        Drag the corners of the frame in the preview. The frame stays put while the video tilts.
                      </div>

                      <!-- Rotate -->
                      <div class="Export_Label">Rotation</div>
                      <div class="Rotate_Row">
                        <v-btn icon small :disabled="Busy" @click="Rotate_By(-90)">
                          <v-icon>mdi-rotate-left</v-icon>
                        </v-btn>
                        <span class="Rotate_Readout Selectable">{{ Total_Rotate }}&deg;</span>
                        <v-btn icon small :disabled="Busy" @click="Rotate_By(90)">
                          <v-icon>mdi-rotate-right</v-icon>
                        </v-btn>
                        <span class="Rotate_Hint ml-2">
                          Quarter turns
                        </span>
                      </div>

                      <v-slider v-model="Rotate_Angle" :min="-15" :max="15" :step="0.5" label="Tilt" thumb-label
                        hide-details class="Tilt_Slider mt-3" :disabled="Busy" @change="Content_Changed"></v-slider>
                      <div class="Rotate_Row mt-1">
                        <v-btn small text :disabled="Busy || !Rotate_Angle"
                          @click="Rotate_Angle = 0; Content_Changed()">
                          Level
                        </v-btn>
                        <v-spacer></v-spacer>
                        <span class="Rotate_Hint">
                          Fine tilt up to &plusmn;15&deg;. Drag the round grip on the preview or use the slider.
                        </span>
                      </div>

                    </v-card-text>
                  </v-card>
                </v-col>
              </v-row>
              <!-- ▲ Crop & Rotate ▲ -->


              <!-- ▼ Export ▼ -->
              <v-row justify="center" class="mt-4">
                <v-col cols="12" md="8">
                  <v-card>
                    <v-card-title>
                      Export
                      <v-spacer></v-spacer>
                      <v-chip x-small label class="mr-1" :color="Engine_Native ? 'success' : 'error'">
                        {{ Engine_Native ? 'WebCodecs' : 'WebCodecs unavailable' }}
                      </v-chip>
                    </v-card-title>
                    <v-card-text>

                      <!-- Resolution -->
                      <div class="Export_Label">Resolution</div>
                      <v-row dense align="center">
                        <v-col cols="12" sm="6">
                          <v-select v-model="Resolution_Preset" :items="Resolution_Items" label="Size"
                            dense outlined hide-details @change="Change_Resolution"></v-select>
                        </v-col>
                        <v-col cols="12" sm="4">
                          <v-text-field v-model.number="Target_Width" label="Width" type="number" dense outlined
                            hide-details :min="16" :max="7680" :step="2" @change="Sync_Resolution('width')"></v-text-field>
                        </v-col>
                        <v-col cols="12" sm="4">
                          <v-text-field v-model.number="Target_Height" label="Height" type="number" dense outlined
                            hide-details :min="16" :max="4320" :step="2" @change="Sync_Resolution('height')"></v-text-field>
                        </v-col>
                        <v-col cols="12" sm="4">
                          <v-checkbox v-model="Lock_Ratio" label="Keep aspect ratio" dense hide-details
                            class="Export_Check mt-1" @change="Sync_Resolution('height')"></v-checkbox>
                        </v-col>
                      </v-row>
                      <div class="Export_Hint">
                        <span>Source {{ Current_Video.width }} x {{ Current_Video.height }}</span>
                        <span v-if="Crop_Enabled || Odd_Quarter" class="ml-3">
                          Content {{ Content_Dims.w }} x {{ Content_Dims.h }}</span>
                        <v-spacer></v-spacer>
                        <span>Output {{ Output_Width }} x {{ Output_Height }}
                          ({{ Scale_Label }})</span>
                      </div>

                      <!-- Frame rate -->
                      <div class="Export_Label">Frame rate</div>
                      <v-select v-model="Target_Fps" :items="Fps_Items" label="FPS" dense outlined hide-details
                        class="Export_Field"></v-select>
                      <div class="Export_Hint" v-if="Fps_Note">
                        <v-icon x-small class="mr-1">mdi-information-outline</v-icon>{{ Fps_Note }}
                      </div>

                      <!-- Quality -->
                      <div class="Export_Label">Quality</div>
                      <v-row dense align="center">
                        <v-col cols="12" sm="5">
                          <v-select v-model="Quality" :items="Quality_Items" label="Preset" dense outlined hide-details
                            @change="Quality = $event; Reset_Bitrate()"></v-select>
                        </v-col>
                        <v-col cols="12" sm="7">
                          <div class="Export_Slider">
                            <v-slider v-model="Bitrate" :min="150" :max="Bitrate_Max" :step="50" thumb-label="always"
                              hide-details></v-slider>
                            <div class="Export_Slider_Label">{{ Format_Bitrate(Bitrate * 1000) }}</div>
                          </div>
                        </v-col>
                      </v-row>

                      <!-- Audio -->
                      <div class="Export_Label">Audio</div>
                      <v-row dense align="center">
                        <v-col cols="12" sm="5">
                          <v-select v-model="Audio" :items="Audio_Items" label="Track" dense outlined hide-details></v-select>
                        </v-col>
                        <v-col cols="12" sm="7" class="Export_Note">
                          <span v-if="!Has_Audio">This file has no audio track.</span>
                          <span v-else-if="Audio_Note">{{ Audio_Note }}</span>
                          <span v-else>Audio {{ Format_Bitrate(Audio_Bitrate) }} - AAC</span>
                        </v-col>
                      </v-row>

                      <!-- File name -->
                      <div class="Export_Label">File name</div>
                      <v-text-field v-model="File_Name" :placeholder="Output_Name()" label="Output file name" dense
                        outlined hide-details prepend-inner-icon="mdi-file-video" class="Export_Field"
                        @keydown.enter.prevent></v-text-field>
                      <div class="Export_Hint">
                        <v-icon x-small class="mr-1">mdi-information-outline</v-icon>
                        {{ Resolved_Name }}
                      </div>

                      <!-- Estimate + Actions -->
                      <v-divider class="my-4"></v-divider>

                      <div class="Export_Hint">
                        <span>Estimated size ({{ Format_Time(Clip_Duration) }})</span>
                        <v-spacer></v-spacer>
                        <span>
                          <b>{{ Format_Size(Estimated_Size) }}</b>
                          <span class="grey--text">&nbsp;from {{ Format_Size(Current_Video.size) }}</span>
                          <v-chip v-if="Reduction_Ratio" x-small label class="ml-2"
                            :color="Reduction_Ratio > 0 ? 'success' : 'error'">
                            {{ Reduction_Ratio > 0 ? '-' : '+' }}{{ Math.abs(Reduction_Ratio) }}%
                          </v-chip>
                        </span>
                      </div>

                      <div class="Screenshot_Row">
                        <v-btn color="primary" rounded :disabled="!Can_Export || Busy" @click="Start_Export">
                          <v-icon left>mdi-export-video</v-icon>
                          Export
                        </v-btn>
                        <v-btn v-if="Busy" text small class="ml-2" @click="Cancel_Export">
                          <v-icon left small>mdi-close</v-icon>
                          Cancel
                        </v-btn>
                        <span class="Screenshot_Hint ml-2">
                          {{ Busy ? Status : 'Re-encode to MP4 and download it' }}
                        </span>
                      </div>

                      <v-progress-linear v-if="Busy" :value="Progress * 100" height="8" rounded class="mt-2"
                        :color="Progress_Phase === 'prepare' ? 'warning' : 'primary'"></v-progress-linear>

                      <!-- Result -->
                      <template v-if="Result">
                        <v-divider class="my-4"></v-divider>
                        <v-row dense align="center">
                          <v-col cols="12" sm="8">
                            <table class="Info_Table">
                              <tbody>
                                <tr>
                                  <th>Result</th>
                                  <td class="Selectable">{{ Format_Size(Result.blob.size) }}</td>
                                </tr>
                                <tr>
                                  <th>Resolution</th>
                                  <td class="Selectable">{{ Output_Width }} x {{ Output_Height }}</td>
                                </tr>
                                <tr>
                                  <th>FPS</th>
                                  <td class="Selectable">{{ Effective_Fps }}</td>
                                </tr>
                                <tr>
                                  <th>Range</th>
                                  <td class="Selectable">{{ Clip_Range }}</td>
                                </tr>
                                <tr>
                                  <th>Engine</th>
                                  <td class="Selectable">{{ Result.engine }} - {{ Result.elapsed }} ms</td>
                                </tr>
                              </tbody>
                            </table>
                          </v-col>
                          <v-col cols="12" sm="4">
                            <v-btn color="success" block rounded @click="Download_Result">
                              <v-icon left>mdi-download</v-icon>
                              Download
                            </v-btn>
                          </v-col>
                        </v-row>
                      </template>

                      <v-alert v-if="Export_Error" type="error" dense text class="mt-3">{{ Export_Error }}</v-alert>

                    </v-card-text>
                  </v-card>
                </v-col>
              </v-row>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
  <script src="../../Asset/Javascript/Common.js?v=1.03"></script>
  <script src="../../Asset/Javascript/VideoEditor.js?v=2.2"></script>

  <script>
    // 動画の標準解像度。大きい順に並べて、アップスケールしない範囲で最も近いものを選ぶ
    const RESOLUTION_PRESETS = [
      [3840, 2160], [2560, 1440], [1920, 1080], [1280, 720], [854, 480], [640, 360],
      [1080, 1920], [720, 1280], [480, 854]
    ];

    // 既定値の上限。4K 入力でも初期値は 1080p まで落とす
    const DEFAULT_MAX_WIDTH = 1920;
    const DEFAULT_MAX_HEIGHT = 1080;

    new Vue({
      el: '#App',
      vuetify: new Vuetify(),
      mixins: [window.Mixins_Common],
      data: {
        Files: [],
        Videos: [],
        Current_Index: -1,
        Playing: false,
        Failed_Playing: false,
        Duration: 0,
        Current_Time: 0,
        Scrubbing: false,
        Trim_Enabled: false,
        Trim_Start: 0,
        Trim_End: 0,
        Trim_Start_Text: '0.00',
        Trim_End_Text: '0.00',
        Editing_Input: null,
        Volume: 1,
        Muted: false,
        Loop: false,
        Speed: 1,
        Speeds: [0.25, 0.5, 1, 1.5, 2, 4],
        Shots: [],
        Drag_Active: false,
        Message: '',
        Source_Info: null,
        Resolution_Preset: '1920x1080',
        Target_Width: 1920,
        Target_Height: 1080,
        Target_Fps: 30,
        Quality: 'standard',
        Lock_Ratio: true,
        Bitrate: 5500,
        Audio: 'keep',
        Aac_Encode: null,
        Busy: false,
        Cancel_Flag: false,
        Progress: 0,
        Progress_Phase: 'prepare',
        Status: '',
        Export_Error: '',
        Result: null,
        Result_Name: '',
        File_Name: '',
        Crop_Enabled: false,
        Crop_X: 0,
        Crop_Y: 0,
        Crop_W: 0,
        Crop_H: 0,
        Rotate_Step: 0,
        Rotate_Angle: 0,
        Crop_Lock_Ratio: false,
        Crop_Ratio: 0
      },
      computed: {
        Current_Video() {
          return this.Videos[this.Current_Index] || null;
        },
        Engine_Native() {
          return window.VideoEditor.Engine() === 'webcodecs';
        },
        // このブラウザは AAC を再エンコードできないため、その場合だけ案内を出す
        Audio_Note() {
          if (!this.Current_Video) return '';
          if (this.Audio === 'remove') return 'Audio track will be removed.';
          if (this.Aac_Encode === false) return 'This browser cannot re-encode audio. Choose Remove audio.';
          return '';
        },
        Output_Width() {
          return window.VideoEditor.To_Even(this.Target_Width || this.Current_Video.width);
        },
        Output_Height() {
          return window.VideoEditor.To_Even(this.Target_Height || this.Current_Video.height);
        },
        Source_W() {
          return this.Current_Video ? (this.Current_Video.width || 0) : 0;
        },
        Source_H() {
          return this.Current_Video ? (this.Current_Video.height || 0) : 0;
        },
        // 90度 / 270度 の回転だけ縦横を入れ替える
        Odd_Quarter() {
          return this.Rotate_Step === 90 || this.Rotate_Step === 270;
        },
        // プレビュー表示と書き出しが使う実効角度 (-180 〜 180)
        Total_Rotate() {
          let value = this.Rotate_Step + (this.Rotate_Angle || 0);
          value = ((value % 360) + 360) % 360;
          if (value > 180) value -= 360;
          return value;
        },
        // 回転を反映した後に画面上へ表示されるフレームの解像度 (90度回転で縦横が入替)
        Frame_Dims() {
          const width = this.Source_W;
          const height = this.Source_H;
          if (!width || !height) return { w: 0, h: 0 };
          return this.Odd_Quarter ? { w: height, h: width } : { w: width, h: height };
        },
        // 切り抜きと回転を反映した後のコンテンツ解像度。
        // 切り抜き矩形はフレーム (画面上固定) の座標なので、そのまま出力比になる
        Content_Dims() {
          const frame = this.Frame_Dims;
          if (!frame.w || !frame.h) return { w: 0, h: 0 };
          if (this.Crop_Enabled && this.Crop_W > 0 && this.Crop_H > 0) {
            return { w: Math.max(2, Math.round(this.Crop_W)), h: Math.max(2, Math.round(this.Crop_H)) };
          }
          return frame;
        },
        // ステージの縦横比は常にソース基準。切り抜きはオーバーレイで表現する
        Stage_AR() {
          const width = this.Source_W;
          const height = this.Source_H;
          if (!width || !height) return 16 / 9;
          return this.Odd_Quarter ? height / width : width / height;
        },
        // 回転後のソースがステージを覆う倍率 (四隅が必ずステージ内に入る rect-cover)
        Stage_K() {
          const ar = this.Stage_AR;
          if (!ar) return 1;
          const theta = Math.abs(this.Total_Rotate) * Math.PI / 180;
          const cos = Math.abs(Math.cos(theta));
          const sin = Math.abs(Math.sin(theta));
          const stageHeight = 1 / ar;
          const innerWidth = this.Odd_Quarter ? stageHeight : 1;
          const innerHeight = this.Odd_Quarter ? 1 : stageHeight;
          const coverWidth = (cos + stageHeight * sin) / innerWidth;
          const coverHeight = (sin + stageHeight * cos) / innerHeight;
          return Math.max(1, coverWidth, coverHeight);
        },
        Stage_Style() {
          const ar = this.Stage_AR;
          return {
            width: `min(100%, calc(var(--stage-max-h, 70vh) * ${ar}))`,
            paddingBottom: `min(calc(100% / ${ar}), var(--stage-max-h, 70vh))`
          };
        },
        Inner_Style() {
          const ar = this.Stage_AR;
          const odd = this.Odd_Quarter;
          return {
            width: odd ? `calc(100% / ${ar})` : '100%',
            height: odd ? `calc(100% * ${ar})` : '100%',
            transform: `translate(-50%, -50%) rotate(${this.Total_Rotate}deg) scale(${this.Stage_K})`
          };
        },
        Crop_Box_Style() {
          const frame = this.Frame_Dims;
          if (!frame.w || !frame.h) return {};
          return {
            left: `${(this.Crop_X / frame.w) * 100}%`,
            top: `${(this.Crop_Y / frame.h) * 100}%`,
            width: `${(this.Crop_W / frame.w) * 100}%`,
            height: `${(this.Crop_H / frame.h) * 100}%`
          };
        },
        Crop_Label() {
          if (!this.Crop_Enabled) return 'Off';
          return `${this.Crop_X}, ${this.Crop_Y} - ${this.Crop_W} x ${this.Crop_H}`;
        },
        Rotate_Label() {
          const value = this.Total_Rotate;
          if (!value) return 'None';
          return `${value > 0 ? '+' : ''}${value} deg`;
        },
        Scale_Label() {
          const content = this.Content_Dims;
          if (!content.w) return '-';
          const scale = this.Output_Width / content.w;
          if (Math.abs(scale - 1) < 0.005) return '100%';
          return `${(scale * 100).toFixed(0)}%`;
        },
        // 出力ファイル名。手入力があれば安全な文字へ直して .mp4 を補う
        Resolved_Name() {
          let name = (this.File_Name || '').trim()
            .replace(/[\\/:*?"<>|]+/g, '_')
            .replace(/\s+/g, ' ')
            .replace(/^[.\s]+/, '')
            .replace(/[.\s]+$/, '');
          if (!name) return this.Output_Name();
          return /\.mp4$/i.test(name) ? name : `${name}.mp4`;
        },
        Resolution_Items() {
          const items = [{ text: 'Original', value: 'original' }];
          RESOLUTION_PRESETS.forEach(([w, h]) => items.push({
            text: `${w} x ${h}`,
            value: `${w}x${h}`
          }));
          items.push({ text: 'Custom', value: 'custom' });
          return items;
        },
        Fps_Items() {
          const items = [{ text: 'Original', value: 0 }];
          [60, 50, 30, 25, 24, 15, 12, 10]
            .filter(fps => !this.Source_Fps || fps <= this.Source_Fps + 0.01)
            .forEach(fps => items.push({ text: `${fps} fps`, value: fps }));
          return items;
        },
        Fps_Note() {
          if (!this.Target_Fps || !this.Source_Fps) return '';
          if (this.Target_Fps < this.Source_Fps - 0.01) {
            return `Frames will be dropped from ${this.Source_Fps.toFixed(2)} fps.`;
          }
          if (this.Target_Fps > this.Source_Fps + 0.01) {
            return `Capped at the source rate (${this.Source_Fps.toFixed(2)} fps). Interpolation is not applied.`;
          }
          return '';
        },
        Quality_Items() {
          return Object.keys(window.VideoEditor.Quality_Table).map(key => ({
            text: window.VideoEditor.Quality_Table[key].label,
            value: key
          }));
        },
        Audio_Items() {
          return Object.keys(window.VideoEditor.Audio_Table).map(key => ({
            text: window.VideoEditor.Audio_Table[key].label,
            value: key
          }));
        },
        Has_Audio() {
          return this.Source_Info ? this.Source_Info.hasAudio : true;
        },
        Audio_Bitrate() {
          return (window.VideoEditor.Audio_Table[this.Audio] || { bitrate: 0 }).bitrate;
        },
        Bitrate_Max() {
          const sourceBitrate = this.Source_Info ? this.Source_Info.bitrate : 0;
          return Math.max(8000, Math.ceil((window.VideoEditor.Suggest_Bitrate(
            this.Output_Width, this.Output_Height, this.Effective_Fps, 'high', sourceBitrate) / 1000) / 1000) * 1000);
        },
        Effective_Fps() {
          if (!this.Target_Fps) return this.Source_Fps ? Number(this.Source_Fps.toFixed(2)) : 30;
          if (this.Source_Fps && this.Target_Fps > this.Source_Fps) return Number(this.Source_Fps.toFixed(2));
          return this.Target_Fps;
        },
        Source_Fps() {
          return this.Source_Info ? this.Source_Info.fps : 0;
        },
        Estimated_Size() {
          const total = this.Bitrate * 1000 + (this.Audio === 'remove' ? 0 : this.Audio_Bitrate);
          return (total * this.Clip_Duration) / 8;
        },
        Reduction_Ratio() {
          if (!this.Current_Video.size || !this.Estimated_Size) return 0;
          return Math.round((1 - this.Estimated_Size / this.Current_Video.size) * 100);
        },
        Can_Export() {
          return !!this.Current_Video && !!this.Current_Video.width && this.Duration > 0
            && this.Engine_Native
            && (!this.Trim_Enabled || this.Trim_Duration >= 0.05);
        },
        Aspect_Ratio() {
          const video = this.Current_Video;
          if (!video || !video.width || !video.height) return '-';
          const _width = video.width;
          const _height = video.height;
          if (_width === _height) return '1:1 (Square)';
          const candidates = [
            { w: 16, h: 9 }, { w: 9, h: 16 }, { w: 4, h: 3 }, { w: 3, h: 4 },
            { w: 21, h: 9 }, { w: 2, h: 1 }, { w: 1, h: 2 }
          ];
          for (const item of candidates) {
            if (Math.abs(_width / _height - item.w / item.h) < 0.02) {
              return `${item.w}:${item.h}`;
            }
          }
          return `${_width}:${_height} (Free)`;
        },
        Trim_Duration() {
          return Math.max(0, (this.Trim_End || 0) - (this.Trim_Start || 0));
        },
        // 書き出しとシークに実際に使う長さ
        Clip_Duration() {
          if (this.Trim_Enabled && this.Duration) return this.Trim_Duration;
          return this.Duration;
        },
        Clip_Range() {
          if (!this.Duration) return '-';
          if (!this.Trim_Enabled) return `Full length (${this.Format_Time(this.Duration)})`;
          return `${this.Format_Time(this.Trim_Start)} - ${this.Format_Time(this.Trim_End)}`;
        },
        Seek_Min() {
          return this.Trim_Enabled && this.Duration ? this.Trim_Start : 0;
        },
        Seek_Max() {
          return this.Trim_Enabled && this.Duration ? this.Trim_End : (this.Duration || 1);
        }
      },
      watch: {
        Trim_Start(value) {
          if (this.Editing_Input !== 'Trim_Start') this.Trim_Start_Text = (value || 0).toFixed(2);
        },
        Trim_End(value) {
          if (this.Editing_Input !== 'Trim_End') this.Trim_End_Text = (value || 0).toFixed(2);
        },
        Trim_Enabled() {
          this.Apply_Loop();
          this.Clamp_Time(this.Current_Time);
        }
      },
      methods: {
        ////// File

        Pick_Files() {
          this.$refs.Input_File.click();
        },

        Drag_Enter() {
          this.Drag_Active = true;
        },

        // 子要素へ移動しただけの離脱では Drag_Active を落とさない
        Drag_Leave(event) {
          if (event.currentTarget.contains(event.relatedTarget)) return;
          this.Drag_Active = false;
        },

        Picked(event) {
          const files = Array.from(event.target.files || []);
          this.Add_Files(files);
          event.target.value = '';
        },

        Dropped(event) {
          this.Drag_Active = false;
          const files = Array.from(event.dataTransfer.files || []);
          this.Add_Files(files);
        },

        Is_Supported(file) {
          return window.VideoEditor.Is_Supported(file);
        },

        Add_Files(files) {
          if (!files.length) return;

          const accepted = files.filter(file => this.Is_Supported(file));
          const skipped = files.length - accepted.length;

          accepted.forEach(file => {
            this.Videos.push({
              name: file.name,
              size: file.size,
              file: file,
              url: URL.createObjectURL(file),
              width: 0,
              height: 0
            });
          });

          const notes = [];
          if (skipped > 0) notes.push(`${skipped} file(s) skipped. Only MP4 / M4V files can be used.`);
          if (accepted.length && !this.$refs.Video) {
            const probe = document.createElement('video');
            if (!probe.canPlayType('video/mp4')) {
              notes.push('This browser cannot play MP4 / H.264.');
            }
          }
          if (accepted.some(file => /\.(mp4|m4v)$/i.test(file.name)) && !this.Engine_Native) {
            notes.push('This browser does not support WebCodecs, so export is unavailable.');
          }
          this.Message = notes.join(' ');

          if (this.Current_Index < 0 && this.Videos.length) this.Select_Video(0);
        },

        Select_Video(index) {
          if (index < 0 || index >= this.Videos.length) return;
          this.Current_Index = index;
          this.Duration = 0;
          this.Current_Time = 0;
          this.Playing = false;
          this.Failed_Playing = false;
          this.Scrubbing = false;
          this.Trim_Enabled = false;
          this.Trim_Start = 0;
          this.Trim_End = 0;
          this.Result = null;
          this.Export_Error = '';
          this.File_Name = '';
          this.Reset_Crop_State();

          // video 要素は :key で作り直されるため、再描画後に設定し直す
          this.$nextTick(() => {
            this.Apply_Volume();
            this.Apply_Speed();
            this.Apply_Loop();
            this.Probe_Source();
          });
        },

        // このブラウザで AAC を書き出せるか、一度だけ確認する
        Probe_Aac() {
          window.VideoEditor.Can_Encode_Aac(48000, 2).then(ok => {
            this.Aac_Encode = ok;
          });
        },

        // moov から FPS と音声の有無を取得する
        Probe_Source() {
          const source = this.Videos[this.Current_Index];
          this.Source_Info = null;
          if (!source || !source.file) return;
          const token = source.url;

          window.VideoEditor.Probe(source.file).then(info => {
            if (this.Videos[this.Current_Index] === undefined) return;
            if (this.Videos[this.Current_Index].url !== token) return;
            this.Source_Info = info;
            this.Reset_Resolution();
            this.Reset_Fps();
            this.Reset_Bitrate();
          });
        },

        Step_Video(direction) {
          this.Select_Video(this.Current_Index + direction);
        },

        Remove_Video(index) {
          const [removed] = this.Videos.splice(index, 1);
          if (removed) URL.revokeObjectURL(removed.url);

          if (!this.Videos.length) {
            this.Current_Index = -1;
            this.Source_Info = null;
          } else if (index < this.Current_Index) {
            this.Select_Video(this.Current_Index - 1);
          } else if (index === this.Current_Index) {
            this.Select_Video(Math.min(index, this.Videos.length - 1));
          } else {
            this.Source_Info = null;
          }
        },

        Clear_Videos() {
          this.Videos.forEach(video => URL.revokeObjectURL(video.url));
          this.Videos = [];
          this.Current_Index = -1;
          this.Source_Info = null;
          this.Duration = 0;
          this.Current_Time = 0;
          this.Playing = false;
          this.Failed_Playing = false;
          this.Trim_Enabled = false;
          this.Trim_Start = 0;
          this.Trim_End = 0;
          this.Result = null;
          this.Export_Error = '';
          this.File_Name = '';
          this.Reset_Crop_State();
        },

        ////// Trim

        Reset_Trim() {
          this.Trim_Start = 0;
          this.Trim_End = this.Duration;
          this.Trim_Start_Text = '0.00';
          this.Trim_End_Text = this.Duration.toFixed(2);
        },

        Focus_Trim_Input(key, event) {
          this.Editing_Input = key;
          event.target.select();
        },

        Commit_Trim_Start() {
          this.Editing_Input = null;
          const value = parseFloat(this.Trim_Start_Text);
          if (!isNaN(value)) {
            const clamped = Math.max(0, Math.min(this.Trim_End, value));
            if (clamped !== this.Trim_Start) {
              this.Trim_Start = clamped;
              this.Normalize_Trim();
            }
          }
          this.Trim_Start_Text = this.Trim_Start.toFixed(2);
        },

        Commit_Trim_End() {
          this.Editing_Input = null;
          const value = parseFloat(this.Trim_End_Text);
          if (!isNaN(value)) {
            const clamped = Math.max(this.Trim_Start, Math.min(this.Duration, value));
            if (clamped !== this.Trim_End) {
              this.Trim_End = clamped;
              this.Normalize_Trim();
            }
          }
          this.Trim_End_Text = this.Trim_End.toFixed(2);
        },

        // トリム幅が潰れたら、拡張できる側を少し広げて補正する
        Normalize_Trim() {
          if (this.Trim_Duration < 0.05) {
            if (this.Trim_End + 0.05 <= this.Duration) {
              this.Trim_End = Math.min(this.Duration, this.Trim_End + 0.05);
            } else {
              this.Trim_Start = Math.max(0, this.Trim_Start - 0.05);
            }
          }
          this.Apply_Loop();
          this.Clamp_Time(this.Current_Time);
        },

        Set_Trim_Start() {
          this.Trim_Start = Math.max(0, Math.min(this.Trim_End - 0.05, this.Current_Time));
          this.Normalize_Trim();
        },

        Set_Trim_End() {
          this.Trim_End = Math.min(this.Duration, Math.max(this.Trim_Start + 0.05, this.Current_Time));
          this.Normalize_Trim();
        },

        // 再生位置を選択範囲内に保つ
        Clamp_Time(time) {
          const video = this.$refs.Video;
          if (!video || !this.Trim_Enabled) return;
          const clamped = Math.max(this.Trim_Start, Math.min(this.Trim_End, time));
          if (video.currentTime !== clamped) video.currentTime = clamped;
          this.Current_Time = clamped;
        },

        ////// Player

        Loaded_Metadata() {
          const video = this.$refs.Video;
          if (!video) return;

          const current = this.Current_Video;
          if (current) {
            this.$set(current, 'width', video.videoWidth);
            this.$set(current, 'height', video.videoHeight);
            // 切り抜きと回転は新しいソースの解像度で作り直す
            this.Reset_Crop_State();
            // 出力サイズと FPS をこのソースの初期値へ戻す。
            // プローブが先に終わって Source_Info が入っていても同じ値になるため二重実行は無害
            this.Reset_Resolution();
            this.Reset_Fps();
          }
          this.Duration = isFinite(video.duration) ? video.duration : 0;
          this.Reset_Trim();
          this.Apply_Loop();
          this.Apply_Volume();
          this.Apply_Speed();
          this.Reset_Bitrate();
        },

        Failed() {
          this.Failed_Playing = true;
          this.Playing = false;
        },

        Update_Time() {
          const video = this.$refs.Video;
          if (!video || this.Scrubbing) return;
          this.Current_Time = video.currentTime;
          if (!this.Trim_Enabled || !this.Duration) return;

          // 選択範囲の終端で止める。ループ時は範囲の先頭へ戻す
          if (video.currentTime < this.Trim_End - 0.02) return;
          if (this.Loop) {
            video.currentTime = this.Trim_Start;
            this.Current_Time = this.Trim_Start;
          } else {
            video.pause();
            video.currentTime = this.Trim_End;
            this.Current_Time = this.Trim_End;
          }
        },

        Ended() {
          this.Playing = false;
          this.Current_Time = this.Duration;
        },

        Toggle_Play() {
          const video = this.$refs.Video;
          if (!video || this.Failed_Playing) return;
          if (video.paused) {
            // 選択範囲の終端で止まっている場合は先頭から再生する
            if (this.Trim_Enabled && video.currentTime >= this.Trim_End - 0.02) {
              video.currentTime = this.Trim_Start;
            }
            video.play();
          } else {
            video.pause();
          }
        },

        Seek_End(value) {
          const video = this.$refs.Video;
          if (!video) return;
          const clamped = Math.max(this.Seek_Min, Math.min(this.Seek_Max, value));
          video.currentTime = clamped;
          this.Current_Time = clamped;
          this.Scrubbing = false;
        },

        Skip(seconds) {
          const video = this.$refs.Video;
          if (!video || !this.Duration) return;
          video.currentTime = Math.min(Math.max(video.currentTime + seconds, this.Seek_Min), this.Seek_Max);
        },

        Toggle_Mute() {
          const video = this.$refs.Video;
          this.Muted = !this.Muted;
          if (video) video.muted = this.Muted;
        },

        Apply_Volume() {
          const video = this.$refs.Video;
          if (!video) return;
          video.volume = this.Volume;
          video.muted = this.Muted || this.Volume === 0;
        },

        Apply_Speed() {
          const video = this.$refs.Video;
          if (!video) return;
          video.playbackRate = this.Speed;
        },

        Apply_Loop() {
          const video = this.$refs.Video;
          // トリム有効時はループを選択範囲内に閉じるため、要素のループは使わない
          if (video) video.loop = this.Loop && !this.Trim_Enabled;
        },

        Toggle_Fullscreen() {
          const frame = this.$refs.Player_Frame;
          if (!frame) return;
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else if (frame.requestFullscreen) {
            frame.requestFullscreen();
          }
        },

        ////// Screenshot

        // 再生中だけ requestVideoFrameCallback を使う
        // 停止中は新しいフレームが提示されないため、呼ばないと発火しない
        Draw_Frame(callback) {
          const video = this.$refs.Video;
          const canvas = this.$refs.Canvas;
          if (!video || !canvas || !video.videoWidth) return;

          const draw = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            callback(canvas);
          };

          if (!video.paused && video.requestVideoFrameCallback) {
            video.requestVideoFrameCallback(draw);
          } else {
            window.requestAnimationFrame(draw);
          }
        },

        // 再生を止めて、現在のフレームを 1 枚 PNG として保存する
        Capture_Screenshot() {
          const video = this.$refs.Video;
          if (!video || !video.videoWidth) return;
          video.pause();

          this.Draw_Frame(canvas => {
            canvas.toBlob(blob => {
              if (!blob) {
                this.Message = 'Could not read the current frame.';
                return;
              }
              const source = this.Current_Video;
              this.Shots.unshift({
                url: URL.createObjectURL(blob),
                time: video.currentTime,
                width: canvas.width,
                height: canvas.height,
                size: blob.size,
                name: source ? source.name.replace(/\.[^.]+$/, '') : 'frame'
              });
            }, 'image/png');
          });
        },

        Download_Shot(shot) {
          const link = document.createElement('a');
          link.href = shot.url;
          link.download = `${shot.name}_${shot.time.toFixed(3)}s.png`;
          link.click();
        },

        Download_All() {
          this.Shots.forEach((shot, index) => {
            window.setTimeout(() => this.Download_Shot(shot), index * 300);
          });
        },

        Remove_Shot(index) {
          const [removed] = this.Shots.splice(index, 1);
          if (removed) URL.revokeObjectURL(removed.url);
        },

        Clear_Shots() {
          this.Shots.forEach(shot => URL.revokeObjectURL(shot.url));
          this.Shots = [];
        },

        ////// Crop & Rotate

        // 切り抜きと回転をフレームの初期状態へ戻す
        Reset_Crop_State() {
          this.Crop_Enabled = false;
          this.Rotate_Step = 0;
          this.Rotate_Angle = 0;
          const frame = this.Frame_Dims;
          this.Crop_X = 0;
          this.Crop_Y = 0;
          this.Crop_W = frame.w;
          this.Crop_H = frame.h;
          this.Crop_Ratio = this.Crop_Lock_Ratio && frame.h > 0 ? frame.w / frame.h : 0;
        },

        // 切り抜き矩形をフレーム (画面上固定) の範囲内へ丸めて収める
        Normalize_Crop() {
          const width = this.Frame_Dims.w;
          const height = this.Frame_Dims.h;
          if (!width || !height) return;

          let x = Math.round(Number(this.Crop_X));
          let y = Math.round(Number(this.Crop_Y));
          let cropWidth = Math.round(Number(this.Crop_W));
          let cropHeight = Math.round(Number(this.Crop_H));
          if (!isFinite(x)) x = 0;
          if (!isFinite(y)) y = 0;
          if (!isFinite(cropWidth) || cropWidth <= 0) cropWidth = width;
          if (!isFinite(cropHeight) || cropHeight <= 0) cropHeight = height;

          x = Math.max(0, Math.min(width - 2, x));
          y = Math.max(0, Math.min(height - 2, y));
          cropWidth = Math.max(16, Math.min(width - x, cropWidth));
          cropHeight = Math.max(16, Math.min(height - y, cropHeight));

          this.Crop_X = x;
          this.Crop_Y = y;
          this.Crop_W = cropWidth;
          this.Crop_H = cropHeight;
        },

        // 出力サイズをコンテンツ比へ合わせるべきか
        Follow_Content() {
          return this.Lock_Ratio || this.Crop_Enabled || this.Odd_Quarter;
        },

        Crop_Changed() {
          this.Normalize_Crop();
          this.Enforce_Crop_Ratio();
          if (this.Follow_Content()) this.Sync_To_Content();
        },

        // 比率ロック切替時、今の枠の比率を保持する
        Crop_Ratio_Changed() {
          this.Crop_Ratio = (this.Crop_Lock_Ratio && this.Crop_H > 0)
            ? this.Crop_W / this.Crop_H
            : 0;
          if (this.Crop_Enabled) this.Crop_Changed();
        },

        // 比率ロック中は幅を基準に高さを合わせ、フレーム内へ収める
        Enforce_Crop_Ratio() {
          if (!this.Crop_Lock_Ratio || !(this.Crop_Ratio > 0)) return;
          const frame = this.Frame_Dims;
          if (!frame.w || !frame.h) return;

          let width = this.Crop_W;
          let height = Math.round(width / this.Crop_Ratio);
          if (height > frame.h) {
            height = frame.h;
            width = Math.min(width, Math.max(16, Math.round(height * this.Crop_Ratio)));
          }
          if (width > frame.w) {
            width = frame.w;
            height = Math.min(height, Math.max(16, Math.round(width / this.Crop_Ratio)));
          }
          width = Math.max(16, Math.min(frame.w, width));
          height = Math.max(16, Math.min(frame.h, height));

          this.Crop_W = width;
          this.Crop_H = height;
          this.Crop_X = Math.max(0, Math.min(frame.w - width, this.Crop_X));
          this.Crop_Y = Math.max(0, Math.min(frame.h - height, this.Crop_Y));
        },

        Content_Changed() {
          if (this.Follow_Content()) this.Sync_To_Content();
        },

        // 切り抜きと回転後のコンテンツ解像度に合わせて出力サイズを決める
        Sync_To_Content() {
          const content = this.Content_Dims;
          if (!content.w || !content.h) return;

          let width = window.VideoEditor.To_Even(this.Target_Width || content.w);
          width = Math.max(16, Math.min(7680, width));
          let height = window.VideoEditor.To_Even((width * content.h) / content.w);
          if (height > 4320) {
            height = 4320;
            width = window.VideoEditor.To_Even((height * content.w) / content.h);
            width = Math.max(16, Math.min(7680, width));
            height = window.VideoEditor.To_Even((width * content.h) / content.w);
          }

          this.Target_Width = width;
          this.Target_Height = height;

          const preset = `${this.Output_Width}x${this.Output_Height}`;
          this.Resolution_Preset = this.Resolution_Items.some(item => item.value === preset)
            ? preset
            : 'custom';
          this.Reset_Bitrate();
        },

        // 90度単位の回転。縦横を入れ替えてから出力サイズを合わせる
        // 90度単位の回転。フレーム (表示座標系) が入れ替わるので、
        // 固定した切り抜き枠を同じ内容が収まる位置へ写像してから出力サイズを合わせる
        Rotate_By(_delta) {
          const oldFrame = this.Frame_Dims;
          const oldTotal = this.Total_Rotate;
          const oldCover = this.Stage_K;

          this.Rotate_Step = (this.Rotate_Step + _delta + 360) % 360;

          const newFrame = this.Frame_Dims;
          const newTotal = this.Total_Rotate;
          const newCover = this.Stage_K;

          if (this.Crop_Enabled && oldFrame.w && newFrame.w) {
            // 同じソース点が新しいフレームのどこへ現れるかで4隅を写像する
            const radians = ((newTotal - oldTotal) * Math.PI) / 180;
            const cos = Math.cos(radians);
            const sin = Math.sin(radians);
            const scale = oldCover > 0 ? newCover / oldCover : 1;
            const centerX = oldFrame.w / 2;
            const centerY = oldFrame.h / 2;
            const offsetX = this.Frame_Dims.w / 2;
            const offsetY = this.Frame_Dims.h / 2;
            const points = [
              [this.Crop_X, this.Crop_Y],
              [this.Crop_X + this.Crop_W, this.Crop_Y],
              [this.Crop_X, this.Crop_Y + this.Crop_H],
              [this.Crop_X + this.Crop_W, this.Crop_Y + this.Crop_H]
            ].map(([px, py]) => {
              const vx = (px - centerX) * scale;
              const vy = (py - centerY) * scale;
              return [offsetX + cos * vx - sin * vy, offsetY + sin * vx + cos * vy];
            });
            const xs = points.map((point) => point[0]);
            const ys = points.map((point) => point[1]);
            this.Crop_X = Math.round(Math.min(...xs));
            this.Crop_Y = Math.round(Math.min(...ys));
            this.Crop_W = Math.round(Math.max(...xs) - Math.min(...xs));
            this.Crop_H = Math.round(Math.max(...ys) - Math.min(...ys));
            this.Normalize_Crop();
            if (this.Crop_Lock_Ratio && this.Crop_H > 0) this.Crop_Ratio = this.Crop_W / this.Crop_H;
          }

          const width = this.Target_Width;
          this.Target_Width = this.Target_Height;
          this.Target_Height = width;
          this.Sync_To_Content();
        },

        Reset_Crop_Rotate() {
          this.Reset_Crop_State();
          this.Reset_Resolution();
        },

        // プレビュー上部のグリップを回して傾き (Rotate_Angle) を調整する。
        // ステージ中心を軸に、掴んだ位置からの回転角をそのまま細かい傾きへ反映する
        Rotate_Drag(_event) {
          if (!this.Current_Video || this.Busy) return;
          const stage = this.$refs.Stage;
          if (!stage) return;
          _event.preventDefault();

          const bounds = stage.getBoundingClientRect();
          const centerX = bounds.left + bounds.width / 2;
          const centerY = bounds.top + bounds.height / 2;
          const startAngle = Math.atan2(_event.clientY - centerY, _event.clientX - centerX) * 180 / Math.PI;
          const startTilt = this.Rotate_Angle || 0;

          const onMove = (event) => {
            const angle = Math.atan2(event.clientY - centerY, event.clientX - centerX) * 180 / Math.PI;
            let delta = angle - startAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            // スライダーと同じ ±15 度、0.5 度刻みに合わせる
            const next = Math.max(-15, Math.min(15, startTilt + delta));
            this.Rotate_Angle = Math.round(next * 2) / 2;
            this.Content_Changed();
          };

          const onEnd = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onEnd);
            window.removeEventListener('pointercancel', onEnd);
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onEnd);
          window.addEventListener('pointercancel', onEnd);
        },

        // プレビュー上の切り抜き枠をドラッグする。枠は画面上で水平固定なので
        // 画面差分をフレーム解像度へ換算するだけでよく、回転補正は不要
        Crop_Drag(_mode, _event) {
          if (!this.Crop_Enabled || this.Busy) return;
          const stage = this.$refs.Stage;
          if (!stage) return;
          const bounds = stage.getBoundingClientRect();
          const frame = this.Frame_Dims;
          if (!bounds.width || !bounds.height || !frame.w || !frame.h) return;
          _event.preventDefault();

          const unitX = frame.w / bounds.width;
          const unitY = frame.h / bounds.height;
          const base = { x: this.Crop_X, y: this.Crop_Y, w: this.Crop_W, h: this.Crop_H };
          const startX = _event.clientX;
          const startY = _event.clientY;

          const onMove = (event) => {
            const deltaX = (event.clientX - startX) * unitX;
            const deltaY = (event.clientY - startY) * unitY;
            this.Apply_Crop_Drag(_mode, base, deltaX, deltaY);
          };

          const onUp = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            window.removeEventListener('pointercancel', onUp);
            this.Crop_Changed();
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
          window.addEventListener('pointercancel', onUp);
        },

        Apply_Crop_Drag(_mode, _base, _deltaX, _deltaY) {
          const width = this.Frame_Dims.w;
          const height = this.Frame_Dims.h;
          if (!width || !height) return;
          const min = 16;
          const east = _mode.indexOf('e') >= 0;
          const west = _mode.indexOf('w') >= 0;
          const north = _mode.indexOf('n') >= 0;
          const south = _mode.indexOf('s') >= 0;
          const right = _base.x + _base.w;
          const bottom = _base.y + _base.h;
          let x = _base.x;
          let y = _base.y;
          let cropWidth = _base.w;
          let cropHeight = _base.h;

          if (_mode === 'move') {
            x = Math.max(0, Math.min(width - _base.w, _base.x + _deltaX));
            y = Math.max(0, Math.min(height - _base.h, _base.y + _deltaY));
          } else if (this.Crop_Lock_Ratio && this.Crop_Ratio > 0) {
            // 比率ロック中は幅か高さの変化率を比べ、大きい側を基準に拡大縮小する
            const rawWidth = east ? _base.w + _deltaX : (west ? _base.w - _deltaX : _base.w);
            const rawHeight = south ? _base.h + _deltaY : (north ? _base.h - _deltaY : _base.h);
            const changeX = Math.abs(rawWidth / _base.w - 1);
            const changeY = Math.abs(rawHeight / _base.h - 1);
            const singleAxis = (east || west) !== (north || south);
            let scale = singleAxis
              ? ((east || west) ? rawWidth / _base.w : rawHeight / _base.h)
              : (changeX >= changeY ? rawWidth / _base.w : rawHeight / _base.h);

            // 動かない側の辺を基準に、はみ出さない上限・最小サイズで挟む
            const anchorWidth = west && !east ? right : width - _base.x;
            const anchorHeight = north && !south ? bottom : height - _base.y;
            const scaleMax = Math.min(anchorWidth / _base.w, anchorHeight / _base.h);
            const scaleMin = Math.max(min / _base.w, min / _base.h);
            scale = Math.max(scaleMin, Math.min(scaleMax, scale));

            cropWidth = Math.round(_base.w * scale);
            cropHeight = Math.round(_base.h * scale);
            x = west ? right - cropWidth : _base.x;
            y = north ? bottom - cropHeight : _base.y;
          } else {
            if (north) {
              y = Math.max(0, Math.min(bottom - min, _base.y + _deltaY));
              cropHeight = bottom - y;
            }
            if (south) {
              cropHeight = Math.max(min, Math.min(height - _base.y, _base.h + _deltaY));
            }
            if (west) {
              x = Math.max(0, Math.min(right - min, _base.x + _deltaX));
              cropWidth = right - x;
            }
            if (east) {
              cropWidth = Math.max(min, Math.min(width - _base.x, _base.w + _deltaX));
            }
          }

          this.Crop_X = Math.round(x);
          this.Crop_Y = Math.round(y);
          this.Crop_W = Math.round(cropWidth);
          this.Crop_H = Math.round(cropHeight);
        },

        ////// Export

        // 元解像度を上限に、縦横を合わせた標準解像度のうち最も大きいものを初期値にする
        Default_Resolution() {
          const source = this.Current_Video;
          if (!source || !source.width || !source.height) return 'original';

          const vertical = source.height > source.width;
          const maxWidth = Math.min(source.width, vertical ? DEFAULT_MAX_HEIGHT : DEFAULT_MAX_WIDTH);
          const maxHeight = Math.min(source.height, vertical ? DEFAULT_MAX_WIDTH : DEFAULT_MAX_HEIGHT);

          let best = null;
          RESOLUTION_PRESETS.forEach(([w, h]) => {
            const [pw, ph] = vertical ? [h, w] : [w, h];
            if (pw > maxWidth || ph > maxHeight) return;
            if (!best || pw * ph > best[0] * best[1]) best = [pw, ph];
          });

          if (!best) return 'original';
          return `${best[0]}x${best[1]}`;
        },

        Reset_Resolution() {
          // ソース解像度が未確定のうちは決められない
          if (!this.Content_Dims.w || !this.Content_Dims.h) return;
          const preset = this.Default_Resolution();
          if (preset === 'original') {
            this.Resolution_Preset = 'original';
            const content = this.Content_Dims;
            this.Target_Width = content.w;
            this.Target_Height = content.h;
          } else {
            this.Resolution_Preset = preset;
            this.Change_Resolution(preset);
            return;
          }
          this.Reset_Bitrate();
        },

        // 初期値は 30fps。元がそれより低い場合はフレームは作らず元の値を使う
        Reset_Fps() {
          const source = this.Source_Fps;
          if (source && source <= 30) {
            this.Target_Fps = Math.round(source);
            return;
          }
          this.Target_Fps = 30;
        },

        Reset_Bitrate() {
          const sourceBitrate = this.Source_Info ? this.Source_Info.bitrate : 0;
          this.Bitrate = Math.round(window.VideoEditor.Suggest_Bitrate(
            this.Output_Width, this.Output_Height, this.Effective_Fps, this.Quality, sourceBitrate) / 1000);
        },

        // 元サイズ比を保ったまま解像度を落とす
        Change_Resolution(_preset) {
          if (_preset === 'original') {
            this.Reset_Resolution();
            return;
          }

          if (_preset === 'custom') {
            this.Reset_Bitrate();
            return;
          }

          const [width, height] = String(_preset).split('x').map(Number);
          const sourceWidth = this.Content_Dims.w;
          const sourceHeight = this.Content_Dims.h;

          // 縦向き動画に横向きプリセットを当てても比率が崩れないようにする
          const sourceVertical = sourceHeight > sourceWidth;
          const presetVertical = height > width;
          if (sourceVertical !== presetVertical) {
            this.Target_Width = height;
            this.Target_Height = width;
          } else {
            this.Target_Width = width;
            this.Target_Height = height;
          }

          if (sourceWidth && sourceHeight) {
            const scale = this.Target_Width / sourceWidth;
            this.Target_Height = window.VideoEditor.To_Even(sourceHeight * scale);
          }

          this.Reset_Bitrate();
        },

        // 片方を変えたらアスペクト比に合わせてもう片方を決める
        Sync_Resolution(_changed) {
          const content = this.Content_Dims;
          if (!content.w || !content.h) return;

          if (this.Follow_Content()) {
            const ratio = content.h / content.w;
            if (_changed === 'width') {
              this.Target_Height = window.VideoEditor.To_Even(this.Target_Width * ratio);
            } else {
              this.Target_Width = window.VideoEditor.To_Even(this.Target_Height / ratio);
            }
          }

          this.Target_Width = window.VideoEditor.To_Even(this.Target_Width);
          this.Target_Height = window.VideoEditor.To_Even(this.Target_Height);

          const preset = `${this.Output_Width}x${this.Output_Height}`;
          this.Resolution_Preset = this.Resolution_Items.some(item => item.value === preset)
            ? preset
            : 'custom';
          this.Reset_Bitrate();
        },

        Start_Export() {
          const video = this.$refs.Video;
          if (video) video.pause();

          this.Busy = true;
          this.Cancel_Flag = false;
          this.Progress = 0;
          this.Progress_Phase = 'prepare';
          this.Status = 'Reading the source file...';
          this.Export_Error = '';
          this.Result = null;

          const options = {
            file: this.Current_Video.file,
            width: this.Output_Width,
            height: this.Output_Height,
            fps: this.Target_Fps,
            sourceFps: this.Source_Fps,
            bitrate: this.Bitrate * 1000,
            audio: this.Audio !== 'remove' && this.Has_Audio,
            audioBitrate: this.Audio_Bitrate || 128000,
            engine: 'webcodecs',
            start: this.Trim_Enabled ? this.Trim_Start : 0,
            duration: this.Clip_Duration,
            crop: this.Crop_Enabled
              ? { x: this.Crop_X, y: this.Crop_Y, w: this.Crop_W, h: this.Crop_H }
              : null,
            rotate: this.Total_Rotate
          };

          window.VideoEditor.Transcode(options, (event) => {
            this.Progress = event.ratio;
            this.Progress_Phase = event.phase;
            if (event.phase === 'prepare') this.Status = 'Reading the source file...';
            if (event.phase === 'video') this.Status = 'Encoding video frames...';
            if (event.phase === 'audio') this.Status = 'Encoding audio...';
            if (event.phase === 'finish') this.Status = 'Finalizing the MP4 file...';
          }, () => this.Cancel_Flag).then((result) => {
            this.Busy = false;

            if (!result || result.cancelled) {
              this.Status = 'Cancelled.';
              this.Progress = 0;
              return;
            }

            this.Progress = 1;
            this.Status = 'Done.';
            this.Result = result;
            this.Result_Name = this.Resolved_Name;
          }).catch((error) => {
            this.Busy = false;
            this.Progress = 0;
            this.Status = '';
            this.Export_Error = (error && error.message) ? error.message : String(error);
          });
        },

        Cancel_Export() {
          this.Cancel_Flag = true;
          this.Status = 'Cancelling...';
        },

        Output_Name() {
          const base = (this.Current_Video.name || 'video').replace(/\.[^.]+$/, '');
          const suffix = [
            this.Trim_Enabled ? '_clip' : '',
            this.Crop_Enabled ? '_crop' : '',
            (this.Rotate_Step || this.Rotate_Angle) ? '_rot' : ''
          ].join('');
          return `${base}_${this.Output_Width}x${this.Output_Height}${suffix}.mp4`;
        },

        Download_Result() {
          if (!this.Result) return;
          const link = document.createElement('a');
          link.href = URL.createObjectURL(this.Result.blob);
          link.download = this.Result_Name || 'output.mp4';
          link.click();
          window.setTimeout(() => URL.revokeObjectURL(link.href), 30000);
        },

        ////// Format

        Format_Bitrate(_bitrate) {
          return window.VideoEditor.Format_Bitrate(_bitrate);
        },

        Format_Size(_bytes) {
          return window.VideoEditor.Format_Size(_bytes);
        },

        Format_Time(_seconds) {
          return window.VideoEditor.Format_Time(_seconds);
        },

        ////// Keyboard

        On_Key(event) {
          if (!this.Current_Video) return;
          const target = event.target;
          if (target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) return;

          switch (event.code) {
            case 'Space':
              event.preventDefault();
              this.Toggle_Play();
              break;
            case 'ArrowLeft':
              event.preventDefault();
              this.Skip(-5);
              break;
            case 'ArrowRight':
              event.preventDefault();
              this.Skip(5);
              break;
            case 'ArrowUp':
              event.preventDefault();
              this.Volume = Math.min(1, this.Volume + 0.1);
              this.Muted = false;
              this.Apply_Volume();
              break;
            case 'ArrowDown':
              event.preventDefault();
              this.Volume = Math.max(0, this.Volume - 0.1);
              this.Apply_Volume();
              break;
            case 'KeyS':
              this.Capture_Screenshot();
              break;
            case 'KeyF':
              this.Toggle_Fullscreen();
              break;
          }
        }
      },
      mounted() {
        window.addEventListener('keydown', this.On_Key);
        this.Probe_Aac();
      },
      beforeDestroy() {
        window.removeEventListener('keydown', this.On_Key);
        this.Clear_Videos();
        this.Clear_Shots();
      }
    });
  </script>
