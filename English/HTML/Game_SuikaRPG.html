<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="shortcut icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../../Asset/CSS/Common.css?v=1.0" rel="stylesheet" />
    <link href="../../Asset/CSS/Game.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <title>Suika RPG</title>
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --ink: #e2e8f0;
            --ink-dim: #94a3b8;
            --panel: rgba(15, 23, 42, 0.88);
            --panel-border: rgba(148, 163, 184, 0.18);
            --accent: #ff5b30;
            --accent-2: #ff9f1f;
            --accent-ink: #ffffff;
            --info: #38bdf8;
            --success: #34d399;
            --danger: #f87171;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Outfit", "Space Grotesk", sans-serif;
            color: var(--ink);
            letter-spacing: 0.02em;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                radial-gradient(45% 40% at 15% 12%, rgba(255, 200, 100, 0.15), transparent 70%),
                radial-gradient(55% 50% at 84% 86%, rgba(255, 100, 80, 0.15), transparent 72%);
        }
        body::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
            opacity: 0.5;
        }

        #Canvas_1 {
            display: block;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }

        #UI_Home_1 {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 10px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--ink-dim);
            user-select: none;
            transition: all 0.2s ease;
        }
        #UI_Home_1:hover {
            color: var(--accent);
            border-color: rgba(255, 91, 48, 0.4);
            transform: translateY(-1px);
        }
        #UI_Home_1:active {
            transform: translateY(1px) scale(0.97);
        }

        #UI_TopBar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 8px;
            align-items: stretch;
            max-width: calc(100% - 130px);
            animation: fadeSlideDown 0.5s cubic-bezier(.2,.75,.2,1) both;
        }

        #UI_Status_Panel {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 8px 16px;
            user-select: none;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            min-width: 120px;
        }
        #UI_Location {
            color: var(--ink);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #UI_Turn {
            color: var(--ink-dim);
            font-size: 0.66rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #UI_Enemy_Panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 160px;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        #UI_Enemy_Panel.panel-shake {
            animation: panelShake 0.45s ease;
        }
        #UI_Enemy_Panel.panel-damage {
            animation: panelDamageFlash 0.4s ease;
        }
        #UI_Enemy_Name {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--danger);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Enemy_Hp_Bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #UI_Enemy_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #f87171);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #UI_Enemy_Hp_Fill.hp-flash {
            animation: hpFlash 0.35s ease;
        }
        #UI_Enemy_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--ink-dim);
            margin-top: 2px;
            text-align: right;
        }

        #UI_Player_Panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 150px;
            user-select: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        #UI_Player_Panel:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }
        #UI_Player_Panel.panel-shake {
            animation: panelShake 0.45s ease;
        }
        #UI_Player_Panel.panel-damage {
            animation: panelDamageFlash 0.4s ease;
        }
        #UI_Player_Panel.panel-heal {
            animation: panelHealFlash 0.4s ease;
        }
        #UI_Player_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--info);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Player_Hp_Bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #UI_Player_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #UI_Player_Hp_Fill.hp-flash {
            animation: hpFlash 0.35s ease;
        }
        #UI_Player_Hp_Fill.hp-heal {
            animation: hpHeal 0.45s ease;
        }
        #UI_Player_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--ink-dim);
            margin-top: 2px;
            text-align: right;
        }
        #UI_Player_Exp_Bar {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.07);
            overflow: hidden;
            margin-top: 4px;
        }
        #UI_Player_Exp_Fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-2), #fde047);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        #UI_Next_Panel {
            position: absolute;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 6px 16px;
            text-align: center;
            user-select: none;
            animation: fadeNextIn 0.5s ease both 0.2s;
        }
        #UI_Next_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.62rem;
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }
        #UI_Next_Fruit {
            font-size: 1.6rem;
            line-height: 1;
        }

        #UI_Item_Panel {
            position: absolute;
            bottom: 14px;
            right: 14px;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 6px 14px;
            text-align: center;
            user-select: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        #UI_Item_Panel:hover {
            border-color: rgba(52, 211, 153, 0.5);
            transform: translateY(-1px);
        }
        #UI_Item_Panel:active {
            transform: translateY(1px) scale(0.96);
        }
        #UI_Item_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.62rem;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        #UI_Item_Count {
            font-size: 1.05rem;
            line-height: 1.1;
            color: var(--ink);
            font-weight: 700;
        }

        #UI_Start_1 {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: rgba(255, 244, 234, 0.97);
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 91, 48, 0.3);
            pointer-events: none;
            animation: startBreath 1.45s ease-in-out infinite;
        }

        #UI_Message_1 {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            width: min(92vw, 560px);
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(1.6rem, 5vw, 3.2rem);
            font-weight: 700;
            color: #ffeede;
            text-align: center;
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 91, 48, 0.3);
            pointer-events: none;
            letter-spacing: 0.06em;
            line-height: 1.15;
            display: none;
        }
        #UI_Message_1.visible {
            display: block;
            animation: clearPulse 0.85s ease-in-out infinite alternate;
        }
        #UI_Message_1 .msg-hint {
            display: none;
            color: var(--ink-dim);
            font-size: 0.9rem;
            margin-top: 14px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 500;
            letter-spacing: 0.08em;
        }
        #UI_Message_1.interactive .msg-hint {
            display: block;
            animation: hintBounce 1.2s ease-in-out infinite;
        }
        #UI_Message_1.victory {
            color: #fbbf24;
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(251, 191, 36, 0.4);
        }
        #UI_Message_1.defeat {
            color: var(--danger);
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(248, 113, 113, 0.4);
        }

        #UI_Action {
            position: absolute;
            left: 50%;
            top: 96px;
            transform: translateX(-50%);
            z-index: 6;
            background: rgba(10, 16, 30, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 8px 20px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.04em;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            display: none;
        }
        #UI_Action.visible {
            display: block;
            animation: actionPop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #UI_Action .msg-hint {
            display: block;
            color: var(--ink-dim);
            font-size: 0.7rem;
            margin-top: 5px;
            font-weight: 500;
            letter-spacing: 0.1em;
            animation: hintBounce 1.2s ease-in-out infinite;
        }
        #UI_Action.action-player b { color: #fbbf24; }
        #UI_Action.action-enemy b, #UI_Action.action-punish b { color: #f87171; }
        #UI_Action.action-heal b { color: #34d399; }

        @keyframes actionPop {
            from { opacity: 0; transform: translateX(-50%) scale(0.85); }
            to { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeNextIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes startBreath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }
        @keyframes clearPulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to   { transform: translate(-50%, -50%) scale(1.08); }
        }
        @keyframes panelShake {
            0%, 100% { transform: translateX(0); }
            12% { transform: translateX(-5px) rotate(-0.8deg); }
            25% { transform: translateX(4px) rotate(0.5deg); }
            37% { transform: translateX(-3px); }
            50% { transform: translateX(2px); }
            62% { transform: translateX(-2px); }
            75% { transform: translateX(1px); }
        }
        @keyframes panelDamageFlash {
            0% { box-shadow: var(--shadow), inset 0 0 0 2px rgba(248, 113, 113, 0.6); }
            50% { box-shadow: var(--shadow), inset 0 0 12px 2px rgba(248, 113, 113, 0.3); }
            100% { box-shadow: var(--shadow), inset 0 0 0 2px transparent; }
        }
        @keyframes hpFlash {
            0% { filter: brightness(1); }
            30% { filter: brightness(1.8) saturate(1.5); }
            100% { filter: brightness(1); }
        }
        @keyframes levelUpGlow {
            0% { box-shadow: var(--shadow), 0 0 0 0 rgba(251, 191, 36, 0); }
            50% { box-shadow: var(--shadow), 0 0 20px 4px rgba(251, 191, 36, 0.35); }
            100% { box-shadow: var(--shadow), 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .level-up-glow {
            animation: levelUpGlow 0.8s ease;
        }

        @keyframes panelHealFlash {
            0% { box-shadow: var(--shadow), inset 0 0 0 2px rgba(52, 211, 153, 0.6); }
            50% { box-shadow: var(--shadow), inset 0 0 12px 2px rgba(52, 211, 153, 0.3); }
            100% { box-shadow: var(--shadow), inset 0 0 0 2px transparent; }
        }
        @keyframes hpHeal {
            0% { filter: brightness(1); }
            30% { filter: brightness(2) saturate(1.5); }
            100% { filter: brightness(1); }
        }

        #UI_Item_Panel, #UI_Dialog, #UI_Shop, #UI_ChapterTitle, #UI_Ending {
            box-sizing: border-box;
        }
        #UI_Dialog, #UI_Shop, #UI_Ending {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(4, 8, 20, 0.78);
        }
        #UI_Dialog.open, #UI_Shop.open, #UI_Ending.open {
            display: flex;
        }
        .dialog-box {
            width: min(88vw, 520px);
            background: linear-gradient(160deg, #1c2440, #12172b);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 26px 28px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            animation: overlayPop 0.35s cubic-bezier(.2,.8,.25,1.15) both;
        }
        #UI_Dialog_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 600;
            line-height: 1.5;
            color: var(--ink);
            min-height: 4.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dialog-hint {
            margin-top: 14px;
            color: var(--ink-dim);
            font-size: 1.1rem;
            animation: hintBounce 1.2s ease-in-out infinite;
        }
        @keyframes hintBounce {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(6px); opacity: 1; }
        }
        @keyframes overlayPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .shop-box {
            width: min(88vw, 420px);
            background: linear-gradient(160deg, #1c2440, #12172b);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 24px 26px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            animation: overlayPop 0.35s cubic-bezier(.2,.8,.25,1.15) both;
        }
        .shop-title {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            color: var(--accent-2);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        #UI_Shop_Gold {
            color: #fbbf24;
            font-weight: 700;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            cursor: pointer;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 600;
            color: var(--ink);
            transition: all 0.15s ease;
            user-select: none;
        }
        .shop-item:hover {
            border-color: var(--accent-2);
            background: rgba(251, 191, 36, 0.08);
        }
        .shop-item .price {
            color: #fbbf24;
        }
        .shop-item.insufficient {
            animation: hpFlash 0.4s ease;
            border-color: rgba(248, 113, 113, 0.6);
        }
        .shop-close {
            margin-top: 14px;
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            user-select: none;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .shop-close:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        #UI_PlayerInfo {
            position: fixed;
            inset: 0;
            z-index: 11;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(4, 8, 20, 0.78);
        }
        #UI_PlayerInfo.open {
            display: flex;
        }
        .info-box {
            width: min(88vw, 400px);
            background: linear-gradient(160deg, #1c2440, #12172b);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 24px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            animation: overlayPop 0.35s cubic-bezier(.2,.8,.25,1.15) both;
        }
        .info-title {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            color: var(--info);
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .info-bar-label {
            display: flex;
            justify-content: space-between;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 600;
            font-size: 0.72rem;
            color: var(--ink-dim);
            margin-bottom: 4px;
        }
        .info-track {
            height: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-bottom: 10px;
        }
        .info-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
            border-radius: 5px;
        }
        .info-exp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-2), #fde047);
            border-radius: 5px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 600;
            color: var(--ink);
        }
        .info-row .info-label {
            color: var(--ink-dim);
            font-weight: 500;
        }
        .info-close {
            margin-top: 16px;
            padding: 10px 22px;
            background: var(--info);
            color: #fff;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            user-select: none;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .info-close:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        #UI_ChapterTitle {
            position: fixed;
            inset: 0;
            z-index: 9;
            display: none;

    <script type="module">

        const FRUITS = [

        ];

        const ENEMIES = [
            { name: 'Slime',        color: '#2ecc71', hp: 80,    exp: 25,  gold: 15 },

        const CHAPTERS = [
            { icon: '🌿', name: 'Grasslands',

            { icon: '🕳️', name: 'Dark Cave',

            { icon: '🦹', name: 'Demon Castle',

        ];

        const SHOP_PRICES = { potion: 30, hp: 40, atk: 40 };

        const ENDING_TEXT =
            'With the Dark Lord shattered, shadow drains from the land. The kingdom breathes free at last, ' +
            'and your legend is sung across every village. Thank you for saving the realm, hero.';

        const GRAVITY = 0.35;
        const DAMPING = 0.72;
        const WALL_BOUNCE = 0.35;
        const FRICTION = 0.995;
        const MERGE_DIST_FACTOR = 0.92;
        const MAX_FRUITS_ON_SCREEN = 60;
        const DROP_LINE_Y_RATIO = 0.24;
        const MAX_FALL_SPEED = 18;
        const CRIT_THRESHOLD = 3;

        /* ─── Canvas Setup ─────────────────────────────────────── */

        const Canvas = document.getElementById('Canvas_1');
        const Ctx = Canvas.getContext('2d');

        let CW, CH;
        let nextPanelReady = false;
        function ResizeCanvas() {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight;
            const ratio = 4 / 5;
            let w = maxW;
            let h = w / ratio;
            if (h > maxH) {
                h = maxH;
                w = h * ratio;
            }
            CW = Math.floor(w);
            CH = Math.floor(h);
            Canvas.width = CW * window.devicePixelRatio;
            Canvas.height = CH * window.devicePixelRatio;
            Canvas.style.width = CW + 'px';
            Canvas.style.height = CH + 'px';
            Ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
            PositionNextPanel();
        }
        ResizeCanvas();
        window.addEventListener('resize', ResizeCanvas);

        function PositionNextPanel() {
            if (!nextPanelReady) return;
            const rect = Canvas.getBoundingClientRect();
            const pw = UI_NextPanel.offsetWidth;
            const ph = UI_NextPanel.offsetHeight;
            const left = rect.right + 12;
            if (left + pw <= window.innerWidth - 8) {
                UI_NextPanel.style.left = left + 'px';
                UI_NextPanel.style.top = (rect.bottom - ph - 12) + 'px';
            } else {
                UI_NextPanel.style.left = ((window.innerWidth - pw) / 2) + 'px';
                UI_NextPanel.style.top = (rect.bottom - ph - 16) + 'px';
            }
        }

        /* ─── UI Elements ──────────────────────────────────────── */

        const UI_Home = document.createElement('div');

            <div id="UI_Player_Label">Lv.1</div>

        `;

        `;
        UI_TopBar.appendChild(UI_StatusPanel);

        const UI_EnemyPanel = document.createElement('div');
        UI_EnemyPanel.id = 'UI_Enemy_Panel';
        UI_EnemyPanel.innerHTML = `
            <div id="UI_Enemy_Name">Slime</div>
            <div id="UI_Enemy_Hp_Bar"><div id="UI_Enemy_Hp_Fill"></div></div>
            <div id="UI_Enemy_Hp_Text">80 / 80</div>
        `;
        UI_TopBar.appendChild(UI_EnemyPanel);

        const UI_NextPanel = document.createElement('div');
        UI_NextPanel.id = 'UI_Next_Panel';
        UI_NextPanel.innerHTML = `
            <div id="UI_Next_Label">Next</div>
            <div id="UI_Next_Fruit">🍒</div>
        `;
        document.body.appendChild(UI_NextPanel);
        nextPanelReady = true;
        PositionNextPanel();

        const UI_ItemPanel = document.createElement('div');
        UI_ItemPanel.id = 'UI_Item_Panel';
        UI_ItemPanel.innerHTML = `
            <div id="UI_Item_Label">Potion</div>
            <div id="UI_Item_Count">×1</div>
        `;
        document.body.appendChild(UI_ItemPanel);

        const UI_Dialog = document.createElement('div');
        UI_Dialog.id = 'UI_Dialog';
        UI_Dialog.innerHTML = `
            <div class="dialog-box">
                <div id="UI_Dialog_Text"></div>
                <div class="dialog-hint">▼</div>
            </div>
        `;
        document.body.appendChild(UI_Dialog);

        const UI_Shop = document.createElement('div');
        UI_Shop.id = 'UI_Shop';
        UI_Shop.innerHTML = `
            <div class="shop-box">
                <div class="shop-title">Shop</div>
                <div id="UI_Shop_Gold">💰 0</div>
                <div class="shop-item" data-buy="potion"><span>Potion</span><span class="price">30G</span></div>
                <div class="shop-item" data-buy="hp"><span>Max HP +25</span><span class="price">40G</span></div>
                <div class="shop-item" data-buy="atk"><span>ATK +2</span><span class="price">40G</span></div>
                <div class="shop-close">Continue ▶</div>
            </div>
        `;
        document.body.appendChild(UI_Shop);

        const UI_ChapterTitle = document.createElement('div');
        UI_ChapterTitle.id = 'UI_ChapterTitle';
        UI_ChapterTitle.innerHTML = `
            <div id="UI_Chapter_Icon"></div>
            <div id="UI_Chapter_Name"></div>
            <div id="UI_Chapter_Intro"></div>
            <div class="msg-hint">▶ Tap to continue</div>
        `;
        document.body.appendChild(UI_ChapterTitle);

        const UI_Ending = document.createElement('div');
        UI_Ending.id = 'UI_Ending';
        UI_Ending.innerHTML = `
            <div class="ending-box">
                <div class="ending-title">THE DEMON HAS FALLEN</div>
                <div id="UI_Ending_Text"></div>
                <div class="ending-close">Back to Title</div>
            </div>
        `;
        document.body.appendChild(UI_Ending);

        const UI_PlayerInfo = document.createElement('div');
        UI_PlayerInfo.id = 'UI_PlayerInfo';
        UI_PlayerInfo.innerHTML = `
            <div class="info-box">
                <div class="info-title">Hero Status</div>
                <div class="info-bar-label"><span>HP</span><span id="Info_Hp_Text"></span></div>
                <div class="info-track"><div class="info-hp-fill" id="Info_Hp_Fill"></div></div>
                <div class="info-bar-label"><span>EXP</span><span id="Info_Exp_Text"></span></div>
                <div class="info-track" style="height:6px"><div class="info-exp-fill" id="Info_Exp_Fill"></div></div>
                <div class="info-row"><span class="info-label">Level</span><span id="Info_Level"></span></div>
                <div class="info-row"><span class="info-label">ATK Bonus</span><span id="Info_Atk"></span></div>
                <div class="info-row"><span class="info-label">Gold</span><span id="Info_Gold" style="color:#fbbf24"></span></div>
                <div class="info-row"><span class="info-label">Potion</span><span id="Info_Potion"></span></div>
                <div class="info-close">Close</div>
            </div>
        `;
        document.body.appendChild(UI_PlayerInfo);

        const UI_Start = document.createElement('div');
        UI_Start.id = 'UI_Start_1';
        UI_Start.innerHTML = 'START';
        document.body.appendChild(UI_Start);

        const UI_Message = document.createElement('div');
        UI_Message.id = 'UI_Message_1';
        UI_Message.innerHTML = `
            <div id="UI_Message_Text"></div>
            <div class="msg-hint">▶ Tap to continue</div>
        `;
        document.body.appendChild(UI_Message);

        const UI_Action = document.createElement('div');
        UI_Action.id = 'UI_Action';
        UI_Action.innerHTML = `
            <div id="UI_Action_Text"></div>
            <div class="msg-hint">▶ Tap to continue</div>
        `;
        document.body.appendChild(UI_Action);

        UI_Action.addEventListener('click', (e) => {
            e.stopPropagation();
            ConfirmAction();
        });

        $(UI_Home).click(() => {
            window.location.href = '../../English/HTML/index.html';
        });

        UI_Dialog.addEventListener('click', () => { ShowDialogLine(); });

        UI_Shop.addEventListener('click', (e) => {
            const item = e.target.closest('.shop-item');
            if (item) {
                const key = item.dataset.buy;
                const price = SHOP_PRICES[key];
                if (Gold >= price) {
                    Gold -= price;
                    if (key === 'potion') {
                        Potions++;
                    } else if (key === 'hp') {
                        PlayerMaxHp += 25;
                        PlayerHp = Math.min(PlayerMaxHp, PlayerHp + 25);
                        AnimatePlayerHeal();
                    } else if (key === 'atk') {
                        AttackBonus += 2;
                    }
                    UpdateUI();
                } else {
                    item.classList.add('insufficient');
                    setTimeout(() => item.classList.remove('insufficient'), 400);
                }
                return;
            }
            if (e.target.closest('.shop-close')) {
                CloseShop();
            }
        });

        UI_ItemPanel.addEventListener('click', () => {
            if (State !== 'Playing') return;
            if (Potions <= 0) return;
            Potions--;
            const heal = Math.floor(PlayerMaxHp * 0.4);
            PlayerHp = Math.min(PlayerMaxHp, PlayerHp + heal);
            AnimatePlayerHeal();
            UpdateUI();
            ShowAction('Potion +' + heal + ' HP', 'action-heal', () => {
                State = 'Playing';
            });
        });

        UI_Ending.addEventListener('click', () => {
            UI_Ending.classList.remove('open');
            ResetGame();
        });

        UI_PlayerPanel.addEventListener('click', (e) => {
            e.stopPropagation();
            OpenPlayerInfo();
        });

        UI_PlayerInfo.addEventListener('click', (e) => {
            if (e.target.closest('.info-close') || e.target === UI_PlayerInfo) {
                ClosePlayerInfo();
            }
        });

        /* ─── Game State ───────────────────────────────────────── */

        let State = 'WaitingStart';
        let Level = 1;
        let PlayerHp = 200;
        let PlayerMaxHp = 200;
        let PlayerLevel = 1;
        let PlayerExp = 0;
        let AttackBonus = 0;
        let Gold = 0;
        let Potions = 1;
        let EnemyHp = 80;
        let EnemyMaxHp = 80;
        let EnemyIndex = 0;
        let CurrentFruitType = 0;
        let NextFruitType = 0;
        let DropX = CW / 2;
        let CanDrop = true;
        let DropCooldown = 0;
        let Fruits = [];
        let DamageNumbers = [];
        let MergeEffects = [];
        let shakeTimer = 0;
        let shakeIntensity = 0;
        let messageTimer = 0;
        let TurnCount = 0;
        let pendingPostClear = 'next';
        let dialogLines = [];
        let dialogIndex = 0;
        let dialogOnDone = null;
        let shopOnClose = null;
        let chapterIntroOnDone = null;
        let prevStateBeforeInfo = null;
        let actionNext = null;

        function GetEnemy() {
            const idx = Math.min(EnemyIndex, ENEMIES.length - 1);
            return ENEMIES[idx];
        }

        function ScaleEnemyHp() {
            const base = GetEnemy().hp;
            const scale = 1 + (Level - 1) * 0.15;
            return Math.floor(base * scale);
        }

        function IsBoss(idx) {
            return idx % 2 === 1;
        }

        function CurrentChapter() {
            return Math.min(Math.floor(EnemyIndex / 2), CHAPTERS.length - 1);
        }

        function NextChapterIdx() {
            return Math.min(CurrentChapter() + 1, CHAPTERS.length - 1);
        }

        function ExpToNext(pl) {
            return 30 + (pl - 1) * 25;
        }

        function GainExp(amount) {
            PlayerExp += amount;
            while (PlayerExp >= ExpToNext(PlayerLevel)) {
                PlayerExp -= ExpToNext(PlayerLevel);
                PlayerLevel++;
                PlayerMaxHp += 20;
                AttackBonus += 2;
                PlayerHp = PlayerMaxHp;
            }
        }

        function UpdateUI() {
            document.getElementById('UI_Player_Label').textContent = 'Lv.' + PlayerLevel + ' · ATK+' + AttackBonus;

            const pRatio = Math.max(0, PlayerHp / PlayerMaxHp);
            document.getElementById('UI_Player_Hp_Fill').style.width = (pRatio * 100) + '%';
            document.getElementById('UI_Player_Hp_Text').textContent =
                Math.max(0, Math.ceil(PlayerHp)) + ' / ' + PlayerMaxHp;

            const expNeed = ExpToNext(PlayerLevel);
            document.getElementById('UI_Player_Exp_Fill').style.width =
                (Math.min(1, PlayerExp / expNeed) * 100) + '%';

            document.getElementById('UI_Location').textContent = CHAPTERS[CurrentChapter()].name;
            document.getElementById('UI_Turn').textContent = 'Turn ' + TurnCount;
            document.getElementById('UI_Shop_Gold').innerHTML = '💰 ' + Gold;
            document.getElementById('UI_Item_Count').textContent = '×' + Potions;

            const enemy = GetEnemy();
            document.getElementById('UI_Enemy_Name').textContent = enemy.name + ' · Lv.' + Level;
            const eRatio = Math.max(0, EnemyHp / EnemyMaxHp);
            document.getElementById('UI_Enemy_Hp_Fill').style.width = (eRatio * 100) + '%';
            document.getElementById('UI_Enemy_Hp_Text').textContent =
                Math.max(0, Math.ceil(EnemyHp)) + ' / ' + EnemyMaxHp;

            document.getElementById('UI_Next_Fruit').textContent = FRUITS[NextFruitType].emoji;
        }

        function ShowMessage(text, duration, className) {
            document.getElementById('UI_Message_Text').innerHTML = text;
            UI_Message.className = 'visible' + (className ? ' ' + className : '');
            messageTimer = (typeof duration === 'number' && duration > 0) ? duration : 0;
        }

        function HideMessage() {
            UI_Message.className = '';
            messageTimer = 0;
        }

        function ShowAction(text, className, onConfirm) {
            document.getElementById('UI_Action_Text').innerHTML = text;
            UI_Action.className = 'visible' + (className ? ' ' + className : '');
            actionNext = onConfirm;
            State = 'Action';
        }

        function ConfirmAction() {
            if (!UI_Action.classList.contains('visible')) return;
            UI_Action.className = '';
            const f = actionNext;
            actionNext = null;
            if (f) f();
        }

        function AnimateEnemyPanel() {
            UI_EnemyPanel.classList.remove('panel-shake');
            void UI_EnemyPanel.offsetWidth;
            UI_EnemyPanel.classList.add('panel-shake');
            const fill = document.getElementById('UI_Enemy_Hp_Fill');
            fill.classList.remove('hp-flash');
            void fill.offsetWidth;
            fill.classList.add('hp-flash');
            setTimeout(() => UI_EnemyPanel.classList.remove('panel-shake'), 500);
        }

        function AnimatePlayerPanel() {
            UI_PlayerPanel.classList.remove('panel-shake', 'panel-damage', 'panel-heal');
            void UI_PlayerPanel.offsetWidth;
            UI_PlayerPanel.classList.add('panel-shake', 'panel-damage');
            const fill = document.getElementById('UI_Player_Hp_Fill');
            fill.classList.remove('hp-flash', 'hp-heal');
            void fill.offsetWidth;
            fill.classList.add('hp-flash');
            setTimeout(() => {
                UI_PlayerPanel.classList.remove('panel-shake', 'panel-damage');
            }, 500);
        }

        function AnimatePlayerHeal() {
            UI_PlayerPanel.classList.remove('panel-shake', 'panel-damage', 'panel-heal');
            void UI_PlayerPanel.offsetWidth;
            UI_PlayerPanel.classList.add('panel-heal');
            const fill = document.getElementById('UI_Player_Hp_Fill');
            fill.classList.remove('hp-flash', 'hp-heal');
            void fill.offsetWidth;
            fill.classList.add('hp-heal');
            setTimeout(() => {
                UI_PlayerPanel.classList.remove('panel-heal');
            }, 500);
        }

        function AnimateLevelUp() {
            UI_TopBar.classList.remove('level-up-glow');
            void UI_TopBar.offsetWidth;
            UI_TopBar.classList.add('level-up-glow');
            setTimeout(() => UI_TopBar.classList.remove('level-up-glow'), 900);
        }

        function AdvanceTurn() {
            TurnCount++;
            UpdateUI();
        }

        function FindFruitAt(x, y) {
            let best = null;
            let bestDist = Infinity;
            for (let i = 0; i < Fruits.length; i++) {
                const f = Fruits[i];
                const dx = f.x - x;
                const dy = f.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < f.radius + 10 && dist < bestDist) {
                    best = f;
                    bestDist = dist;
                }
            }
            return best;
        }

        /* ─── Fruit Class ──────────────────────────────────────── */

        class Fruit {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.radius = FRUITS[type].radius;
                this.settled = false;
                this.markedForMerge = false;
                this.age = 0;
            }

            get color() { return FRUITS[this.type].color; }
            get emoji() { return FRUITS[this.type].emoji; }
            get damage() { return FRUITS[this.type].damage; }

            update(dt) {
                this.age += dt;
                this.vy += GRAVITY;
                if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
                this.vx *= FRICTION;
                this.x += this.vx;
                this.y += this.vy;

                const wallLeft = 10;
                const wallRight = CW - 10;
                const floorY = CH - 10;

                if (this.x - this.radius < wallLeft) {
                    this.x = wallLeft + this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.x + this.radius > wallRight) {
                    this.x = wallRight - this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.y + this.radius > floorY) {
                    this.y = floorY - this.radius;
                    this.vy *= -DAMPING;
                    this.vx *= 0.92;
                    if (Math.abs(this.vy) < 0.5) {
                        this.vy = 0;
                        this.settled = true;
                    }
                }
            }

            draw() {
                Ctx.save();
                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const grad = Ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, this.lightenColor(this.color, 60));
                grad.addColorStop(0.7, this.color);
                grad.addColorStop(1, this.darkenColor(this.color, 40));
                Ctx.fillStyle = grad;
                Ctx.fill();

                Ctx.strokeStyle = this.darkenColor(this.color, 60);
                Ctx.lineWidth = 1.5;
                Ctx.stroke();

                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius * 0.38, 0, Math.PI * 2);
                const highlight = Ctx.createRadialGradient(
                    this.x - this.radius * 0.15, this.y - this.radius * 0.15, 0,
                    this.x, this.y, this.radius * 0.38
                );
                highlight.addColorStop(0, 'rgba(255,255,255,0.5)');
                highlight.addColorStop(1, 'rgba(255,255,255,0)');
                Ctx.fillStyle = highlight;
                Ctx.fill();

                Ctx.font = `${Math.max(10, this.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(this.emoji, this.x, this.y + 1);

                Ctx.restore();
            }

            lightenColor(hex, amount) {
                const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
                const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
                const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
                return `rgb(${r},${g},${b})`;
            }

            darkenColor(hex, amount) {
                const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
                const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
                const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
                return `rgb(${r},${g},${b})`;
            }
        }

        /* ─── Physics ──────────────────────────────────────────── */

        function ClampFruitSpeed(f) {
            const sp = Math.hypot(f.vx, f.vy);
            const max = 14;
            if (sp > max) {
                const s = max / sp;
                f.vx *= s;
                f.vy *= s;
            }
        }

        function ResolveCollisions() {
            let detectedMerge = false;
            for (let i = 0; i < Fruits.length; i++) {
                for (let j = i + 1; j < Fruits.length; j++) {
                    const a = Fruits[i];
                    const b = Fruits[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = a.radius + b.radius;

                    if (dist < minDist && dist > 0.001) {
                        if (a.type === b.type && a.type < FRUITS.length - 1) {
                            a.markedForMerge = true;
                            b.markedForMerge = true;
                            detectedMerge = true;
                        }

                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = minDist - dist;
                        const totalMass = a.radius + b.radius;
                        const pushA = overlap * (b.radius / totalMass);
                        const pushB = overlap * (a.radius / totalMass);

                        a.x -= nx * pushA;
                        a.y -= ny * pushA;
                        b.x += nx * pushB;
                        b.y += ny * pushB;

                        const dvx = a.vx - b.vx;
                        const dvy = a.vy - b.vy;
                        const dot = dvx * nx + dvy * ny;

                        if (dot > 0) {
                            const restitution = 0.18;
                            const mA = a.radius * a.radius * a.radius;
                            const mB = b.radius * b.radius * b.radius;
                            const j = -(1 + restitution) * dot / (1 / mA + 1 / mB);
                            a.vx -= j * nx / mA;
                            a.vy -= j * ny / mA;
                            b.vx += j * nx / mB;
                            b.vy += j * ny / mB;
                            ClampFruitSpeed(a);
                            ClampFruitSpeed(b);
                        }
                    }
                }
            }

            if (detectedMerge) {
                ProcessMerges();
            }
        }

        function ProcessMerges() {
            let didMerge = false;
            let mergeCount = 0;
            const toRemove = new Set();
            const spawnQueue = [];
            const visited = new Set();

            for (let i = 0; i < Fruits.length; i++) {
                if (visited.has(i)) continue;
                if (!Fruits[i].markedForMerge) continue;

                const group = [];
                const queue = [i];
                visited.add(i);
                while (queue.length > 0) {
                    const cur = queue.shift();
                    group.push(cur);
                    for (let j = 0; j < Fruits.length; j++) {
                        if (visited.has(j)) continue;
                        if (Fruits[cur].type === Fruits[j].type && Fruits[j].markedForMerge) {
                            visited.add(j);
                            queue.push(j);
                        }
                    }
                }

                if (group.length < 2) {
                    for (const idx of group) {
                        Fruits[idx].markedForMerge = false;
                    }
                    continue;
                }

                for (const idx of group) {
                    toRemove.add(idx);
                }
                let cx = 0;
                let cy = 0;
                for (const idx of group) {
                    cx += Fruits[idx].x;
                    cy += Fruits[idx].y;
                }
                cx /= group.length;
                cy /= group.length;

                const newType = Math.min(Fruits[group[0]].type + 1, FRUITS.length - 1);
                const baseDmg = FRUITS[newType].damage;
                let multiplier = 1;
                if (group.length >= CRIT_THRESHOLD) {
                    multiplier = 1 + (group.length - CRIT_THRESHOLD + 1) * 0.5;
                }
                const dmg = Math.floor(baseDmg * multiplier);
                didMerge = true;
                mergeCount += group.length;

                const isCrit = group.length >= CRIT_THRESHOLD;
                DamageNumbers.push({
                    x: cx, y: cy,
                    text: (isCrit ? 'CRIT! ' : '') + '+' + dmg,
                    color: isCrit ? '#ffdd57' : '#fff',
                    alpha: 1,
                    vy: -2.5,
                    life: 1.5
                });

                MergeEffects.push({
                    x: cx, y: cy,
                    radius: 5,
                    maxRadius: FRUITS[newType].radius * 2.5,
                    alpha: 0.8,
                    color: FRUITS[newType].color
                });

                spawnQueue.push({ x: cx, y: cy, type: newType });
            }

            if (toRemove.size > 0) {
                Fruits = Fruits.filter((_, idx) => !toRemove.has(idx));
                for (const sp of spawnQueue) {
                    const nf = new Fruit(sp.x, sp.y, sp.type);
                    nf.vy = -2;
                    Fruits.push(nf);
                }
            }

            return mergeCount;
        }

        /* ─── RPG Logic ────────────────────────────────────────── */

        function DealDamageToEnemy(dmg) {
            EnemyHp -= dmg;
            if (EnemyHp <= 0) {
                EnemyHp = 0;
                OnEnemyDefeated();
            }
            UpdateUI();
        }

        function OnEnemyDefeated() {
            const enemy = GetEnemy();
            const expReward = enemy.exp + Level * 2;
            const goldReward = enemy.gold + Level * 3;
            const dropPotion = Math.random() < 0.3;

            Gold += goldReward;
            if (dropPotion) Potions++;
            const lvlBefore = PlayerLevel;
            GainExp(expReward);
            const leveled = PlayerLevel > lvlBefore;

            let rewardText = 'EXP +' + expReward + '&ensp;💰+' + goldReward;
            if (dropPotion) rewardText += '<br>🎁 Potion ×1';
            if (leveled) {
                rewardText += '<br>⬆ LEVEL UP! → Lv.' + PlayerLevel;
                AnimateLevelUp();
            }

            State = 'LevelClear';
            ShowMessage('Victory!<br>' + rewardText, 0, 'victory interactive');

            const isFinal = EnemyIndex >= ENEMIES.length - 1;
            if (isFinal) {
                pendingPostClear = 'ending';
            } else if (IsBoss(EnemyIndex)) {
                pendingPostClear = 'boss';
            } else {
                pendingPostClear = 'next';
            }
        }

        function ContinueAfterClear() {
            HideMessage();
            if (pendingPostClear === 'boss' || pendingPostClear === 'ending') {
                ShowBossStory();
            } else {
                NextStage();
            }
        }

        function NextStage() {
            AdvanceLevel();
            ResetLevel();
            UpdateUI();
        }

        function AdvanceLevel() {
            Level++;
            EnemyIndex++;
            const enemy = GetEnemy();
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            PlayerHp = Math.min(PlayerMaxHp, PlayerHp + Math.floor(PlayerMaxHp * 0.3));
            UpdateUI();
        }

        function EnemyAction(extraDmg, label) {
            const dmg = 5 + Math.floor(Level * 3 + EnemyIndex * 2) + (extraDmg || 0);
            PlayerHp -= dmg;
            AnimatePlayerPanel();
            UpdateUI();
            if (PlayerHp <= 0) {
                PlayerHp = 0;
                State = 'GameOver';
                ShowMessage('Defeat...', 0, 'defeat interactive');
                return;
            }
            ShowAction((label || 'Enemy attack') + ' <b>-' + dmg + ' HP</b>', label ? 'action-punish' : 'action-enemy', () => {
                State = 'Playing';
            });
        }

        /* ─── Story / Shop Flow ────────────────────────────────── */

        function ShowBossStory() {
            const chapter = CHAPTERS[CurrentChapter()];
            const lines = chapter.boss ? [chapter.boss] : [];
            const isFinal = pendingPostClear === 'ending';
            if (isFinal) {
                lines.push(
                    'With the Dark Lord gone, shadow drains from the land...',
                    'Your legend will echo through every age.'
                );
            }
            OpenDialog(lines, () => {
                if (isFinal) {
                    ShowEnding();
                } else {
                    OpenShop(() => {
                        ShowChapterIntro(NextChapterIdx(), () => NextStage());
                    });
                }
            });
        }

        function ShowEnding() {
            document.getElementById('UI_Ending_Text').textContent = ENDING_TEXT;
            UI_Ending.classList.add('open');
        }

        function OpenDialog(lines, onDone) {
            dialogLines = lines;
            dialogIndex = 0;
            dialogOnDone = onDone;
            UI_Dialog.classList.add('open');
            ShowDialogLine();
        }

        function ShowDialogLine() {
            const text = document.getElementById('UI_Dialog_Text');
            if (dialogIndex >= dialogLines.length) {
                UI_Dialog.classList.remove('open');
                if (dialogOnDone) {
                    const f = dialogOnDone;
                    dialogOnDone = null;
                    f();
                }
                return;
            }
            text.textContent = dialogLines[dialogIndex];
            dialogIndex++;
        }

        function OpenShop(onClose) {
            State = 'Shop';
            shopOnClose = onClose;
            UpdateUI();
            UI_Shop.classList.add('open');
        }

        function CloseShop() {
            UI_Shop.classList.remove('open');
            if (shopOnClose) {
                const f = shopOnClose;
                shopOnClose = null;
                f();
            }
        }

        function ShowChapterIntro(chapterIdx, onDone) {
            const ch = CHAPTERS[Math.min(chapterIdx, CHAPTERS.length - 1)];
            document.getElementById('UI_Chapter_Icon').textContent = ch.icon;
            document.getElementById('UI_Chapter_Name').textContent = ch.name;
            document.getElementById('UI_Chapter_Intro').textContent = ch.intro;
            chapterIntroOnDone = onDone;
            UI_ChapterTitle.classList.add('open');
        }

        UI_ChapterTitle.addEventListener('click', () => {
            if (!UI_ChapterTitle.classList.contains('open')) return;
            UI_ChapterTitle.classList.remove('open');
            if (chapterIntroOnDone) {
                const f = chapterIntroOnDone;
                chapterIntroOnDone = null;
                f();
            }
        });

        function HideOverlays() {
            UI_Dialog.classList.remove('open');
            UI_Shop.classList.remove('open');
            UI_ChapterTitle.classList.remove('open');
            UI_Ending.classList.remove('open');
            UI_PlayerInfo.classList.remove('open');
            prevStateBeforeInfo = null;
        }

        function RefreshPlayerInfo() {
            document.getElementById('Info_Level').textContent = PlayerLevel;
            document.getElementById('Info_Atk').textContent = '+' + AttackBonus;
            document.getElementById('Info_Hp_Text').textContent =
                Math.max(0, Math.ceil(PlayerHp)) + ' / ' + PlayerMaxHp;
            const pRatio = Math.max(0, PlayerHp / PlayerMaxHp);
            document.getElementById('Info_Hp_Fill').style.width = (pRatio * 100) + '%';
            const expNeed = ExpToNext(PlayerLevel);
            document.getElementById('Info_Exp_Text').textContent = PlayerExp + ' / ' + expNeed;
            document.getElementById('Info_Exp_Fill').style.width =
                (Math.min(1, PlayerExp / expNeed) * 100) + '%';
            document.getElementById('Info_Gold').textContent = '💰 ' + Gold;
            document.getElementById('Info_Potion').textContent = '×' + Potions;
        }

        function OpenPlayerInfo() {
            RefreshPlayerInfo();
            UI_PlayerInfo.classList.add('open');
            if (State === 'Playing') {
                prevStateBeforeInfo = 'Playing';
                State = 'Paused';
            }
        }

        function ClosePlayerInfo() {
            UI_PlayerInfo.classList.remove('open');
            if (prevStateBeforeInfo === 'Playing') {
                State = 'Playing';
            }
            prevStateBeforeInfo = null;
        }

        /* ─── Fruit Drop ───────────────────────────────────────── */

        function SpawnFruit() {
            if (!CanDrop || State !== 'Playing') return;
            if (Fruits.length >= MAX_FRUITS_ON_SCREEN) return;

            const dropY = CH * DROP_LINE_Y_RATIO;
            const f = new Fruit(DropX, dropY, CurrentFruitType);
            f.vy = 1;
            Fruits.push(f);

            CurrentFruitType = NextFruitType;
            NextFruitType = Math.floor(Math.random() * Math.min(4 + Math.floor(Level / 2), FRUITS.length));

            CanDrop = false;
            DropCooldown = 0.4;
            TurnCount++;
            UpdateUI();

            EnemyAction();
        }

        function AttackWithFruit(fruit) {
            if (State !== 'Playing') return;

            const dmg = fruit.damage + AttackBonus;
            Fruits = Fruits.filter(f => f !== fruit);

            DamageNumbers.push({
                x: fruit.x, y: fruit.y,
                text: '-' + dmg,
                color: '#ff6b6b',
                alpha: 1,
                vy: -2.5,
                life: 1.5
            });

            MergeEffects.push({
                x: fruit.x, y: fruit.y,
                radius: 5,
                maxRadius: fruit.radius * 2,
                alpha: 0.8,
                color: fruit.color
            });

            DealDamageToEnemy(dmg);
            TurnCount++;
            shakeTimer = 0.15;
            shakeIntensity = Math.min(8, dmg * 0.03);
            AnimateEnemyPanel();
            UpdateUI();

            if (State === 'LevelClear') {
                return;
            }

            ShowAction('Your attack <b>-' + dmg + ' HP</b>', 'action-player', () => {
                EnemyAction();
            });
        }

        /* ─── Game Loop ────────────────────────────────────────── */

        let lastTime = performance.now();

        function GameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (State === 'Playing') {
                DropCooldown -= dt;
                if (DropCooldown <= 0) {
                    CanDrop = true;
                }

                for (const f of Fruits) f.update(dt);
                ResolveCollisions();

                const heightLimit = CH * 0.28;
                let overLimit = false;
                for (const f of Fruits) {
                    if (f.y - f.radius < heightLimit && f.age > 1 && Math.abs(f.vy) < 1) {
                        overLimit = true;
                        break;
                    }
                }
                if (overLimit && Fruits.length > 3) {
                    shakeTimer = 0.2;
                    shakeIntensity = 4;
                    Fruits = Fruits.filter(f => f.age < 0.5);
                    EnemyAction(5, 'The enemy punishes you');
                    UpdateUI();
                }
            }

            for (let i = DamageNumbers.length - 1; i >= 0; i--) {
                const d = DamageNumbers[i];
                d.y += d.vy;
                d.life -= dt;
                d.alpha = Math.max(0, d.life / 1.5);
                if (d.life <= 0) DamageNumbers.splice(i, 1);
            }
            for (let i = MergeEffects.length - 1; i >= 0; i--) {
                const e = MergeEffects[i];
                e.radius += (e.maxRadius - e.radius) * 0.12;
                e.alpha -= dt * 2;
                if (e.alpha <= 0) MergeEffects.splice(i, 1);
            }

            if (messageTimer > 0) {
                messageTimer -= dt;
                if (messageTimer <= 0) {
                    HideMessage();
                }
            }

            if (shakeTimer > 0) shakeTimer -= dt;

            Render();
            UpdateUI();
            requestAnimationFrame(GameLoop);
        }

        /* ─── Render ───────────────────────────────────────────── */

        function Render() {
            Ctx.save();

            if (shakeTimer > 0) {
                const sx = (Math.random() - 0.5) * shakeIntensity * 2;
                const sy = (Math.random() - 0.5) * shakeIntensity * 2;
                Ctx.translate(sx, sy);
            }

            Ctx.clearRect(-20, -20, CW + 40, CH + 40);

            const bgGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(0.5, '#16213e');
            bgGrad.addColorStop(1, '#0f3460');
            Ctx.fillStyle = bgGrad;
            Ctx.fillRect(0, 0, CW, CH);

            Ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let gx = 0; gx < CW; gx += 28) {
                Ctx.fillRect(gx, 0, 1, CH);
            }
            for (let gy = 0; gy < CH; gy += 28) {
                Ctx.fillRect(0, gy, CW, 1);
            }

            const wallLeft = 10;
            const wallRight = CW - 10;
            const floorY = CH - 10;

            const wallGradX = Ctx.createLinearGradient(0, 0, CW, 0);
            wallGradX.addColorStop(0, 'rgba(255,255,255,0.06)');
            wallGradX.addColorStop(0.5, 'rgba(255,255,255,0.18)');
            wallGradX.addColorStop(1, 'rgba(255,255,255,0.06)');

            Ctx.fillStyle = wallGradX;
            Ctx.fillRect(wallLeft, floorY - 3, wallRight - wallLeft, 3);
            Ctx.fillRect(wallLeft - 3, floorY - 6, 3, 6);
            Ctx.fillRect(wallRight, floorY - 6, 3, 6);

            Ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            Ctx.lineWidth = 1.5;
            const wallGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            wallGrad.addColorStop(0, 'rgba(148,163,184,0.45)');
            wallGrad.addColorStop(0.12, 'rgba(148,163,184,0.10)');
            wallGrad.addColorStop(1, 'rgba(148,163,184,0.25)');
            Ctx.strokeStyle = wallGrad;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, 0);
            Ctx.lineTo(wallLeft, floorY - 6);
            Ctx.lineTo(wallRight, floorY - 6);
            Ctx.lineTo(wallRight, 0);
            Ctx.stroke();

            Ctx.save();
            Ctx.setLineDash([2, 8]);
            Ctx.strokeStyle = 'rgba(148,163,184,0.28)';
            Ctx.lineWidth = 1;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, floorY - 6);
            Ctx.lineTo(wallRight, floorY - 6);
            Ctx.stroke();
            Ctx.restore();

            const dropY = CH * DROP_LINE_Y_RATIO;
            if (State === 'Playing' && CanDrop) {
                Ctx.save();
                Ctx.setLineDash([6, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                Ctx.lineWidth = 1.5;
                Ctx.beginPath();
                Ctx.moveTo(DropX, dropY);
                Ctx.lineTo(DropX, floorY);
                Ctx.stroke();

                Ctx.setLineDash([2, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                Ctx.lineWidth = 1;
                Ctx.beginPath();
                Ctx.moveTo(wallLeft, dropY);
                Ctx.lineTo(wallRight, dropY);
                Ctx.stroke();
                Ctx.restore();

                const previewFruit = FRUITS[CurrentFruitType];
                Ctx.globalAlpha = 0.5;
                Ctx.beginPath();
                Ctx.arc(DropX, dropY, previewFruit.radius, 0, Math.PI * 2);
                Ctx.fillStyle = previewFruit.color;
                Ctx.fill();
                Ctx.font = `${Math.max(10, previewFruit.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(previewFruit.emoji, DropX, dropY + 1);
                Ctx.globalAlpha = 1;
            }

            for (const e of MergeEffects) {
                Ctx.beginPath();
                Ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                Ctx.strokeStyle = e.color;
                Ctx.globalAlpha = e.alpha;
                Ctx.lineWidth = 3;
                Ctx.stroke();
                Ctx.globalAlpha = 1;
            }

            for (const f of Fruits) {
                f.draw();
            }

            for (const d of DamageNumbers) {
                Ctx.save();
                Ctx.globalAlpha = d.alpha;
                Ctx.font = 'bold 18px "Space Grotesk", "Outfit", sans-serif';
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillStyle = '#000';
                Ctx.fillText(d.text, d.x + 1, d.y + 1);
                Ctx.fillStyle = d.color;
                Ctx.fillText(d.text, d.x, d.y);
                Ctx.restore();
            }

            if (State === 'WaitingStart') {
                Ctx.fillStyle = 'rgba(0,0,0,0.35)';
                Ctx.fillRect(0, 0, CW, CH);
            }

            Ctx.restore();
        }

        /* ─── Input ────────────────────────────────────────────── */

        function GetCanvasX(clientX) {
            const rect = Canvas.getBoundingClientRect();
            return clientX - rect.left;
        }

        function GetCanvasY(clientY) {
            const rect = Canvas.getBoundingClientRect();
            return clientY - rect.top;
        }

        Canvas.addEventListener('mousemove', (e) => {
            if (State === 'Playing') {
                DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.clientX)));
            }
        });

        Canvas.addEventListener('click', (e) => {
            e.preventDefault();
            if (State === 'WaitingStart') {
                StartGame();
            } else if (State === 'Playing') {
                const cx = GetCanvasX(e.clientX);
                const cy = GetCanvasY(e.clientY);
                const target = FindFruitAt(cx, cy);
                if (target) {
                    AttackWithFruit(target);
                } else {
                    SpawnFruit();
                }
            } else if (State === 'Action') {
                ConfirmAction();
            } else if (State === 'LevelClear') {
                ContinueAfterClear();
            } else if (State === 'GameOver') {
                ResetGame();
            }
        });

        Canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (State === 'Playing' && e.touches.length > 0) {
                DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.touches[0].clientX)));
            }
        }, { passive: false });

        Canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (State === 'WaitingStart') {
                StartGame();
            } else if (State === 'Playing') {
                if (e.touches.length > 0) {
                    const cx = GetCanvasX(e.touches[0].clientX);
                    const cy = GetCanvasY(e.touches[0].clientY);
                    DropX = Math.max(24, Math.min(CW - 24, cx));
                    const target = FindFruitAt(cx, cy);
                    if (target) {
                        AttackWithFruit(target);
                    } else {
                        SpawnFruit();
                    }
                }
            } else if (State === 'Action') {
                ConfirmAction();
            } else if (State === 'LevelClear') {
                ContinueAfterClear();
            } else if (State === 'GameOver') {
                ResetGame();
            }
        }, { passive: false });

        /* ─── Game Flow ────────────────────────────────────────── */

        function StartGame() {
            HideMessage();
            UI_Start.style.display = 'none';
            State = 'Intro';
            ShowChapterIntro(0, EnterBattleLevel);
        }

        function EnterBattleLevel() {
            State = 'Playing';
            CurrentFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            UpdateUI();
        }

        function ResetGame() {
            Level = 1;
            Gold = 0;
            PlayerLevel = 1;
            PlayerExp = 0;
            AttackBonus = 0;
            Potions = 1;
            PlayerMaxHp = 200;
            PlayerHp = PlayerMaxHp;
            EnemyIndex = 0;
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            TurnCount = 0;
            DropCooldown = 0;
            CanDrop = true;
            CurrentFruitType = 0;
            NextFruitType = 0;
            pendingPostClear = 'next';
            dialogOnDone = null;
            shopOnClose = null;
            HideMessage();
            HideOverlays();
            UI_Action.className = '';
            actionNext = null;
            UpdateUI();
            UI_Start.style.display = '';
            State = 'WaitingStart';
        }

        function ResetLevel() {
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            TurnCount = 0;
            DropCooldown = 0;
            CanDrop = true;
            CurrentFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            DropX = CW / 2;
            UI_Action.className = '';
            actionNext = null;
            State = 'Playing';
            UpdateUI();
        }

        /* ─── Fade-in ──────────────────────────────────────────── */

        setTimeout(() => {
            const fade = document.getElementById('Fade_Game');
            if (fade) fade.style.opacity = '0';
        }, 100);

        /* ─── Init ─────────────────────────────────────────────── */

        UpdateUI();
        requestAnimationFrame(GameLoop);

    </script>
</body>
</html>
