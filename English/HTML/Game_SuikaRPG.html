<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">

    <style>
        :root {
            --ink: #0f172a;
            --panel: rgba(255, 255, 255, 0.68);
            --panel-border: rgba(255, 255, 255, 0.62);
            --accent: #ff5b30;
            --accent-2: #ff9f1f;
            --accent-ink: #ffffff;
            --info: #1689ff;
            --success: #00a97f;
            --shadow: 0 12px 32px rgba(11, 20, 36, 0.26);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Outfit", "Space Grotesk", sans-serif;
            color: var(--ink);
            letter-spacing: 0.02em;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                radial-gradient(45% 40% at 15% 12%, rgba(255, 200, 100, 0.15), transparent 70%),
                radial-gradient(55% 50% at 84% 86%, rgba(255, 100, 80, 0.15), transparent 72%);
        }
        body::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
            opacity: 0.5;
        }

        #Canvas_1 {
            display: block;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }

        #UI_Home_1 {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 3;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 999px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 18px;
            cursor: pointer;
            color: var(--accent);
            user-select: none;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
            animation: uiSlide 0.55s cubic-bezier(.2,.75,.2,1) both;
        }
        #UI_Home_1:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(11, 20, 36, 0.3);
        }
        #UI_Home_1:active {
            transform: translateY(1px) scale(0.97);
        }

        #UI_Level_1 {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 999px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 18px;
            color: var(--ink);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            user-select: none;
            animation: uiSlide 0.55s cubic-bezier(.2,.75,.2,1) both 0.1s;
        }

        #UI_Score_1 {
            position: absolute;
            top: 64px;
            right: 18px;
            z-index: 3;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 999px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 14px;
            color: #d4a017;
            letter-spacing: 0.04em;
            user-select: none;
            animation: uiSlide 0.55s cubic-bezier(.2,.75,.2,1) both 0.15s;
        }

        #UI_Enemy_Panel {
            position: absolute;
            top: 64px;
            left: 18px;
            z-index: 3;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 16px;
            padding: 12px 16px;
            min-width: 180px;
            user-select: none;
            animation: uiSlide 0.55s cubic-bezier(.2,.75,.2,1) both 0.2s;
        }
        #UI_Enemy_Name {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            color: #b33;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Enemy_Hp_Bar {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: rgba(0,0,0,0.15);
            overflow: hidden;
        }
        #UI_Enemy_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #e74c3c, #ff6b6b);
            border-radius: 6px;
            transition: width 0.3s ease;
        }
        #UI_Enemy_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ink);
            margin-top: 2px;
            text-align: right;
        }

        #UI_Player_Panel {
            position: absolute;
            bottom: 18px;
            left: 18px;
            z-index: 3;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 16px;
            padding: 12px 16px;
            min-width: 160px;
            user-select: none;
            animation: uiRise 0.55s ease both 0.14s;
        }
        #UI_Player_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--info);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Player_Hp_Bar {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: rgba(0,0,0,0.15);
            overflow: hidden;
        }
        #UI_Player_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #27ae60, #6ddb9c);
            border-radius: 6px;
            transition: width 0.3s ease;
        }
        #UI_Player_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ink);
            margin-top: 2px;
            text-align: right;
        }

        #UI_Next_Panel {
            position: absolute;
            bottom: 18px;
            right: 18px;
            z-index: 3;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 16px;
            padding: 10px 14px;
            text-align: center;
            user-select: none;
            animation: uiRise 0.55s ease both 0.18s;
        }
        #UI_Next_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }
        #UI_Next_Fruit {
            font-size: 2rem;
            line-height: 1;
        }

        #UI_Start_1 {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: rgba(255, 244, 234, 0.97);
            text-shadow:
                0 12px 30px rgba(53, 15, 6, 0.48),
                0 0 18px rgba(255, 144, 106, 0.52);
            pointer-events: none;
            animation: startBreath 1.45s ease-in-out infinite;
        }

        #UI_Message_1 {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            width: min(92vw, 560px);
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(1.6rem, 5vw, 3.2rem);
            font-weight: 700;
            color: #ffeede;
            text-align: center;
            text-shadow:
                0 10px 28px rgba(65, 22, 11, 0.45),
                0 0 20px rgba(255, 133, 92, 0.45);
            pointer-events: none;
            letter-spacing: 0.06em;
            line-height: 1.15;
            display: none;
        }
        #UI_Message_1.visible {
            display: block;
            animation: clearPulse 0.85s ease-in-out infinite alternate;
        }

        @keyframes uiSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes uiRise {
            from { opacity: 0; transform: translateX(0) translateY(10px); }
            to { opacity: 1; transform: translateX(0) translateY(0); }
        }
        @keyframes startBreath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }
        @keyframes clearPulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to   { transform: translate(-50%, -50%) scale(1.08); }
        }

        @media (max-width: 768px) {
            #UI_Home_1 {
                top: 12px;
                right: 12px;
                padding: 9px 14px;
                font-size: 0.82rem;
            }
            #UI_Level_1 {
                top: 12px;
                font-size: 0.82rem;
                padding: 9px 14px;
            }
            #UI_Score_1 {
                top: 56px;
                right: 12px;
                font-size: 0.8rem;
                padding: 7px 12px;
            }
            #UI_Enemy_Panel {
                top: 56px;
                left: 12px;
                min-width: 140px;
                padding: 10px 12px;
            }
            #UI_Player_Panel {
                bottom: 12px;
                left: 12px;
                min-width: 130px;
                padding: 10px 12px;
            }
            #UI_Next_Panel {
                bottom: 12px;
                right: 12px;
                padding: 8px 10px;
            }
        }
    </style>

<body>
    <div id="Fade_Game"></div>
    <canvas id="Canvas_1"></canvas>

    <script type="module">

        /* ─── Constants ────────────────────────────────────────── */

        const FRUITS = [
            { name: 'Cherry',      emoji: '🍒', color: '#e74c3c', radius: 14, damage: 5  },
            { name: 'Strawberry',  emoji: '🍓', color: '#ff6b81', radius: 18, damage: 10 },
            { name: 'Grape',       emoji: '🍇', color: '#9b59b6', radius: 22, damage: 18 },
            { name: 'Orange',      emoji: '🍊', color: '#f39c12', radius: 26, damage: 28 },
            { name: 'Apple',       emoji: '🍎', color: '#e8432a', radius: 30, damage: 40 },
            { name: 'Pear',        emoji: '🍐', color: '#7dcea0', radius: 34, damage: 55 },
            { name: 'Peach',       emoji: '🍑', color: '#f5b7b1', radius: 38, damage: 72 },
            { name: 'Pineapple',   emoji: '🍍', color: '#f1c40f', radius: 42, damage: 92 },
            { name: 'Melon',       emoji: '🍈', color: '#58d68d', radius: 46, damage: 115 },
            { name: 'Watermelon',  emoji: '🍉', color: '#27ae60', radius: 50, damage: 140 }
        ];

        const ENEMIES = [
            { name: 'Slime',        color: '#2ecc71', hp: 80,    pattern: 'none' },
            { name: 'Goblin',       color: '#e67e22', hp: 160,   pattern: 'none' },
            { name: 'Skeleton',     color: '#bdc3c7', hp: 280,   pattern: 'none' },
            { name: 'Orc',          color: '#27ae60', hp: 420,   pattern: 'none' },
            { name: 'Dark Mage',    color: '#8e44ad', hp: 600,   pattern: 'none' },
            { name: 'Minotaur',     color: '#d35400', hp: 820,   pattern: 'none' },
            { name: 'Vampire',      color: '#c0392b', hp: 1100,  pattern: 'none' },
            { name: 'Demon',        color: '#7b241c', hp: 1500,  pattern: 'none' },
            { name: 'Dragon',       color: '#f39c12', hp: 2000,  pattern: 'none' },
            { name: 'Dark Lord',    color: '#1a1a2e', hp: 2800,  pattern: 'none' }
        ];

        const GRAVITY = 0.35;
        const DAMPING = 0.85;
        const WALL_BOUNCE = 0.5;
        const FRICTION = 0.995;
        const MERGE_DIST_FACTOR = 0.92;
        const MAX_FRUITS_ON_SCREEN = 60;
        const DROP_LINE_Y_RATIO = 0.12;
        const CRIT_THRESHOLD = 3;

        /* ─── Canvas Setup ─────────────────────────────────────── */

        const Canvas = document.getElementById('Canvas_1');
        const Ctx = Canvas.getContext('2d');

        let CW, CH;
        function ResizeCanvas() {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight;
            const ratio = 4 / 5;
            let w = maxW;
            let h = w / ratio;
            if (h > maxH) {
                h = maxH;
                w = h * ratio;
            }
            CW = Math.floor(w);
            CH = Math.floor(h);
            Canvas.width = CW * window.devicePixelRatio;
            Canvas.height = CH * window.devicePixelRatio;
            Canvas.style.width = CW + 'px';
            Canvas.style.height = CH + 'px';
            Ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }
        ResizeCanvas();
        window.addEventListener('resize', ResizeCanvas);

        /* ─── UI Elements ──────────────────────────────────────── */

        const UI_Home = document.createElement('div');
        UI_Home.id = 'UI_Home_1';
        UI_Home.innerHTML = 'HOME';
        document.body.appendChild(UI_Home);

        const UI_Level = document.createElement('div');
        UI_Level.id = 'UI_Level_1';
        UI_Level.innerHTML = 'Level 1';
        document.body.appendChild(UI_Level);

        const UI_Score = document.createElement('div');
        UI_Score.id = 'UI_Score_1';
        UI_Score.innerHTML = 'Score: 0';
        document.body.appendChild(UI_Score);

        const UI_EnemyPanel = document.createElement('div');
        UI_EnemyPanel.id = 'UI_Enemy_Panel';
        UI_EnemyPanel.innerHTML = `
            <div id="UI_Enemy_Name">Slime</div>
            <div id="UI_Enemy_Hp_Bar"><div id="UI_Enemy_Hp_Fill"></div></div>
            <div id="UI_Enemy_Hp_Text">80 / 80</div>
        `;
        document.body.appendChild(UI_EnemyPanel);

        const UI_PlayerPanel = document.createElement('div');
        UI_PlayerPanel.id = 'UI_Player_Panel';
        UI_PlayerPanel.innerHTML = `
            <div id="UI_Player_Label">Player</div>
            <div id="UI_Player_Hp_Bar"><div id="UI_Player_Hp_Fill"></div></div>
            <div id="UI_Player_Hp_Text">200 / 200</div>
        `;
        document.body.appendChild(UI_PlayerPanel);

        const UI_NextPanel = document.createElement('div');
        UI_NextPanel.id = 'UI_Next_Panel';
        UI_NextPanel.innerHTML = `
            <div id="UI_Next_Label">Next</div>
            <div id="UI_Next_Fruit">🍒</div>
        `;
        document.body.appendChild(UI_NextPanel);

        const UI_Start = document.createElement('div');
        UI_Start.id = 'UI_Start_1';
        UI_Start.innerHTML = 'START';
        document.body.appendChild(UI_Start);

        const UI_Message = document.createElement('div');
        UI_Message.id = 'UI_Message_1';
        document.body.appendChild(UI_Message);

        $(UI_Home).click(() => {
            window.location.href = '../../English/HTML/index.html';
        });

        /* ─── Game State ───────────────────────────────────────── */

        let State = 'WaitingStart';
        let Level = 1;
        let Score = 0;
        let PlayerHp = 200;
        let PlayerMaxHp = 200;
        let EnemyHp = 80;
        let EnemyMaxHp = 80;
        let EnemyIndex = 0;
        let CurrentFruitType = 0;
        let NextFruitType = 0;
        let DropX = CW / 2;
        let CanDrop = true;
        let DropCooldown = 0;
        let Fruits = [];
        let DamageNumbers = [];
        let MergeEffects = [];
        let shakeTimer = 0;
        let shakeIntensity = 0;
        let messageTimer = 0;

        function GetEnemy() {
            const idx = Math.min(EnemyIndex, ENEMIES.length - 1);
            return ENEMIES[idx];
        }

        function ScaleEnemyHp() {
            const base = GetEnemy().hp;
            const scale = 1 + (Level - 1) * 0.15;
            return Math.floor(base * scale);
        }

        function UpdateUI() {
            UI_Level.innerHTML = 'Level ' + Level;
            UI_Score.innerHTML = 'Score: ' + Score;

            const enemy = GetEnemy();
            document.getElementById('UI_Enemy_Name').textContent = enemy.name;
            const eRatio = Math.max(0, EnemyHp / EnemyMaxHp);
            document.getElementById('UI_Enemy_Hp_Fill').style.width = (eRatio * 100) + '%';
            document.getElementById('UI_Enemy_Hp_Text').textContent =
                Math.max(0, Math.ceil(EnemyHp)) + ' / ' + EnemyMaxHp;

            const pRatio = Math.max(0, PlayerHp / PlayerMaxHp);
            document.getElementById('UI_Player_Hp_Fill').style.width = (pRatio * 100) + '%';
            document.getElementById('UI_Player_Hp_Text').textContent =
                Math.max(0, Math.ceil(PlayerHp)) + ' / ' + PlayerMaxHp;

            document.getElementById('UI_Next_Fruit').textContent = FRUITS[NextFruitType].emoji;
        }

        function ShowMessage(text, duration) {
            UI_Message.textContent = text;
            UI_Message.classList.add('visible');
            messageTimer = duration || 2;
        }

        function HideMessage() {
            UI_Message.classList.remove('visible');
            messageTimer = 0;
        }

        /* ─── Fruit Class ──────────────────────────────────────── */

        class Fruit {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.radius = FRUITS[type].radius;
                this.merged = false;
                this.settled = false;
                this.age = 0;
            }

            get color() { return FRUITS[this.type].color; }
            get emoji() { return FRUITS[this.type].emoji; }
            get damage() { return FRUITS[this.type].damage; }

            update(dt) {
                this.age += dt;
                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.x += this.vx;
                this.y += this.vy;

                const wallLeft = 10;
                const wallRight = CW - 10;
                const floorY = CH - 10;

                if (this.x - this.radius < wallLeft) {
                    this.x = wallLeft + this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.x + this.radius > wallRight) {
                    this.x = wallRight - this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.y + this.radius > floorY) {
                    this.y = floorY - this.radius;
                    this.vy *= -DAMPING;
                    this.vx *= 0.92;
                    if (Math.abs(this.vy) < 0.5) {
                        this.vy = 0;
                        this.settled = true;
                    }
                }
            }

            draw() {
                Ctx.save();
                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const grad = Ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, this.lightenColor(this.color, 60));
                grad.addColorStop(0.7, this.color);
                grad.addColorStop(1, this.darkenColor(this.color, 40));
                Ctx.fillStyle = grad;
                Ctx.fill();

                Ctx.strokeStyle = this.darkenColor(this.color, 60);
                Ctx.lineWidth = 1.5;
                Ctx.stroke();

                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius * 0.38, 0, Math.PI * 2);
                const highlight = Ctx.createRadialGradient(
                    this.x - this.radius * 0.15, this.y - this.radius * 0.15, 0,
                    this.x, this.y, this.radius * 0.38
                );
                highlight.addColorStop(0, 'rgba(255,255,255,0.5)');
                highlight.addColorStop(1, 'rgba(255,255,255,0)');
                Ctx.fillStyle = highlight;
                Ctx.fill();

                Ctx.font = `${Math.max(10, this.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(this.emoji, this.x, this.y + 1);

                Ctx.restore();
            }

            lightenColor(hex, amount) {
                const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
                const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
                const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
                return `rgb(${r},${g},${b})`;
            }

            darkenColor(hex, amount) {
                const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
                const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
                const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
                return `rgb(${r},${g},${b})`;
            }
        }

        /* ─── Physics ──────────────────────────────────────────── */

        function ResolveCollisions() {
            for (let i = 0; i < Fruits.length; i++) {
                for (let j = i + 1; j < Fruits.length; j++) {
                    const a = Fruits[i];
                    const b = Fruits[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = a.radius + b.radius;

                    if (dist < minDist && dist > 0.001) {
                        if (a.type === b.type && a.type < FRUITS.length - 1) {
                            a.merged = true;
                            b.merged = true;
                            continue;
                        }

                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = minDist - dist;
                        const totalMass = a.radius + b.radius;
                        const pushA = overlap * (b.radius / totalMass);
                        const pushB = overlap * (a.radius / totalMass);

                        a.x -= nx * pushA;
                        a.y -= ny * pushA;
                        b.x += nx * pushB;
                        b.y += ny * pushB;

                        const dvx = a.vx - b.vx;
                        const dvy = a.vy - b.vy;
                        const dot = dvx * nx + dvy * ny;

                        if (dot > 0) {
                            const impulse = dot * 0.6;
                            a.vx -= impulse * (b.radius / totalMass) * nx;
                            a.vy -= impulse * (b.radius / totalMass) * ny;
                            b.vx += impulse * (a.radius / totalMass) * nx;
                            b.vy += impulse * (a.radius / totalMass) * ny;
                        }
                    }
                }
            }
        }

        function ProcessMerges() {
            let totalDamage = 0;
            let mergeCount = 0;
            const toRemove = new Set();
            const spawnQueue = [];

            for (let i = 0; i < Fruits.length; i++) {
                if (Fruits[i].merged || toRemove.has(i)) continue;

                const group = [i];
                Fruits[i].merged = true;
                let cx = Fruits[i].x;
                let cy = Fruits[i].y;

                for (let j = i + 1; j < Fruits.length; j++) {
                    if (Fruits[j].merged || toRemove.has(j)) continue;
                    if (Fruits[i].type === Fruits[j].type) {
                        group.push(j);
                        Fruits[j].merged = true;
                    }
                }

                if (group.length >= 2) {
                    for (const idx of group) {
                        toRemove.add(idx);
                        cx += Fruits[idx].x;
                        cy += Fruits[idx].y;
                    }
                    cx /= group.length;
                    cy /= group.length;

                    const newType = Math.min(Fruits[group[0]].type + 1, FRUITS.length - 1);
                    const baseDmg = FRUITS[newType].damage;
                    let multiplier = 1;
                    if (group.length >= CRIT_THRESHOLD) {
                        multiplier = 1 + (group.length - CRIT_THRESHOLD + 1) * 0.5;
                    }
                    const dmg = Math.floor(baseDmg * multiplier);
                    totalDamage += dmg;
                    mergeCount += group.length;

                    const isCrit = group.length >= CRIT_THRESHOLD;
                    DamageNumbers.push({
                        x: cx, y: cy,
                        text: (isCrit ? 'CRIT! ' : '') + '+' + dmg,
                        color: isCrit ? '#ffdd57' : '#fff',
                        alpha: 1,
                        vy: -2.5,
                        life: 1.5
                    });

                    MergeEffects.push({
                        x: cx, y: cy,
                        radius: 5,
                        maxRadius: FRUITS[newType].radius * 2.5,
                        alpha: 0.8,
                        color: FRUITS[newType].color
                    });

                    spawnQueue.push({ x: cx, y: cy, type: newType });
                }
            }

            if (toRemove.size > 0) {
                Fruits = Fruits.filter((_, idx) => !toRemove.has(idx));
                for (const sp of spawnQueue) {
                    const nf = new Fruit(sp.x, sp.y, sp.type);
                    nf.vy = -2;
                    Fruits.push(nf);
                }
            }

            if (totalDamage > 0) {
                DealDamageToEnemy(totalDamage);
                Score += totalDamage;
                shakeTimer = 0.15;
                shakeIntensity = Math.min(8, totalDamage * 0.03);
            }

            return mergeCount;
        }

        /* ─── RPG Logic ────────────────────────────────────────── */

        function DealDamageToEnemy(dmg) {
            EnemyHp -= dmg;
            if (EnemyHp <= 0) {
                EnemyHp = 0;
                OnEnemyDefeated();
            }
            UpdateUI();
        }

        function OnEnemyDefeated() {
            State = 'LevelClear';
            ShowMessage('Victory!', 2.5);
        }

        function AdvanceLevel() {
            Level++;
            EnemyIndex++;
            const enemy = GetEnemy();
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            PlayerMaxHp = 200 + (Level - 1) * 25;
            PlayerHp = Math.min(PlayerMaxHp, PlayerHp + Math.floor(PlayerMaxHp * 0.3));
            UpdateUI();
        }

        function EnemyAttack() {
            const dmg = 5 + Math.floor(Level * 3 + EnemyIndex * 2);
            PlayerHp -= dmg;
            if (PlayerHp <= 0) {
                PlayerHp = 0;
                State = 'GameOver';
                ShowMessage('Defeat...', 3);
            }
            UpdateUI();
        }

        /* ─── Fruit Drop ───────────────────────────────────────── */

        function SpawnFruit() {
            if (!CanDrop || State !== 'Playing') return;
            if (Fruits.length >= MAX_FRUITS_ON_SCREEN) return;

            const dropY = CH * DROP_LINE_Y_RATIO;
            const f = new Fruit(DropX, dropY, CurrentFruitType);
            f.vy = 1;
            Fruits.push(f);

            CurrentFruitType = NextFruitType;
            NextFruitType = Math.floor(Math.random() * Math.min(4 + Math.floor(Level / 2), FRUITS.length));
            UpdateUI();

            CanDrop = false;
            DropCooldown = 0.4;
        }

        /* ─── Game Loop ────────────────────────────────────────── */

        let lastTime = performance.now();
        let settleTimer = 0;
        let enemyAttackTimer = 0;

        function GameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (State === 'Playing') {
                DropCooldown -= dt;
                if (DropCooldown <= 0) {
                    CanDrop = true;
                }

                for (const f of Fruits) f.update(dt);
                ResolveCollisions();
                const merges = ProcessMerges();

                settleTimer += dt;
                if (settleTimer > 1.5) {
                    const allSettled = Fruits.every(f =>
                        Math.abs(f.vx) < 0.3 && Math.abs(f.vy) < 0.5
                    );
                    if (allSettled && Fruits.length > 0 && CanDrop) {
                        enemyAttackTimer += dt;
                        if (enemyAttackTimer > 2) {
                            EnemyAttack();
                            enemyAttackTimer = 0;
                            settleTimer = 0;
                        }
                    }
                } else {
                    enemyAttackTimer = 0;
                }

                const heightLimit = CH * 0.28;
                let overLimit = false;
                for (const f of Fruits) {
                    if (f.y - f.radius < heightLimit && f.age > 1 && Math.abs(f.vy) < 1) {
                        overLimit = true;
                        break;
                    }
                }
                if (overLimit && Fruits.length > 3) {
                    EnemyAttack();
                    PlayerHp -= 5;
                    shakeTimer = 0.2;
                    shakeIntensity = 4;
                    Fruits = Fruits.filter(f => f.age < 0.5);
                    settleTimer = 0;
                    enemyAttackTimer = 0;
                    if (PlayerHp <= 0) {
                        PlayerHp = 0;
                        State = 'GameOver';
                        ShowMessage('Defeat...', 3);
                    }
                    UpdateUI();
                }
            }

            for (let i = DamageNumbers.length - 1; i >= 0; i--) {
                const d = DamageNumbers[i];
                d.y += d.vy;
                d.life -= dt;
                d.alpha = Math.max(0, d.life / 1.5);
                if (d.life <= 0) DamageNumbers.splice(i, 1);
            }
            for (let i = MergeEffects.length - 1; i >= 0; i--) {
                const e = MergeEffects[i];
                e.radius += (e.maxRadius - e.radius) * 0.12;
                e.alpha -= dt * 2;
                if (e.alpha <= 0) MergeEffects.splice(i, 1);
            }

            if (messageTimer > 0) {
                messageTimer -= dt;
                if (messageTimer <= 0) {
                    if (State === 'LevelClear') {
                        HideMessage();
                        AdvanceLevel();
                        ResetLevel();
                    } else if (State === 'GameOver') {
                        HideMessage();
                    }
                }
            }

            if (shakeTimer > 0) shakeTimer -= dt;

            Render();
            UpdateUI();
            requestAnimationFrame(GameLoop);
        }

        /* ─── Render ───────────────────────────────────────────── */

        function Render() {
            Ctx.save();

            if (shakeTimer > 0) {
                const sx = (Math.random() - 0.5) * shakeIntensity * 2;
                const sy = (Math.random() - 0.5) * shakeIntensity * 2;
                Ctx.translate(sx, sy);
            }

            Ctx.clearRect(-20, -20, CW + 40, CH + 40);

            const bgGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(0.5, '#16213e');
            bgGrad.addColorStop(1, '#0f3460');
            Ctx.fillStyle = bgGrad;
            Ctx.fillRect(0, 0, CW, CH);

            Ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let gx = 0; gx < CW; gx += 28) {
                Ctx.fillRect(gx, 0, 1, CH);
            }
            for (let gy = 0; gy < CH; gy += 28) {
                Ctx.fillRect(0, gy, CW, 1);
            }

            const wallLeft = 10;
            const wallRight = CW - 10;
            const floorY = CH - 10;

            Ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            Ctx.lineWidth = 2;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, 0);
            Ctx.lineTo(wallLeft, floorY);
            Ctx.lineTo(wallRight, floorY);
            Ctx.lineTo(wallRight, 0);
            Ctx.stroke();

            const dropY = CH * DROP_LINE_Y_RATIO;
            if (State === 'Playing' && CanDrop) {
                Ctx.save();
                Ctx.setLineDash([6, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                Ctx.lineWidth = 1.5;
                Ctx.beginPath();
                Ctx.moveTo(DropX, dropY);
                Ctx.lineTo(DropX, floorY);
                Ctx.stroke();
                Ctx.restore();

                const previewFruit = FRUITS[CurrentFruitType];
                Ctx.globalAlpha = 0.5;
                Ctx.beginPath();
                Ctx.arc(DropX, dropY, previewFruit.radius, 0, Math.PI * 2);
                Ctx.fillStyle = previewFruit.color;
                Ctx.fill();
                Ctx.font = `${Math.max(10, previewFruit.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(previewFruit.emoji, DropX, dropY + 1);
                Ctx.globalAlpha = 1;
            }

            for (const e of MergeEffects) {
                Ctx.beginPath();
                Ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                Ctx.strokeStyle = e.color;
                Ctx.globalAlpha = e.alpha;
                Ctx.lineWidth = 3;
                Ctx.stroke();
                Ctx.globalAlpha = 1;
            }

            for (const f of Fruits) {
                f.draw();
            }

            for (const d of DamageNumbers) {
                Ctx.save();
                Ctx.globalAlpha = d.alpha;
                Ctx.font = 'bold 18px "Space Grotesk", "Outfit", sans-serif';
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillStyle = '#000';
                Ctx.fillText(d.text, d.x + 1, d.y + 1);
                Ctx.fillStyle = d.color;
                Ctx.fillText(d.text, d.x, d.y);
                Ctx.restore();
            }

            if (State === 'WaitingStart') {
                Ctx.fillStyle = 'rgba(0,0,0,0.35)';
                Ctx.fillRect(0, 0, CW, CH);
            }

            Ctx.restore();
        }

        /* ─── Input ────────────────────────────────────────────── */

        function GetCanvasX(clientX) {
            const rect = Canvas.getBoundingClientRect();
            return clientX - rect.left;
        }

        Canvas.addEventListener('mousemove', (e) => {
            if (State === 'Playing') {
                DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.clientX)));
            }
        });

        Canvas.addEventListener('click', (e) => {
            e.preventDefault();
            if (State === 'WaitingStart') {
                StartGame();
            } else if (State === 'Playing') {
                SpawnFruit();
            } else if (State === 'GameOver' || State === 'LevelClear') {
                if (State === 'GameOver') {
                    ResetGame();
                }
            }
        });

        Canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (State === 'Playing' && e.touches.length > 0) {
                DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.touches[0].clientX)));
            }
        }, { passive: false });

        Canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (State === 'WaitingStart') {
                StartGame();
            } else if (State === 'Playing') {
                if (e.touches.length > 0) {
                    DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.touches[0].clientX)));
                }
                SpawnFruit();
            } else if (State === 'GameOver') {
                ResetGame();
            }
        }, { passive: false });

        /* ─── Game Flow ────────────────────────────────────────── */

        function StartGame() {
            State = 'Playing';
            UI_Start.style.display = 'none';
            HideMessage();
            CurrentFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            UpdateUI();
        }

        function ResetGame() {
            Level = 1;
            Score = 0;
            PlayerMaxHp = 200;
            PlayerHp = PlayerMaxHp;
            EnemyIndex = 0;
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            settleTimer = 0;
            enemyAttackTimer = 0;
            DropCooldown = 0;
            CanDrop = true;
            CurrentFruitType = 0;
            NextFruitType = 0;
            HideMessage();
            UpdateUI();
            UI_Start.style.display = '';
        }

        function ResetLevel() {
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            settleTimer = 0;
            enemyAttackTimer = 0;
            DropCooldown = 0;
            CanDrop = true;
            CurrentFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            DropX = CW / 2;
            State = 'Playing';
            UpdateUI();
        }

        /* ─── Fade-in ──────────────────────────────────────────── */

        setTimeout(() => {
            const fade = document.getElementById('Fade_Game');
            if (fade) fade.style.opacity = '0';
        }, 100);

        /* ─── Init ─────────────────────────────────────────────── */

        UpdateUI();
        requestAnimationFrame(GameLoop);

    </script>
</body>
