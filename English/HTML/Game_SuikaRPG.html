<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="shortcut icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../../Asset/CSS/Common.css?v=1.0" rel="stylesheet" />
    <link href="../../Asset/CSS/Game.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <title>Suika RPG</title>
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --ink: #e2e8f0;
            --ink-dim: #94a3b8;
            --panel: rgba(15, 23, 42, 0.88);
            --panel-border: rgba(148, 163, 184, 0.18);
            --accent: #ff5b30;
            --accent-2: #ff9f1f;
            --accent-ink: #ffffff;
            --info: #38bdf8;
            --success: #34d399;
            --danger: #f87171;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Outfit", "Space Grotesk", sans-serif;
            color: var(--ink);
            letter-spacing: 0.02em;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                radial-gradient(45% 40% at 15% 12%, rgba(255, 200, 100, 0.15), transparent 70%),
                radial-gradient(55% 50% at 84% 86%, rgba(255, 100, 80, 0.15), transparent 72%);
        }
        body::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
            opacity: 0.5;
        }

        #Canvas_1 {
            display: block;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }

        #UI_Home_1 {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 10px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--ink-dim);
            user-select: none;
            transition: all 0.2s ease;
        }
        #UI_Home_1:hover {
            color: var(--accent);
            border-color: rgba(255, 91, 48, 0.4);
            transform: translateY(-1px);
        }
        #UI_Home_1:active {
            transform: translateY(1px) scale(0.97);
        }

        #UI_TopBar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 8px;
            align-items: stretch;
            max-width: calc(100% - 130px);
            animation: fadeSlideDown 0.5s cubic-bezier(.2,.75,.2,1) both;
        }

        #UI_Level_1 {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 8px 14px;
            color: var(--ink);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            user-select: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
        }
        #UI_Level_1 .sep {
            color: var(--ink-dim);
            opacity: 0.4;
        }

        #UI_Enemy_Panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 160px;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        #UI_Enemy_Panel.panel-shake {
            animation: panelShake 0.45s ease;
        }
        #UI_Enemy_Panel.panel-damage {
            animation: panelDamageFlash 0.4s ease;
        }
        #UI_Enemy_Name {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--danger);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Enemy_Hp_Bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #UI_Enemy_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #f87171);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #UI_Enemy_Hp_Fill.hp-flash {
            animation: hpFlash 0.35s ease;
        }
        #UI_Enemy_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--ink-dim);
            margin-top: 2px;
            text-align: right;
        }

        #UI_Player_Panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 140px;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        #UI_Player_Panel.panel-shake {
            animation: panelShake 0.45s ease;
        }
        #UI_Player_Panel.panel-damage {
            animation: panelDamageFlash 0.4s ease;
        }
        #UI_Player_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--info);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Player_Hp_Bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #UI_Player_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #UI_Player_Hp_Fill.hp-flash {
            animation: hpFlash 0.35s ease;
        }
        #UI_Player_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--ink-dim);
            margin-top: 2px;
            text-align: right;
        }

        #UI_Next_Panel {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 6px 16px;
            text-align: center;
            user-select: none;
            animation: fadeSlideUp 0.5s ease both 0.2s;
        }
        #UI_Next_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.62rem;
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }
        #UI_Next_Fruit {
            font-size: 1.6rem;
            line-height: 1;
        }

        #UI_Start_1 {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: rgba(255, 244, 234, 0.97);
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 91, 48, 0.3);
            pointer-events: none;
            animation: startBreath 1.45s ease-in-out infinite;
        }

        #UI_Message_1 {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            width: min(92vw, 560px);
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(1.6rem, 5vw, 3.2rem);
            font-weight: 700;
            color: #ffeede;
            text-align: center;
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 91, 48, 0.3);
            pointer-events: none;
            letter-spacing: 0.06em;
            line-height: 1.15;
            display: none;
        }
        #UI_Message_1.visible {
            display: block;
            animation: clearPulse 0.85s ease-in-out infinite alternate;
        }
        #UI_Message_1.victory {
            color: #fbbf24;
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(251, 191, 36, 0.4);
        }
        #UI_Message_1.defeat {
            color: var(--danger);
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(248, 113, 113, 0.4);
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes startBreath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }
        @keyframes clearPulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to   { transform: translate(-50%, -50%) scale(1.08); }
        }
        @keyframes panelShake {
            0%, 100% { transform: translateX(0); }
            12% { transform: translateX(-5px) rotate(-0.8deg); }
            25% { transform: translateX(4px) rotate(0.5deg); }
            37% { transform: translateX(-3px); }
            50% { transform: translateX(2px); }
            62% { transform: translateX(-2px); }
            75% { transform: translateX(1px); }
        }
        @keyframes panelDamageFlash {
            0% { box-shadow: var(--shadow), inset 0 0 0 2px rgba(248, 113, 113, 0.6); }
            50% { box-shadow: var(--shadow), inset 0 0 12px 2px rgba(248, 113, 113, 0.3); }
            100% { box-shadow: var(--shadow), inset 0 0 0 2px transparent; }
        }
        @keyframes hpFlash {
            0% { filter: brightness(1); }
            30% { filter: brightness(1.8) saturate(1.5); }
            100% { filter: brightness(1); }
        }
        @keyframes levelUpGlow {
            0% { box-shadow: var(--shadow), 0 0 0 0 rgba(251, 191, 36, 0); }
            50% { box-shadow: var(--shadow), 0 0 20px 4px rgba(251, 191, 36, 0.35); }
            100% { box-shadow: var(--shadow), 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .level-up-glow {
            animation: levelUpGlow 0.8s ease;
        }

        @media (max-width: 768px) {
            #UI_Home_1 {
                top: 10px;
                left: 10px;
                padding: 7px 12px;
                font-size: 0.72rem;
            }
            #UI_TopBar {
                top: 10px;
                gap: 6px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-areas: "player enemy" "level level";
                max-width: calc(100% - 60px);
                width: min(460px, 100%);
            }
            #UI_Player_Panel { grid-area: player; min-width: 0; }
            #UI_Enemy_Panel { grid-area: enemy; min-width: 0; }
            #UI_Level_1 { grid-area: level; justify-content: center; order: 3; }
            #UI_Level_1, #UI_Player_Panel, #UI_Enemy_Panel {
                font-size: 0.66rem;
                padding: 6px 10px;
            }
            #UI_Next_Panel {
                bottom: 10px;
                padding: 5px 12px;
            }
            #UI_Next_Fruit {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div id="Fade_Game"></div>
    <canvas id="Canvas_1"></canvas>

    <script type="module">

        /* ─── Constants ────────────────────────────────────────── */

        const FRUITS = [
            { name: 'Cherry',      emoji: '🍒', color: '#e74c3c', radius: 28, damage: 5  },
            { name: 'Strawberry',  emoji: '🍓', color: '#ff6b81', radius: 36, damage: 10 },
            { name: 'Grape',       emoji: '🍇', color: '#9b59b6', radius: 44, damage: 18 },
            { name: 'Orange',      emoji: '🍊', color: '#f39c12', radius: 52, damage: 28 },
            { name: 'Apple',       emoji: '🍎', color: '#e8432a', radius: 60, damage: 40 },
            { name: 'Pear',        emoji: '🍐', color: '#7dcea0', radius: 68, damage: 55 },
            { name: 'Peach',       emoji: '🍑', color: '#f5b7b1', radius: 76, damage: 72 },
            { name: 'Pineapple',   emoji: '🍍', color: '#f1c40f', radius: 84, damage: 92 },
            { name: 'Melon',       emoji: '🍈', color: '#58d68d', radius: 92, damage: 115 },
            { name: 'Watermelon',  emoji: '🍉', color: '#27ae60', radius: 100, damage: 140 }
        ];

        const ENEMIES = [
            { name: 'Slime',        color: '#2ecc71', hp: 80,    pattern: 'none' },
            { name: 'Goblin',       color: '#e67e22', hp: 160,   pattern: 'none' },
            { name: 'Skeleton',     color: '#bdc3c7', hp: 280,   pattern: 'none' },
            { name: 'Orc',          color: '#27ae60', hp: 420,   pattern: 'none' },
            { name: 'Dark Mage',    color: '#8e44ad', hp: 600,   pattern: 'none' },
            { name: 'Minotaur',     color: '#d35400', hp: 820,   pattern: 'none' },
            { name: 'Vampire',      color: '#c0392b', hp: 1100,  pattern: 'none' },
            { name: 'Demon',        color: '#7b241c', hp: 1500,  pattern: 'none' },
            { name: 'Dragon',       color: '#f39c12', hp: 2000,  pattern: 'none' },
            { name: 'Dark Lord',    color: '#1a1a2e', hp: 2800,  pattern: 'none' }
        ];

        const GRAVITY = 0.35;
        const DAMPING = 0.85;
        const WALL_BOUNCE = 0.5;
        const FRICTION = 0.995;
        const MERGE_DIST_FACTOR = 0.92;
        const MAX_FRUITS_ON_SCREEN = 60;
        const DROP_LINE_Y_RATIO = 0.24;
        const CRIT_THRESHOLD = 3;

        /* ─── Canvas Setup ─────────────────────────────────────── */

        const Canvas = document.getElementById('Canvas_1');
        const Ctx = Canvas.getContext('2d');

        let CW, CH;
        function ResizeCanvas() {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight;
            const ratio = 4 / 5;
            let w = maxW;
            let h = w / ratio;
            if (h > maxH) {
                h = maxH;
                w = h * ratio;
            }
            CW = Math.floor(w);
            CH = Math.floor(h);
            Canvas.width = CW * window.devicePixelRatio;
            Canvas.height = CH * window.devicePixelRatio;
            Canvas.style.width = CW + 'px';
            Canvas.style.height = CH + 'px';
            Ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }
        ResizeCanvas();
        window.addEventListener('resize', ResizeCanvas);

        /* ─── UI Elements ──────────────────────────────────────── */

        const UI_Home = document.createElement('div');
        UI_Home.id = 'UI_Home_1';
        UI_Home.innerHTML = 'HOME';
        document.body.appendChild(UI_Home);

        const UI_TopBar = document.createElement('div');
        UI_TopBar.id = 'UI_TopBar';
        document.body.appendChild(UI_TopBar);

        const UI_PlayerPanel = document.createElement('div');
        UI_PlayerPanel.id = 'UI_Player_Panel';
        UI_PlayerPanel.innerHTML = `
            <div id="UI_Player_Label">Player</div>
            <div id="UI_Player_Hp_Bar"><div id="UI_Player_Hp_Fill"></div></div>
            <div id="UI_Player_Hp_Text">200 / 200</div>
        `;
        UI_TopBar.appendChild(UI_PlayerPanel);

        const UI_Level = document.createElement('div');
        UI_Level.id = 'UI_Level_1';
        UI_Level.innerHTML = 'Level 1';
        UI_TopBar.appendChild(UI_Level);

        const UI_EnemyPanel = document.createElement('div');
        UI_EnemyPanel.id = 'UI_Enemy_Panel';
        UI_EnemyPanel.innerHTML = `
            <div id="UI_Enemy_Name">Slime</div>
            <div id="UI_Enemy_Hp_Bar"><div id="UI_Enemy_Hp_Fill"></div></div>
            <div id="UI_Enemy_Hp_Text">80 / 80</div>
        `;
        UI_TopBar.appendChild(UI_EnemyPanel);

        const UI_NextPanel = document.createElement('div');
        UI_NextPanel.id = 'UI_Next_Panel';
        UI_NextPanel.innerHTML = `
            <div id="UI_Next_Label">Next</div>
            <div id="UI_Next_Fruit">🍒</div>
        `;
        document.body.appendChild(UI_NextPanel);

        const UI_Start = document.createElement('div');
        UI_Start.id = 'UI_Start_1';
        UI_Start.innerHTML = 'START';
        document.body.appendChild(UI_Start);

        const UI_Message = document.createElement('div');
        UI_Message.id = 'UI_Message_1';
        document.body.appendChild(UI_Message);

        $(UI_Home).click(() => {
            window.location.href = '../../English/HTML/index.html';
        });

        /* ─── Game State ───────────────────────────────────────── */

        let State = 'WaitingStart';
        let Level = 1;
        let Score = 0;
        let PlayerHp = 200;
        let PlayerMaxHp = 200;
        let EnemyHp = 80;
        let EnemyMaxHp = 80;
        let EnemyIndex = 0;
        let CurrentFruitType = 0;
        let NextFruitType = 0;
        let DropX = CW / 2;
        let CanDrop = true;
        let DropCooldown = 0;
        let Fruits = [];
        let DamageNumbers = [];
        let MergeEffects = [];
        let shakeTimer = 0;
        let shakeIntensity = 0;
        let messageTimer = 0;
        let TurnCount = 0;
        let turnActive = false;
        let enemyAttackTimer = 0;
        const ATTACK_DELAY = 1.0;

        function GetEnemy() {
            const idx = Math.min(EnemyIndex, ENEMIES.length - 1);
            return ENEMIES[idx];
        }

        function ScaleEnemyHp() {
            const base = GetEnemy().hp;
            const scale = 1 + (Level - 1) * 0.15;
            return Math.floor(base * scale);
        }

        function UpdateUI() {
            UI_Level.innerHTML = 'Level ' + Level + ' &middot; Turn ' + TurnCount + '<span class="sep">&ensp;|&ensp;</span>Score ' + Score;

            const enemy = GetEnemy();
            document.getElementById('UI_Enemy_Name').textContent = enemy.name;
            const eRatio = Math.max(0, EnemyHp / EnemyMaxHp);
            document.getElementById('UI_Enemy_Hp_Fill').style.width = (eRatio * 100) + '%';
            document.getElementById('UI_Enemy_Hp_Text').textContent =
                Math.max(0, Math.ceil(EnemyHp)) + ' / ' + EnemyMaxHp;

            const pRatio = Math.max(0, PlayerHp / PlayerMaxHp);
            document.getElementById('UI_Player_Hp_Fill').style.width = (pRatio * 100) + '%';
            document.getElementById('UI_Player_Hp_Text').textContent =
                Math.max(0, Math.ceil(PlayerHp)) + ' / ' + PlayerMaxHp;

            document.getElementById('UI_Next_Fruit').textContent = FRUITS[NextFruitType].emoji;
        }

        function ShowMessage(text, duration, className) {
            UI_Message.textContent = text;
            UI_Message.className = 'visible' + (className ? ' ' + className : '');
            messageTimer = duration || 2;
        }

        function HideMessage() {
            UI_Message.className = '';
            messageTimer = 0;
        }

        function ShowWarning() {
            UI_Message.textContent = 'Enemy is attacking!';
            UI_Message.className = 'visible';
            messageTimer = 0;
        }

        function AnimateEnemyPanel() {
            UI_EnemyPanel.classList.remove('panel-shake');
            void UI_EnemyPanel.offsetWidth;
            UI_EnemyPanel.classList.add('panel-shake');
            const fill = document.getElementById('UI_Enemy_Hp_Fill');
            fill.classList.remove('hp-flash');
            void fill.offsetWidth;
            fill.classList.add('hp-flash');
            setTimeout(() => UI_EnemyPanel.classList.remove('panel-shake'), 500);
        }

        function AnimatePlayerPanel() {
            UI_PlayerPanel.classList.remove('panel-shake', 'panel-damage');
            void UI_PlayerPanel.offsetWidth;
            UI_PlayerPanel.classList.add('panel-shake', 'panel-damage');
            const fill = document.getElementById('UI_Player_Hp_Fill');
            fill.classList.remove('hp-flash');
            void fill.offsetWidth;
            fill.classList.add('hp-flash');
            setTimeout(() => {
                UI_PlayerPanel.classList.remove('panel-shake', 'panel-damage');
            }, 500);
        }

        function AnimateLevelUp() {
            UI_TopBar.classList.remove('level-up-glow');
            void UI_TopBar.offsetWidth;
            UI_TopBar.classList.add('level-up-glow');
            setTimeout(() => UI_TopBar.classList.remove('level-up-glow'), 900);
        }

        function AdvanceTurn() {
            if (turnActive) return;
            TurnCount++;
            turnActive = true;
            enemyAttackTimer = ATTACK_DELAY;
            ShowWarning();
            UpdateUI();
        }

        function FindFruitAt(x, y) {
            let best = null;
            let bestDist = Infinity;
            for (let i = 0; i < Fruits.length; i++) {
                const f = Fruits[i];
                const dx = f.x - x;
                const dy = f.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < f.radius + 10 && dist < bestDist) {
                    best = f;
                    bestDist = dist;
                }
            }
            return best;
        }

        /* ─── Fruit Class ──────────────────────────────────────── */

        class Fruit {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.radius = FRUITS[type].radius;
                this.settled = false;
                this.markedForMerge = false;
                this.age = 0;
            }

            get color() { return FRUITS[this.type].color; }
            get emoji() { return FRUITS[this.type].emoji; }
            get damage() { return FRUITS[this.type].damage; }

            update(dt) {
                this.age += dt;
                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.x += this.vx;
                this.y += this.vy;

                const wallLeft = 10;
                const wallRight = CW - 10;
                const floorY = CH - 10;

                if (this.x - this.radius < wallLeft) {
                    this.x = wallLeft + this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.x + this.radius > wallRight) {
                    this.x = wallRight - this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.y + this.radius > floorY) {
                    this.y = floorY - this.radius;
                    this.vy *= -DAMPING;
                    this.vx *= 0.92;
                    if (Math.abs(this.vy) < 0.5) {
                        this.vy = 0;
                        this.settled = true;
                    }
                }
            }

            draw() {
                Ctx.save();
                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const grad = Ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, this.lightenColor(this.color, 60));
                grad.addColorStop(0.7, this.color);
                grad.addColorStop(1, this.darkenColor(this.color, 40));
                Ctx.fillStyle = grad;
                Ctx.fill();

                Ctx.strokeStyle = this.darkenColor(this.color, 60);
                Ctx.lineWidth = 1.5;
                Ctx.stroke();

                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius * 0.38, 0, Math.PI * 2);
                const highlight = Ctx.createRadialGradient(
                    this.x - this.radius * 0.15, this.y - this.radius * 0.15, 0,
                    this.x, this.y, this.radius * 0.38
                );
                highlight.addColorStop(0, 'rgba(255,255,255,0.5)');
                highlight.addColorStop(1, 'rgba(255,255,255,0)');
                Ctx.fillStyle = highlight;
                Ctx.fill();

                Ctx.font = `${Math.max(10, this.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(this.emoji, this.x, this.y + 1);

                Ctx.restore();
            }

            lightenColor(hex, amount) {
                const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
                const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
                const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
                return `rgb(${r},${g},${b})`;
            }

            darkenColor(hex, amount) {
                const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
                const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
                const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
                return `rgb(${r},${g},${b})`;
            }
        }

        /* ─── Physics ──────────────────────────────────────────── */

        function ResolveCollisions() {
            let detectedMerge = false;
            for (let i = 0; i < Fruits.length; i++) {
                for (let j = i + 1; j < Fruits.length; j++) {
                    const a = Fruits[i];
                    const b = Fruits[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = a.radius + b.radius;

                    if (dist < minDist && dist > 0.001) {
                        if (a.type === b.type && a.type < FRUITS.length - 1) {
                            a.markedForMerge = true;
                            b.markedForMerge = true;
                            detectedMerge = true;
                        }

                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = minDist - dist;
                        const totalMass = a.radius + b.radius;
                        const pushA = overlap * (b.radius / totalMass);
                        const pushB = overlap * (a.radius / totalMass);

                        a.x -= nx * pushA;
                        a.y -= ny * pushA;
                        b.x += nx * pushB;
                        b.y += ny * pushB;

                        const dvx = a.vx - b.vx;
                        const dvy = a.vy - b.vy;
                        const dot = dvx * nx + dvy * ny;

                        if (dot > 0) {
                            const impulse = dot * 0.6;
                            a.vx -= impulse * (b.radius / totalMass) * nx;
                            a.vy -= impulse * (b.radius / totalMass) * ny;
                            b.vx += impulse * (a.radius / totalMass) * nx;
                            b.vy += impulse * (a.radius / totalMass) * ny;
                        }
                    }
                }
            }

            if (detectedMerge) {
                ProcessMerges();
            }
        }

        function ProcessMerges() {
            let didMerge = false;
            let mergeCount = 0;
            const toRemove = new Set();
            const spawnQueue = [];
            const visited = new Set();

            for (let i = 0; i < Fruits.length; i++) {
                if (visited.has(i)) continue;
                if (!Fruits[i].markedForMerge) continue;

                const group = [];
                const queue = [i];
                visited.add(i);
                while (queue.length > 0) {
                    const cur = queue.shift();
                    group.push(cur);
                    for (let j = 0; j < Fruits.length; j++) {
                        if (visited.has(j)) continue;
                        if (Fruits[cur].type === Fruits[j].type && Fruits[j].markedForMerge) {
                            visited.add(j);
                            queue.push(j);
                        }
                    }
                }

                if (group.length < 2) {
                    for (const idx of group) {
                        Fruits[idx].markedForMerge = false;
                    }
                    continue;
                }

                for (const idx of group) {
                    toRemove.add(idx);
                }
                let cx = 0;
                let cy = 0;
                for (const idx of group) {
                    cx += Fruits[idx].x;
                    cy += Fruits[idx].y;
                }
                cx /= group.length;
                cy /= group.length;

                const newType = Math.min(Fruits[group[0]].type + 1, FRUITS.length - 1);
                const baseDmg = FRUITS[newType].damage;
                let multiplier = 1;
                if (group.length >= CRIT_THRESHOLD) {
                    multiplier = 1 + (group.length - CRIT_THRESHOLD + 1) * 0.5;
                }
                const dmg = Math.floor(baseDmg * multiplier);
                didMerge = true;
                mergeCount += group.length;

                const isCrit = group.length >= CRIT_THRESHOLD;
                DamageNumbers.push({
                    x: cx, y: cy,
                    text: (isCrit ? 'CRIT! ' : '') + '+' + dmg,
                    color: isCrit ? '#ffdd57' : '#fff',
                    alpha: 1,
                    vy: -2.5,
                    life: 1.5
                });

                MergeEffects.push({
                    x: cx, y: cy,
                    radius: 5,
                    maxRadius: FRUITS[newType].radius * 2.5,
                    alpha: 0.8,
                    color: FRUITS[newType].color
                });

                spawnQueue.push({ x: cx, y: cy, type: newType });
            }

            if (toRemove.size > 0) {
                Fruits = Fruits.filter((_, idx) => !toRemove.has(idx));
                for (const sp of spawnQueue) {
                    const nf = new Fruit(sp.x, sp.y, sp.type);
                    nf.vy = -2;
                    Fruits.push(nf);
                }
            }

            if (didMerge) {
                AdvanceTurn();
            }

            return mergeCount;
        }

        /* ─── RPG Logic ────────────────────────────────────────── */

        function DealDamageToEnemy(dmg) {
            EnemyHp -= dmg;
            if (EnemyHp <= 0) {
                EnemyHp = 0;
                OnEnemyDefeated();
            }
            UpdateUI();
        }

        function OnEnemyDefeated() {
            State = 'LevelClear';
            ShowMessage('Victory!', 2.5, 'victory');
            AnimateLevelUp();
        }

        function AdvanceLevel() {
            Level++;
            EnemyIndex++;
            const enemy = GetEnemy();
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            PlayerMaxHp = 200 + (Level - 1) * 25;
            PlayerHp = Math.min(PlayerMaxHp, PlayerHp + Math.floor(PlayerMaxHp * 0.3));
            UpdateUI();
        }

        function EnemyAttack() {
            const dmg = 5 + Math.floor(Level * 3 + EnemyIndex * 2);
            PlayerHp -= dmg;
            AnimatePlayerPanel();
            if (PlayerHp <= 0) {
                PlayerHp = 0;
                State = 'GameOver';
                ShowMessage('Defeat...', 3, 'defeat');
            }
            UpdateUI();
        }

        /* ─── Fruit Drop ───────────────────────────────────────── */

        function SpawnFruit() {
            if (!CanDrop || State !== 'Playing') return;
            if (Fruits.length >= MAX_FRUITS_ON_SCREEN) return;

            const dropY = CH * DROP_LINE_Y_RATIO;
            const f = new Fruit(DropX, dropY, CurrentFruitType);
            f.vy = 1;
            Fruits.push(f);

            CurrentFruitType = NextFruitType;
            NextFruitType = Math.floor(Math.random() * Math.min(4 + Math.floor(Level / 2), FRUITS.length));
            UpdateUI();

            CanDrop = false;
            DropCooldown = 0.4;

            AdvanceTurn();
        }

        function AttackWithFruit(fruit) {
            if (State !== 'Playing') return;

            const dmg = fruit.damage;
            Fruits = Fruits.filter(f => f !== fruit);

            DamageNumbers.push({
                x: fruit.x, y: fruit.y,
                text: '-' + dmg,
                color: '#ff6b6b',
                alpha: 1,
                vy: -2.5,
                life: 1.5
            });

            MergeEffects.push({
                x: fruit.x, y: fruit.y,
                radius: 5,
                maxRadius: fruit.radius * 2,
                alpha: 0.8,
                color: fruit.color
            });

            DealDamageToEnemy(dmg);
            Score += dmg;
            shakeTimer = 0.15;
            shakeIntensity = Math.min(8, dmg * 0.03);
            AnimateEnemyPanel();

            if (State === 'Playing') {
                AdvanceTurn();
            }
        }

        /* ─── Game Loop ────────────────────────────────────────── */

        let lastTime = performance.now();

        function GameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (State === 'Playing') {
                DropCooldown -= dt;
                if (DropCooldown <= 0) {
                    CanDrop = true;
                }

                for (const f of Fruits) f.update(dt);
                ResolveCollisions();

                if (turnActive) {
                    enemyAttackTimer -= dt;
                    if (enemyAttackTimer <= 0) {
                        EnemyAttack();
                        turnActive = false;
                        HideMessage();
                    }
                }

                const heightLimit = CH * 0.28;
                let overLimit = false;
                for (const f of Fruits) {
                    if (f.y - f.radius < heightLimit && f.age > 1 && Math.abs(f.vy) < 1) {
                        overLimit = true;
                        break;
                    }
                }
                if (overLimit && Fruits.length > 3) {
                    EnemyAttack();
                    PlayerHp -= 5;
                    shakeTimer = 0.2;
                    shakeIntensity = 4;
                    Fruits = Fruits.filter(f => f.age < 0.5);
                    turnActive = false;
                    enemyAttackTimer = 0;
                    if (PlayerHp <= 0) {
                        PlayerHp = 0;
                        State = 'GameOver';
                        ShowMessage('Defeat...', 3, 'defeat');
                    }
                    UpdateUI();
                }
            }

            for (let i = DamageNumbers.length - 1; i >= 0; i--) {
                const d = DamageNumbers[i];
                d.y += d.vy;
                d.life -= dt;
                d.alpha = Math.max(0, d.life / 1.5);
                if (d.life <= 0) DamageNumbers.splice(i, 1);
            }
            for (let i = MergeEffects.length - 1; i >= 0; i--) {
                const e = MergeEffects[i];
                e.radius += (e.maxRadius - e.radius) * 0.12;
                e.alpha -= dt * 2;
                if (e.alpha <= 0) MergeEffects.splice(i, 1);
            }

            if (messageTimer > 0) {
                messageTimer -= dt;
                if (messageTimer <= 0) {
                    if (State === 'LevelClear') {
                        HideMessage();
                        AdvanceLevel();
                        ResetLevel();
                    } else if (State === 'GameOver') {
                        HideMessage();
                    }
                }
            }

            if (shakeTimer > 0) shakeTimer -= dt;

            Render();
            UpdateUI();
            requestAnimationFrame(GameLoop);
        }

        /* ─── Render ───────────────────────────────────────────── */

        function Render() {
            Ctx.save();

            if (shakeTimer > 0) {
                const sx = (Math.random() - 0.5) * shakeIntensity * 2;
                const sy = (Math.random() - 0.5) * shakeIntensity * 2;
                Ctx.translate(sx, sy);
            }

            Ctx.clearRect(-20, -20, CW + 40, CH + 40);

            const bgGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(0.5, '#16213e');
            bgGrad.addColorStop(1, '#0f3460');
            Ctx.fillStyle = bgGrad;
            Ctx.fillRect(0, 0, CW, CH);

            Ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let gx = 0; gx < CW; gx += 28) {
                Ctx.fillRect(gx, 0, 1, CH);
            }
            for (let gy = 0; gy < CH; gy += 28) {
                Ctx.fillRect(0, gy, CW, 1);
            }

            const wallLeft = 10;
            const wallRight = CW - 10;
            const floorY = CH - 10;

            const wallGradX = Ctx.createLinearGradient(0, 0, CW, 0);
            wallGradX.addColorStop(0, 'rgba(255,255,255,0.06)');
            wallGradX.addColorStop(0.5, 'rgba(255,255,255,0.18)');
            wallGradX.addColorStop(1, 'rgba(255,255,255,0.06)');

            Ctx.fillStyle = wallGradX;
            Ctx.fillRect(wallLeft, floorY - 3, wallRight - wallLeft, 3);
            Ctx.fillRect(wallLeft - 3, floorY - 6, 3, 6);
            Ctx.fillRect(wallRight, floorY - 6, 3, 6);

            Ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            Ctx.lineWidth = 1.5;
            const wallGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            wallGrad.addColorStop(0, 'rgba(148,163,184,0.45)');
            wallGrad.addColorStop(0.12, 'rgba(148,163,184,0.10)');
            wallGrad.addColorStop(1, 'rgba(148,163,184,0.25)');
            Ctx.strokeStyle = wallGrad;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, 0);
            Ctx.lineTo(wallLeft, floorY - 6);
            Ctx.lineTo(wallRight, floorY - 6);
            Ctx.lineTo(wallRight, 0);
            Ctx.stroke();

            Ctx.save();
            Ctx.setLineDash([2, 8]);
            Ctx.strokeStyle = 'rgba(148,163,184,0.28)';
            Ctx.lineWidth = 1;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, floorY - 6);
            Ctx.lineTo(wallRight, floorY - 6);
            Ctx.stroke();
            Ctx.restore();

            const dropY = CH * DROP_LINE_Y_RATIO;
            if (State === 'Playing' && CanDrop) {
                Ctx.save();
                Ctx.setLineDash([6, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                Ctx.lineWidth = 1.5;
                Ctx.beginPath();
                Ctx.moveTo(DropX, dropY);
                Ctx.lineTo(DropX, floorY);
                Ctx.stroke();

                Ctx.setLineDash([2, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                Ctx.lineWidth = 1;
                Ctx.beginPath();
                Ctx.moveTo(wallLeft, dropY);
                Ctx.lineTo(wallRight, dropY);
                Ctx.stroke();
                Ctx.restore();

                const previewFruit = FRUITS[CurrentFruitType];
                Ctx.globalAlpha = 0.5;
                Ctx.beginPath();
                Ctx.arc(DropX, dropY, previewFruit.radius, 0, Math.PI * 2);
                Ctx.fillStyle = previewFruit.color;
                Ctx.fill();
                Ctx.font = `${Math.max(10, previewFruit.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(previewFruit.emoji, DropX, dropY + 1);
                Ctx.globalAlpha = 1;
            }

            for (const e of MergeEffects) {
                Ctx.beginPath();
                Ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                Ctx.strokeStyle = e.color;
                Ctx.globalAlpha = e.alpha;
                Ctx.lineWidth = 3;
                Ctx.stroke();
                Ctx.globalAlpha = 1;
            }

            for (const f of Fruits) {
                f.draw();
            }

            for (const d of DamageNumbers) {
                Ctx.save();
                Ctx.globalAlpha = d.alpha;
                Ctx.font = 'bold 18px "Space Grotesk", "Outfit", sans-serif';
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillStyle = '#000';
                Ctx.fillText(d.text, d.x + 1, d.y + 1);
                Ctx.fillStyle = d.color;
                Ctx.fillText(d.text, d.x, d.y);
                Ctx.restore();
            }

            if (State === 'WaitingStart') {
                Ctx.fillStyle = 'rgba(0,0,0,0.35)';
                Ctx.fillRect(0, 0, CW, CH);
            }

            Ctx.restore();
        }

        /* ─── Input ────────────────────────────────────────────── */

        function GetCanvasX(clientX) {
            const rect = Canvas.getBoundingClientRect();
            return clientX - rect.left;
        }

        function GetCanvasY(clientY) {
            const rect = Canvas.getBoundingClientRect();
            return clientY - rect.top;
        }

        Canvas.addEventListener('mousemove', (e) => {
            if (State === 'Playing') {
                DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.clientX)));
            }
        });

        Canvas.addEventListener('click', (e) => {
            e.preventDefault();
            if (State === 'WaitingStart') {
                StartGame();
            } else if (State === 'Playing') {
                const cx = GetCanvasX(e.clientX);
                const cy = GetCanvasY(e.clientY);
                const target = FindFruitAt(cx, cy);
                if (target) {
                    AttackWithFruit(target);
                } else {
                    SpawnFruit();
                }
            } else if (State === 'GameOver' || State === 'LevelClear') {
                if (State === 'GameOver') {
                    ResetGame();
                }
            }
        });

        Canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (State === 'Playing' && e.touches.length > 0) {
                DropX = Math.max(24, Math.min(CW - 24, GetCanvasX(e.touches[0].clientX)));
            }
        }, { passive: false });

        Canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (State === 'WaitingStart') {
                StartGame();
            } else if (State === 'Playing') {
                if (e.touches.length > 0) {
                    const cx = GetCanvasX(e.touches[0].clientX);
                    const cy = GetCanvasY(e.touches[0].clientY);
                    DropX = Math.max(24, Math.min(CW - 24, cx));
                    const target = FindFruitAt(cx, cy);
                    if (target) {
                        AttackWithFruit(target);
                    } else {
                        SpawnFruit();
                    }
                }
            } else if (State === 'GameOver') {
                ResetGame();
            }
        }, { passive: false });

        /* ─── Game Flow ────────────────────────────────────────── */

        function StartGame() {
            State = 'Playing';
            UI_Start.style.display = 'none';
            HideMessage();
            CurrentFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            UpdateUI();
        }

        function ResetGame() {
            Level = 1;
            Score = 0;
            PlayerMaxHp = 200;
            PlayerHp = PlayerMaxHp;
            EnemyIndex = 0;
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            TurnCount = 0;
            turnActive = false;
            enemyAttackTimer = 0;
            DropCooldown = 0;
            CanDrop = true;
            CurrentFruitType = 0;
            NextFruitType = 0;
            HideMessage();
            UpdateUI();
            UI_Start.style.display = '';
        }

        function ResetLevel() {
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            turnActive = false;
            enemyAttackTimer = 0;
            DropCooldown = 0;
            CanDrop = true;
            CurrentFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            DropX = CW / 2;
            State = 'Playing';
            UpdateUI();
        }

        /* ─── Fade-in ──────────────────────────────────────────── */

        setTimeout(() => {
            const fade = document.getElementById('Fade_Game');
            if (fade) fade.style.opacity = '0';
        }, 100);

        /* ─── Init ─────────────────────────────────────────────── */

        UpdateUI();
        requestAnimationFrame(GameLoop);

    </script>
</body>
