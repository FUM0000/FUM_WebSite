    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================================
        //  Scene setup (minimal - plain particle debug view)
        // ============================================================
        const canvas = document.getElementById('Canvas');
        const Scene = new THREE.Scene();
        Scene.background = new THREE.Color(0x05070d);

        const Renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        Renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        Renderer.setSize(window.innerWidth, window.innerHeight);

        const Camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
        Camera.position.set(7, 5, 17);
        Camera.lookAt(0, 0.5, 0);

        const Controls = new OrbitControls(Camera, canvas);
        Controls.target.set(0, 2, 0);
        Controls.enableDamping = true;
        Controls.dampingFactor = 0.08;
        Controls.maxPolarAngle = Math.PI * 0.49;
        Controls.minDistance = 5;
        Controls.maxDistance = 60;
        Controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
        Controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_PAN };

        const Ambient = new THREE.AmbientLight(0x2a3a55, 1.0);
        Scene.add(Ambient);
        const Key = new THREE.DirectionalLight(0xaaccff, 1.2);
        Key.position.set(8, 16, 8);
        Scene.add(Key);

        // wireframe tank so the fluid bounds are visible (rectangular, tilted)
        const TANK_X = 9.0, TANK_Y = 0.7, TANK_Z = 4.5;
        const TILT = 0.16;              // tilt around z-axis (radians) -> low end +x
        const COS_T = Math.cos(TILT), SIN_T = Math.sin(TILT);
        // raise the box so its lowest corner rests on the ground (world y=0)
        const OFFY = (TANK_X / 2 - 0.2) * SIN_T - 0.05 * COS_T;

        const TankGroup = new THREE.Group();
        TankGroup.rotation.z = -TILT;   // +x end tips downward
        TankGroup.position.y = OFFY;    // low corner rests at world y=0
        const LineMat = new THREE.LineBasicMaterial({ color: 0x4a6a9a, transparent: true, opacity: 0.5 });
        const TankBox = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK_X, TANK_Y, TANK_Z)),
            LineMat
        );
        TankBox.position.y = TANK_Y / 2;
        TankGroup.add(TankBox);

        const TankFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(TANK_X, TANK_Z),
            new THREE.MeshStandardMaterial({ color: 0x0e1726, roughness: 0.6, metalness: 0.2 })
        );
        TankFloor.rotation.x = -Math.PI / 2;
        TankFloor.position.y = 0;
        TankGroup.add(TankFloor);
        Scene.add(TankGroup);

        // ============================================================
        //  SPH parameters
        //  These constants are the calibrated set that settle into a
        //  stable resting pool (kept identical to the validated build).
        // ============================================================
        const H = 0.55;              // smoothing radius
        const H2 = H * H;
        const REST_DENSITY = 1.0;    // rest density
        const MASS = 0.016;          // particle mass
        const GRAVITY = -31;           // gravity magnitude (box-local)
        const GRAV_X = -GRAVITY * SIN_T;   // tilt puts a downhill component along +x
        const GRAV_Y = GRAVITY * COS_T;    // .. and a vertical component
        const GAS_CONST = 35;        // stiffness of the pressure term
        const VISCOSITY = 3;         // viscosity (lower = less honey-like)
        const MAX_SPEED = 14;        // velocity clamp
        const COL_SOFT = 0.10;       // wall / rock restitution
        const SPACING = 0.22;        // initial particle spacing
        const NUM_PARTICLES = 2200;

        // kernels (Poly6 density, Spiky gradient, Laplacian viscosity)
        const KERNEL_POLY6 = 315 / (64 * Math.PI * Math.pow(H, 9));
        const KERNEL_SPIKY_GRAD = -45 / (Math.PI * Math.pow(H, 6));
        const KERNEL_VISC_LAP = 45 / (Math.PI * Math.pow(H, 6));

        function poly6(r2) {
            const d = H2 - r2;
            return d <= 0 ? 0 : KERNEL_POLY6 * d * d * d;
        }
        function spikyGrad(r, r2) {
            if (r === 0) return 0;
            const d = H - r;
            return KERNEL_SPIKY_GRAD * d * d;
        }
        function viscLap(r) {
            return KERNEL_VISC_LAP * (H - r);
        }

        // domain bounds (box-local; the tank is rendered tilted)
        const HALF_X = TANK_X / 2, HALF_Z = TANK_Z / 2;
        const MIN = { x: -HALF_X + 0.2, y: 0.05, z: -HALF_Z + 0.2 };
        const MAX = { x: HALF_X - 0.2, y: TANK_Y, z: HALF_Z - 0.2 };

        // particle data
        const pos = new Float32Array(NUM_PARTICLES * 3);
        const vel = new Float32Array(NUM_PARTICLES * 3);
        const density = new Float32Array(NUM_PARTICLES);
        const pressure = new Float32Array(NUM_PARTICLES);

        // flat spatial grid (no per-frame allocation)
        const CELL = H;
        const PHYS_DT = 0.004;       // fixed physics substep (CFL-safe; stable range verified)
        const GRID_NX = 18, GRID_NY = 12, GRID_NZ = 12;
        const GRID_XZ = GRID_NX * GRID_NY;
        const cellCount = GRID_NX * GRID_NY * GRID_NZ;
        const cellCounts = new Int32Array(cellCount);
        const cellStarts = new Int32Array(cellCount);
        const cellCursor = new Int32Array(cellCount);
        const cellIds = new Int32Array(NUM_PARTICLES);
        const cellOf = new Int32Array(NUM_PARTICLES);

        function rebuildGrid() {
            cellCounts.fill(0);
            for (let i = 0; i < NUM_PARTICLES; i++) {
                let cx = Math.floor((pos[i * 3] - MIN.x) / CELL);
                let cy = Math.floor((pos[i * 3 + 1] - MIN.y) / CELL);
                let cz = Math.floor((pos[i * 3 + 2] - MIN.z) / CELL);
                if (cx < 0) cx = 0; else if (cx >= GRID_NX) cx = GRID_NX - 1;
                if (cy < 0) cy = 0; else if (cy >= GRID_NY) cy = GRID_NY - 1;
                if (cz < 0) cz = 0; else if (cz >= GRID_NZ) cz = GRID_NZ - 1;
                const c = cx + cy * GRID_NX + cz * GRID_XZ;
                cellOf[i] = c;
                cellCounts[c]++;
            }
            let offset = 0;
            for (let c = 0; c < cellCount; c++) {
                cellStarts[c] = offset;
                offset += cellCounts[c];
            }
            cellCursor.set(cellStarts);
            for (let i = 0; i < NUM_PARTICLES; i++) {
                cellIds[cellCursor[cellOf[i]]++] = i;
            }
        }

        function resetParticles() {
            pos.fill(0);
            vel.fill(0);
            density.fill(0);
            pressure.fill(0);

            const x0 = MIN.x + 0.5;
            const z0 = MIN.z + 0.5;
            const w = (MAX.x - MIN.x) - 1.0;
            const d = (MAX.z - MIN.z) - 1.0;
            const nx = Math.max(1, Math.floor(w / SPACING));
            const nz = Math.max(1, Math.floor(d / SPACING));
            const perLayer = nx * nz;
            const layers = Math.max(1, Math.ceil(NUM_PARTICLES / perLayer));
            const layerStep = SPACING * 0.85;

            let idx = 0;
            for (let ly = 0; ly < layers && idx < NUM_PARTICLES; ly++) {
                for (let gz = 0; gz < nz && idx < NUM_PARTICLES; gz++) {
                    for (let gx = 0; gx < nx && idx < NUM_PARTICLES; gx++) {
                        const x = x0 + (gx + 0.5) * SPACING;
                        const z = z0 + (gz + 0.5) * SPACING;
                        if (x > MAX.x - 0.4 || z > MAX.z - 0.4) continue;
                        const y = 0.12 + ly * layerStep;
                        pos[idx * 3] = x;
                        pos[idx * 3 + 1] = y;
                        pos[idx * 3 + 2] = z;
                        idx++;
                    }
                }
            }
            // fill remainder near the surface
            let i = idx;
            while (i < NUM_PARTICLES) {
                const x = MIN.x + 0.6 + (i % 12) * 0.25;
                const z = MIN.z + 0.6 + ((i / 12) % 12) * 0.25;
                const y = 0.12 + ((i / 144) % 6) * 0.25;
                pos[i * 3] = x;
                pos[i * 3 + 1] = y;
                pos[i * 3 + 2] = z;
                i++;
            }
        }

        resetParticles();

        // compact neighbor lists
        const MAX_NEIGHBORS = 128;
        const nCount = new Int32Array(NUM_PARTICLES);
        const nStart = new Int32Array(NUM_PARTICLES);
        const nList = new Int32Array(NUM_PARTICLES * MAX_NEIGHBORS);

        function cellX(i) { return Math.floor((pos[i * 3] - MIN.x) / CELL); }
        function cellY(i) { return Math.floor((pos[i * 3 + 1] - MIN.y) / CELL); }
        function cellZ(i) { return Math.floor((pos[i * 3 + 2] - MIN.z) / CELL); }

        function buildNeighborLists() {
            let offset = 0;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                nStart[i] = offset;
                let cx = cellX(i), cy = cellY(i), cz = cellZ(i);
                if (cx < 0) cx = 0; else if (cx >= GRID_NX) cx = GRID_NX - 1;
                if (cy < 0) cy = 0; else if (cy >= GRID_NY) cy = GRID_NY - 1;
                if (cz < 0) cz = 0; else if (cz >= GRID_NZ) cz = GRID_NZ - 1;

                const ix3 = i * 3;
                const ix = pos[ix3], iy = pos[ix3 + 1], iz = pos[ix3 + 2];

                let cnt = 0, d = 0;                      // d = density accumulator (NOT capped)
                for (let zc = cz - 1; zc <= cz + 1; zc++) {
                    if (zc < 0 || zc >= GRID_NZ) continue;
                    for (let yc = cy - 1; yc <= cy + 1; yc++) {
                        if (yc < 0 || yc >= GRID_NY) continue;
                        for (let xc = cx - 1; xc <= cx + 1; xc++) {
                            if (xc < 0 || xc >= GRID_NX) continue;
                            const c = xc + yc * GRID_NX + zc * GRID_XZ;
                            const start = cellStarts[c], end = start + cellCounts[c];
                            for (let k = start; k < end; k++) {
                                const j = cellIds[k];
                                if (j === i) continue;
                                const jx3 = j * 3;
                                const dx = ix - pos[jx3];
                                const dy = iy - pos[jx3 + 1];
                                const dz = iz - pos[jx3 + 2];
                                const r2 = dx * dx + dy * dy + dz * dz;
                                if (r2 < H2) {
                                    d += MASS * poly6(r2);
                                    if (cnt < MAX_NEIGHBORS) nList[offset + cnt++] = j;
                                }
                            }
                        }
                    }
                }
                density[i] = d;                           // write exact density
                nCount[i] = cnt;
                offset += cnt;
            }
        }

        // symmetric pressure + viscosity, mono-atomic integration
        function computeForcesAndIntegrate(dt) {
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const ix3 = i * 3;
                const rho = density[i] > 1e-5 ? density[i] : 1e-5;
                // clamp pressure >= 0 -> no negative (tensile) stresses on the
                // free surface, which otherwise make the fluid clump together
                pressure[i] = GAS_CONST * (rho - REST_DENSITY);
                if (pressure[i] < 0) pressure[i] = 0;

                const ix = pos[ix3], iy = pos[ix3 + 1], iz = pos[ix3 + 2];
                let ax = GRAV_X, ay = GRAV_Y, az = 0;

                const s = nStart[i], e = s + nCount[i];
                for (let k = s; k < e; k++) {
                    const j = nList[k];
                    const jx3 = j * 3;
                    const dx = ix - pos[jx3];
                    const dy = iy - pos[jx3 + 1];
                    const dz = iz - pos[jx3 + 2];
                    const r2 = dx * dx + dy * dy + dz * dz;
                    if (r2 >= H2 || r2 < 1e-8) continue;
                    const r = Math.sqrt(r2);

                    // pressure:  a -= m_j (pi/rho_i^2 + pj/rho_j^2) gradW
                    const grad = spikyGrad(r, r2);
                    const rhoJ = density[j] > 1e-5 ? density[j] : 1e-5;
                    const pForce = MASS * (pressure[i] / (rho * rho) + pressure[j] / (rhoJ * rhoJ));
                    ax -= (dx / r) * pForce * grad;
                    ay -= (dy / r) * pForce * grad;
                    az -= (dz / r) * pForce * grad;

                    // viscosity:  a += m_j (v_j - v_i) / rho_j * lapW
                    const vx = vel[jx3] - vel[ix3];
                    const vy = vel[jx3 + 1] - vel[ix3 + 1];
                    const vz = vel[jx3 + 2] - vel[ix3 + 2];
                    const vMul = MASS * VISCOSITY * viscLap(r) / rhoJ;
                    ax += vx * vMul;
                    ay += vy * vMul;
                    az += vz * vMul;
                }

                vel[ix3] += ax * dt;
                vel[ix3 + 1] += ay * dt;
                vel[ix3 + 2] += az * dt;
                pos[ix3] += vel[ix3] * dt;
                pos[ix3 + 1] += vel[ix3 + 1] * dt;
                pos[ix3 + 2] += vel[ix3 + 2] * dt;
            }
        }

        function collisions() {
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const ix = i * 3;
                const px = pos[ix], py = pos[ix + 1], pz = pos[ix + 2];

                // recycle when the water reaches the ground (world y=0)
                // worldY = -px*SIN_T + py*COS_T + OFFY  <= 0
                if (-px * SIN_T + py * COS_T + OFFY <= 0) {
                    // well up inside the box at the raised (-x) end, arcing downhill
                    pos[ix] = MIN.x + 0.35 + Math.random() * 0.9;
                    pos[ix + 1] = 0.06 + Math.random() * 0.12;
                    pos[ix + 2] = (MIN.z + MAX.z) / 2 + (Math.random() - 0.5) * 1.2;
                    const V = 5.0 + Math.random() * 3.0;
                    vel[ix] = 2.5 + Math.random() * 1.5;   // toward the low (+x) end
                    vel[ix + 1] = V;                        // upward (local)
                    vel[ix + 2] = (Math.random() - 0.5) * 2.0;
                    continue;
                }

                // box floor (local)
                if (py < MIN.y) {
                    pos[ix + 1] = MIN.y;
                    if (vel[ix + 1] < 0) vel[ix + 1] = -vel[ix + 1] * COL_SOFT;
                }

                // raised end (-x) and the side walls are always closed;
                // only the low (+x) end opens above the wall top so water spills
                if (px < MIN.x) { pos[ix] = MIN.x; if (vel[ix] < 0) vel[ix] = -vel[ix] * COL_SOFT; }
                if (pz < MIN.z) { pos[ix + 2] = MIN.z; if (vel[ix + 2] < 0) vel[ix + 2] = -vel[ix + 2] * COL_SOFT; }
                if (pz > MAX.z) { pos[ix + 2] = MAX.z; if (vel[ix + 2] > 0) vel[ix + 2] = -vel[ix + 2] * COL_SOFT; }
                if (py < TANK_Y) {
                    if (px > MAX.x) { pos[ix] = MAX.x; if (vel[ix] > 0) vel[ix] = -vel[ix] * COL_SOFT; }
                }
                // above the wall top at +x the water leaves the box and falls

                if (pos[ix + 1] > TANK_Y + 6) {   // runaway safety cap
                    pos[ix + 1] = TANK_Y + 6;
                    if (vel[ix + 1] > 0) vel[ix + 1] = 0;
                }

                const vx = vel[ix], vy = vel[ix + 1], vz = vel[ix + 2];
                const sp = Math.sqrt(vx * vx + vy * vy + vz * vz);
                if (sp > MAX_SPEED) {
                    const f = MAX_SPEED / sp;
                    vel[ix] *= f; vel[ix + 1] *= f; vel[ix + 2] *= f;
                }
            }
        }

        function stepSPH(dtReal) {
            // fixed small substeps keep the pressure integration stable
            // regardless of the render-frame rate (no huge-dt blowups)
            let remain = Math.min(dtReal, 0.05);
            let guard = 0;
            while (remain > 1e-6 && guard < 16) {  // hard cap prevents a slow frame
                const h = Math.min(PHYS_DT, remain); //   from spawning an unbounded
                rebuildGrid();                        //   catch-up run (death spiral)
                buildNeighborLists();
                computeForcesAndIntegrate(h);
                collisions();
                remain -= h;
                guard++;
            }
        }

        // ============================================================
        //  Water surface: density field + marching tetrahedra mesh,
        //  lit only (no tint) with fresnel sky reflection + sun specular
        // ============================================================
        const WATER_ISO = 0.80;                 // isosurface at this density
        const MC_CELL = 0.45;
        const MC_NX = 24, MC_NY = 6, MC_NZ = 12;
        const MC_MIN_X = -5.40, MC_MIN_Y = -0.25, MC_MIN_Z = -2.70;
        const MC_X1 = MC_NX + 1, MC_Y1 = MC_NY + 1, MC_Z1 = MC_NZ + 1;
        const MC_SZ = MC_X1 * MC_Y1;
        const MC_NCORN = MC_X1 * MC_Y1 * MC_Z1;
        const fieldDens = new Float32Array(MC_NCORN);
        const fieldGrad = new Float32Array(MC_NCORN * 3);

        function cornerBase(ix, iy, iz) { return iz * MC_SZ + iy * MC_X1 + ix; }
        function cornerWorld(ix, iy, iz) {
            return [MC_MIN_X + ix * MC_CELL, MC_MIN_Y + iy * MC_CELL, MC_MIN_Z + iz * MC_CELL];
        }

        function densityAt(wx, wy, wz, cellOut) {
            let cx = Math.floor((wx - MIN.x) / CELL);
            let cy = Math.floor((wy - MIN.y) / CELL);
            let cz = Math.floor((wz - MIN.z) / CELL);
            let d = 0;
            for (let zc = cz - 1; zc <= cz + 1; zc++) {
                if (zc < 0 || zc >= GRID_NZ) continue;
                for (let yc = cy - 1; yc <= cy + 1; yc++) {
                    if (yc < 0 || yc >= GRID_NY) continue;
                    for (let xc = cx - 1; xc <= cx + 1; xc++) {
                        if (xc < 0 || xc >= GRID_NX) continue;
                        const c = xc + yc * GRID_NX + zc * GRID_XZ;
                        const start = cellStarts[c], end = start + cellCounts[c];
                        for (let k = start; k < end; k++) {
                            const j = cellIds[k];
                            const jx3 = j * 3;
                            const dx = wx - pos[jx3];
                            const dy = wy - pos[jx3 + 1];
                            const dz = wz - pos[jx3 + 2];
                            const r2 = dx * dx + dy * dy + dz * dz;
                            if (r2 < H2) d += MASS * poly6(r2);
                        }
                    }
                }
            }
            return d;
        }

        function buildDensityField() {
            for (let iz = 0; iz < MC_Z1; iz++) {
                const wz = MC_MIN_Z + iz * MC_CELL;
                for (let iy = 0; iy < MC_Y1; iy++) {
                    const wy = MC_MIN_Y + iy * MC_CELL;
                    const base = iz * MC_SZ + iy * MC_X1;
                    for (let ix = 0; ix < MC_X1; ix++) {
                        const wx = MC_MIN_X + ix * MC_CELL;
                        fieldDens[base + ix] = densityAt(wx, wy, wz);
                    }
                }
            }
            for (let iz = 0; iz < MC_Z1; iz++) {
                for (let iy = 0; iy < MC_Y1; iy++) {
                    for (let ix = 0; ix < MC_X1; ix++) {
                        const idx = cornerBase(ix, iy, iz);
                        const gx0 = ix > 0 ? ix - 1 : 0, gx1 = ix < MC_X1 - 1 ? ix + 1 : MC_X1 - 1;
                        const gy0 = iy > 0 ? iy - 1 : 0, gy1 = iy < MC_Y1 - 1 ? iy + 1 : MC_Y1 - 1;
                        const gz0 = iz > 0 ? iz - 1 : 0, gz1 = iz < MC_Z1 - 1 ? iz + 1 : MC_Z1 - 1;
                        const k = idx * 3;
                        const dx = MC_CELL * (gx1 - gx0);
                        const dy = MC_CELL * (gy1 - gy0);
                        const dz2 = MC_CELL * (gz1 - gz0);
                        fieldGrad[k] = (fieldDens[cornerBase(gx1, iy, iz)] - fieldDens[cornerBase(gx0, iy, iz)]) / dx;
                        fieldGrad[k + 1] = (fieldDens[cornerBase(ix, gy1, iz)] - fieldDens[cornerBase(ix, gy0, iz)]) / dy;
                        fieldGrad[k + 2] = (fieldDens[cornerBase(ix, iy, gz1)] - fieldDens[cornerBase(ix, iy, gz0)]) / dz2;
                    }
                }
            }
        }

        // cube split: 12 tets, each = cell CENTER + one face triangle.
        // guaranteed gap-free and overlap-free; conforming across cells.
        // corners 0..7 as (x,y,z) in {0,1}^3; 8 = cell center (0.5,0.5,0.5)
        const cOx = [0, 1, 0, 1, 0, 1, 0, 1];
        const cOy = [0, 0, 1, 1, 0, 0, 1, 1];
        const cOz = [0, 0, 0, 0, 1, 1, 1, 1];
        // faces (4 corners in cyclic order), each split into 2 triangles
        const FACES = [
            [0, 1, 3, 2],       // -Z
            [4, 5, 7, 6],       // +Z
            [0, 1, 5, 4],       // -Y
            [2, 3, 7, 6],       // +Y
            [0, 2, 6, 4],       // -X
            [1, 3, 7, 5]        // +X
        ];
        const MAX_TRIS = MC_NX * MC_NY * MC_NZ * 24;   // 12 tets * up to 2 tris
        const MAX_VERTS = MAX_TRIS * 3;
        const surfacePos = new Float32Array(MAX_VERTS * 3);
        const surfaceNrm = new Float32Array(MAX_VERTS * 3);
        let surfaceVerts = 0;
        let sbbX0 = 1e9, sbbX1 = -1e9, sbbY0 = 1e9, sbbY1 = -1e9, sbbZ0 = 1e9, sbbZ1 = -1e9;

        // per-cell scratch descriptors (9 verts: 8 corners + center)
        const cellD = new Float32Array(9);          // density
        const cellG = new Float32Array(27);         // gradient xyz per vert
        const cellO = new Float32Array(27);         // offset-in-cell xyz per vert

        function isoMidVerts(cx, cy, cz, a, b) {
            const va = cellD[a], vb = cellD[b];
            const t = (WATER_ISO - va) / (vb - va);
            const ao = a * 3, bo = b * 3;
            const lfx = cellO[ao] + (cellO[bo] - cellO[ao]) * t;
            const lfy = cellO[ao + 1] + (cellO[bo + 1] - cellO[ao + 1]) * t;
            const lfz = cellO[ao + 2] + (cellO[bo + 2] - cellO[ao + 2]) * t;
            const wxo = MC_MIN_X + (cx + lfx) * MC_CELL;
            const wyo = MC_MIN_Y + (cy + lfy) * MC_CELL;
            const wzo = MC_MIN_Z + (cz + lfz) * MC_CELL;
            if (wxo < sbbX0) sbbX0 = wxo; if (wxo > sbbX1) sbbX1 = wxo;
            if (wyo < sbbY0) sbbY0 = wyo; if (wyo > sbbY1) sbbY1 = wyo;
            if (wzo < sbbZ0) sbbZ0 = wzo; if (wzo > sbbZ1) sbbZ1 = wzo;
            surfacePos[surfaceVerts * 3] = wxo * COS_T + wyo * SIN_T;
            surfacePos[surfaceVerts * 3 + 1] = -wxo * SIN_T + wyo * COS_T + OFFY;
            surfacePos[surfaceVerts * 3 + 2] = wzo;
            // interpolated normal (box-local), rotated to world
            let nx = cellG[ao] + (cellG[bo] - cellG[ao]) * t;
            let ny = cellG[ao + 1] + (cellG[bo + 1] - cellG[ao + 1]) * t;
            let nz = cellG[ao + 2] + (cellG[bo + 2] - cellG[ao + 2]) * t;
            const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
            if (nl < 1e-6) { nx = 0; ny = 1; nz = 0; }
            else { nx /= nl; ny /= nl; nz /= nl; }
            surfaceNrm[surfaceVerts * 3] = nx * COS_T + ny * SIN_T;
            surfaceNrm[surfaceVerts * 3 + 1] = -nx * SIN_T + ny * COS_T;
            surfaceNrm[surfaceVerts * 3 + 2] = nz;
            return surfaceVerts++;
        }

        function processTetV(cx, cy, cz, v0, v1, v2, v3) {
            let above = 0;
            if (cellD[v0] > WATER_ISO) above |= 1;
            if (cellD[v1] > WATER_ISO) above |= 2;
            if (cellD[v2] > WATER_ISO) above |= 4;
            if (cellD[v3] > WATER_ISO) above |= 8;
            if (above === 0 || above === 15) return;
            const V = [v0, v1, v2, v3];
            if (above === 1 || above === 2 || above === 4 || above === 8) {
                let a = 0;
                for (let n = 0; n < 4; n++) if (above & (1 << n)) a = n;
                isoMidVerts(cx, cy, cz, V[a], V[(a + 1) % 4]);
                isoMidVerts(cx, cy, cz, V[a], V[(a + 2) % 4]);
                isoMidVerts(cx, cy, cz, V[a], V[(a + 3) % 4]);
                return;
            }
            if (above === 14 || above === 13 || above === 11 || above === 7) {
                let b = 0;
                for (let n = 0; n < 4; n++) if ((above & (1 << n)) === 0) b = n;
                isoMidVerts(cx, cy, cz, V[b], V[(b + 1) % 4]);
                isoMidVerts(cx, cy, cz, V[b], V[(b + 2) % 4]);
                isoMidVerts(cx, cy, cz, V[b], V[(b + 3) % 4]);
                return;
            }
            const ab = [], bl = [];
            for (let n = 0; n < 4; n++) {
                if (above & (1 << n)) ab.push(n); else bl.push(n);
            }
            isoMidVerts(cx, cy, cz, V[ab[0]], V[bl[0]]);
            isoMidVerts(cx, cy, cz, V[ab[1]], V[bl[0]]);
            isoMidVerts(cx, cy, cz, V[ab[1]], V[bl[1]]);
            isoMidVerts(cx, cy, cz, V[ab[0]], V[bl[0]]);
            isoMidVerts(cx, cy, cz, V[ab[1]], V[bl[1]]);
            isoMidVerts(cx, cy, cz, V[ab[0]], V[bl[1]]);
        }

        function marchWater() {
            surfaceVerts = 0;
            sbbX0 = 1e9; sbbX1 = -1e9; sbbY0 = 1e9; sbbY1 = -1e9; sbbZ0 = 1e9; sbbZ1 = -1e9;
            for (let cz = 0; cz < MC_NZ; cz++) {
                for (let cy = 0; cy < MC_NY; cy++) {
                    for (let cx = 0; cx < MC_NX; cx++) {
                        const base = cornerBase(cx, cy, cz);
                        // corner descriptors
                        for (let ci = 0; ci < 8; ci++) {
                            const idx = base + cOz[ci] * MC_SZ + cOy[ci] * MC_X1 + cOx[ci];
                            cellD[ci] = fieldDens[idx];
                            const g = idx * 3, cg = ci * 3;
                            cellG[cg] = fieldGrad[g];
                            cellG[cg + 1] = fieldGrad[g + 1];
                            cellG[cg + 2] = fieldGrad[g + 2];
                            cellO[cg] = cOx[ci];
                            cellO[cg + 1] = cOy[ci];
                            cellO[cg + 2] = cOz[ci];
                        }
                        // center descriptor (average of the 8 corners)
                        const g0 = 24;
                        cellD[8] = (cellD[0] + cellD[1] + cellD[2] + cellD[3] + cellD[4] + cellD[5] + cellD[6] + cellD[7]) / 8;
                        for (let ci = 0; ci < 8; ci++) {
                            const cg = ci * 3;
                            cellG[g0] += cellG[cg];
                            cellG[g0 + 1] += cellG[cg + 1];
                            cellG[g0 + 2] += cellG[cg + 2];
                        }
                        cellG[g0] /= 8; cellG[g0 + 1] /= 8; cellG[g0 + 2] /= 8;
                        cellO[g0] = 0.5; cellO[g0 + 1] = 0.5; cellO[g0 + 2] = 0.5;
                        // 12 tets: center + each face triangle
                        for (let f = 0; f < 6; f++) {
                            const fc = FACES[f];
                            processTetV(cx, cy, cz, 8, fc[0], fc[1], fc[2]);
                            processTetV(cx, cy, cz, 8, fc[0], fc[2], fc[3]);
                        }
                    }
                }
            }
        }

        // water surface mesh (filled each frame, non-indexed triangle soup)
        const waterGeo = new THREE.BufferGeometry();
        const surfPosAttr = new THREE.BufferAttribute(surfacePos, 3).setUsage(THREE.DynamicDrawUsage);
        const surfNrmAttr = new THREE.BufferAttribute(surfaceNrm, 3).setUsage(THREE.DynamicDrawUsage);
        waterGeo.setAttribute('position', surfPosAttr);
        waterGeo.setAttribute('normal', surfNrmAttr);
        waterGeo.setDrawRange(0, 0);

        // background render target: the tank WITHOUT water, so the water
        // material can show it THROUGH the surface (refraction) plus
        // fresnel reflection + sun specular. light only, no own color.
        const bgRT = new THREE.WebGLRenderTarget(1, 1, {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter
        });

        const LightDir = new THREE.Vector3(-8, -16, -8).normalize();
        const WaterMat = new THREE.ShaderMaterial({
            side: THREE.DoubleSide,
            uniforms: {
                uTime: { value: 0 },
                uLightDir: { value: LightDir },
                tBack: { value: bgRT.texture },
                uRes: { value: new THREE.Vector2(1, 1) }
            },
            vertexShader: `
                varying vec3 vPos;
                varying vec3 vNrm;
                void main() {
                    vec4 wp = modelMatrix * vec4(position, 1.0);
                    vPos = wp.xyz;
                    vNrm = normalize(mat3(modelMatrix) * normal);
                    gl_Position = projectionMatrix * viewMatrix * wp;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uLightDir;
                uniform sampler2D tBack;
                uniform vec2 uRes;
                varying vec3 vPos;
                varying vec3 vNrm;
                void main() {
                    vec3 N = normalize(vNrm);
                    vec3 V = normalize(cameraPosition - vPos);
                    // gentle animated ripple on the surface normal
                    float t = uTime;
                    N = normalize(N + 0.055 * vec3(
                        sin(vPos.x * 6.0 + t * 1.7),
                        cos((vPos.x + vPos.z) * 4.5 + t * 1.3),
                        sin(vPos.z * 5.5 + t * 1.5)));
                    float ndv = clamp(dot(N, V), 0.0, 1.0);
                    float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);      // fresnel
                    // screen-space refraction of the background (tank + sky)
                    vec2 uv = gl_FragCoord.xy / uRes;
                    vec2 off = N.xz * (1.0 - F) * 0.035;
                    vec3 bg = texture2D(tBack, uv + off).rgb;
                    // analytic sky gradient for the reflected part
                    vec3 R = reflect(-V, N);
                    float skyMix = clamp(R.y * 0.5 + 0.5, 0.0, 1.0);
                    vec3 sky = mix(vec3(0.11, 0.12, 0.16), vec3(0.90, 0.92, 0.96), skyMix);
                    vec3 col = mix(bg, sky, F);
                    // sun specular
                    vec3 H = normalize(uLightDir + V);
                    float spec = pow(clamp(dot(N, H), 0.0, 1.0), 140.0);
                    col += vec3(1.0) * spec * 1.6;
                    gl_FragColor = vec4(col, 1.0);
                }
            `
        });
        const water = new THREE.Mesh(waterGeo, WaterMat);
        water.frustumCulled = false;
        Scene.add(water);

        // ============================================================
        //  Interaction (splash + stir)
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const mouseNDC = new THREE.Vector2();
        let recycleCursor = 0;

        function pointerWorld(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouseNDC, Camera);
            const target = new THREE.Vector3();
            if (!raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), target)) return null;
            // world -> box-local (inverse of the TankGroup -TILT rotation, minus OFFY)
            const lx = target.x * COS_T - (target.y - OFFY) * SIN_T;
            const ly = target.x * SIN_T + (target.y - OFFY) * COS_T;
            return new THREE.Vector3(lx, ly, target.z);
        }

        function splashAt(point, count) {
            if (!point) return;
            let placed = 0, guard = 0;
            while (placed < count && guard < count * 6) {
                guard++;
                const i = recycleCursor;
                recycleCursor = (recycleCursor + 1) % NUM_PARTICLES;
                const tx = point.x + (Math.random() - 0.5) * 0.7;
                const tz = point.z + (Math.random() - 0.5) * 0.7;
                if (tx < MIN.x + 0.1 || tx > MAX.x - 0.1 || tz < MIN.z + 0.1 || tz > MAX.z - 0.1) continue;
                const ty = Math.min(TANK_Y + 1.0, 0.5 + Math.random() * 0.6);
                pos[i * 3] = tx;
                pos[i * 3 + 1] = ty;
                pos[i * 3 + 2] = tz;
                vel[i * 3] = (Math.random() - 0.5) * 3.5;
                vel[i * 3 + 1] = 0;
                vel[i * 3 + 2] = (Math.random() - 0.5) * 3.5;
                placed++;
            }
        }

        function stirAt(point) {
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const dx = pos[i * 3] - point.x;
                const dz = pos[i * 3 + 2] - point.z;
                const d2 = dx * dx + dz * dz;
                if (d2 < 5.0) {
                    const dist = Math.sqrt(d2) || 1;
                    const mul = 1.0 - Math.min(1, dist / 2.5);
                    vel[i * 3] += dx * 6 * mul;
                    vel[i * 3 + 1] += 1.5 * mul;
                    vel[i * 3 + 2] += dz * 6 * mul;
                }
            }
        }

        let pressed = false;
        let lastPoint = null;
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            canvas.setPointerCapture(e.pointerId);
            pressed = true;
            const p = pointerWorld(e.clientX, e.clientY);
            splashAt(p, 10);
            lastPoint = p;
        });
        canvas.addEventListener('pointermove', (e) => {
            const p = pointerWorld(e.clientX, e.clientY);
            if (pressed && p) { if (lastPoint) stirAt(p); lastPoint = p; }
        });
        const endPointer = () => { pressed = false; lastPoint = null; };
        canvas.addEventListener('pointerup', endPointer);
        canvas.addEventListener('pointercancel', endPointer);
        canvas.addEventListener('pointerleave', endPointer);

        let paused = false;
        document.getElementById('Reset_Btn').addEventListener('click', () => {
            resetParticles();
            document.getElementById('Reset_Btn').blur();
        });
        document.getElementById('Pause_Btn').addEventListener('click', () => {
            paused = !paused;
            document.getElementById('Pause_Btn').textContent = paused ? 'Resume' : 'Pause';
            document.getElementById('Pause_Btn').classList.toggle('is-on', paused);
            document.getElementById('Pause_Btn').blur();
        });

        // ============================================================
        //  Main loop
        // ============================================================
        let uTime = 0;
        let fps = 60, fpsAcc = 0, fpsFrames = 0, lastT = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min(1 / 40, (now - lastT) / 1000);
            lastT = now;

            fpsAcc += dt; fpsFrames++;
            if (fpsAcc >= 0.5) {
                fps = fpsFrames / fpsAcc;
                fpsAcc = 0; fpsFrames = 0;
            }

            Controls.update();
            uTime += dt;

            if (!paused) stepSPH(dt);

            // rebuild the water surface mesh from the current particles
            buildDensityField();
            marchWater();
            surfPosAttr.needsUpdate = true;
            surfNrmAttr.needsUpdate = true;
            waterGeo.setDrawRange(0, surfaceVerts);
            WaterMat.uniforms.uTime.value = uTime;

            // pass 1: background (tank + sky, WITHOUT water) for refraction
            water.visible = false;
            Renderer.setRenderTarget(bgRT);
            Renderer.render(Scene, Camera);
            Renderer.setRenderTarget(null);
            water.visible = true;
            // pass 2: full scene including the water surface
            Renderer.render(Scene, Camera);

            // average |pressure| across the fluid -> proves pressure is working
            let pSum = 0;
            let bx0 = 1e9, bx1 = -1e9, bz0 = 1e9, bz1 = -1e9, by0 = 1e9, by1 = -1e9;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                pSum += Math.abs(pressure[i]);
                const px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
                if (px < bx0) bx0 = px; if (px > bx1) bx1 = px;
                if (py < by0) by0 = py; if (py > by1) by1 = py;
                if (pz < bz0) bz0 = pz; if (pz > bz1) bz1 = pz;
            }
            const pAvg = pSum / NUM_PARTICLES;

            document.getElementById('Stats').innerHTML =
                (paused ? 'PAUSED<br>' : '') +
                'fps&nbsp;: ' + fps.toFixed(0) +
                '<br>water : ' + (surfaceVerts / 3).toFixed(0) + ' tris' +
                '<br>surf x:' + sbbX0.toFixed(2) + '..' + sbbX1.toFixed(2) +
                ' y:' + sbbY0.toFixed(2) + '..' + sbbY1.toFixed(2) +
                ' z:' + sbbZ0.toFixed(2) + '..' + sbbZ1.toFixed(2) +
                '<br>particles : ' + NUM_PARTICLES +
                '<br>pressure&nbsp;av : ' + pAvg.toFixed(2) +
                '<br>bbox x:' + bx0.toFixed(2) + '..' + bx1.toFixed(2) +
                ' z:' + bz0.toFixed(2) + '..' + bz1.toFixed(2) +
                ' y:' + by0.toFixed(2) + '..' + by1.toFixed(2);
        }

        function resize() {
            Camera.aspect = window.innerWidth / window.innerHeight;
            Camera.updateProjectionMatrix();
            Renderer.setSize(window.innerWidth, window.innerHeight);
            bgRT.setSize(Renderer.domElement.width, Renderer.domElement.height);
            WaterMat.uniforms.uRes.value.set(Renderer.domElement.width, Renderer.domElement.height);
        }
        window.addEventListener('resize', resize);
        resize();

        setTimeout(() => {
            document.getElementById('Fade_Game').style.opacity = '0';
        }, 60);

        animate();
    </script>
</body>
</html>
