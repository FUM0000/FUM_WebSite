<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="author" content="F U M">
  <meta name="description" content="A guide for cat health: safe foods and foods to avoid.">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-B89KY0993B');
  </script>

  <link rel="icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">

  <link href="../../Asset/CSS/Common.css?v=1.2" rel="stylesheet" />

  <title>Cat</title>

  <style>
    [v-cloak] {
      display: none;
    }

    #Main {
      background: radial-gradient(circle at top left, rgba(255, 183, 77, 0.12), transparent 30%),
        linear-gradient(180deg, #f8f9fb 0%, #f1f5f9 100%);
    }

    .cat-shell {
      max-width: 1120px;
      margin: 0 auto;
    }

    .cat-panel {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 42px);
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .hero-shell {
      position: relative;
      padding: clamp(18px, 3vw, 30px) 0;
    }

    .hero-copy {
      max-width: 760px;
    }

    .hero-copy h1 {
      margin: 0;
      line-height: 1.08;
      font-family: 'Outfit', 'Space Mono', 'Zen Kaku Gothic New', sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: clamp(2.7rem, 5vw, 4.6rem);
      max-width: 8ch;
      color: #162033;
    }

    .hero-lead {
      color: rgba(22, 32, 51, 0.76);
      font-size: clamp(1rem, 1.2vw, 1.08rem);
      line-height: 1.9;
      max-width: 70ch;
      margin: 16px 0 0;
    }

    .section-header {
      margin-top: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      color: #1f2937;
      font-size: clamp(1.35rem, 3vw, 1.95rem);
    }

    .table-shell {
      margin-top: 16px;
      border: 1px solid rgba(31, 41, 55, 0.1);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.07);
    }

    .table-scroll {
      overflow-x: auto;
      max-width: 100%;
    }

    .cat-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    .cat-table thead th {
      padding: 16px 20px;
      text-align: left;
      background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%);
      color: #1f2937;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      white-space: nowrap;
      border-bottom: 1px solid rgba(31, 41, 55, 0.08);
    }

    .cat-table tbody tr:nth-child(even) {
      background: rgba(249, 250, 251, 0.6);
    }

    .cat-table tbody tr:hover {
      background: rgba(243, 244, 246, 0.8);
    }

    .cat-table td {
      padding: 14px 20px;
      vertical-align: top;
      color: #374151;
      line-height: 1.8;
      border-bottom: 1px solid rgba(31, 41, 55, 0.06);
    }

    .item-name {
      min-width: 160px;
      color: #111827;
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
    }

    .cat-table tbody tr:last-child td {
      border-bottom: none;
    }

    .table-note {
      padding: 14px 18px 18px;
      color: #6b7280;
      font-size: 0.9rem;
      line-height: 1.7;
      background: rgba(249, 250, 251, 0.9);
    }

    .table-note.important {
      background: rgba(254, 226, 226, 0.5);
      color: #991b1b;
      border-top: 1px solid rgba(220, 38, 38, 0.12);
    }

    @media (max-width: 600px) {
      .cat-panel {
        border-radius: 22px;
        padding: 20px;
      }

      .cat-table {
        min-width: 0;
        table-layout: fixed;
      }

      .cat-table thead th,
      .cat-table td {
        padding: 12px 14px;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .hero-copy h1 {
        max-width: none;
        font-size: 2.4rem;
      }

      .hero-lead {
        font-size: 0.98rem;
      }
    }
  </style>
</head>

<body>
  <v-app id="App" v-cloak>
    <template>
      <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Service > Cat</main-system-bar>

      <v-main id="Main">
        <transition name="Fade_Page">
          <v-container v-show="Ready_Page" fluid class="pa-5">
            <div class="cat-shell">
              <section class="cat-panel">
                <section class="hero-shell">
                  <div class="hero-copy">
                    <h1>Cat Health</h1>
                    <p class="hero-lead">
                      This is a quick reference for foods that are generally considered safe for healthy cats, and foods that should be avoided.
                      Exceptions and precautions are listed below. If your cat has a medical condition, always follow your veterinarian's advice.
                    </p>
                  </div>
                </section>

                <section class="section-header">
                  <h2 class="section-title">Good Foods (Safe in Moderation)</h2>
                </section>

                <div class="table-shell">
                  <div class="table-scroll">
                    <table class="cat-table">
                      <thead>
                        <tr>
                          <th>Food</th>
                          <th>Exception</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td class="item-name">Bluefish</td>
                          <td>Raw, salted, seasoned, or containing bones.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Whitefish</td>
                          <td>Raw, salted, seasoned, or containing bones.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Chicken</td>
                          <td>Raw, seasoned, containing bones, or excessive skin.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Egg</td>
                          <td>Uncooked / raw.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Natto</td>
                          <td>With tare/karashi, or in excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Unsweetened Yogurt</td>
                          <td>Sweetened, containing xylitol, or for lactose-intolerant cats.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Pumpkin</td>
                          <td>Seasoned, or in excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Sweet Potato</td>
                          <td>Seasoned, or in excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Fermented Foods</td>
                          <td>Those containing alcohol, high salt, or spicy seasonings.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Foods containing EPA/DHA</td>
                          <td>Excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Cat Probiotics</td>
                          <td>Products not specifically formulated for cats.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="table-note">
                    These items are generally well-tolerated when given in small, appropriate amounts. Always introduce new foods gradually.
                  </div>
                </div>

                <section class="section-header">
                  <h2 class="section-title">Foods to Avoid (禁止)</h2>
                </section>

                <div class="table-shell">
                  <div class="table-scroll">
                    <table class="cat-table">
                      <thead>
                        <tr>
                          <th>Food</th>
                          <th>Notes / Exceptions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td class="item-name">Alliums (onions, garlic, chives etc.) (ネギ類・球根類)</td>
                          <td>Exception: none.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Grapes/Raisins (ぶどう類)</td>
                          <td>Exception: none.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Cacao/Chocolate (カカオ類)</td>
                          <td>Exception: none.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Caffeine (カフェイン類)</td>
                          <td>Exception: caffeine-free beverages.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Alcohol (アルコール類)</td>
                          <td>Exception: none.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Raw Yeast / Unbaked Rising Dough (生イースト・発酵中の生地)</td>
                          <td>Exception: fully baked bread.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Human Medications/Supplements (人間用の薬・サプリメント)</td>
                          <td>Exception: only if prescribed by a veterinarian.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Raw Meat/Fish/Eggs (生肉・生魚・生卵)</td>
                          <td>Exception: properly managed commercial cat food formulated for cats.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Bones (骨類)</td>
                          <td>Exception: cat-specific products confirmed as safe.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Dairy Products (乳製品)</td>
                          <td>Exception: cat-specific milk or lactose-free products.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Moldy/Rotten Foods (カビ・腐敗食品)</td>
                          <td>Exception: none.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="table-note important">
                    For safety, keep these foods away from your cat. Never self-medicate with human drugs.
                  </div>
                </div>

              </section>
            </div>
          </v-container>
        </transition>
      </v-main>

      <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
      <main-footer-simple></main-footer-simple>
    </template>
  </v-app>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
  <script src="../../Asset/Javascript/Common.js?v=1.03"></script>

  <script>
    new Vue({
      el: '#App',
      vuetify: new Vuetify(),
      mixins: [window.Mixins_Common],
      data: {
        Ready_Page: true
      }
    });
  </script>
</body>

</html>
