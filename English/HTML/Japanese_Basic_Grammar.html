<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-B89KY0993B');
    </script>

    <link rel="shortcut icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">

    <!-- Setting -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">

    <!-- Vue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS -->
    <link href="../../Asset/CSS/Common.css?v=1.2" rel="stylesheet" />

    <title>Grammar</title>
    <meta name="robots" content="index, follow">

    <style>
        .LP_SectionTitle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.08), rgba(25, 118, 210, 0.02));
            border-left: 3px solid #1976D2;
            border-radius: 0 8px 8px 0;
            margin: 0 0 14px;
            max-width: 720px;
        }
        .LP_SectionTitle .v-icon {
            color: #1976D2;
        }
        .LP_SectionTitle span {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .LP_Card {
            display: flex;
            flex-direction: column;
            border-radius: 14px !important;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.07) !important;
            overflow: hidden;
            max-width: 720px;
            margin: 0;
        }
        .LP_TopNav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 10px 16px 6px !important;
        }
        .LP_Count {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1976D2;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .LP_Progress {
            flex: 1;
        }
        .LP_Stage {
            flex-grow: 1;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
        }
        .LP_Point {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .LP_PointBadge {
            position: absolute;
            left: -22px;
            top: 50%;
            transform: translateY(-50%);
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.05rem;
            color: white;
            background: linear-gradient(135deg, #1976D2, #42A5F5);
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
        }
        .LP_PointText {
            flex: 1;
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .LP_Highlight {
            color: #D32F2F;
            font-weight: 700;
        }
        .LP_Nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px 14px !important;
        }
        .LP_Dots {
            display: flex;
            gap: 7px;
            align-items: center;
        }
        .LP_Dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: #B0BEC5;
            padding: 0;
            transition: all 0.25s ease;
        }
        .LP_Dot:hover {
            background: #78909C;
            transform: scale(1.2);
        }
        .LP_Dot.Active {
            width: 26px;
            border-radius: 8px;
            background: #1976D2;
        }
        .slide-enter-active,
        .slide-leave-active {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .slide-left-enter {
            opacity: 0;
            transform: translateX(48px);
        }
        .slide-left-leave-to {
            opacity: 0;
            transform: translateX(-48px);
        }
        .slide-right-enter {
            opacity: 0;
            transform: translateX(-48px);
        }
        .slide-right-leave-to {
            opacity: 0;
            transform: translateX(48px);
        }
        @media (max-width: 600px) {
            .LP_Point {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
            .LP_PointBadge {
                position: static;
                transform: none;
            }
            .LP_Stage {
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>

    <v-app id="App">
        <template>

            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Japanese Language > Basic >
                Grammar</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" class="lp-page">

                        <section class="hero-shell">
                            <div class="hero-grid">
                                <div class="hero-copy">
                                    <h1>Grammar</h1>
                                    <p class="hero-lead">
                                        Basic grammar rules for understanding Japanese sentence structure.
                                    </p>
                                </div>
                            </div>
                        </section>

                        <v-row>
                            <!-- Basic Grammar -->
                            <v-col cols="12" id="LP_Section1">
                                <div class="LP_SectionTitle">
                                    <v-icon small>mdi-book-open-variant</v-icon>
                                    <span>Basic Grammar</span>
                                </div>
                                <v-card class="LP_Card" @click.native="Active = 1">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_Basic" :disabled="Page_Basic === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_Basic + 1 }} / {{ List_Basic.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_Basic">
                                            <span class="d-none d-sm-inline">{{ Page_Basic === List_Basic.length - 1 ? 'Next Section' : 'Next' }}</span>
                                            <v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_Basic" mode="out-in">
                                            <div :key="Page_Basic" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_Basic + 1 }}</div>
                                                <div class="LP_PointText" v-html="List_Basic[Page_Basic].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_Basic" :key="'b'+i" class="LP_Dot"
                                                :class="{ Active: Page_Basic === i }" @click="Go_Basic(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                            </v-col>

                            <!-- Connection -->
                            <v-col cols="12" id="LP_Section2">
                                <div class="LP_SectionTitle">
                                    <v-icon small>mdi-link-variant</v-icon>
                                    <span>Connection</span>
                                </div>
                                <v-card class="LP_Card" @click.native="Active = 2">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_Connection" :disabled="Page_Connection === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_Connection + 1 }} / {{ List_Connection.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_Connection">
                                            <span class="d-none d-sm-inline">{{ Page_Connection === List_Connection.length - 1 ? 'Next Section' : 'Next' }}</span>
                                            <v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_Connection" mode="out-in">
                                            <div :key="Page_Connection" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_Connection + 1 }}</div>
                                                <div class="LP_PointText" v-html="List_Connection[Page_Connection].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_Connection" :key="'c'+i" class="LP_Dot"
                                                :class="{ Active: Page_Connection === i }" @click="Go_Connection(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                            </v-col>

                            <!-- Order -->
                            <v-col cols="12" id="LP_Section3">
                                <div class="LP_SectionTitle">
                                    <v-icon small>mdi-sort-numeric-variant</v-icon>
                                    <span>Order</span>
                                </div>
                                <v-card class="LP_Card" @click.native="Active = 3">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_Order" :disabled="Page_Order === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_Order + 1 }} / {{ List_Order.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_Order"
                                            :disabled="Page_Order === List_Order.length - 1">
                                            <span class="d-none d-sm-inline">Next</span><v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_Order" mode="out-in">
                                            <div :key="Page_Order" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_Order + 1 }}</div>
                                                <div class="LP_PointText" v-html="List_Order[Page_Order].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_Order" :key="'o'+i" class="LP_Dot"
                                                :class="{ Active: Page_Order === i }" @click="Go_Order(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                            </v-col>
                        </v-row>

                        <div style="height: 160px;"></div>

                    </v-container>
                </transition>
            </v-main>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer></main-footer>

        </template>
    </v-app>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <script src="../../Asset/Javascript/Common.js?v=1.03"></script>

    <script>

        let vue = new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Common],
            data: {
                Active: 1,
                Page_Basic: 0, Page_Connection: 0, Page_Order: 0,
                Direction_Basic: 'slide-left', Direction_Connection: 'slide-left', Direction_Order: 'slide-left',
                List_Basic: [
                    { text: `<strong>English</strong><br>Subject + Something<br><strong>Japanese</strong><br>Subject + は(<span class="LP_Highlight">wa</span>) or が(<span class="LP_Highlight">ga</span>) + Something` },
                    { text: `<strong>Basic difference between "は(wa)" and "が(ga)" after the Subject</strong><br><br><div style="text-align: left; display: inline-block; margin: 0 auto;"><strong>は</strong>: Subject (Description of the Subject)<br><strong>が</strong>: Action (Subject of the Action), subject within the subject</div><br>In addition, when Emphasizing the Subject, the interchange "は ⇄ が" occurs.` },
                    { text: `<strong>English</strong><br>Verb + Object<br><strong>Japanese</strong><br>Object + を(<span class="LP_Highlight">o</span>) + Verb` },
                ],
                List_Connection: [
                    { text: `<strong>English</strong><br>Main + <span class="LP_Highlight">of</span> + Sub<br><strong>Japanese</strong><br>Sub + <span class="LP_Highlight">の(no)</span> + Main` },
                    { text: `<strong>English</strong><br><span class="LP_Highlight">with</span> + Someone<br><strong>Japanese</strong><br>Someone + <span class="LP_Highlight">と(to)</span>` },
                    { text: `<strong>English</strong><br>Be + <span class="LP_Highlight">in</span> + Somewhere<br><strong>Japanese</strong><br>Somewhere + <span class="LP_Highlight">に(ni)</span>` },
                    { text: `<strong>English</strong><br>Do + <span class="LP_Highlight">in</span> + Somewhere<br><strong>Japanese</strong><br>Somewhere + <span class="LP_Highlight">で(de)</span>` },
                    { text: `<strong>English</strong><br><span class="LP_Highlight">to</span> + Somewhere<br><strong>Japanese</strong><br>Somewhere + <span class="LP_Highlight">に(ni)</span>` },
                    { text: `<strong>English</strong><br><span class="LP_Highlight">from</span> + Something<br><strong>Japanese</strong><br>Something + <span class="LP_Highlight">から(kara)</span>` },
                    { text: `<strong>English</strong><br><span class="LP_Highlight">for</span> + Noun<br><strong>Japanese</strong><br>Noun + <span class="LP_Highlight">のために(notameni)</span>` },
                    { text: `<strong>English</strong><br><span class="LP_Highlight">for</span> + Verb<br><strong>Japanese</strong><br>Verb + <span class="LP_Highlight">ために(tameni)</span>` },
                ],
                List_Order: [
                    { text: `<strong>English</strong><br>Subject + Adverb + Verb + Object + Place + Time + .<br><strong>Japanese</strong><br>Time + Subject + は(wa)/が(ga) + Place + に(ni)/で(de) + Object + を(o) + Adverb + Verb + 。` },
                ],
            },
            computed: {
                Progress_Basic() { return (this.Page_Basic + 1) / this.List_Basic.length * 100; },
                Progress_Connection() { return (this.Page_Connection + 1) / this.List_Connection.length * 100; },
                Progress_Order() { return (this.Page_Order + 1) / this.List_Order.length * 100; },
                SlideName_Basic() { return this.Direction_Basic; },
                SlideName_Connection() { return this.Direction_Connection; },
                SlideName_Order() { return this.Direction_Order; },
            },
            methods: {
                Go_Basic(i) {
                    const next = Math.max(0, Math.min(this.List_Basic.length - 1, i));
                    this.Direction_Basic = next >= this.Page_Basic ? 'slide-left' : 'slide-right';
                    this.Page_Basic = next;
                },
                Prev_Basic() { this.Active = 1; this.Go_Basic(this.Page_Basic - 1); },
                Next_Basic() {
                    this.Active = 1;
                    if (this.Page_Basic < this.List_Basic.length - 1) { this.Go_Basic(this.Page_Basic + 1); }
                    else { this.Active = 2; this.ScrollTo('LP_Section2'); }
                },
                Go_Connection(i) {
                    const next = Math.max(0, Math.min(this.List_Connection.length - 1, i));
                    this.Direction_Connection = next >= this.Page_Connection ? 'slide-left' : 'slide-right';
                    this.Page_Connection = next;
                },
                Prev_Connection() { this.Active = 2; this.Go_Connection(this.Page_Connection - 1); },
                Next_Connection() {
                    this.Active = 2;
                    if (this.Page_Connection < this.List_Connection.length - 1) { this.Go_Connection(this.Page_Connection + 1); }
                    else { this.Active = 3; this.ScrollTo('LP_Section3'); }
                },
                Go_Order(i) {
                    const next = Math.max(0, Math.min(this.List_Order.length - 1, i));
                    this.Direction_Order = next >= this.Page_Order ? 'slide-left' : 'slide-right';
                    this.Page_Order = next;
                },
                Prev_Order() { this.Active = 3; this.Go_Order(this.Page_Order - 1); },
                Next_Order() { this.Active = 3; this.Go_Order(this.Page_Order + 1); },
                ScrollTo(id) {
                    const el = document.getElementById(id);
                    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 72, behavior: 'smooth' });
                },
                Handle_Key(e) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        if (this.Active === 1) {
                            if (this.Page_Basic < this.List_Basic.length - 1) this.Go_Basic(this.Page_Basic + 1);
                            else { this.Active = 2; this.ScrollTo('LP_Section2'); }
                        } else if (this.Active === 2) {
                            if (this.Page_Connection < this.List_Connection.length - 1) this.Go_Connection(this.Page_Connection + 1);
                            else { this.Active = 3; this.ScrollTo('LP_Section3'); }
                        } else if (this.Page_Order < this.List_Order.length - 1) {
                            this.Go_Order(this.Page_Order + 1);
                        }
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        if (this.Active === 3) {
                            if (this.Page_Order > 0) this.Go_Order(this.Page_Order - 1);
                            else { this.Active = 2; this.ScrollTo('LP_Section2'); }
                        } else if (this.Active === 2) {
                            if (this.Page_Connection > 0) this.Go_Connection(this.Page_Connection - 1);
                            else { this.Active = 1; this.ScrollTo('LP_Section1'); }
                        } else if (this.Page_Basic > 0) {
                            this.Go_Basic(this.Page_Basic - 1);
                        }
                    }
                },
            },
            mounted() {
                this.$nextTick(() => { window.addEventListener('keydown', this.Handle_Key); });
            },
            beforeDestroy() {
                window.removeEventListener('keydown', this.Handle_Key);
            },
        })

    </script>

</body>

</html>
