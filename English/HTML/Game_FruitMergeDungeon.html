<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="shortcut icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../../Asset/CSS/Common.css?v=1.0" rel="stylesheet" />
    <link href="../../Asset/CSS/Game.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <title>Fruit Merge Dungeon</title>
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --ink: #e2e8f0;
            --ink-dim: #94a3b8;
            --panel: rgba(15, 23, 42, 0.88);
            --panel-border: rgba(148, 163, 184, 0.18);
            --accent: #ff5b30;
            --accent-2: #ff9f1f;
            --accent-ink: #ffffff;
            --info: #38bdf8;
            --success: #34d399;
            --danger: #f87171;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Outfit", "Space Grotesk", sans-serif;
            color: var(--ink);
            letter-spacing: 0.02em;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                radial-gradient(45% 40% at 15% 12%, rgba(255, 200, 100, 0.15), transparent 70%),
                radial-gradient(55% 50% at 84% 86%, rgba(255, 100, 80, 0.15), transparent 72%);
        }
        body::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
            opacity: 0.5;
        }

        #Canvas_1 {
            display: block;
            position: relative;
            z-index: 1;
            margin: 0 auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        #UI_Home_1 {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 10px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--ink-dim);
            user-select: none;
            transition: all 0.2s ease;
        }
        #UI_Home_1:hover {
            color: var(--accent);
            border-color: rgba(255, 91, 48, 0.4);
            transform: translateY(-1px);
        }
        #UI_Home_1:active {
            transform: translateY(1px) scale(0.97);
        }

        #UI_TopBar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 8px;
            align-items: stretch;
            max-width: calc(100% - 130px);
            animation: fadeSlideDown 0.5s cubic-bezier(.2,.75,.2,1) both;
        }

        #UI_Status_Panel {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 8px 16px;
            user-select: none;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            min-width: 120px;
        }
        #UI_Stage_Progress {
            width: 100%;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .stage-progress-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.35s ease;
        }
        .stage-dot-active {
            width: 11px;
            height: 11px;
        }
        .stage-dot-active.stage-dot-start { box-shadow: 0 0 6px rgba(52, 211, 153, 0.7); }
        .stage-dot-active.stage-dot-mid { box-shadow: 0 0 6px rgba(255, 159, 31, 0.7); }
        .stage-dot-active.stage-dot-end { box-shadow: 0 0 6px rgba(56, 189, 248, 0.7); }
        .stage-dot-start { background: var(--success); }
        .stage-dot-mid { background: var(--accent-2); }
        .stage-dot-end { background: var(--info); }
        .stage-progress-track {
    flex: 1;
    position: relative;
    height: 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
}
        .stage-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            z-index: 1;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .track-seg-1 .stage-progress-fill {
            background: linear-gradient(90deg, var(--success), var(--accent-2));
        }
        .track-seg-2 .stage-progress-fill {
            background: linear-gradient(90deg, var(--accent-2), var(--info));
        }
        #UI_Location {
            color: var(--ink);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #UI_Turn {
            color: var(--ink-dim);
            font-size: 0.66rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #UI_Enemy_Panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 160px;
            user-select: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        #UI_Enemy_Panel:hover {
            border-color: rgba(248, 113, 113, 0.4);
        }
        #UI_Enemy_Panel.panel-shake {
            animation: panelShake 0.45s ease;
        }
        #UI_Enemy_Panel.panel-damage {
            animation: panelDamageFlash 0.4s ease;
        }
        #UI_Enemy_Name {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--danger);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Enemy_Hp_Bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #UI_Enemy_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #f87171);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #UI_Enemy_Hp_Fill.hp-flash {
            animation: hpFlash 0.35s ease;
        }
        #UI_Enemy_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--ink-dim);
            margin-top: 2px;
            text-align: right;
        }
        #UI_Enemy_Fruit_Bar {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
            margin-top: 4px;
        }
        #UI_Enemy_Fruit_Fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e74c3c, #ff6b6b);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #UI_Enemy_Fruit_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: #ff6b6b;
            margin-top: 2px;
            text-align: left;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #UI_Player_Panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 150px;
            user-select: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        #UI_Player_Panel:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }
        #UI_Player_Panel.panel-shake {
            animation: panelShake 0.45s ease;
        }
        #UI_Player_Panel.panel-damage {
            animation: panelDamageFlash 0.4s ease;
        }
        #UI_Player_Panel.panel-heal {
            animation: panelHealFlash 0.4s ease;
        }
        #UI_Player_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--info);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #UI_Player_Hp_Bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #UI_Player_Hp_Fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #UI_Player_Hp_Fill.hp-flash {
            animation: hpFlash 0.35s ease;
        }
        #UI_Player_Hp_Fill.hp-heal {
            animation: hpHeal 0.45s ease;
        }
        #UI_Player_Hp_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--ink-dim);
            margin-top: 2px;
            text-align: right;
        }
        #UI_Player_Exp_Bar {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.07);
            overflow: hidden;
            margin-top: 4px;
        }
        #UI_Player_Exp_Fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-2), #fde047);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        #UI_Next_Panel {
            position: absolute;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 6px 16px;
            text-align: center;
            user-select: none;
            animation: fadeNextIn 0.5s ease both 0.2s;
        }
        #UI_Next_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.62rem;
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }
        #UI_Next_Fruit {
            font-size: 1.6rem;
            line-height: 1;
        }

        #UI_Item_Panel {
            position: absolute;
            bottom: 14px;
            right: 14px;
            z-index: 3;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 6px 14px;
            text-align: center;
            user-select: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        #UI_Item_Panel:hover {
            border-color: rgba(52, 211, 153, 0.5);
            transform: translateY(-1px);
        }
        #UI_Item_Panel:active {
            transform: translateY(1px) scale(0.96);
        }
        #UI_Item_Label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.62rem;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        #UI_Item_Count {
            font-size: 1.05rem;
            line-height: 1.1;
            color: var(--ink);
            font-weight: 700;
        }

        #UI_Start_1 {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: rgba(255, 244, 234, 0.97);
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 91, 48, 0.3);
            pointer-events: none;
            animation: startBreath 1.45s ease-in-out infinite;
        }

        #UI_Message_1 {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(4, 8, 20, 0.78);
            box-sizing: border-box;
        }
        #UI_Message_1.visible {
            display: flex;
        }
        .msg-box {
            width: min(88vw, 430px);
            background: linear-gradient(160deg, #1c2440, #12172b);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 26px 28px 20px;
            text-align: center;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.03em;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            animation: overlayPop 0.35s cubic-bezier(.2,.8,.25,1.15) both;
            cursor: pointer;
        }
        #UI_Message_1.victory .msg-box {
            border-color: rgba(251, 191, 36, 0.35);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(251, 191, 36, 0.15);
        }
        #UI_Message_1.defeat .msg-box {
            border-color: rgba(248, 113, 113, 0.35);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(248, 113, 113, 0.15);
        }
        #UI_Message_1 .msg-hint {
            display: none;
            color: var(--ink-dim);
            font-size: 0.95rem;
            margin-top: 18px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 500;
            letter-spacing: 0.08em;
        }
        #UI_Message_1.interactive .msg-hint {
            display: block;
            animation: hintBounce 1.2s ease-in-out infinite;
        }
        .vt-title {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 900;
            font-size: clamp(1.3rem, 5vw, 1.9rem);
            letter-spacing: 0.12em;
            color: #fbbf24;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 0 26px rgba(251, 191, 36, 0.4);
        }
        .vt-reward {
            font-size: clamp(0.9rem, 3.5vw, 1.05rem);
            line-height: 1.75;
            color: var(--ink);
            margin-top: 4px;
        }
        .vt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .vt-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(0.9rem, 3vw, 1rem);
        }
        .vt-label {
            color: var(--ink-dim);
            font-weight: 500;
        }
        .vt-val {
            margin-left: auto;
            font-weight: 700;
            color: var(--ink);
        }
        .vt-level {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border: 1px solid rgba(251, 191, 36, 0.45);
            background: rgba(251, 191, 36, 0.10);
            border-radius: 10px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-weight: 800;
            color: #fde047;
            letter-spacing: 0.04em;
        }

        #UI_Action {
            position: absolute;
            left: 50%;
            top: 96px;
            --act-pop: 0px;
            transform: translateX(calc(-50% + var(--act-pop)));
            z-index: 6;
            background: rgba(10, 16, 30, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 8px 20px;
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.04em;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            display: none;
        }
        #UI_Action.visible {
            display: block;
            animation: actionPop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #UI_Action .msg-hint {
            display: block;
            color: var(--ink-dim);
            font-size: 0.7rem;
            margin-top: 5px;
            font-weight: 500;
            letter-spacing: 0.1em;
            animation: hintBounce 1.2s ease-in-out infinite;
        }
        #UI_Action.action-player b { color: #fbbf24; }
        #UI_Action.action-enemy b, #UI_Action.action-punish b { color: #f87171; }
        #UI_Action.action-heal b { color: #34d399; }
        #UI_Action.action-dodge b { color: #38bdf8; }
        #UI_Action .dmg-mult {
            font-size: 0.72em;
            color: var(--ink-dim);
            font-weight: 600;
            margin-left: 6px;
            letter-spacing: 0.05em;
            opacity: 0.85;
        }
        #UI_Action.action-player { --act-pop: clamp(40px, 16vw, 150px); }
        #UI_Action.action-enemy,
        #UI_Action.action-punish,
        #UI_Action.action-heal { --act-pop: calc(clamp(40px, 16vw, 150px) * -1); }

        @keyframes actionPop {
            from { opacity: 0; transform: translateX(calc(-50% + var(--act-pop))) scale(0.85); }
            to { opacity: 1; transform: translateX(calc(-50% + var(--act-pop))) scale(1); }
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeNextIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes startBreath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }
        @keyframes clearPulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to   { transform: translate(-50%, -50%) scale(1.08); }
        }
        @keyframes panelShake {
            0%, 100% { transform: translateX(0); }
            12% { transform: translateX(-5px) rotate(-0.8deg); }
            25% { transform: translateX(4px) rotate(0.5deg); }
            37% { transform: translateX(-3px); }
            50% { transform: translateX(2px); }
            62% { transform: translateX(-2px); }
            75% { transform: translateX(1px); }
        }
        @keyframes panelDamageFlash {
            0% { box-shadow: var(--shadow), inset 0 0 0 2px rgba(248, 113, 113, 0.6); }
            50% { box-shadow: var(--shadow), inset 0 0 12px 2px rgba(248, 113, 113, 0.3); }
            100% { box-shadow: var(--shadow), inset 0 0 0 2px transparent; }
        }
        @keyframes hpFlash {
            0% { filter: brightness(1); }
            30% { filter: brightness(1.8) saturate(1.5); }
            100% { filter: brightness(1); }
        }
        @keyframes levelUpGlow {
            0% { box-shadow: var(--shadow), 0 0 0 0 rgba(251, 191, 36, 0); }
            50% { box-shadow: var(--shadow), 0 0 20px 4px rgba(251, 191, 36, 0.35); }
            100% { box-shadow: var(--shadow), 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .level-up-glow {
            animation: levelUpGlow 0.8s ease;
        }

        @keyframes panelHealFlash {
            0% { box-shadow: var(--shadow), inset 0 0 0 2px rgba(52, 211, 153, 0.6); }
            50% { box-shadow: var(--shadow), inset 0 0 12px 2px rgba(52, 211, 153, 0.3); }
            100% { box-shadow: var(--shadow), inset 0 0 0 2px transparent; }
        }
        @keyframes hpHeal {
            0% { filter: brightness(1); }
            30% { filter: brightness(2) saturate(1.5); }
            100% { filter: brightness(1); }
        }

        #UI_Item_Panel, #UI_Dialog, #UI_Shop, #UI_ChapterTitle, #UI_Ending {
            box-sizing: border-box;
        }
        #UI_Dialog, #UI_Shop, #UI_Ending {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(4, 8, 20, 0.78);
        }
        #UI_Dialog.open, #UI_Shop.open, #UI_Ending.open {
            display: flex;
        }
        .dialog-box {
            width: min(88vw, 520px);
            background: linear-gradient(160deg, #1c2440, #12172b);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 26px 28px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            animation: overlayPop 0.35s cubic-bezier(.2,.8,.25,1.15) both;
        }
        #UI_Dialog_Text {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 600;
            line-height: 1.5;
            color: var(--ink);
            min-height: 4.5em;
            display: flex;

<body>

    <script type="module">

        /* ─── Constants ────────────────────────────────────────── */

        const FRUITS = [

            { name: 'Demon',        color: '#7b241c', hp: 1500,  exp: 235, gold: 200, agi: 14 },
            { name: 'Dragon',       color: '#f39c12', hp: 2000,  exp: 300, gold: 260, agi: 16 },
            { name: 'Dark Lord',    color: '#1a1a2e', hp: 2800,  exp: 420, gold: 500, agi: 18 }
        ];

        const CHAPTERS = [
            { icon: '🌿', name: 'Grasslands',
              intro: 'The sunlit plains hum with life. Something stirs in the grass...',
              boss: 'The Goblin chieftain collapses. A dark cave gapes beyond the hills.' },
            { icon: '🕳️', name: 'Dark Cave',
              intro: 'Damp darkness closes in. Skeletons rattle to life...',
              boss: 'The Orc warlord falls! An ancient keep rises from the mist.' },
            { icon: '🏰', name: 'Ancient Keep',
              intro: 'Mildew and echoes haunt the old corridors...',
              boss: 'The Minotaur crashes down. Smoke and ash hang on the horizon—a volcano.' },
            { icon: '🌋', name: 'Crimson Volcano',
              intro: 'Molten rivers glow beneath the crags...',
              boss: 'The Demon shatters into cinders. At last, the Demon Castle stands.' },
            { icon: '🦹', name: 'Demon Castle',
              intro: 'The final door creaks open. The Dark Lord awaits...',
              boss: '' }
        ];

        const SHOP_PRICES = { potion: 30, hp: 40, atk: 40, agi: 40 };

        const DEX_BASE = 10;
        const POW_BASE = 10;

        const SP_PER_LEVEL = 3;
        const ATK_PER_SP = 2;
        const HP_PER_SP = 25;
        const DEX_PER_SP = 1;

        const ENDING_TEXT =
            'With the Dark Lord shattered, shadow drains from the land. The kingdom breathes free at last, ' +
            'and your legend is sung across every village. Thank you for saving the realm, hero.';

        const GRAVITY = 0.35;
        const DAMPING = 0.88;
        const WALL_BOUNCE = 0.35;
        const FRICTION = 0.998;
        const MERGE_DIST_FACTOR = 0.92;
        const MAX_FRUITS_ON_SCREEN = 60;
        const DROP_LINE_Y_RATIO = 0.24;
        const MAX_FALL_SPEED = 18;
        const CRIT_THRESHOLD = 3;

        /* ─── Canvas Setup ─────────────────────────────────────── */

        const Canvas = document.getElementById('Canvas_1');
        const Ctx = Canvas.getContext('2d');

        let CW, CH;
        let nextPanelReady = false;
        let FruitScale = 1;
        let Fruits = [];
        let MergeEffects = [];
        function ResizeCanvas() {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight;
            if (IsMobile()) {
                CW = Math.floor(maxW);
                CH = Math.floor(maxH);
            } else {
                const ratio = 4 / 5;
                let w = maxW;
                let h = w / ratio;
                if (h > maxH) {
                    h = maxH;
                    w = h * ratio;
                }
                CW = Math.floor(w);
                CH = Math.floor(h);
            }
            Canvas.width = CW * window.devicePixelRatio;
            Canvas.height = CH * window.devicePixelRatio;
            Canvas.style.width = CW + 'px';
            Canvas.style.height = CH + 'px';
            Ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
            const prevScale = FruitScale;
            FruitScale = Math.max(0.8, Math.min(2.6, (CW - 20) / 340));
            const k = FruitScale / prevScale;
            if (k !== 1 && prevScale > 0) {
                for (const f of Fruits) f.radius *= k;
                for (const e of MergeEffects) e.maxRadius *= k;
            }
            PositionNextPanel();
        }
        ResizeCanvas();
        window.addEventListener('resize', ResizeCanvas);
        window.addEventListener('resize', () => {
            if (UI_Action.classList.contains('visible')) {
                RepositionActionPopup(UI_Action.className.replace('visible', '').trim());
            }
        });

        function IsMobile() {
            return window.innerWidth <= 768;
        }

        function PositionNextPanel() {
            if (!nextPanelReady) return;
            if (IsMobile()) {
                UI_NextPanel.style.left = '8px';
                UI_NextPanel.style.top = '';
                UI_NextPanel.style.bottom = '8px';
                UI_NextPanel.style.right = '';
                return;
            }
            const rect = Canvas.getBoundingClientRect();
            const pw = UI_NextPanel.offsetWidth;
            const ph = UI_NextPanel.offsetHeight;
            const left = rect.right + 12;
            if (left + pw <= window.innerWidth - 8) {
                UI_NextPanel.style.left = left + 'px';
                UI_NextPanel.style.top = (rect.bottom - ph - 12) + 'px';
                UI_NextPanel.style.bottom = '';
            } else {
                UI_NextPanel.style.left = ((window.innerWidth - pw) / 2) + 'px';
                UI_NextPanel.style.top = (rect.bottom - ph - 16) + 'px';
                UI_NextPanel.style.bottom = '';
            }
        }

        /* ─── UI Elements ──────────────────────────────────────── */

        const UI_Home = document.createElement('div');
        UI_Home.id = 'UI_Home_1';
        UI_Home.innerHTML = 'HOME';
        document.body.appendChild(UI_Home);

        const UI_TopBar = document.createElement('div');

        document.body.appendChild(UI_TopBar);

        const UI_StatusPanel = document.createElement('div');

        UI_StatusPanel.innerHTML = `
            <div id="UI_Stage_Progress">
                <div class="stage-progress-dot stage-dot-start" id="Stage_Dot_Start"></div>
                <div class="stage-progress-track track-seg-1" id="Stage_Track_1">

                </div>
                <div class="stage-progress-dot stage-dot-mid" id="Stage_Dot_Mid"></div>
                <div class="stage-progress-track track-seg-2" id="Stage_Track_2">
                    <div class="stage-progress-fill" id="UI_Stage_Progress_Fill_2"></div>
                </div>
                <div class="stage-progress-dot stage-dot-end" id="Stage_Dot_End"></div>
            </div>
            <div id="UI_Location">Grasslands</div>
            <div id="UI_Turn">Turn 0</div>
        `;
        UI_TopBar.appendChild(UI_StatusPanel);

        const UI_EnemyPanel = document.createElement('div');
        UI_EnemyPanel.id = 'UI_Enemy_Panel';
        UI_EnemyPanel.innerHTML = `
            <div id="UI_Enemy_Name">Slime</div>
            <div id="UI_Enemy_Hp_Bar"><div id="UI_Enemy_Hp_Fill"></div></div>
            <div id="UI_Enemy_Hp_Text">80 / 80</div>
            <div id="UI_Enemy_Fruit_Bar"><div id="UI_Enemy_Fruit_Fill"></div></div>
            <div id="UI_Enemy_Fruit_Text">—</div>
        `;
        UI_TopBar.appendChild(UI_EnemyPanel);

        const UI_NextPanel = document.createElement('div');
        UI_NextPanel.id = 'UI_Next_Panel';
        UI_NextPanel.innerHTML = `
            <div id="UI_Next_Label">Next</div>
            <div id="UI_Next_Fruit">🍒</div>
        `;
        document.body.appendChild(UI_NextPanel);
        nextPanelReady = true;
        PositionNextPanel();

        const UI_ItemPanel = document.createElement('div');
        UI_ItemPanel.id = 'UI_Item_Panel';
        UI_ItemPanel.innerHTML = `
            <div id="UI_Item_Label">Potion</div>
            <div id="UI_Item_Count">×1</div>
        `;
        document.body.appendChild(UI_ItemPanel);

            <div class="dialog-box">
                <div id="UI_Dialog_Text"></div>
                <div class="dialog-hint">▼</div>
            </div>
        `;
        document.body.appendChild(UI_Dialog);

        function UpdateStageProgress() {
            const fill1 = document.getElementById('UI_Stage_Progress_Fill');
            const fill2 = document.getElementById('UI_Stage_Progress_Fill_2');
            const track1 = document.getElementById('Stage_Track_1');
            const track2 = document.getElementById('Stage_Track_2');
            const dotStart = document.getElementById('Stage_Dot_Start');
            const dotMid   = document.getElementById('Stage_Dot_Mid');
            const dotEnd   = document.getElementById('Stage_Dot_End');
            if (!fill1 || !fill2) return;
            const chapterIdx = CurrentChapter();
            const defeatedInArea = EnemyIndex - chapterIdx * 2;
            const hpFrac = EnemyMaxHp > 0 ? Clamp(1 - EnemyHp / EnemyMaxHp, 0, 1) : 0;
            const progress = (defeatedInArea + hpFrac) / 2;
            fill1.style.width = Math.min(100, progress * 200) + '%';
            fill2.style.width = Math.max(0, Math.min(100, (progress - 0.5) * 200)) + '%';

            [dotStart, dotMid, dotEnd].forEach(d => d && d.classList.remove('stage-dot-active'));
            let activeDot = progress <= 0 ? dotStart : progress < 1 ? dotMid : dotEnd;
            if (activeDot) activeDot.classList.add('stage-dot-active');

            const startC = 'rgba(52,211,153,0.4)';
            const midC   = 'rgba(255,159,31,0.4)';
            const endC   = 'rgba(56,189,248,0.4)';
            const grey   = 'rgba(255,255,255,0.08)';
            let t1bg, t2bg;
            if (progress <= 0) {
                t1bg = 'linear-gradient(90deg, ' + startC + ', ' + grey + ')';
                t2bg = grey;
            } else if (progress < 1) {
                t1bg = 'linear-gradient(90deg, ' + grey + ', ' + midC + ')';
                t2bg = 'linear-gradient(90deg, ' + midC + ', ' + grey + ')';
            } else {
                t1bg = grey;
                t2bg = 'linear-gradient(90deg, ' + grey + ', ' + endC + ')';

            if (track2) track2.style.background = t2bg;

        function EnemyTryMerge() {
            let merged = true;
            while (merged) {
                merged = false;
                for (let i = 0; i < FRUITS.length - 1; i++) {
                    if (EnemyFruitCounts[i] >= 2) {
                        EnemyFruitCounts[i] -= 2;
                        EnemyFruitCounts[i + 1]++;
                        merged = true;
                    }
                }
            }
        }

        function EnemyStrongestFruit() {
            for (let i = FRUITS.length - 1; i >= 0; i--) {
                if (EnemyFruitCounts[i] > 0) {

            if (!UI_PlayerInfo.classList.contains('open')) return;
            const remaining = StatPoints - DraftTotal();
            if (dir > 0) {
                if (remaining <= 0) return;
                if (stat === 'hp') DraftHp++;
                else if (stat === 'pow') DraftPow++;
                else if (stat === 'dex') DraftDex++;
            } else {
                if (stat === 'hp') {
                    if (DraftHp <= 0) return;
                    DraftHp--;
                } else if (stat === 'pow') {
                    if (DraftPow <= 0) return;
                    DraftPow--;
                } else if (stat === 'dex') {
                    if (DraftDex <= 0) return;
                    DraftDex--;
                }

            RefreshPlayerInfo();

            if (!UI_PlayerInfo.classList.contains('open')) return;
            const total = DraftTotal();
            if (total <= 0) return;
            PlayerMaxHp += DraftHp * HP_PER_SP;
            PlayerHp += DraftHp * HP_PER_SP;
            AttackBonus += DraftPow * ATK_PER_SP;
            HpStat += DraftHp;
            PowerStat += DraftPow;
            DexStat += DraftDex;
            StatPoints -= total;
            DraftHp = 0;
            DraftPow = 0;
            DraftDex = 0;
            RefreshPlayerInfo();
            UpdateUI();

        function RollDodge(defenderAgi, attackerAgi) {
            const diff = defenderAgi - attackerAgi;
            const nullifyChance = Clamp(0.04 + diff * 0.02, 0.01, 0.55);
            const reduceChance  = Clamp(0.25 + diff * 0.01, 0.08, 0.50);
            const r = Math.random();
            if (r < nullifyChance) return 'nullify';
            if (r < nullifyChance + reduceChance) return 'reduce';
            return 'normal';
        }

        function BeginPlayerTurn() {
            prevTurnCombos = comboCount;
            comboCount = 0;
        }

        function ComboMultiplier() {
            return Math.pow(1.2, prevTurnCombos);
        }

        function FindFruitAt(x, y) {
            let best = null;
            let bestDist = Infinity;
            for (let i = 0; i < Fruits.length; i++) {
                const f = Fruits[i];
                const dx = f.x - x;
                const dy = f.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < f.radius + 10 && dist < bestDist) {
                    best = f;
                    bestDist = dist;
                }
            }
            return best;
        }

        /* ─── Fruit Class ──────────────────────────────────────── */

        class Fruit {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.radius = FRUITS[type].radius * FruitScale;
                this.settled = false;
                this.markedForMerge = false;
                this.age = 0;
            }

            get color() { return FRUITS[this.type].color; }
            get emoji() { return FRUITS[this.type].emoji; }
            get damage() { return FRUITS[this.type].damage; }

            update(dt) {
                this.age += dt;
                this.vy += GRAVITY;
                if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
                this.vx *= FRICTION;
                this.x += this.vx;
                this.y += this.vy;

                const wallLeft = 10;
                const wallRight = CW - 10;
                const floorY = CH - 10;

                if (this.x - this.radius < wallLeft) {
                    this.x = wallLeft + this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.x + this.radius > wallRight) {
                    this.x = wallRight - this.radius;
                    this.vx *= -WALL_BOUNCE;
                }
                if (this.y + this.radius > floorY) {
                    this.y = floorY - this.radius;
                    this.vy *= -DAMPING;
                    this.vx *= 0.96;
                    if (Math.abs(this.vy) < 0.5) {
                        this.vy = 0;
                        this.settled = true;
                    }
                }
            }

            draw() {
                Ctx.save();
                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const grad = Ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, this.lightenColor(this.color, 60));
                grad.addColorStop(0.7, this.color);
                grad.addColorStop(1, this.darkenColor(this.color, 40));
                Ctx.fillStyle = grad;
                Ctx.fill();

                Ctx.strokeStyle = this.darkenColor(this.color, 60);
                Ctx.lineWidth = 1.5;
                Ctx.stroke();

                Ctx.beginPath();
                Ctx.arc(this.x, this.y, this.radius * 0.38, 0, Math.PI * 2);
                const highlight = Ctx.createRadialGradient(
                    this.x - this.radius * 0.15, this.y - this.radius * 0.15, 0,
                    this.x, this.y, this.radius * 0.38
                );
                highlight.addColorStop(0, 'rgba(255,255,255,0.5)');
                highlight.addColorStop(1, 'rgba(255,255,255,0)');
                Ctx.fillStyle = highlight;
                Ctx.fill();

                Ctx.font = `${Math.max(10, this.radius * 0.9)}px serif`;
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText(this.emoji, this.x, this.y + 1);

                Ctx.restore();
            }

            lightenColor(hex, amount) {
                const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
                const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
                const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
                return `rgb(${r},${g},${b})`;
            }

            darkenColor(hex, amount) {
                const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
                const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
                const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
                return `rgb(${r},${g},${b})`;
            }
        }

        /* ─── Physics ──────────────────────────────────────────── */

        function ResolveCollisions() {
            let detectedMerge = false;
            for (let i = 0; i < Fruits.length; i++) {
                for (let j = i + 1; j < Fruits.length; j++) {
                    const a = Fruits[i];
                    const b = Fruits[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = a.radius + b.radius;

                    if (dist < minDist && dist > 0.001) {
                        if (a.type === b.type && a.type < FRUITS.length - 1) {
                            a.markedForMerge = true;
                            b.markedForMerge = true;
                            detectedMerge = true;
                        }
                    }
                }
            }

            const PASSES = 3;
            const relax = 0.5;
            for (let pass = 0; pass < PASSES; pass++) {
                for (let i = 0; i < Fruits.length; i++) {
                    for (let j = i + 1; j < Fruits.length; j++) {
                        const a = Fruits[i];
                        const b = Fruits[j];
                        const dx = b.x - a.x;
                        const dy = b.y - a.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 0.001) continue;
                        const minDist = a.radius + b.radius;
                        if (dist >= minDist) continue;

                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = minDist - dist;

                        const invA = 1 / (a.radius * a.radius);
                        const invB = 1 / (b.radius * b.radius);
                        const totalInv = invA + invB;

                        const pushA = overlap * (invA / totalInv) * relax;
                        const pushB = overlap * (invB / totalInv) * relax;
                        const maxPush = Math.min(a.radius, b.radius) * 0.6;
                        const cA = Math.min(pushA, maxPush);
                        const cB = Math.min(pushB, maxPush);

                        a.x -= nx * cA;
                        a.y -= ny * cA;
                        b.x += nx * cB;
                        b.y += ny * cB;

                        const dvx = a.vx - b.vx;
                        const dvy = a.vy - b.vy;
                        const dot = dvx * nx + dvy * ny;

                        if (dot > 0) {
                            const restitution = 0.18;
                            const j = -(1 + restitution) * dot / totalInv;
                            a.vx += j * nx * invA;
                            a.vy += j * ny * invA;
                            b.vx -= j * nx * invB;
                            b.vy -= j * ny * invB;
                        }
                    }
                }
            }

            if (detectedMerge) {
                ProcessMerges();
            }
        }

        function ProcessMerges() {
            let didMerge = false;
            let mergeCount = 0;
            const toRemove = new Set();
            const spawnQueue = [];
            const visited = new Set();

            for (let i = 0; i < Fruits.length; i++) {
                if (visited.has(i)) continue;
                if (!Fruits[i].markedForMerge) continue;

                const group = [];
                const queue = [i];
                visited.add(i);
                while (queue.length > 0) {
                    const cur = queue.shift();
                    group.push(cur);
                    for (let j = 0; j < Fruits.length; j++) {
                        if (visited.has(j)) continue;
                        if (Fruits[cur].type === Fruits[j].type && Fruits[j].markedForMerge) {
                            visited.add(j);
                            queue.push(j);
                        }
                    }
                }

                if (group.length < 2) {
                    for (const idx of group) {
                        Fruits[idx].markedForMerge = false;
                    }
                    continue;
                }

                for (const idx of group) {
                    toRemove.add(idx);
                }
                let cx = 0;
                let cy = 0;
                let vxSum = 0;
                let vySum = 0;
                for (const idx of group) {
                    cx += Fruits[idx].x;
                    cy += Fruits[idx].y;
                    vxSum += Fruits[idx].vx;
                    vySum += Fruits[idx].vy;
                }
                cx /= group.length;
                cy /= group.length;
                vxSum /= group.length;
                vySum /= group.length;

                const newType = Math.min(Fruits[group[0]].type + 1, FRUITS.length - 1);
                didMerge = true;
                mergeCount += group.length;
                comboCount++;

                if (comboCount >= 2) {
                    DamageNumbers.push({
                        x: cx, y: cy - 46,
                        text: 'COMBO ×' + comboCount,
                        color: '#ffd166',
                        alpha: 1,
                        vy: -3.2,
                        life: 1.3
                    });
                }

                MergeEffects.push({
                    x: cx, y: cy,
                    radius: 5,
                    maxRadius: FRUITS[newType].radius * FruitScale * 2.5,
                    alpha: 0.8,
                    color: FRUITS[newType].color
                });

                spawnQueue.push({ x: cx, y: cy, type: newType, vx: vxSum, vy: vySum });
            }

            if (toRemove.size > 0) {
                Fruits = Fruits.filter((_, idx) => !toRemove.has(idx));
                for (const sp of spawnQueue) {
                    const nf = new Fruit(sp.x, sp.y, sp.type);
                    nf.vx = sp.vx || 0;
                    nf.vy = sp.vy || 0;
                    Fruits.push(nf);
                }
            }

            return mergeCount;
        }

        /* ─── RPG Logic ────────────────────────────────────────── */

        function DealDamageToEnemy(dmg) {
            EnemyHp -= dmg;
            if (EnemyHp <= 0) {
                EnemyHp = 0;
                OnEnemyDefeated();
            }
            UpdateUI();
        }

        function GoldRewardRange() {
            const enemy = GetEnemy();
            const base = enemy.gold + Level * 3;
            return {
                min: Math.ceil(base * 0.75),
                max: Math.floor(base * 1.25)
            };
        }

        function OnEnemyDefeated() {
            const enemy = GetEnemy();
            const expReward = enemy.exp + Level * 2;
            const range = GoldRewardRange();
            const goldReward = range.min + Math.floor(Math.random() * (range.max - range.min + 1));
            const dropPotion = Math.random() < 0.3;

            Gold += goldReward;
            if (dropPotion) Potions++;
            const lvlBefore = PlayerLevel;
            GainExp(expReward);
            const leveled = PlayerLevel > lvlBefore;

            let cells = '';
            let levelRow = '';
            if (leveled) {
                const spGained = (PlayerLevel - lvlBefore) * SP_PER_LEVEL;
                levelRow = '<div class="vt-level">⬆ LEVEL UP! → Lv.' + PlayerLevel + '&ensp;★ SP +' + spGained + '</div>';
                AnimateLevelUp();
            }
            cells += '<div class="vt-cell"><span>⭐</span><span class="vt-label">EXP</span><span class="vt-val" style="color:#7dd3fc">+' + expReward + '</span></div>';
            cells += '<div class="vt-cell"><span>💰</span><span class="vt-label">Gold</span><span class="vt-val" style="color:#fbbf24">+' + goldReward + '</span></div>';
            if (dropPotion) {
                cells += '<div class="vt-cell"><span>🎁</span><span class="vt-label">Potion</span><span class="vt-val" style="color:#4ade80">×1</span></div>';
            }

            State = 'LevelClear';
            pendingVictoryText = '<div class="vt-title">🏆 Victory</div><div class="vt-grid">' + levelRow + cells + '</div>';

            const isFinal = EnemyIndex >= ENEMIES.length - 1;
            if (isFinal) {
                pendingPostClear = 'ending';
            } else if (IsBoss(EnemyIndex)) {
                pendingPostClear = 'boss';
            } else {
                pendingPostClear = 'next';
            }
        }

        function ContinueAfterClear() {
            HideMessage();
            if (pendingPostClear === 'boss' || pendingPostClear === 'ending') {
                ShowBossStory();
            } else {
                NextStage();
            }
        }

        function NextStage() {
            const prevChapter = CurrentChapter();
            AdvanceLevel();
            const sameArea = CurrentChapter() === prevChapter;
            ResetLevel(sameArea);
            UpdateUI();
        }

        function AdvanceLevel() {
            Level++;
            EnemyIndex++;
            const enemy = GetEnemy();
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            PlayerHp = Math.min(PlayerMaxHp, PlayerHp + Math.floor(PlayerMaxHp * 0.3));
            UpdateUI();
        }

        function EnemyAction(extraDmg, label) {
            if (extraDmg && extraDmg > 0) {
                const strongest = EnemyStrongestFruit();
                const baseDmg = (strongest ? strongest.damage : 0) + extraDmg;
                if (strongest) EnemyFruitCounts[strongest.type]--;
                EnemyFruitTimer = 0;
                lastEnemyAction = 'attack';

                let dmg = baseDmg;
                let outText = label + ' <b>-' + dmg + ' HP</b>';
                let outClass = 'action-punish';

                if (playerActionThisTurn !== 'attack') {
                    const roll = RollDodge(PlayerAgility(), EnemyAgility());
                    if (roll === 'nullify') {
                        dmg = 0;
                        outText = 'You dodge the punishment! <b>0 damage</b>';
                        outClass = 'action-dodge';
                    } else if (roll === 'reduce') {
                        dmg = Math.max(1, Math.floor(baseDmg * 0.5));
                        outText = 'You brace for the hit <b>-' + dmg + ' HP</b>';
                    }
                }

                PlayerHp -= dmg;
                AnimatePlayerPanel();
                UpdateUI();
                if (PlayerHp <= 0) {
                    PlayerHp = 0;
                    State = 'GameOver';
                    ShowMessage('<div class="vt-title" style="color:var(--danger)">💀 Defeat</div><div class="vt-reward">The brave hero has fallen...</div>', 0, 'defeat interactive');
                    return;
                }
                ShowAction(outText, outClass, () => {
                    State = 'Playing';
                });
                return;
            }

            EnemyAddRandomFruit();
            EnemyFruitTimer++;

            const threshold = GetEnemyAttackCycle();

            if (EnemyFruitTimer >= threshold) {
                const strongest = EnemyStrongestFruit();
                const baseDmg = strongest ? strongest.damage : 1;
                if (strongest) EnemyFruitCounts[strongest.type]--;
                EnemyFruitTimer = 0;
                lastEnemyAction = 'attack';

                let dmg = baseDmg;
                let outText = 'Enemy throws ' + (strongest ? strongest.emoji : FRUITS[0].emoji) + ' <b>-' + dmg + ' HP</b>';
                let outClass = 'action-enemy';

                if (playerActionThisTurn !== 'attack') {
                    const roll = RollDodge(PlayerAgility(), EnemyAgility());
                    if (roll === 'nullify') {
                        dmg = 0;
                        outText = 'You dodge the attack! <b>0 damage</b>';
                        outClass = 'action-dodge';
                    } else if (roll === 'reduce') {
                        dmg = Math.max(1, Math.floor(baseDmg * 0.5));
                        outText = 'You half-dodge <b>-' + dmg + ' HP</b>';
                    }
                }

                PlayerHp -= dmg;
                AnimatePlayerPanel();
                UpdateUI();
                if (PlayerHp <= 0) {
                    PlayerHp = 0;
                    State = 'GameOver';
                    ShowMessage('<div class="vt-title" style="color:var(--danger)">💀 Defeat</div><div class="vt-reward">The brave hero has fallen...</div>', 0, 'defeat interactive');
                    return;
                }
                ShowAction(outText, outClass, () => {
                    State = 'Playing';
                });
            } else {
                lastEnemyAction = 'build';
                State = 'Playing';
                UpdateUI();
            }
        }

                lines.push(
                    'With the Dark Lord gone, shadow drains from the land...',
                    'Your legend will echo through every age.'

            OpenDialog(lines, () => {
                if (isFinal) {
                    ShowEnding();
                } else {
                    OpenShop(() => {
                        ShowChapterIntro(NextChapterIdx(), () => NextStage());
                    });
                }
            });

            UI_Shop.classList.add('open');

                shopOnClose = null;

        function ShowChapterIntro(chapterIdx, onDone) {

            UI_Shop.classList.remove('open');
            UI_ChapterTitle.classList.remove('open');
            UI_Ending.classList.remove('open');
            UI_PlayerInfo.classList.remove('open');
            UI_EnemyInfo.classList.remove('open');

            prevStateBeforeEnemyInfo = null;

        function RefreshPlayerInfo() {
            const remaining = StatPoints - DraftTotal();
            document.getElementById('Info_Points').textContent = 'SP ' + remaining;
            document.getElementById('Info_Level').textContent = PlayerLevel;
            document.getElementById('Info_Pow').textContent = POW_BASE + AttackBonus + DraftPow * ATK_PER_SP;
            document.getElementById('Info_HpStat').textContent = PlayerMaxHp + DraftHp * HP_PER_SP;

            document.getElementById('Info_Hp_Text').textContent =

            document.getElementById('Info_Potion').textContent = '×' + Potions;

            UI_PlayerInfo.querySelectorAll('.stat-btn').forEach((b) => {
                const dir = b.dataset.dir ? parseInt(b.dataset.dir, 10) : 1;

                prevStateBeforeInfo = 'Playing';
                State = 'Paused';

            DraftPow = 0;

        function RefreshEnemyInfo() {
            const enemy = GetEnemy();
            const strongest = EnemyStrongestFruit();
            document.getElementById('EInfo_Title').textContent = enemy.name;
            document.getElementById('EInfo_Hp_Text').textContent =
                Math.max(0, Math.ceil(EnemyHp)) + ' / ' + EnemyMaxHp;
            const eRatio = Math.max(0, EnemyHp / EnemyMaxHp);
            document.getElementById('EInfo_Hp_Fill').style.width = (eRatio * 100) + '%';
            document.getElementById('EInfo_Level').textContent = Level;
            document.getElementById('EInfo_Pow').textContent =
                strongest ? strongest.emoji + ' ' + strongest.damage : '—';

            document.getElementById('EInfo_Reward').textContent =
                'EXP ' + (enemy.exp + Level * 2) + ' / 💰 ' + rewardRange.min + '-' + rewardRange.max;
