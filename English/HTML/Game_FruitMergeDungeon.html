        }

        function OpenEnemyInfo() {
            RefreshEnemyInfo();
            UI_EnemyInfo.classList.add('open');
            if (State === 'Playing') {
                prevStateBeforeEnemyInfo = 'Playing';
                State = 'Paused';
            }
        }

        function CloseEnemyInfo() {
            UI_EnemyInfo.classList.remove('open');
            if (prevStateBeforeEnemyInfo === 'Playing') {
                State = 'Playing';
            }
            prevStateBeforeEnemyInfo = null;
        }

        /* ─── Fruit Drop ───────────────────────────────────────── */

        function SpawnFruit() {
            if (!CanDrop || State !== 'Playing') return;
            if (Fruits.length >= MAX_FRUITS_ON_SCREEN) return;
            if (NextFruitPending) return;
            BeginPlayerTurn();
            playerActionThisTurn = 'drop';

            const dropY = CH * DROP_LINE_Y_RATIO;
            const f = new Fruit(DropX, dropY, CurrentFruitType);
            f.vy = 1;
            Fruits.push(f);

            NextFruitPending = true;
            NextFruitCooldown = 2.0;

            CanDrop = false;
            DropCooldown = 0.4;
            TurnCount++;
            UpdateUI();

            EnemyAction();
        }

        function ReplenishNextFruit() {
            if (!NextFruitPending) return;
            NextFruitPending = false;
            CurrentFruitType = NextFruitType;
            NextFruitType = Math.floor(Math.random() * Math.min(4 + Math.floor(Level / 2), FRUITS.length));
            UpdateUI();
        }

        function AttackWithFruit(fruit) {
            if (State !== 'Playing') return;
            BeginPlayerTurn();
            playerActionThisTurn = 'attack';

            const mult = ComboMultiplier();
            const baseDmg = Math.floor((fruit.damage + POW_BASE + AttackBonus) * mult);
            Fruits = Fruits.filter(f => f !== fruit);

            let dmg = baseDmg;
            const multText = prevTurnCombos > 0 ? ' <span class="dmg-mult">×' + parseFloat(mult.toFixed(2)) + '</span>' : '';
            let outText = 'Your attack <b>-' + dmg + ' HP</b>' + multText;
            let outClass = 'action-player';

            if (lastEnemyAction !== 'attack') {
                const roll = RollDodge(EnemyAgility(), PlayerAgility());
                if (roll === 'nullify') {
                    dmg = 0;
                    outText = 'Enemy dodges! <b>0 damage</b>';
                    outClass = 'action-dodge';
                } else if (roll === 'reduce') {
                    dmg = Math.max(1, Math.floor(baseDmg * 0.5));
                    outText = 'Enemy deflects <b>-' + dmg + ' HP</b>' + multText;
                }
            }

            DamageNumbers.push({
                x: fruit.x, y: fruit.y,
                text: '-' + dmg + (dmg > 0 && mult > 1 ? ' ×' + parseFloat(mult.toFixed(2)) : ''),
                color: dmg === 0 ? '#38bdf8' : '#ff6b6b',
                alpha: 1,
                vy: -2.5,
                life: 1.5
            });

            MergeEffects.push({
                x: fruit.x, y: fruit.y,
                radius: 5,
                maxRadius: fruit.radius * 2,
                alpha: 0.8,
                color: fruit.color
            });

            DealDamageToEnemy(dmg);
            TurnCount++;
            shakeTimer = 0.15;
            shakeIntensity = Math.min(8, dmg * 0.03);
            AnimateEnemyPanel();
            UpdateUI();

            const wasKilled = EnemyHp <= 0;
            ShowAction(outText, outClass, () => {
                if (wasKilled) {
                    State = 'LevelClear';
                    ShowMessage(pendingVictoryText, 0, 'victory interactive');
                } else {
                    EnemyAction();
                }
            });
        }

        /* ─── Game Loop ────────────────────────────────────────── */

        let lastTime = performance.now();

        function GameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (State === 'Playing') {
                DropCooldown -= dt;
                if (DropCooldown <= 0) {
                    CanDrop = true;
                }

                for (const f of Fruits) f.update(dt);
                ResolveCollisions();

                const heightLimit = CH * 0.28;
                let overLimit = false;
                for (const f of Fruits) {
                    if (f.y < heightLimit && f.age > 1 && Math.abs(f.vy) < 1) {
                        overLimit = true;
                        break;
                    }
                }
                if (overLimit && Fruits.length > 3) {
                    shakeTimer = 0.2;
                    shakeIntensity = 4;
                    const spilled = Fruits.filter(f => f.y < heightLimit && f.age > 1 && Math.abs(f.vy) < 1);
                    Fruits = Fruits.filter(f => !(f.y < heightLimit && f.age > 1 && Math.abs(f.vy) < 1));
                    for (const f of spilled) {
                        MergeEffects.push({
                            x: f.x, y: f.y,
                            radius: 5,
                            maxRadius: Math.max(16, f.radius * 1.6),
                            alpha: 1,
                            color: FRUITS[f.type].color
                        });
                    }
                    if (spilled.length > 0) {
                        DamageNumbers.push({
                            x: CW / 2, y: heightLimit - 16,
                            text: 'Overflow! -' + spilled.length,
                            color: '#f87171',
                            alpha: 1,
                            vy: -2,
                            life: 1.6
                        });
                    }
                    EnemyAction(5, 'The enemy punishes you');
                    UpdateUI();
                }
            }

            if (NextFruitPending) {
                NextFruitCooldown -= dt;
                if (NextFruitCooldown <= 0 && State === 'Playing') {
                    ReplenishNextFruit();
                }
            }

            for (let i = DamageNumbers.length - 1; i >= 0; i--) {
                const d = DamageNumbers[i];
                d.y += d.vy;
                d.life -= dt;
                d.alpha = Math.max(0, d.life / 1.5);
                if (d.life <= 0) DamageNumbers.splice(i, 1);
            }
            for (let i = MergeEffects.length - 1; i >= 0; i--) {
                const e = MergeEffects[i];
                e.radius += (e.maxRadius - e.radius) * 0.12;
                e.alpha -= dt * 2;
                if (e.alpha <= 0) MergeEffects.splice(i, 1);
            }

            if (messageTimer > 0) {
                messageTimer -= dt;
                if (messageTimer <= 0) {
                    HideMessage();
                }
            }

            if (shakeTimer > 0) shakeTimer -= dt;

            Render();
            UpdateUI();
            requestAnimationFrame(GameLoop);
        }

        /* ─── Render ───────────────────────────────────────────── */

        function DrawFruitHalo(f, intensity, pulse) {
            const r = f.radius;
            const glowColor = '255, 214, 130';
            Ctx.save();
            Ctx.globalCompositeOperation = 'lighter';
            const halo = Ctx.createRadialGradient(f.x, f.y, r * 0.6, f.x, f.y, r * 1.7);
            halo.addColorStop(0, `rgba(${glowColor}, ${0.15 * intensity * pulse})`);
            halo.addColorStop(1, `rgba(${glowColor}, 0)`);
            Ctx.fillStyle = halo;
            Ctx.beginPath();
            Ctx.arc(f.x, f.y, r * 1.7, 0, Math.PI * 2);
            Ctx.fill();
            Ctx.strokeStyle = `rgba(${glowColor}, ${0.22 * intensity})`;
            Ctx.lineWidth = 1.2 + intensity * 0.5;
            Ctx.shadowColor = `rgba(${glowColor}, 0.9)`;
            Ctx.shadowBlur = 5 * intensity;
            Ctx.beginPath();
            Ctx.arc(f.x, f.y, r + 3, 0, Math.PI * 2);
            Ctx.stroke();
            Ctx.restore();
        }

        function DrawFruitBodyGlow(f, intensity, pulse) {
            const r = f.radius;
            const glowColor = '255, 236, 190';
            Ctx.save();
            Ctx.globalCompositeOperation = 'lighter';
            const inner = Ctx.createRadialGradient(f.x, f.y, r * 0.1, f.x, f.y, r);
            inner.addColorStop(0, `rgba(255, 255, 235, ${0.20 * intensity * pulse})`);
            inner.addColorStop(0.7, `rgba(${glowColor}, ${0.08 * intensity * pulse})`);
            inner.addColorStop(1, `rgba(${glowColor}, 0)`);
            Ctx.fillStyle = inner;
            Ctx.beginPath();
            Ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
            Ctx.fill();
            Ctx.restore();
        }

        function Render() {
            Ctx.save();

            if (shakeTimer > 0) {
                const sx = (Math.random() - 0.5) * shakeIntensity * 2;
                const sy = (Math.random() - 0.5) * shakeIntensity * 2;
                Ctx.translate(sx, sy);
            }

            Ctx.clearRect(-20, -20, CW + 40, CH + 40);

            const bgGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(0.5, '#16213e');
            bgGrad.addColorStop(1, '#0f3460');
            Ctx.fillStyle = bgGrad;
            Ctx.fillRect(0, 0, CW, CH);

            Ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let gx = 0; gx < CW; gx += 28) {
                Ctx.fillRect(gx, 0, 1, CH);
            }
            for (let gy = 0; gy < CH; gy += 28) {
                Ctx.fillRect(0, gy, CW, 1);
            }

            const wallLeft = 10;
            const wallRight = CW - 10;
            const floorY = CH - 10;

            const wallGradX = Ctx.createLinearGradient(0, 0, CW, 0);
            wallGradX.addColorStop(0, 'rgba(255,255,255,0.06)');
            wallGradX.addColorStop(0.5, 'rgba(255,255,255,0.18)');
            wallGradX.addColorStop(1, 'rgba(255,255,255,0.06)');

            Ctx.fillStyle = wallGradX;
            Ctx.fillRect(wallLeft, floorY - 3, wallRight - wallLeft, 3);
            Ctx.fillRect(wallLeft - 3, floorY - 6, 3, 6);
            Ctx.fillRect(wallRight, floorY - 6, 3, 6);

            Ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            Ctx.lineWidth = 1.5;
            const wallGrad = Ctx.createLinearGradient(0, 0, 0, CH);
            wallGrad.addColorStop(0, 'rgba(148,163,184,0.45)');
            wallGrad.addColorStop(0.12, 'rgba(148,163,184,0.10)');
            wallGrad.addColorStop(1, 'rgba(148,163,184,0.25)');
            Ctx.strokeStyle = wallGrad;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, 0);
            Ctx.lineTo(wallLeft, floorY - 6);
            Ctx.lineTo(wallRight, floorY - 6);
            Ctx.lineTo(wallRight, 0);
            Ctx.stroke();

            Ctx.save();
            Ctx.setLineDash([2, 8]);
            Ctx.strokeStyle = 'rgba(148,163,184,0.28)';
            Ctx.lineWidth = 1;
            Ctx.beginPath();
            Ctx.moveTo(wallLeft, floorY - 6);
            Ctx.lineTo(wallRight, floorY - 6);
            Ctx.stroke();
            Ctx.restore();

            const dropY = CH * DROP_LINE_Y_RATIO;
            const showDropGuide = (State === 'Playing' && CanDrop) ||
                (State !== 'WaitingStart' && State !== 'Intro' && State !== 'LevelClear' && State !== 'GameOver');
            if (showDropGuide) {
                Ctx.save();
                Ctx.setLineDash([6, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                Ctx.lineWidth = 1.5;
                Ctx.beginPath();
                Ctx.moveTo(DropX, dropY);
                Ctx.lineTo(DropX, floorY);
                Ctx.stroke();

                Ctx.setLineDash([2, 6]);
                Ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                Ctx.lineWidth = 1;
                Ctx.beginPath();
                Ctx.moveTo(wallLeft, dropY);
                Ctx.lineTo(wallRight, dropY);
                Ctx.stroke();
                Ctx.restore();

                if (!NextFruitPending) {
                    const previewFruit = FRUITS[CurrentFruitType];
                    const previewR = previewFruit.radius * FruitScale;
                    Ctx.globalAlpha = 0.5;
                    Ctx.beginPath();
                    Ctx.arc(DropX, dropY, previewR, 0, Math.PI * 2);
                    Ctx.fillStyle = previewFruit.color;
                    Ctx.fill();
                    Ctx.font = `${Math.max(10, previewR * 0.9)}px serif`;
                    Ctx.textAlign = 'center';
                    Ctx.textBaseline = 'middle';
                    Ctx.fillText(previewFruit.emoji, DropX, dropY + 1);
                    Ctx.globalAlpha = 1;
                }
            }

            for (const e of MergeEffects) {
                Ctx.beginPath();
                Ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                Ctx.strokeStyle = e.color;
                Ctx.globalAlpha = e.alpha;
                Ctx.lineWidth = 3;
                Ctx.stroke();
                Ctx.globalAlpha = 1;
            }

            const glowPulse = 0.75 + 0.25 * Math.sin(performance.now() * 0.006);
            for (const f of Fruits) {
                const sel = (f === PressedFruit) ? 1.4 : (f === HoveredFruit ? 0.9 : 0);
                if (sel > 0) DrawFruitHalo(f, sel, glowPulse);
                f.draw();
                if (sel > 0) DrawFruitBodyGlow(f, sel, glowPulse);
            }

            for (const d of DamageNumbers) {
                Ctx.save();
                Ctx.globalAlpha = d.alpha;
                Ctx.font = 'bold 18px "Space Grotesk", "Outfit", sans-serif';
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillStyle = '#000';
                Ctx.fillText(d.text, d.x + 1, d.y + 1);
                Ctx.fillStyle = d.color;
                Ctx.fillText(d.text, d.x, d.y);
                Ctx.restore();
            }

            if (State === 'WaitingStart') {
                Ctx.fillStyle = 'rgba(0,0,0,0.35)';
                Ctx.fillRect(0, 0, CW, CH);
            }

            Ctx.restore();
        }

        /* ─── Input ────────────────────────────────────────────── */

        let lastTouchTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;
        let lastActionTime = 0;
        const ACTION_INTERVAL = 500;
        let HoveredFruit = null;
        let PressedFruit = null;

        function actionBlocked() {
            return (performance.now() - lastActionTime) < ACTION_INTERVAL;
        }

        function GetCanvasX(clientX) {
            const rect = Canvas.getBoundingClientRect();
            return clientX - rect.left;
        }

        function GetCanvasY(clientY) {
            const rect = Canvas.getBoundingClientRect();
            return clientY - rect.top;
        }

        function ClampDropX(x) {
            const r = FRUITS[CurrentFruitType].radius * FruitScale;
            return Math.max(10 + r, Math.min(CW - 10 - r, x));
        }

        function shouldIgnoreClick() {
            return (performance.now() - lastTouchTime) < 700;
        }

        Canvas.addEventListener('mousemove', (e) => {
            if (State === 'Playing') {
                const cx = GetCanvasX(e.clientX);
                const cy = GetCanvasY(e.clientY);
                DropX = ClampDropX(cx);
                HoveredFruit = FindFruitAt(cx, cy);
                Canvas.style.cursor = HoveredFruit ? 'pointer' : 'default';
            }
        });

        Canvas.addEventListener('mouseleave', () => {
            HoveredFruit = null;
            PressedFruit = null;
            Canvas.style.cursor = 'default';
        });

        Canvas.addEventListener('mousedown', (e) => {
            if (State === 'Playing') {
                PressedFruit = FindFruitAt(GetCanvasX(e.clientX), GetCanvasY(e.clientY));
            }
        });

        Canvas.addEventListener('mouseup', () => {
            PressedFruit = null;
        });

        Canvas.addEventListener('click', (e) => {
            e.preventDefault();
            if (actionBlocked()) return;
            if (shouldIgnoreClick()) return;
            if (State === 'WaitingStart') {
                lastActionTime = performance.now();
                StartGame();
            } else if (State === 'Playing') {
                lastActionTime = performance.now();
                const cx = GetCanvasX(e.clientX);
                const cy = GetCanvasY(e.clientY);
                const target = FindFruitAt(cx, cy);
                if (target) {
                    AttackWithFruit(target);
                    HoveredFruit = FindFruitAt(cx, cy);
                    Canvas.style.cursor = HoveredFruit ? 'pointer' : 'default';
                } else {
                    SpawnFruit();
                }
            } else if (State === 'Action') {
                lastActionTime = performance.now();
                ConfirmAction();
            } else if (State === 'LevelClear') {
                lastActionTime = performance.now();
                ContinueAfterClear();
            } else if (State === 'GameOver') {
                lastActionTime = performance.now();
                ResetGame();
            }
        });

        Canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (State === 'Playing' && e.touches.length > 0) {
                DropX = ClampDropX(GetCanvasX(e.touches[0].clientX));
                touchMoved = true;
                PressedFruit = null;
            }
        }, { passive: false });

        Canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            lastTouchTime = performance.now();
            if (State === 'WaitingStart') {
                if (actionBlocked()) return;
                lastActionTime = performance.now();
                StartGame();
            } else if (State === 'Playing') {
                if (e.touches.length > 0) {
                    const cx = GetCanvasX(e.touches[0].clientX);
                    const cy = GetCanvasY(e.touches[0].clientY);
                    DropX = ClampDropX(cx);
                    touchStartX = cx;
                    touchStartY = cy;
                    touchMoved = false;
                    PressedFruit = FindFruitAt(cx, cy);
                }
            } else if (State === 'Action') {
                if (actionBlocked()) return;
                lastActionTime = performance.now();
                ConfirmAction();
            } else if (State === 'LevelClear') {
                if (actionBlocked()) return;
                lastActionTime = performance.now();
                ContinueAfterClear();
            } else if (State === 'GameOver') {
                if (actionBlocked()) return;
                lastActionTime = performance.now();
                ResetGame();
            }
        }, { passive: false });

        Canvas.addEventListener('touchend', (e) => {
            PressedFruit = null;
            if (State !== 'Playing') return;
            if (actionBlocked()) return;
            const cx = (e.changedTouches && e.changedTouches.length > 0)
                ? GetCanvasX(e.changedTouches[0].clientX) : DropX;
            const cy = (e.changedTouches && e.changedTouches.length > 0)
                ? GetCanvasY(e.changedTouches[0].clientY) : CH * DROP_LINE_Y_RATIO;
            if (!touchMoved) {
                const target = FindFruitAt(cx, cy);
                if (target) {
                    AttackWithFruit(target);
                    return;
                }
            }
            SpawnFruit();
        });

        Canvas.addEventListener('touchcancel', () => {
            PressedFruit = null;
            HoveredFruit = null;
        });

        /* ─── Game Flow ────────────────────────────────────────── */

        function StartGame() {
            HideMessage();
            UI_Start.style.display = 'none';
            State = 'Intro';
            ShowChapterIntro(0, EnterBattleLevel);
        }

        function EnterBattleLevel() {
            State = 'Playing';
            CurrentFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3, FRUITS.length));
            UpdateUI();
        }

        function ResetGame() {
            Level = 1;
            Gold = 0;
            PlayerLevel = 1;
            PlayerExp = 0;
            AttackBonus = 0;
            StatPoints = 0;
            PowerStat = 0;
            HpStat = 0;
            DexStat = 0;
            DraftHp = 0;
            DraftPow = 0;
            DraftDex = 0;
            Potions = 1;
            PlayerMaxHp = 200;
            PlayerHp = PlayerMaxHp;
            EnemyIndex = 0;
            EnemyMaxHp = ScaleEnemyHp();
            EnemyHp = EnemyMaxHp;
            Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            HoveredFruit = null;
            PressedFruit = null;
            TurnCount = 0;
            DropCooldown = 0;
            CanDrop = true;
            NextFruitPending = false;
            NextFruitCooldown = 0;
            CurrentFruitType = 0;
            NextFruitType = 0;
            EnemyFruitCounts = new Array(FRUITS.length).fill(0);
            EnemyFruitTimer = 0;
            DexBonus = 0;
            lastEnemyAction = 'build';
            playerActionThisTurn = 'drop';
            comboCount = 0;
            prevTurnCombos = 0;
            pendingPostClear = 'next';
            dialogOnDone = null;
            shopOnClose = null;
            HideMessage();
            HideOverlays();
            UI_Action.className = '';
            actionNext = null;
            UpdateUI();
            UI_Start.style.display = '';
            State = 'WaitingStart';
        }

        function ResetLevel(keepFruits) {
            if (!keepFruits) Fruits = [];
            DamageNumbers = [];
            MergeEffects = [];
            HoveredFruit = null;
            PressedFruit = null;
            TurnCount = 0;
            DropCooldown = 0;
            CanDrop = true;
            NextFruitPending = false;
            NextFruitCooldown = 0;
            CurrentFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            NextFruitType = Math.floor(Math.random() * Math.min(3 + Math.floor(Level / 2), FRUITS.length));
            DropX = CW / 2;
            EnemyFruitCounts = new Array(FRUITS.length).fill(0);
            EnemyFruitTimer = 0;
            lastEnemyAction = 'build';
            playerActionThisTurn = 'drop';
            comboCount = 0;
            prevTurnCombos = 0;
            UI_Action.className = '';
            actionNext = null;
            State = 'Playing';
            UpdateUI();
        }

        /* ─── Fade-in ──────────────────────────────────────────── */

        setTimeout(() => {
            const fade = document.getElementById('Fade_Game');
            if (fade) fade.style.opacity = '0';
        }, 100);

        /* ─── Init ─────────────────────────────────────────────── */

        UpdateUI();
        requestAnimationFrame(GameLoop);

    </script>
</body>
</html>
