    <style>
        .tetris-card {
            background: #ffffff;
            border: 1px solid rgba(120, 144, 156, 0.28);
            border-radius: 22px !important;
            box-shadow: 0 18px 48px rgba(38, 50, 56, 0.18) !important;
        }

        .tetris-hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tetris-hud__item {
            display: flex;
            flex-direction: column;
            min-width: 60px;
        }

        .tetris-hud__label {
            color: #78909c;
            font-family: "Space Mono", monospace;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            line-height: 1.2;
        }

        .tetris-hud__value {
            color: #102a43;
            font-family: "Space Mono", monospace;
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .tetris-hud__value--best {
            color: #0284c7;
        }

        .tetris-hud__value--level {
            color: #0f766e;
        }

        .tetris-stage {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #060a12;
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.18);
        }

        #TetrisCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 400 / 520;
            touch-action: none;
        }

        .tetris-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(4, 8, 16, 0.74);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            color: #f8fafc;
            text-align: center;
        }

        .tetris-fade-enter-active {
            transition: opacity 0.3s ease;
        }

        .tetris-fade-leave-active {
            transition: opacity 1s ease;
        }

        .tetris-fade-enter,
        .tetris-fade-leave-to {
            opacity: 0;
        }

        .tetris-overlay__label {
            font-family: "Space Grotesk", "Outfit", sans-serif;
            font-size: clamp(1.7rem, 6vw, 2.4rem);
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #fca5a5;
            text-shadow: 0 0 24px rgba(248, 113, 113, 0.45);
        }

        .tetris-overlay__label--paused {
            color: #7dd3fc;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
        }

        .tetris-overlay__score {
            margin-bottom: 12px;
            font-family: "Space Mono", monospace;
            font-size: 1.1rem;
            color: #bae6fd;
        }

        .tetris-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .tetris-controls .v-btn {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .tetris-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .tetris-help {
            margin-top: 12px;
            color: #78909c;
            font-family: "Space Mono", monospace;
            font-size: 0.68rem;
            text-align: center;
            line-height: 1.7;
            letter-spacing: 0.02em;
        }

        @media (max-width: 600px) {
            .tetris-hud {
                gap: 6px;
            }

            .tetris-hud__item {
                min-width: 50px;
            }

            .tetris-hud__value {
                font-size: 1.2rem;
            }

            .tetris-help {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 420px) {
            .tetris-hud {
                flex-wrap: wrap;
                gap: 4px 8px;
            }

            .tetris-hud__item {
                min-width: 44px;
            }

            .tetris-hud__value {
                font-size: 1.05rem;
            }

            .tetris-controls {
                gap: 6px;
            }

            .tetris-controls .v-btn {
                width: 44px !important;
                height: 44px !important;
                min-width: 44px !important;
            }

            .tetris-controls .v-btn .v-icon {
                font-size: 20px !important;
            }
        }
    </style>
</head>

<body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Tetris</h1>

    <v-app id="App" v-cloak>
        <template>
            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Game > Tetris</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container fluid class="pa-4 pa-sm-6">
                        <v-row justify="center">
                            <v-col cols="12" sm="10" md="8" lg="6" xl="5">
                                <v-card class="tetris-card mx-auto pa-4 pa-sm-6" max-width="448">
                                    <div class="tetris-hud">
                                        <div class="tetris-hud__item">
                                            <span class="tetris-hud__label">LEVEL</span>
                                            <span class="tetris-hud__value tetris-hud__value--level">{{ level }}</span>
                                        </div>
                                        <div class="tetris-hud__item">
                                            <span class="tetris-hud__label">LINES</span>
                                            <span class="tetris-hud__value">{{ lines }}</span>
                                        </div>
                                        <div class="tetris-hud__item">
                                            <span class="tetris-hud__label">SCORE</span>
                                            <span class="tetris-hud__value">{{ score }}</span>
                                        </div>
                                        <div class="tetris-hud__item">
                                            <span class="tetris-hud__label">BEST</span>
                                            <span class="tetris-hud__value tetris-hud__value--best">{{ best }}</span>
                                        </div>
                                    </div>

                                    <div class="tetris-stage">
                                        <canvas id="TetrisCanvas" width="400" height="520"
                                            aria-label="Tetris game board"></canvas>

                                        <transition name="tetris-fade">
                                            <div v-if="state === 'gameover'" class="tetris-overlay">
                                                <div class="tetris-overlay__label">GAME OVER</div>
                                                <div class="tetris-overlay__score">{{ score }} points · Level {{ level }}</div>
                                                <v-btn color="primary" rounded large @click="restart">
                                                    <v-icon left>mdi-restart</v-icon>
                                                    Play Again
                                                </v-btn>
                                            </div>
                                        </transition>

                                        <transition name="Fade_Page">
                                            <div v-if="state === 'paused'" class="tetris-overlay">
                                                <div class="tetris-overlay__label tetris-overlay__label--paused">PAUSED</div>
                                                <div class="tetris-overlay__score">Take a breath</div>
                                                <v-btn color="primary" rounded large @click="togglePause">
                                                    <v-icon left>mdi-play</v-icon>
                                                    Resume
                                                </v-btn>
                                            </div>
                                        </transition>
                                    </div>

                                    <div class="tetris-controls">
                                        <v-btn fab color="blue-grey darken-4" @click="moveLeft"
                                            aria-label="Move piece left">
                                            <v-icon>mdi-chevron-left</v-icon>
                                        </v-btn>

                                        <v-btn fab color="primary" @click="rotate" aria-label="Rotate piece">
                                            <v-icon>mdi-rotate-right</v-icon>
                                        </v-btn>

                                        <v-btn fab color="blue-grey darken-4" @click="moveRight"
                                            aria-label="Move piece right">
                                            <v-icon>mdi-chevron-right</v-icon>
                                        </v-btn>

                                        <v-btn fab color="cyan darken-3" @pointerdown.prevent="pressSoftDrop"
                                            @pointerup="releaseSoftDrop" @pointerleave="releaseSoftDrop"
                                            @pointercancel="releaseSoftDrop" @contextmenu.prevent
                                            aria-label="Soft drop (hold to drop faster)">
                                            <v-icon>mdi-chevron-down</v-icon>
                                        </v-btn>

                                        <v-btn fab color="deep-purple darken-2" @click="hardDrop"
                                            aria-label="Hard drop">
                                            <v-icon>mdi-arrow-down-bold</v-icon>
                                        </v-btn>
                                    </div>

                                    <div class="tetris-actions">
                                        <v-btn small outlined color="blue-grey darken-3" @click="hold"
                                            :disabled="state !== 'playing'">
                                            <v-icon small left>mdi-swap-vertical</v-icon>
                                            HOLD
                                        </v-btn>

                                        <v-btn small outlined color="blue-grey darken-3" @click="togglePause"
                                            :disabled="state === 'gameover'">
                                            <v-icon small left>{{ state === 'paused' ? 'mdi-play' : 'mdi-pause' }}</v-icon>
                                            {{ state === 'paused' ? 'RESUME' : 'PAUSE' }}
                                        </v-btn>
                                    </div>

                                    <div class="tetris-help">
                                        ← → move &nbsp;·&nbsp; ↑ rotate &nbsp;·&nbsp; ↓ soft drop &nbsp;·&nbsp; Space hard drop<br>
                                        C hold &nbsp;·&nbsp; P pause &nbsp;·&nbsp; R restart
                                    </div>
                                </v-card>
                            </v-col>
                        </v-row>
                    </v-container>
                </transition>
            </v-main>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer></main-footer>
        </template>
    </v-app>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js" integrity="sha384-smVS78N63G0uFpVH9bKdb+2YIW7Q9eFrle79imo+AWW6YLluQxAEK7kxLOt1bNex" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.7.2/dist/vuetify.js" integrity="sha384-IufsRL4FQ+k4aWgxYvH6I1RoIrzL8Ynna+E/AavDQE9hD+UBZQLSTX2+7pPQWNsr" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha384-fJU6sGmyn07b+uD1nMk7/iSb4yvaowcueiQhfVgQuD98rfva8mcr1eSvjchfpMrH" crossorigin="anonymous"></script>
    <script src="../../Asset/Javascript/Common.js?v=1.05"></script>
    <script src="../../Asset/Javascript/Tetris.js?v=1.0"></script>

    <script>
        let TetrisGameInstance = null;

        new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Common],
            data: {
                score: 0,
                best: 0,
                level: 1,
                lines: 0,
                reason: '',
                state: 'playing'
            },
            methods: {
                restart() {
                    if (TetrisGameInstance) TetrisGameInstance.reset();
                },
                moveLeft() {
                    if (TetrisGameInstance) TetrisGameInstance.move(-1);
                },
                moveRight() {
                    if (TetrisGameInstance) TetrisGameInstance.move(1);
                },
                rotate() {
                    if (TetrisGameInstance) TetrisGameInstance.rotate(1);
                },
                hardDrop() {
                    if (TetrisGameInstance) TetrisGameInstance.hardDrop();
                },
                hold() {
                    if (TetrisGameInstance) TetrisGameInstance.hold();
                },
                togglePause() {
                    if (TetrisGameInstance) TetrisGameInstance.togglePause();
                },
                pressSoftDrop() {
                    if (TetrisGameInstance) TetrisGameInstance.pressSoftDrop();
                },
                releaseSoftDrop() {
                    if (TetrisGameInstance) TetrisGameInstance.releaseSoftDrop();
                }
            },
            mounted() {
                const vm = this;

                TetrisGameInstance = new TetrisGame(
                    document.getElementById('TetrisCanvas'),
                    {
                        onChange(snapshot) {
                            vm.score = snapshot.score;
                            vm.best = snapshot.best;
                            vm.level = snapshot.level;
                            vm.lines = snapshot.lines;
                            vm.reason = snapshot.reason;
                            vm.state = snapshot.state;
                        }
                    }
                );
            },
            beforeDestroy() {
                if (TetrisGameInstance) {
                    TetrisGameInstance.destroy();
                    TetrisGameInstance = null;
                }
            }
        });
    </script>
</body>

</html>
