  <meta name="twitter:description" content="A practical cat health guide: safe foods, foods to avoid, and supplements for kittens, adult cats, and seniors.">
  <meta name="twitter:image" content="https://fum0000.github.io/FUM_WebSite/Asset/Image/Icon_1_2.png">

  <style>
    [v-cloak] {
      display: none;
    }

    #Main {
      background: radial-gradient(circle at top left, rgba(255, 183, 77, 0.12), transparent 30%),
        linear-gradient(180deg, #f8f9fb 0%, #f1f5f9 100%);
    }

    .cat-shell {
      max-width: 1120px;
      margin: 0 auto;
    }

    .cat-panel {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 42px);
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .hero-shell {
      position: relative;
      padding: clamp(18px, 3vw, 30px) 0;
    }

    .hero-copy {
      max-width: 760px;
    }

    .hero-copy h1 {
      margin: 0;
      line-height: 1.08;
      font-family: 'Outfit', 'Space Mono', 'Zen Kaku Gothic New', sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: clamp(2.7rem, 5vw, 4.6rem);
      max-width: 8ch;
      color: #162033;
    }

    .hero-lead {
      color: rgba(22, 32, 51, 0.76);
      font-size: clamp(1rem, 1.2vw, 1.08rem);
      line-height: 1.9;
      max-width: 70ch;
      margin: 16px 0 0;
    }

    .section-header {
      margin-top: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      color: #1f2937;
      font-size: clamp(1.35rem, 3vw, 1.95rem);
    }

    .table-shell {
      margin-top: 16px;
      border: 1px solid rgba(31, 41, 55, 0.1);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.07);
    }

    .table-scroll {
      overflow-x: auto;
      max-width: 100%;
    }

    .cat-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    .cat-table thead th {
      padding: 16px 20px;
      text-align: left;
      background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%);
      color: #1f2937;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      white-space: nowrap;
      border-bottom: 1px solid rgba(31, 41, 55, 0.08);
    }

    .cat-table tbody tr:nth-child(even) {
      background: rgba(249, 250, 251, 0.6);
    }

    .cat-table tbody tr:hover {
      background: rgba(243, 244, 246, 0.8);
    }

    .cat-table td {
      padding: 14px 20px;
      vertical-align: top;
      color: #374151;
      line-height: 1.8;
      border-bottom: 1px solid rgba(31, 41, 55, 0.06);
    }

    .item-name {
      min-width: 160px;
      color: #111827;
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
    }

    .cat-table tbody tr:last-child td {
      border-bottom: none;
    }

    .table-note {
      padding: 14px 18px 18px;
      color: #6b7280;
      font-size: 0.9rem;
      line-height: 1.7;
      background: rgba(249, 250, 251, 0.9);
    }

    .table-note.important {
      background: rgba(254, 226, 226, 0.5);
      color: #991b1b;
      border-top: 1px solid rgba(220, 38, 38, 0.12);
    }

    /* --- Food / Supplements view switch --- */
    .view-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 4px 0 8px;
      padding: 8px;
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 20px;
      background: rgba(243, 244, 246, 0.78);
    }

    .view-switch-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #6b7280;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .view-switch-btn:hover {
      background: rgba(255, 255, 255, 0.68);
      color: #374151;
    }

    .view-switch-btn.is-active {
      background: #fff;
      color: #9a3412;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
    }

    .view-switch-btn .v-icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #fff7ed;
      color: #ea580c;
      font-size: 20px;
      transition: background-color 0.18s ease;
    }

    .view-switch-btn.is-active .v-icon {
      background: #ffedd5;
    }

    .view-switch-copy {
      display: block;
      min-width: 0;
    }

    .view-switch-copy strong {
      display: block;
      font-size: 0.98rem;
      line-height: 1.3;
    }

    .view-switch-copy small {
      display: block;
      margin-top: 3px;
      color: #8b95a5;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .view-panel {
      padding-top: 12px;
    }

    /* --- Supplements by age --- */
    .section-lead {
      margin: 8px 0 0;
      max-width: 74ch;
      color: #6b7280;
      font-size: 0.94rem;
      line-height: 1.8;
    }

    .age-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .age-tab {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      padding: 10px 18px;
      border: 1px solid rgba(31, 41, 55, 0.12);
      border-radius: 999px;
      background: #fff;
      color: #6b7280;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .age-tab:hover {
      border-color: rgba(234, 88, 12, 0.32);
      color: #9a3412;
    }

    .age-tab.is-active {
      border-color: transparent;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.22);
    }

    .age-tab small {
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.72;
    }

    .focus-banner {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-top: 16px;
      padding: 20px 22px;
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 237, 213, 0.95), rgba(255, 251, 235, 0.92));
    }

    .focus-badge {
      flex: 0 0 auto;
      padding: 6px 11px;
      border: 1px solid rgba(234, 88, 12, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: #c2410c;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .focus-banner h3 {
      margin: 0 0 4px;
      color: #7c2d12;
      font-size: 1.08rem;
    }

    .focus-banner p {
      margin: 0;
      color: #9a3412;
      font-size: 0.92rem;
      line-height: 1.75;
    }

    .supp-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .supp-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      border: 1px solid rgba(31, 41, 55, 0.09);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.055);
    }

    .supp-card-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .supp-icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fff7ed, #ffedd5);
      color: #ea580c;
      font-size: 21px;
    }

    .supp-card h4 {
      margin: 0;
      color: #111827;
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .supp-tag {
      display: inline-block;
      margin-top: 4px;
      color: #b45309;
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .supp-why {
      margin: 0;
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.75;
    }

    .supp-facts {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-top: 2px;
      border-top: 1px solid rgba(31, 41, 55, 0.06);
    }

    .supp-facts > div {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding-top: 8px;
    }

    .supp-facts dt {
      padding-top: 2px;
      color: #9ca3af;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .supp-facts dd {
      margin: 0;
      color: #374151;
      font-size: 0.86rem;
      line-height: 1.65;
    }

    .supp-facts .is-watch dt {
      color: #c2410c;
    }

    .supp-facts .is-watch dd {
      color: #9a3412;
    }

    .example-note {
      margin-top: 14px;
      padding: 13px 16px;
      border: 1px solid rgba(31, 41, 55, 0.07);
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.9);
      color: #64748b;
      font-size: 0.84rem;
      line-height: 1.7;
    }

    .example-note strong {
      color: #334155;
    }

    .safety-note {
      margin-top: 18px;
      padding: 18px 20px;
      border: 1px solid rgba(180, 83, 9, 0.18);
      border-radius: 18px;
      background: rgba(255, 247, 237, 0.82);
    }

    .safety-note h3 {
      margin: 0;
      color: #7c2d12;
      font-size: 1rem;
    }

    .safety-note ul {
      margin: 10px 0 0;
      padding-left: 20px;
      color: #7c2d12;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .safety-note li + li {
      margin-top: 4px;
    }

    @media (max-width: 900px) {
      .supp-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .cat-panel {
        border-radius: 22px;
        padding: 20px;
      }

      .cat-table {
        min-width: 0;
        table-layout: fixed;
      }

      .cat-table thead th,
      .cat-table td {
        padding: 12px 14px;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .hero-copy h1 {
        max-width: none;
        font-size: 2.4rem;
      }

      .hero-lead {
        font-size: 0.98rem;
      }

      .view-switch {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 6px;
        border-radius: 16px;
      }

      .view-switch-btn {
        padding: 12px 14px;
      }

      .view-switch-copy small {
        font-size: 0.74rem;
      }

      .age-switch {
        gap: 6px;
      }

      .age-tab {
        flex: 1 1 auto;
        justify-content: center;
        padding: 10px 13px;
      }

      .focus-banner {
        flex-direction: column;
        gap: 10px;
        padding: 17px 18px;
      }

      .supp-card {
        padding: 17px;
      }

      .supp-facts > div {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .safety-note {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <v-app id="App" v-cloak>
    <template>
      <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Service > Cat</main-system-bar>

      <v-main id="Main">
        <transition name="Fade_Page">
          <v-container v-show="Ready_Page" fluid class="pa-5">
            <div class="cat-shell">
              <section class="cat-panel">
                <section class="hero-shell">
                  <div class="hero-copy">
                    <h1>Cat Health</h1>
                    <p class="hero-lead">
                      Let’s learn about cat health. If your cat has a medical condition, always follow your veterinarian's advice.
                    </p>
                  </div>
                </section>

                <div class="view-switch" role="tablist" aria-label="Cat health topics">
                  <button type="button" class="view-switch-btn" :class="{ 'is-active': Active_Section === 'food' }"
                    role="tab" :aria-selected="Active_Section === 'food'" aria-controls="Food_Panel"
                    @click="Active_Section = 'food'">
                    <v-icon aria-hidden="true">mdi-food-apple-outline</v-icon>
                    <span class="view-switch-copy">
                      <strong>Food Guide</strong>
                      <small>Safe foods &amp; foods to avoid</small>
                    </span>
                  </button>
                  <button type="button" class="view-switch-btn" :class="{ 'is-active': Active_Section === 'supplement' }"
                    role="tab" :aria-selected="Active_Section === 'supplement'" aria-controls="Supplement_Panel"
                    @click="Active_Section = 'supplement'">
                    <v-icon aria-hidden="true">mdi-pill</v-icon>
                    <span class="view-switch-copy">
                      <strong>Supplements by Age</strong>
                      <small>Kitten, adult &amp; senior support</small>
                    </span>
                  </button>
                </div>

                <div v-show="Active_Section === 'food'" id="Food_Panel" class="view-panel" role="tabpanel"
                  aria-label="Food guide">

                  <section class="section-header">
                    <h2 class="section-title">Good Foods (Safe in Moderation)</h2>
                  </section>

                <div class="table-shell">
                  <div class="table-scroll">
                    <table class="cat-table">
                      <thead>
                        <tr>
                          <th>Food</th>
                          <th>Exception</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td class="item-name">Bluefish</td>
                          <td>Raw, salted, seasoned, or containing bones.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Whitefish</td>
                          <td>Raw, salted, seasoned, or containing bones.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Chicken</td>
                          <td>Raw, seasoned, containing bones, or excessive skin.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Egg</td>
                          <td>Uncooked / raw.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Natto</td>
                          <td>With tare/karashi, or in excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Unsweetened Yogurt</td>
                          <td>Sweetened, containing xylitol, or for lactose-intolerant cats.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Pumpkin</td>
                          <td>Seasoned, or in excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Sweet Potato</td>
                          <td>Seasoned, or in excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Fermented Foods</td>
                          <td>Those containing alcohol, high salt, or spicy seasonings.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Foods containing EPA/DHA</td>
                          <td>Excessive amounts.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Cat Probiotics</td>
                          <td>Products not specifically formulated for cats.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="table-note">
                    These items are generally well-tolerated when given in small, appropriate amounts. Always introduce new foods gradually.
                  </div>
                </div>

                <section class="section-header">
                  <h2 class="section-title">Foods to Avoid</h2>
                </section>

                <div class="table-shell">
                  <div class="table-scroll">
                    <table class="cat-table">
                      <thead>
                        <tr>
                          <th>Food</th>
                          <th>Exception</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td class="item-name">Alliums (onions, garlic, chives, etc.)</td>
                          <td>None.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Grapes/Raisins</td>
                          <td>None.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Cacao/Chocolate</td>
                          <td>None.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Caffeine</td>
                          <td>Caffeine-free beverages.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Alcohol</td>
                          <td>None.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Raw Yeast / Unbaked Rising Dough</td>
                          <td>Fully baked bread.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Human Medications/Supplements</td>
                          <td>Only if prescribed by a veterinarian.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Raw Meat/Fish/Eggs</td>
                          <td>Properly managed commercial cat food formulated for cats.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Bones</td>
                          <td>Cat-specific products confirmed as safe.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Dairy Products</td>
                          <td>Cat-specific milk or lactose-free products.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Dog Food</td>
                          <td>None. It does not meet a cat's nutritional needs.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Moldy/Rotten Foods</td>
                          <td>None.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Lilies (lily, etc.)</td>
                          <td>None. All parts, including pollen and vase water.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Azalea/Rhododendron</td>
                          <td>None. All parts are toxic.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Oleander</td>
                          <td>None. All parts are toxic.</td>
                        </tr>
                        <tr>
                          <td class="item-name">Pothos/Dieffenbachia</td>
                          <td>None. Ingestion of leaves or sap.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="table-note important">
                    For safety, keep these foods away from your cat. Never self-medicate with human drugs.
                  </div>
                </div>

                </div><!-- /Food_Panel -->

                <div v-show="Active_Section === 'supplement'" id="Supplement_Panel" class="view-panel" role="tabpanel"
                  aria-label="Supplements by age">

                  <section class="section-header">
                    <div>
                      <h2 class="section-title">Supplements by Age</h2>
                      <p class="section-lead">
                        A complete, balanced cat food already supplies the essentials. The options below are targeted support to discuss with your
                        veterinarian—not a replacement for a proper diet or medical care.
                      </p>
                    </div>
                  </section>

                  <div class="age-switch" role="tablist" aria-label="Choose your cat's age group">
                    <button type="button" class="age-tab" :class="{ 'is-active': Active_Age === 'kitten' }" role="tab"
                      :aria-selected="Active_Age === 'kitten'" aria-controls="Kitten_Panel" @click="Active_Age = 'kitten'">
                      Kittens <small>0–12 months</small>
                    </button>
                    <button type="button" class="age-tab" :class="{ 'is-active': Active_Age === 'adult' }" role="tab"
                      :aria-selected="Active_Age === 'adult'" aria-controls="Adult_Panel" @click="Active_Age = 'adult'">
                      Adults <small>1–7 years</small>
                    </button>
                    <button type="button" class="age-tab" :class="{ 'is-active': Active_Age === 'senior' }" role="tab"
                      :aria-selected="Active_Age === 'senior'" aria-controls="Senior_Panel" @click="Active_Age = 'senior'">
                      Seniors <small>7+ years</small>
                    </button>
                  </div>

                  <div v-show="Active_Age === 'kitten'" id="Kitten_Panel" role="tabpanel" aria-label="Kitten supplements">
                    <div class="focus-banner">
                      <span class="focus-badge">0–12 months</span>
                      <div>
                        <h3>Build the foundation</h3>
                        <p>
                          Kittens grow quickly, so a complete kitten food comes first. Supplements are mainly for weaning stress,
                          homemade diets, or a specific concern diagnosed by your veterinarian.
                        </p>
                      </div>
                    </div>

                    <div class="supp-grid">
                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-brain</v-icon></span>
                          <div>
                            <h4>DHA (Omega-3)</h4>
                            <span class="supp-tag">Brain &amp; vision</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          DHA supports brain and retinal development during the first year. Most complete kitten foods already include it.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A complete kitten food with DHA, or a cat-labeled fish or algal oil with a measured EPA/DHA dose.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Do not use cod liver oil or guess the dose. Excess fat can upset the stomach, and very high doses may affect clotting.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-bacteria-outline</v-icon></span>
                          <div>
                            <h4>Cat-Specific Probiotics</h4>
                            <span class="supp-tag">Gut &amp; weaning</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          May support a healthy gut during weaning, food changes, or stress-related loose stool.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A product labeled for cats, with named strains (for example, <em>Enterococcus faecium</em>) and a clear CFU count.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Skip human probiotics. Persistent diarrhea, vomiting, or poor growth needs veterinary care.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-bone</v-icon></span>
                          <div>
                            <h4>Calcium &amp; Phosphorus</h4>
                            <span class="supp-tag">Bones &amp; teeth</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          These minerals are critical for skeletal growth, but they only need adjusting when a homemade diet is used.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A recipe balanced by a board-certified veterinary nutritionist, with calcium and phosphorus in the correct ratio.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Never add calcium or phosphorus to commercial food. An imbalance can cause serious growth problems.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-heart-pulse</v-icon></span>
                          <div>
                            <h4>Taurine</h4>
                            <span class="supp-tag">Heart &amp; eyes</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          An essential amino acid for cats. Deficiency can damage the heart and retina.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A complete kitten food, which is already fortified. Extra taurine is only for a vet-formulated homemade diet.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Taurine cannot fix an unbalanced diet. Do not use supplements as a substitute for complete food.</dd>
                          </div>
                        </dl>
                      </article>
                    </div>

                    <div class="example-note">
                      <strong>Examples:</strong> FortiFlora is a widely used cat probiotic; DHA is usually best supplied by a complete kitten food.
                      Examples are not endorsements, and formulas or availability vary by country—confirm the label and dose with your vet.
                    </div>
                  </div>

                  <div v-show="Active_Age === 'adult'" id="Adult_Panel" role="tabpanel" aria-label="Adult cat supplements">
                    <div class="focus-banner">
                      <span class="focus-badge">1–7 years</span>
                      <div>
                        <h3>Maintain and protect</h3>
                        <p>
                          Healthy adults on a complete diet usually need nothing extra. Targeted support may help with skin and coat,
                          digestion, joints, dental care, or weight management.
                        </p>
                      </div>
                    </div>

                    <div class="supp-grid">
                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-fish</v-icon></span>
                          <div>
                            <h4>Omega-3 EPA/DHA</h4>
                            <span class="supp-tag">Skin, coat &amp; joints</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Marine omega-3s help manage inflammation and support skin, coat, joints, heart, and kidney health.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A cat-labeled marine oil with stated EPA/DHA per serving and vitamin E as an antioxidant.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Dose by weight. High doses can cause diarrhea or affect clotting. Avoid cod liver oil.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-bacteria-outline</v-icon></span>
                          <div>
                            <h4>Probiotics + Prebiotics</h4>
                            <span class="supp-tag">Digestion &amp; hairballs</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Supports gut balance, firmer stool, and may help with hairball management and stress-related digestive upset.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A cat-specific, multi-strain formula with CFU guaranteed through expiry; the NASC seal is a plus.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Introduce slowly. Bloody diarrhea, vomiting, or weight loss needs a vet.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-run</v-icon></span>
                          <div>
                            <h4>Glucosamine + Chondroitin</h4>
                            <span class="supp-tag">Joints &amp; mobility</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Provides building blocks for cartilage and joint fluid. Often used for active or overweight cats.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A veterinary joint formula with a known dose, plus green-lipped mussel if your vet recommends it.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Evidence in cats is limited, and it is not a painkiller. Arthritis needs a veterinary plan.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-heart-pulse</v-icon></span>
                          <div>
                            <h4>Taurine</h4>
                            <span class="supp-tag">Heart &amp; vision</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Essential for cardiac and retinal health. Commercial cat foods are fortified with taurine.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>Complete adult cat food. Extra taurine is only needed for a vet-formulated homemade diet.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Do not rely on a supplement to correct a poorly balanced diet.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-scale-balance</v-icon></span>
                          <div>
                            <h4>L-Carnitine</h4>
                            <span class="supp-tag">Weight management</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          May support fat metabolism and lean muscle in overweight cats.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A vet-supervised weight plan with a cat-labeled L-carnitine product.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Not a weight-loss shortcut. Rapid weight loss can cause liver disease in cats.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-tooth-outline</v-icon></span>
                          <div>
                            <h4>Dental Supplement</h4>
                            <span class="supp-tag">Plaque &amp; breath</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Some oral powders or gels help reduce plaque and tartar when used consistently.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>VOHC Accepted products and a label that clearly states the product is safe for cats.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Not a replacement for brushing or professional dental care.</dd>
                          </div>
                        </dl>
                      </article>
                    </div>

                    <div class="example-note">
                      <strong>Examples:</strong> FortiFlora (probiotic), Cosequin for Cats (joint), Nordic Naturals Omega-3 Pet
                      (omega-3), and VetriScience Hairball Plus (hairball support). Examples are not endorsements; confirm the
                      product is labeled for cats and check the dose with your vet.
                    </div>
                  </div>

                  <div v-show="Active_Age === 'senior'" id="Senior_Panel" role="tabpanel" aria-label="Senior cat supplements">
                    <div class="focus-banner">
                      <span class="focus-badge">7+ years</span>
                      <div>
                        <h3>Support aging systems</h3>
                        <p>
                          Senior cats often hide disease, so bloodwork and a dental check come before supplements. These options
                          support—but do not treat—common age-related concerns.
                        </p>
                      </div>
                    </div>

                    <div class="supp-grid">
                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-fish</v-icon></span>
                          <div>
                            <h4>Omega-3 EPA/DHA</h4>
                            <span class="supp-tag">Joints, kidneys &amp; brain</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Anti-inflammatory support for aging joints, kidney function, and cognitive health.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A concentrated, cat-labeled oil with a measured EPA/DHA dose and a vet-guided serving size.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Ask your vet first if your cat has kidney disease, a bleeding disorder, or surgery planned.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-run</v-icon></span>
                          <div>
                            <h4>Joint Support</h4>
                            <span class="supp-tag">Mobility &amp; cartilage</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Glucosamine, chondroitin, and green-lipped mussel may support cartilage and comfort in older cats.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A veterinary joint formula with a clear dose; check sodium, sugar, and calorie content.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Not a substitute for pain control or weight management. Cats hide pain—report changes early.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-water-outline</v-icon></span>
                          <div>
                            <h4>Kidney Support</h4>
                            <span class="supp-tag">CKD support</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Omega-3s, B vitamins, potassium, and phosphate control may be part of a vet-managed kidney plan.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>Only products and doses recommended by your vet, alongside a renal diet and good hydration.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Never start potassium or phosphate binders without bloodwork. Excess can be dangerous.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-bacteria-outline</v-icon></span>
                          <div>
                            <h4>Probiotics + Prebiotics</h4>
                            <span class="supp-tag">Gut &amp; appetite</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Aging guts can benefit from support during antibiotic use, stress, or loose stool.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A cat-specific, easy-to-mix formula with named strains and a clear CFU count.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Diarrhea, vomiting, weight loss, or reduced appetite needs a vet.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-shield-check-outline</v-icon></span>
                          <div>
                            <h4>Antioxidants &amp; SAMe</h4>
                            <span class="supp-tag">Brain &amp; liver</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Antioxidants and SAMe are used to support aging cells, cognition, and liver function.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A vet-formulated senior product with a stabilized SAMe dose and clear labeling.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Evidence is limited. Avoid stacking several products with overlapping ingredients.</dd>
                          </div>
                        </dl>
                      </article>

                      <article class="supp-card">
                        <div class="supp-card-head">
                          <span class="supp-icon"><v-icon aria-hidden="true">mdi-grain</v-icon></span>
                          <div>
                            <h4>Fiber / Hairball Support</h4>
                            <span class="supp-tag">Constipation &amp; hairballs</span>
                          </div>
                        </div>
                        <p class="supp-why">
                          Psyllium or pumpkin can support regular stool and hairball passage when water intake is adequate.
                        </p>
                        <dl class="supp-facts">
                          <div>
                            <dt>Look for</dt>
                            <dd>A cat-safe fiber product with a clear dose, plus canned food or other ways to increase water intake.</dd>
                          </div>
                          <div class="is-watch">
                            <dt>Watch out</dt>
                            <dd>Fiber can worsen dehydration or an obstruction. Ask your vet before starting.</dd>
                          </div>
                        </dl>
                      </article>
                    </div>

                    <div class="example-note">
                      <strong>Examples:</strong> Cosequin or Dasuquin for Cats (joint), Welactin Feline (omega-3), VetriScience
                      Renal Essentials (kidney support), and VetriScience Nu Cat Senior (senior multivitamin). Examples are not
                      endorsements; senior cats should be checked by a vet before any new supplement.
                    </div>
                  </div>

                  <div class="safety-note">
                    <h3>Before you buy</h3>
                    <ul>
                      <li>Start with a complete and balanced diet. Most healthy cats do not need a multivitamin.</li>
                      <li>Choose products labeled for cats, and look for the NASC Quality Seal or independent quality testing.</li>
                      <li>Add one supplement at a time, then watch for vomiting, diarrhea, itching, or appetite changes.</li>
                      <li>Supplements are not medicines. They cannot diagnose, cure, or treat disease; a diagnosis needs a vet.</li>
                      <li>Do not give human supplements, herbal products, or megadoses without veterinary guidance.</li>
                      <li>Ask your vet first if your cat is pregnant, nursing, on medication, has organ disease, or is scheduled for surgery.</li>
                    </ul>
                  </div>
                </div><!-- /Supplement_Panel -->

              </section>
            </div>
          </v-container>
        </transition>
      </v-main>

      <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
      <main-footer-simple></main-footer-simple>
    </template>
