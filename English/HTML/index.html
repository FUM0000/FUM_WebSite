<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="description" content="FUM_Website">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-B89KY0993B');
    </script>
    <link rel="canonical" href="https://fum0000.github.io/FUM_WebSite/English/HTML/index.html">

    <link rel="icon" href="/FUM_WebSite/Asset/Image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">
    <link href="../../Asset/CSS/Common.css?v=1.5" rel="stylesheet" />

    <title>FUM Website</title>
    <meta name="description"
        content="FUM Website (fum_website) official website. Development, space, convenience features, creators, languages, culture, cuisine, plants, games, philosophy.">
</head>

<body>

    <!-- ローディング画面 -->
    <div id="loading-overlay">
        <div class="intro-circle">
            <div class="inner-circle">
                <div class="loading-galaxy-mask">
                    <canvas id="loadingGalaxyCanvas" aria-hidden="true"></canvas>
                </div>
            </div>
        </div>
        <div class="text-orbit">
            <span class="orbit-letter">F</span><span class="orbit-letter">U</span><span
                class="orbit-letter">M</span><span class="orbit-letter"></span><span class="orbit-letter"></span><span
                class="orbit-letter"></span><span class="orbit-letter"></span><span class="orbit-letter"></span><span
                class="orbit-letter"></span><span class="orbit-letter"></span><span class="orbit-letter"></span><span
                class="orbit-letter"></span>
        </div>
        <svg class="progress-ring" width="330" height="330" viewBox="-25 -25 330 330">
            <path class="progress-ring-bg" id="loadingRingBg" fill="none" stroke="rgba(255,255,255,0.05)"
                stroke-width="2.5" transform="rotate(-90 140 140)" />
            <path class="progress-ring-fill" id="loadingRing" fill="none" stroke="#00ffcc"
                stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9999" stroke-dashoffset="9999"
                transform="rotate(-90 140 140)" />
        </svg>
        <div class="loading-text">
            <div class="loading-text-row">
                <span class="loading-label">Loading</span>
                <span class="loading-percent" id="loadingPercent">0%</span>
            </div>
            <span class="loading-stage" id="loadingStage">Initializing</span>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <canvas id="ElectronShell"></canvas>

    <v-app id="App">
        <template>
            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Home</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" fluid fill-height class="pa-5" style="align-content: flex-start;">
                        <!-- テキストフロー -->
                        <v-container id="TextFlow_1" fluid>
                            <div class="TextFlow_Track">
                                <span class="TextFlow_Item"><span style="color: red"> &lt;NEWS&gt; </span><span style="color: rgb(200, 200, 200)">Autumn colors begin in northern Japan in September and spread southward through December. Daytime temperatures range from about 10–23°C, while mornings and evenings can be chilly. Wear layers you can easily add or remove.</span></span>
                                <span class="TextFlow_Item" aria-hidden="true"><span style="color: red"> &lt;NEWS&gt; </span><span style="color: rgb(200, 200, 200)">Autumn colors begin in northern Japan in September and spread southward through December. Daytime temperatures range from about 10–23°C, while mornings and evenings can be chilly. Wear layers you can easily add or remove.</span></span>
                            </div>
                        </v-container>
                    </v-container>
                </transition>
            </v-main>

            <div id="menu-guide" aria-hidden="true">
                <div class="menu-guide-ring menu-guide-ring-outer"></div>
                <div class="menu-guide-ring menu-guide-ring-middle"></div>
                <div class="menu-guide-ring menu-guide-ring-inner"></div>
            </div>

            <!-- LOG Panel -->
            <div id="log-panel" :class="{ 'is-open': LogOpen }" style="z-index: 5;">
                <div class="log-frame">
                    <div class="log-corner log-corner-tl"></div>
                    <div class="log-corner log-corner-tr"></div>
                    <div class="log-corner log-corner-bl"></div>
                    <div class="log-corner log-corner-br"></div>
                    <div class="log-scanline"></div>
                    <div class="log-header" @click="LogOpen = !LogOpen">
                        <span class="log-title">LOG</span>
                        <span class="log-chevron" :class="{ 'open': LogOpen }">&#9652;</span>
                    </div>
                    <div class="log-body">
                        <div class="log-entry" v-for="(entry, i) in LogEntries" :key="i">
                            <div class="log-date">{{ entry.date }}</div>
                            <div class="log-items">
                                <div class="log-row" v-for="(item, j) in entry.items" :key="j">
                                    <span class="log-page">{{ item.page }}</span>
                                    <span class="log-desc">{{ item.desc }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RECOMMEND Panel -->
            <div id="recommend-panel" :class="{ 'is-open': Recommend_Open }" style="z-index: 4;">
                <div class="recommend-frame">
                    <div class="recommend-corner recommend-corner-tl"></div>
                    <div class="recommend-corner recommend-corner-tr"></div>
                    <div class="recommend-corner recommend-corner-bl"></div>
                    <div class="recommend-corner recommend-corner-br"></div>
                    <div class="recommend-scanline"></div>
                    <div class="recommend-header" @click="Recommend_Open = !Recommend_Open">
                        <span class="recommend-title">RECOMMEND</span>
                        <div class="recommend-actions">
                            <span class="recommend-refresh" v-if="Recommend_Open" title="Pick another page" @click.stop="Reselect_Recommend()">&#8635;</span>
                            <span class="recommend-chevron" :class="{ 'open': Recommend_Open }">&#9652;</span>
                        </div>
                    </div>
                    <div class="recommend-body">
                        <template v-if="Recommend">
                            <div class="recommend-thumb-wrap">
                                <img v-if="Recommend_Image" class="recommend-thumb" :src="Recommend_Image" :alt="Recommend.title" />
                                <div v-else class="recommend-loading">
                                    <span class="recommend-loading-spinner"></span>
                                    <span class="recommend-loading-text">Capturing preview</span>
                                </div>
                            </div>
                            <div class="recommend-rows">
                                <div class="recommend-row">
                                    <span class="recommend-row-label">PAGE</span>
                                    <span class="recommend-page">{{ Recommend.title }}</span>
                                </div>
                                <div class="recommend-row">
                                    <span class="recommend-row-label">CATEGORY</span>
                                    <span class="recommend-cat">{{ Recommend_Hierarchy() }}</span>
                                </div>
                                <div class="recommend-row">
                                    <span class="recommend-row-label">ABOUT</span>
                                    <span class="recommend-desc">{{ Recommend.description }}</span>
                                </div>
                            </div>
                        </template>
                        <div v-else class="recommend-loading">
                            <span class="recommend-loading-spinner"></span>
                            <span class="recommend-loading-text">Loading recommendations</span>
                        </div>
                    </div>
                </div>
                <div id="recommend-capturer"></div>
            </div>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer-simple></main-footer-simple>
        </template>
    </v-app>

    <style>
        body {
            overflow: hidden;
        }

        #ElectronShell {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #App {
            position: relative;
            z-index: 1;
            background-color: transparent !important;
            pointer-events: none;
        }

        #App a,
        #App button,
        #App input,
        #App select,
        #App textarea,
        #App .v-btn,
        #App .v-list-item,
        #App .v-icon {
            pointer-events: auto;
        }

        @keyframes Flow_1 {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        #TextFlow_1 {
            width: 100%;
            max-width: none !important;
            overflow: hidden;
            white-space: nowrap;
            padding-top: 0;
            padding-bottom: 0;
        }

        #TextFlow_1 .TextFlow_Track {
            display: inline-flex;
            flex-wrap: nowrap;
            align-items: baseline;
            animation: Flow_1 40s linear infinite;
            will-change: transform;
        }

        #TextFlow_1 .TextFlow_Item {
            flex: 0 0 auto;
            white-space: nowrap;
            padding-right: 6rem;
        }

        @media (prefers-reduced-motion: reduce) {
            #TextFlow_1 .TextFlow_Track {
                animation: none;
            }
        }

        #menu-guide {
            --menu-guide-x: calc(100vw - 76px);
            --menu-guide-y: 25px;
            --menu-guide-width: 72px;
            --menu-guide-height: 28px;
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        #menu-guide.is-visible {
            opacity: 1;
        }

        #menu-guide.is-hidden {
            opacity: 0;
        }

        .menu-guide-ring {
            position: absolute;
            left: var(--menu-guide-x);
            top: var(--menu-guide-y);
            width: var(--menu-guide-width);
            height: var(--menu-guide-height);
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        .menu-guide-ring-outer {
            border: 1px solid rgba(0, 255, 204, 0.8);
            box-shadow:
                0 0 18px rgba(0, 255, 204, 0.45),
                0 0 42px rgba(0, 255, 204, 0.28),
                inset 0 0 14px rgba(255, 255, 255, 0.15);
            animation: menuGuideFrameSweep 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        .menu-guide-ring-middle {
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.28),
                inset 0 0 12px rgba(0, 255, 204, 0.18);
            animation: menuGuideFrameLock 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        .menu-guide-ring-inner {
            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.2) 0%,
                    rgba(0, 255, 204, 0.18) 45%,
                    rgba(0, 255, 204, 0.04) 100%);
            animation: menuGuideFrameFill 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        @keyframes menuGuideFrameSweep {
            0% {
                transform: translate(calc(-50% - 18px), -50%) scaleX(0.9) scaleY(0.82);
                opacity: 0;
            }

            22% {
                opacity: 1;
            }

            52% {
                transform: translate(-50%, -50%) scaleX(1.04) scaleY(1.08);
                opacity: 0.92;
            }

            72% {
                transform: translate(-50%, -50%) scaleX(1) scaleY(1);
                opacity: 0.78;
            }

            100% {
                transform: translate(calc(-50% + 12px), -50%) scaleX(1.08) scaleY(0.92);
                opacity: 0;
            }
        }

        @keyframes menuGuideFrameLock {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.96);
                opacity: 0.52;
            }

            30% {
                transform: translate(-50%, -50%) scale(1.02);
                opacity: 0.9;
            }

            52% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            68% {
                transform: translate(-50%, -50%) scale(0.985);
                opacity: 0.88;
            }
        }

        @keyframes menuGuideFrameFill {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.94);
                opacity: 0.12;
            }

            34% {
                opacity: 0.26;
            }

            52% {
                transform: translate(-50%, -50%) scale(0.985);
                opacity: 0.56;
            }

            76% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.2;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #menu-guide {
                display: none;
            }
        }


        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            z-index: 9999;
            opacity: 1;
            transition: opacity 2s ease-out;
            pointer-events: auto;
        }

        #loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .intro-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 2s ease-out, transform 2s ease-out;
        }

        #loading-overlay.is-visible .intro-circle {
            opacity: 1;
        }

        #loading-overlay.fade-out .intro-circle {
            transform: translate(-50%, -50%) scale(1.8);
            opacity: 0;
        }

        .inner-circle {
            position: absolute;
            width: 198px;
            height: 198px;
            border-radius: 50%;
            background: #111111;
            opacity: 1;
            z-index: 1;
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }

        .loading-galaxy-mask {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            opacity: 0;
            transition: opacity 2s ease-out 1.2s;
            background:
                radial-gradient(circle at 50% 45%,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.03) 28%,
                    rgba(0, 0, 0, 0) 62%),
                radial-gradient(circle at 50% 50%,
                    rgba(8, 16, 30, 0.1) 0%,
                    rgba(0, 0, 0, 0.28) 72%,
                    rgba(0, 0, 0, 0.6) 100%);
        }

        .loading-galaxy-mask::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 50%,
                    rgba(255, 255, 255, 0) 56%,
                    rgba(0, 0, 0, 0.18) 75%,
                    rgba(0, 0, 0, 0.5) 100%);
            box-shadow:
                inset 0 0 18px rgba(0, 0, 0, 0.72),
                inset 0 0 36px rgba(0, 170, 255, 0.08);
        }

        #loading-overlay.is-visible .loading-galaxy-mask {
            opacity: 1;
        }

        #loadingGalaxyCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .text-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 225px;
            height: 225px;
            transform: translate(-50%, -50%);
        }

        .orbit-letter {
            position: absolute;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .orbit-letter.positioned {
            opacity: 1;
        }

        @keyframes orbit {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(-360deg);
            }
        }

        .loading-text {
            position: fixed;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            user-select: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 1.5s ease-out 0.4s;
        }

        .loading-text-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .loading-stage {
            font-size: 12px;
            font-weight: 400;
            color: rgba(0, 255, 204, 0.72);
            letter-spacing: 3px;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
        }

        #loading-overlay.is-visible .loading-text {
            opacity: 1;
        }

        .loading-label {
            font-size: 26px;
            font-weight: 400;
            color: #00ffcc;
            text-shadow: 2.4px 0 #ff00c1, -2.4px 0 #00ffcc;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .loading-percent {
            font-size: 26px;
            font-weight: 500;
            color: #00ffcc;
            text-shadow: 2.4px 0 #ff00c1, -2.4px 0 #00ffcc;
            width: 65px;
            text-align: right;
            transition: none;
        }

        .loading-label.glitch,
        .loading-percent.glitch,
        .progress-ring.glitch {
            animation: glitchEffect 0.12s ease-in-out infinite !important;
        }

        @keyframes glitchEffect {
            0% {
                transform: translate(0);
                text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            }

            15% {
                transform: translate(-1.5px, 0.5px);
                text-shadow: 2.4px 0 #ff00c1, -2.4px 0 #00ffcc;
            }

            30% {
                transform: translate(1.5px, -0.5px);
                text-shadow: -2.4px 0 #ff00c1, 2.4px 0 #00ffcc;
            }

            45% {
                transform: translate(-0.5px, 1px);
                text-shadow: 1.6px 0 #00ffcc, -1.6px 0 #ff00c1;
            }

            60% {
                transform: translate(0.5px, -1px);
                text-shadow: -1.6px 0 #ff00c1, 1.6px 0 #00ffcc;
            }

            75% {
                transform: translate(-1px, 0.5px);
                text-shadow: 2.4px 0 #00ffcc, -0.8px 0 #ff00c1;
            }

            90% {
                transform: translate(1px, -0.5px);
                text-shadow: -2.4px 0 #ff00c1, 0.8px 0 #00ffcc;
            }

            100% {
                transform: translate(0);
                text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            }
        }

        @media (max-width: 768px) {
            .loading-text {
                transform: translateX(-50%) scale(0.7);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #loading-overlay .intro-circle,
            #loading-overlay .loading-text,
            #loading-overlay .loading-galaxy-mask {
                opacity: 1;
                transition: none;
            }
        }

        .progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        .progress-ring-bg {
            opacity: 0.6;
        }

        .progress-ring-fill {
            filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.4));
            transition: stroke-dashoffset 0.3s ease;
        }

        .progress-ring.glitch {
            animation: ringGlitch 0.12s ease-in-out infinite !important;
        }

        @keyframes ringGlitch {
            0% {
                filter: none;
            }

            15% {
                filter: drop-shadow(2.4px 0 #ff00c1) drop-shadow(-2.4px 0 #00ffcc);
            }

            30% {
                filter: drop-shadow(-2.4px 0 #ff00c1) drop-shadow(2.4px 0 #00ffcc);
            }

            45% {
                filter: drop-shadow(1.6px 0 #00ffcc) drop-shadow(-1.6px 0 #ff00c1);
            }

            60% {
                filter: drop-shadow(-1.6px 0 #ff00c1) drop-shadow(1.6px 0 #00ffcc);
            }

            75% {
                filter: drop-shadow(2.4px 0 #00ffcc) drop-shadow(-0.8px 0 #ff00c1);
            }

            90% {
                filter: drop-shadow(-2.4px 0 #ff00c1) drop-shadow(0.8px 0 #00ffcc);
            }

            100% {
                filter: none;
            }
        }

        /* ── LOG Panel ── */
        #log-panel {
            position: fixed;
            bottom: 56px;
            left: 20px;
            width: 400px;
            max-width: calc(100vw - 40px);
            z-index: 5;
            pointer-events: auto;
            font-family: 'Space Mono', monospace;
            max-height: calc(100vh - 126px);
            max-height: calc(100dvh - 126px);
            overflow: hidden;
        }

        .log-frame {
            position: relative;
            border: 1px solid rgba(0, 255, 204, 0.5);
            background: rgba(2, 4, 12, 0.82);
            backdrop-filter: blur(6px);
            min-width: 0;
            max-width: 400px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease;
        }

        #log-panel.is-open .log-frame {
            max-height: calc(100vh - 126px);
            max-height: calc(100dvh - 126px);
        }

        .log-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(0, 255, 204, 0.08);
            margin: 3px;
            pointer-events: none;
        }

        /* Corner decorations */
        .log-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            pointer-events: none;
        }

        .log-corner-tl {
            top: -1px;
            left: -1px;
            border-top: 2px solid #00ffcc;
            border-left: 2px solid #00ffcc;
        }

        .log-corner-tr {
            top: -1px;
            right: -1px;
            border-top: 2px solid #00ffcc;
            border-right: 2px solid #00ffcc;
        }

        .log-corner-bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 2px solid #00ffcc;
            border-left: 2px solid #00ffcc;
        }

        .log-corner-br {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid #00ffcc;
            border-right: 2px solid #00ffcc;
        }

        /* Scan line overlay */
        .log-scanline {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 204, 0.015) 2px,
                    rgba(0, 255, 204, 0.015) 4px);
            pointer-events: none;
            z-index: 1;
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 255, 204, 0.25);
            user-select: none;
            position: relative;
            z-index: 2;
        }

        .log-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }

        .log-chevron {
            font-size: 12px;
            color: #00ffcc;
            transition: transform 0.3s ease;
            transform: rotate(0deg);
        }

        .log-chevron.open {
            transform: rotate(180deg);
        }

        .log-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .log-frame .log-body {
            padding: 0 14px;
        }

        #log-panel.is-open .log-body {
            max-height: calc(100vh - 165px);
            max-height: calc(100dvh - 165px);
            padding: 8px 14px 12px;
            overflow-y: auto;
        }

        window.vue = new Vue({

                Recommend_Hierarchy() {
                    const parts = [this.Recommend_Category];
                    if (this.Recommend_Subcategory && this.Recommend_Subcategory !== 'Top') {
                        parts.push(this.Recommend_Subcategory);
                    }
                    return parts.join(' > ');
                },
                Reselect_Recommend() {
                    const data = this.Page_Data;
                    if (!data) return;
                    const categories = Object.keys(data);
                    if (!categories.length) return;

                    const lastCategory = localStorage.getItem('RECOMMEND_LAST_CATEGORY') || '';
                    let categoryPool = categories.filter(c => c !== lastCategory);
                    if (!categoryPool.length) categoryPool = categories;
                    const category = categoryPool[Math.floor(Math.random() * categoryPool.length)];

                    const subcategories = Object.keys(data[category]);
                    const lastSubcategory = localStorage.getItem('RECOMMEND_LAST_SUBCATEGORY') || '';
                    let subPool = subcategories.filter(s => s !== lastSubcategory);
                    if (!subPool.length) subPool = subcategories;
                    const subcategory = subPool[Math.floor(Math.random() * subPool.length)];

                    const pages = data[category][subcategory];
                    const lastUrl = localStorage.getItem('RECOMMEND_LAST_URL') || '';
                    let index = Math.floor(Math.random() * pages.length);
                    if (pages.length > 1 && pages[index].url === lastUrl) {
                        index = (index + 1) % pages.length;
                    }

                    this.Recommend_Category = category;
                    this.Recommend_Subcategory = subcategory;
                    this.Recommend = pages[index];

                    localStorage.setItem('RECOMMEND_LAST_CATEGORY', category);
                    localStorage.setItem('RECOMMEND_LAST_SUBCATEGORY', subcategory);
                    localStorage.setItem('RECOMMEND_LAST_URL', pages[index].url);

                    this.Freeze_Recommend_Image();
                },
                Freeze_Recommend_Image() {
                    const container = document.getElementById('recommend-capturer');
                    if (!container || !this.Recommend || !window.html2canvas) return;
                    container.innerHTML = '';
                    this.Recommend_Image = null;

                    const frame = document.createElement('iframe');
                    frame.style.cssText = 'width:390px;height:844px;border:0;';
                    frame.src = this.Recommend.url;
                    let captured = false;
                    const capture = () => {
                        if (captured) return;
                        captured = true;
                        let doc = null;
                        try {
                            doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
                        } catch (e) {
                            doc = null;
                        }
                        if (!doc || !doc.body) {

        const realLoading = (() => {
            const stages = [
                { key: 'libraries', weight: 30, label: 'Loading libraries' },
                { key: 'log', weight: 15, label: 'Loading logs' },
                { key: 'page', weight: 15, label: 'Loading page data' },
                { key: 'window', weight: 20, label: 'Loading assets' },
                { key: 'render', weight: 20, label: 'Rendering scene' }
            ];
            const totalWeight = stages.reduce((sum, s) => sum + s.weight, 0);
            const done = new Set();
            const listeners = [];
            let progress = 0;

            const cumulativeWeight = () =>
                stages.reduce((sum, s) => (done.has(s.key) ? sum + s.weight : sum), 0);

            const complete = (key) => {
                if (done.has(key)) return;
                done.add(key);
                progress = Math.min((cumulativeWeight() / totalWeight) * 100, 100);
                listeners.forEach(fn => fn(progress));
            };

            return {
                stages,
                stagePercents: stages.map((s, i) =>
                    (stages.slice(0, i + 1).reduce((sum, x) => sum + x.weight, 0) / totalWeight) * 100),
                get value() { return progress; },
                get doneCount() { return done.size; },
                isDone() { return done.size >= stages.length; },
                isComplete(key) { return done.has(key); },
                complete,
                onProgress(fn) { listeners.push(fn); }
            };
        })();

        // 散光星雲用テクスチャ生成（fBm値ノイズ）
        function createEmissionNebulaTexture(seed) {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(size, size);
            const data = imageData.data;

            let s = seed || 1;
            function rand() {
                s |= 0; s = (s + 0x6D2B79F5) | 0;
                let t = Math.imul(s ^ (s >>> 15), 1 | s);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }

            const perm = new Uint8Array(512);
            const p = new Uint8Array(256);
            for (let i = 0; i < 256; i++) p[i] = i;
            for (let i = 255; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
            }
            for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

            function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            function lerp(a, b, t) { return a + (b - a) * t; }
            function grad(h, x, y) {
                const hh = h & 7;
                const u = hh < 4 ? x : y;
                const v = hh < 4 ? y : x;
                return ((hh & 1) ? -u : u) + ((hh & 2) ? -2 * v : 2 * v);
            }
            function noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = fade(x);
                const v = fade(y);
                const A = perm[X] + Y;
                const B = perm[X + 1] + Y;
                return lerp(
                    lerp(grad(perm[A], x, y), grad(perm[B], x - 1, y), u),
                    lerp(grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1), u),
                    v
                );
            }
            function fbm(x, y) {
                let value = 0;
                let amp = 0.5;
                let freq = 1;
                for (let o = 0; o < 4; o++) {
                    value += amp * noise(x * freq, y * freq);
                    amp *= 0.5;
                    freq *= 2;
                }
                return value;
            }

            const offX = rand() * 100;
            const offY = rand() * 100;
            const mixBias = 0.1 + rand() * 0.35;

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const nx = (x / size) * 2 - 1;
                    const ny = (y / size) * 2 - 1;
                    const dist = Math.sqrt(nx * nx + ny * ny);
                    const falloff = Math.max(0, 1 - Math.max(0, (dist - 0.15) / 0.85));
                    const falloffSoft = falloff * falloff * (3 - 2 * falloff);

                    const n = fbm(nx * 1.5 + offX, ny * 1.5 + offY);
                    const n2 = fbm(nx * 3.2 + offX * 2, ny * 3.2 + offY * 2);
                    const n3 = fbm(nx * 6.5 - offX, ny * 6.5 - offY);

                    const density = Math.max(0, n * 0.75 + 0.25);
                    const density2 = Math.max(0, n2 * 0.6 + 0.4);

                    let alpha = Math.pow(density, 1.6) * falloffSoft;
                    alpha = Math.min(1, alpha);

                    const mixT = Math.max(0, Math.min(1, (n3 + n2) * 0.35 + 0.35 + mixBias));

                    // シードごとに青白緑のトーンを変えて単調さを防ぐ
                    const coolPalettes = [
                        [80, 200, 255],   // シアン
                        [110, 175, 255],  // 青
                        [60, 225, 175]    // 青緑
                    ];
                    const pal = coolPalettes[Math.floor(rand() * coolPalettes.length)];
                    const coolR = lerp(pal[0] * 0.7, pal[0], mixT);
                    const coolG = lerp(pal[1] * 0.85, pal[1], mixT);
                    const coolB = lerp(pal[2] * 0.9, pal[2], mixT);

                    // 中心ほど淡い黄（星の光）に寄せ、外縁は青白緑のリアルな配色
                    const warmT = Math.max(0, Math.min(1, (1 - dist) * 1.15));
                    let r = lerp(coolR, 255, warmT * 0.7);
                    let g = lerp(coolG, 232, warmT * 0.7);
                    let b = lerp(coolB, 185, warmT * 0.7);

                    // 彩度を引き上げて低Opacityでも色をはっきり出す
                    const luma = r * 0.299 + g * 0.587 + b * 0.114;
                    const sat = 1.4;
                    r = Math.max(0, luma + (r - luma) * sat);
                    g = Math.max(0, luma + (g - luma) * sat);
                    b = Math.max(0, luma + (b - luma) * sat);
                    const bright = 0.85 + density2 * 0.3;

                    const idx = (y * size + x) * 4;
                    data[idx] = Math.min(255, r * bright);
                    data[idx + 1] = Math.min(255, g * bright);
                    data[idx + 2] = Math.min(255, b * bright);
                    data[idx + 3] = alpha * 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            return new THREE.CanvasTexture(canvas);
        }

            function noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = fade(x);
                const v = fade(y);
                const A = perm[X] + Y;
                const B = perm[X + 1] + Y;
                return lerp(
                    lerp(grad(perm[A], x, y), grad(perm[B], x - 1, y), u),
                    lerp(grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1), u),
                    v
                );
            }
            function fbm(x, y) {
                let value = 0;
                let amp = 0.5;
                let freq = 1;
                for (let o = 0; o < 5; o++) {
                    value += amp * noise(x * freq, y * freq);
                    amp *= 0.5;
                    freq *= 2;
                }
                return value;
            }

            const offX = rand() * 100;
            const offY = rand() * 100;

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const nx = (x / size) * 2 - 1;
                    const ny = (y / size) * 2 - 1;
                    const dist = Math.sqrt(nx * nx + ny * ny);
                    const falloff = Math.max(0, 1 - Math.max(0, (dist - 0.05) / 0.95));
                    const falloffSoft = falloff * falloff * (3 - 2 * falloff);

                    // 中央は丸くグラデーションで星雲を消す（ブラックホール領域を空ける）
                    // holeRadius が 0 以下の場合は穴を作らず、中央まで全面を色付きにする
                    const holeRadius = holeRadiusParam !== undefined ? holeRadiusParam : 0.02;
                    const holeFeather = 0.18;
                    const holeMaskRaw = holeRadius > 0
                        ? Math.max(0, Math.min(1, (dist - holeRadius) / holeFeather))
                        : 1;
                    const holeMask = holeMaskRaw;
                    const holeSmooth = holeMask * holeMask * (3 - 2 * holeMask);

                    const n = fbm(nx * 0.9 + offX, ny * 0.9 + offY);
                    const n2 = fbm(nx * 2.1 + offX * 2, ny * 2.1 + offY * 2);

                    const density = Math.max(0, n * 0.65 + 0.45);
                    let alpha = Math.pow(density, 1.3) * falloffSoft * holeSmooth;
                    alpha = Math.min(1, alpha);

                    const mixT = Math.max(0, Math.min(1, (n2 + n) * 0.3 + 0.5));

                    // 中央ほど濃い黄、外縁は青白緑のリアルな配色
                    const warmT = Math.max(0, Math.min(1, (1 - dist) * 1.5));
                    const coolR = lerp(185, 220, mixT);
                    const coolG = lerp(225, 250, mixT);
                    const coolB = lerp(235, 255, mixT);
                    let r = lerp(coolR, 255, warmT * 0.9);
                    let g = lerp(coolG, 215, warmT * 0.9);
                    let b = lerp(coolB, 115, warmT * 0.9);

                    // 彩度を引き上げて低Opacityでも色をはっきり出す
                    const luma = r * 0.299 + g * 0.587 + b * 0.114;
                    const sat = 1.35;
                    r = Math.max(0, luma + (r - luma) * sat);
                    g = Math.max(0, luma + (g - luma) * sat);
                    b = Math.max(0, luma + (b - luma) * sat);

                    const idx = (y * size + x) * 4;
                    data[idx] = r;
                    data[idx + 1] = g;
                    data[idx + 2] = b;
                    data[idx + 3] = alpha * 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            return new THREE.CanvasTexture(canvas);
        }

        // ── 共有：銀河全体を覆う円盤（xz平面に寝かせた1枚板） ── ローディング中とメイン画面の両方で使用
        function createGalaxyDiskMesh(parent, opts) {
            opts = opts || {};
            const size = opts.size || 420;
            const opacity = opts.opacity || 0.3;
            const tex = createGalaxyDiskTexture(opts.seed || 7, opts.holeRadius);
            const geometry = new THREE.PlaneGeometry(size, size);
            const material = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                opacity: opacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                fog: false,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = opts.y || 0;
            mesh.renderOrder = opts.renderOrder || 1;
            parent.add(mesh);
            return mesh;
        }

        // 散光星雲スプライトを銀河円盤内に満遍なく配置（腕沿い＋円盤全体）
        const emissionNebulaConfig = {
            minR: 20,
            maxR: 220,
            sizeMin: 10,
            sizeMax: 30,
            opacityBase: 0.1,
            opacityVar: 0.1,
            uniformRatio: 0.1
        };
        function createEmissionNebulaSprites(parent, textures, armConfig, diskSpread, count) {
            const cfg = emissionNebulaConfig;
            const minR = cfg.minR;
            const maxR = cfg.maxR;
            const sizeMin = cfg.sizeMin;
            const sizeMax = cfg.sizeMax;
            const opacityBase = cfg.opacityBase;
            const opacityVar = cfg.opacityVar;
            const uniformRatio = cfg.uniformRatio;
            for (let i = 0; i < count; i++) {
                let radius, angle;
                if (Math.random() < uniformRatio) {
                    // 円盤全体に均等配置（半径方向は線形で満遍なく）
                    radius = minR + (maxR - minR) * Math.random();
                    angle = Math.random() * Math.PI * 2;
                } else {
                    // 渦巻腕に沿って配置
                    const isMain = Math.random() < armConfig[0].weight;
                    const cfg = isMain ? armConfig[0] : armConfig[1];
                    const armIdx = Math.floor(Math.random() * cfg.armCount);
                    const baseAngle = (Math.PI * 2 * armIdx) / cfg.armCount;
                    radius = minR + Math.pow(Math.random(), 0.65) * (maxR - minR);
                    const armAngle = radius * cfg.twist;
                    const scatter = (cfg.scatterBase + cfg.scatterGrowth * radius) * 0.5;
                    angle = baseAngle + armAngle + (Math.random() - 0.5) * scatter;
                }
                const tex = textures[Math.floor(Math.random() * textures.length)];

                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: tex,
                    transparent: true,
                    opacity: opacityBase + Math.random() * opacityVar,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                }));
                let size = sizeMin + Math.random() * (sizeMax - sizeMin);
                sprite.position.set(
                    Math.cos(angle) * radius + (Math.random() - 0.5) * (diskSpread * 0.4),
                    (Math.random() - 0.5) * (diskSpread * 0.1),
                    Math.sin(angle) * radius + (Math.random() - 0.5) * (diskSpread * 0.4)
                );
                sprite.scale.set(size, size, 1);
                parent.add(sprite);
            }
        }

        const deferScripts = document.querySelectorAll('script[defer]');
        let deferScriptsLeft = deferScripts.length;
        if (deferScriptsLeft === 0) {
            realLoading.complete('libraries');
        } else {
            const onDeferDone = () => {
                deferScriptsLeft -= 1;
                if (deferScriptsLeft <= 0) realLoading.complete('libraries');
            };
            deferScripts.forEach((s) => {
                s.addEventListener('load', onDeferDone, { once: true });
                s.addEventListener('error', onDeferDone, { once: true });
            });
        }

        window.addEventListener('load', () => realLoading.complete('window'));

        fetch('../../Asset/Data/Log.json')
            .then(r => r.json())
            .then(data => { window.vue.LogEntries = data; realLoading.complete('log'); })
            .catch(() => { realLoading.complete('log'); });

        fetch('../../Asset/Data/Page.json')
            .then(r => r.json())
            .then(data => {
                window.vue.Page_Data = data;
                window.vue.Reselect_Recommend();
                realLoading.complete('page');
            })
            .catch(() => { realLoading.complete('page'); });

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('loading-overlay');
            const loadingRing = document.getElementById('loadingRing');
            const loadingPercent = document.getElementById('loadingPercent');
            const loadingLabel = document.querySelector('.loading-label');
            const progressRing = document.querySelector('.progress-ring');
            const menuGuide = document.getElementById('menu-guide');
            const loadingGalaxyCanvas = document.getElementById('loadingGalaxyCanvas');

            const orbitContainer = document.querySelector('.text-orbit');
            const introCircle = document.querySelector('.intro-circle');
            const innerCircle = document.querySelector('.inner-circle');
            let menuGuideDismissed = false;
            let destroyLoadingGalaxy = null;
            let orbitLetters = null;
            let orbitAngle = 0;
            let exploded = false;
            let beginAfterGalaxy = null;
            let progress = 0;

            // ── ローディング用：ローディング画面の天の川銀河を生成 ──
            // opts.holeRadius で中央のブラックホール幅（星雲中心幅）を指定できる
            const setupLoadingGalaxy = (canvas, opts) => {
                if (!canvas || !window.THREE) return null;
                opts = opts || {};

                const renderer = new THREE.WebGLRenderer({
                    canvas,
                    antialias: true,

                const galaxyGroup = new THREE.Group();
                scene.add(galaxyGroup);

                const ambientLight = new THREE.AmbientLight(0xa8bfff, 0.05);
                scene.add(ambientLight);

                function createLoadingParticleTexture() {
                    const s = 32;
                    const c = document.createElement('canvas');
                    c.width = c.height = s;
                    const ctx = c.getContext('2d');
                    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
                    g.addColorStop(0, 'rgba(255,255,255,1)');
                    g.addColorStop(0.3, 'rgba(255,255,255,0.85)');
                    g.addColorStop(0.6, 'rgba(255,255,255,0.2)');
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, s, s);
                    return new THREE.CanvasTexture(c);
                }
                const loadingParticleTex = createLoadingParticleTexture();

                // ── ローディング用：ローディング中天の川銀河（渦巻銀河） ── ローディング後に表示する銀河と同じ計算式
                // 以下の milkyWayTotal / armConfig / diskSpread / starSizeGroups はローディング用の専用設定
                const milkyWayTotal = 5000;
                const armConfig = [
                    { armCount: 2, weight: 0.65, twist: 0.045, scatterBase: 0.4, scatterGrowth: 0.008 },
                    { armCount: 2, weight: 0.35, twist: 0.030, scatterBase: 0.6, scatterGrowth: 0.012 },
                ];
                const diskSpread = 10;
                const starSizeGroups = [
                    { ratio: 0.40, size: 0.18, opacity: 1.0 },
                    { ratio: 0.30, size: 0.35, opacity: 1.0 },
                    { ratio: 0.18, size: 0.6, opacity: 1.0 },
                    { ratio: 0.09, size: 1.0, opacity: 1.0 },
                    { ratio: 0.03, size: 2.0, opacity: 1.0 },
                ];

                for (let g = 0; g < starSizeGroups.length; g++) {
                    const group = starSizeGroups[g];
                    const count = Math.floor(milkyWayTotal * group.ratio);
                    if (count < 5) continue;
                    const positions = new Float32Array(count * 3);
                    const colors = new Float32Array(count * 3);

                    for (let i = 0; i < count; i++) {
                        const isMain = Math.random() < armConfig[0].weight;
                        const cfg = isMain ? armConfig[0] : armConfig[1];
                        const armIdx = Math.floor(Math.random() * cfg.armCount);
                        const baseAngle = (Math.PI * 2 * armIdx) / cfg.armCount;

                        const radius = 10 + Math.pow(Math.random(), 0.65) * 190;
                        const armAngle = radius * cfg.twist;
                        const scatter = cfg.scatterBase + cfg.scatterGrowth * radius;
                        const angle = baseAngle + armAngle + (Math.random() - 0.5) * scatter;

                        const x = Math.cos(angle) * radius + (Math.random() - 0.5) * diskSpread;
                        const y = (Math.random() - 0.5) * (diskSpread * 0.3);
                        const z = Math.sin(angle) * radius + (Math.random() - 0.5) * diskSpread;

                        let color;
                        const t = radius / 200;
                        const isOrangeSpot = Math.random() < 0.18;
                        if (isOrangeSpot) {
                            color = new THREE.Color().setHSL(0.07 + Math.random() * 0.06, 0.5 + Math.random() * 0.3, 0.6 + Math.random() * 0.3);
                        } else if (t < 0.18) {
                            color = new THREE.Color().setHSL(0.07 + Math.random() * 0.05, 0.5 + Math.random() * 0.3, 0.6 + Math.random() * 0.25);
                        } else {
                            color = new THREE.Color().setHSL(0.58 + Math.random() * 0.07, 0.15 + Math.random() * 0.2, 0.85 + Math.random() * 0.15);
                        }

                        positions[i * 3] = x;
                        positions[i * 3 + 1] = y;
                        positions[i * 3 + 2] = z;
                        colors[i * 3] = color.r;
                        colors[i * 3 + 1] = color.g;
                        colors[i * 3 + 2] = color.b;
                    }

                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    const material = new THREE.PointsMaterial({
                        map: loadingParticleTex,
                        vertexColors: true,
                        size: group.size,
                        transparent: true,
                        opacity: group.opacity,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        sizeAttenuation: true
                    });
                    galaxyGroup.add(new THREE.Points(geometry, material));
                }

                const coreCount = 420;
                const corePositions = new Float32Array(coreCount * 3);
                const coreColors = new Float32Array(coreCount * 3);
                for (let i = 0; i < coreCount; i++) {
                    const radius = Math.pow(Math.random(), 1.9) * 3.4;
                    const angle = Math.random() * Math.PI * 2;
                    corePositions[i * 3] = Math.cos(angle) * radius;
                    corePositions[i * 3 + 1] = (Math.random() - 0.5) * 0.08;
                    corePositions[i * 3 + 2] = Math.sin(angle) * radius;

                    const color = new THREE.Color().setHSL(0.08 + Math.random() * 0.04, 0.5 + Math.random() * 0.3, 0.7 + Math.random() * 0.25);
                    coreColors[i * 3] = color.r;
                    coreColors[i * 3 + 1] = color.g;
                    coreColors[i * 3 + 2] = color.b;
                }
                const coreGeometry = new THREE.BufferGeometry();
                coreGeometry.setAttribute('position', new THREE.BufferAttribute(corePositions, 3));
                coreGeometry.setAttribute('color', new THREE.BufferAttribute(coreColors, 3));
                const coreMaterial = new THREE.PointsMaterial({
                    size: 0.52,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.09,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });
                const core = new THREE.Points(coreGeometry, coreMaterial);
                galaxyGroup.add(core);

                // ── ローディング用：中央のブラックホールは描かない
                const blackholeRadius = 4.5;
                const blackholeSphere = new THREE.Mesh(
                    new THREE.SphereGeometry(blackholeRadius, 48, 48),
                    new THREE.MeshBasicMaterial({ color: 0x000000 })
                );
                blackholeSphere.position.set(0, 0, 0);
                galaxyGroup.add(blackholeSphere);

                // ── ローディング用：銀河全体を覆う円盤（xz平面の1枚板）
                createGalaxyDiskMesh(galaxyGroup, {
                    size: 700,
                    opacity: 0.25,
                    seed: 7,
                    y: 0,
                    holeRadius: opts.holeRadius !== undefined ? opts.holeRadius : 0.02
                });

                let rafId = 0;
                let active = true;
                const clock = new THREE.Clock();

                const resize = () => {
                    const size = canvas.parentElement?.clientWidth || 198;
                    renderer.setSize(size, size, false);
                    camera.aspect = 1;
                    camera.updateProjectionMatrix();
                };

                const animateGalaxy = () => {
                    if (!active) return;
                    rafId = requestAnimationFrame(animateGalaxy);
                    const delta = clock.getDelta();
                    const elapsed = clock.elapsedTime;
                    const galaxySpeed = 0.08;
                    galaxyGroup.rotation.y += delta * galaxySpeed;
                    galaxyGroup.rotation.x = 0;
                    core.material.opacity = 0.085 + Math.sin(elapsed * 1.8) * 0.006;
                    renderer.render(scene, camera);
                };

                resize();
                animateGalaxy();
                window.addEventListener('resize', resize);

                return () => {
                    active = false;
                    cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', resize);
                    galaxyGroup.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                    renderer.dispose();
                };
            };

            // ── ローディング用：ローディング画面の銀河アニメーション開始 ──
            // { holeRadius: 0 } にするとロード中の銀河の色付き円盤は中央（ブラックホール付近）まで全て色付きになる
            destroyLoadingGalaxy = setupLoadingGalaxy(loadingGalaxyCanvas, { holeRadius: 0 });

            // ローディングバー／％は各段階の完了に合わせて即座に進行を開始する
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (overlay) overlay.classList.add('is-visible');
                    if (beginAfterGalaxy) beginAfterGalaxy();
                });
            });

            const findMenuButton = () => {
                const buttons = Array.from(document.querySelectorAll('#App .v-system-bar .v-btn'));
                return buttons.find((button) => button.textContent.trim() === 'MENU') || null;
            };

            const updateMenuGuidePosition = () => {
                if (!menuGuide || menuGuideDismissed) return;

                const menuButton = findMenuButton();
                if (!menuButton) return;

                const rect = menuButton.getBoundingClientRect();
                menuGuide.style.setProperty('--menu-guide-x', `${rect.left + rect.width / 2}px`);
                menuGuide.style.setProperty('--menu-guide-y', `${rect.top + rect.height / 2}px`);
                menuGuide.style.setProperty('--menu-guide-width', `${rect.width + 10}px`);
                menuGuide.style.setProperty('--menu-guide-height', `${rect.height + 8}px`);
            };

            const hideMenuGuide = () => {
                if (!menuGuide || menuGuideDismissed) return;
                menuGuideDismissed = true;
                menuGuide.classList.remove('is-visible');
                menuGuide.classList.add('is-hidden');
            };

            const tryBindMenuGuide = () => {
                const menuButton = findMenuButton();
                if (!menuButton) {
                    requestAnimationFrame(tryBindMenuGuide);
                    return;
                }

                updateMenuGuidePosition();
                menuGuide.classList.add('is-visible');
                menuButton.addEventListener('click', hideMenuGuide, { once: true });
            };

            if (orbitContainer) {
                const letters = orbitContainer.querySelectorAll('.orbit-letter');
                const letterCount = letters.length;
                const radius = 112.5;
                const angleStep = 360 / letterCount;

                orbitLetters = letters;

                letters.forEach((letter, index) => {
                    const angleDeg = index * angleStep - 90;
                    const angleRad = angleDeg * (Math.PI / 180);

                    const x = radius * Math.cos(angleRad);
                    const y = radius * Math.sin(angleRad);

                    letter.style.left = `calc(50% + ${x}px)`;
                    letter.style.top = `calc(50% + ${y}px)`;

                    letter.style.transform = `translate(-50%, -50%) rotate(${index * angleStep}deg)`;

                    letter.dataset.angle = angleRad;
                    letter.dataset.index = index;

                    setTimeout(() => {
                        letter.classList.add('positioned');
                    }, index * 50);
                });
            }
            if (overlay && loadingRing) {
                // ── ローディングリング：円に沿って正弦波状に波打つパスを生成 ──
                const RING_CENTER = 140;
                const RING_RADIUS = 146;
                const WAVE_COUNT = 8;
                const WAVE_AMPLITUDE = 12;
                const WAVE_STEPS = 720;
                let ringPathData = '';
                for (let i = 0; i <= WAVE_STEPS; i++) {
                    const t = (i / WAVE_STEPS) * Math.PI * 2;
                    const r = RING_RADIUS + WAVE_AMPLITUDE * Math.sin(WAVE_COUNT * t);
                    const x = RING_CENTER + r * Math.cos(t);
                    const y = RING_CENTER + r * Math.sin(t);
                    ringPathData += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
                    if (i !== WAVE_STEPS) ringPathData += ' ';
                }
                loadingRing.setAttribute('d', ringPathData);
                const loadingRingBg = document.getElementById('loadingRingBg');
                if (loadingRingBg) loadingRingBg.setAttribute('d', ringPathData);
                const circumference = loadingRing.getTotalLength();
                loadingRing.style.transition = 'none';
                loadingRing.style.strokeDasharray = circumference;
                loadingRing.style.strokeDashoffset = circumference;
                void loadingRing.getBoundingClientRect();
                loadingRing.style.transition = '';
                const MIN_DURATION = 3200;
                const MAX_DURATION = 15000;
                const STAGE_STEP_MS = 600;
                const ORBIT_SPEED = 2;
                const loadingStage = document.getElementById('loadingStage');
                const totalStages = realLoading.stages.length;
                let startTime = performance.now();
                let shownStages = 0;
                let lastStepTime = 0;
                let progressTimer = null;
                let pendingFinish = false;
                let cleanupDone = false;

                const cleanupOverlay = () => {
                    if (cleanupDone) return;
                    cleanupDone = true;
                    if (destroyLoadingGalaxy) {
                        destroyLoadingGalaxy();
                        destroyLoadingGalaxy = null;
                    }
                    overlay.remove();
                    if (window.__revealScene) window.__revealScene();
                    setTimeout(() => {
                        window.vue.Ready_Page = true;
                    }, 100);
                    tryBindMenuGuide();
                };

                const tickProgress = () => {
                    const now = performance.now();
                    const elapsed = now - startTime;

                    // 完了した段階へ、最低間隔を空けながらバーを合わせる
                    if (shownStages < realLoading.doneCount && (now - lastStepTime >= STAGE_STEP_MS)) {
                        shownStages += 1;
                        lastStepTime = now;
                    }
                    progress = shownStages > 0 ? realLoading.stagePercents[shownStages - 1] : 0;
                    if (progress >= 100) progress = 100;

                    const offset = circumference * (1 - progress / 100);
                    loadingRing.style.strokeDashoffset = offset;
                    if (loadingPercent) {
                        loadingPercent.textContent = Math.round(progress) + '%';
                        loadingPercent.classList.remove('glitch');
                        void loadingPercent.offsetWidth;
                        loadingPercent.classList.add('glitch');
                    }
                    if (loadingLabel) {
                        loadingLabel.classList.remove('glitch');
                        void loadingLabel.offsetWidth;
                        loadingLabel.classList.add('glitch');
                    }
                    if (loadingStage) {
                        const current = realLoading.stages[shownStages];
                        loadingStage.textContent = current ? current.label : 'Ready';
                    }
                    if (progressRing) {
                        progressRing.classList.remove('glitch');
                        void progressRing.getBoundingClientRect();
                        progressRing.classList.add('glitch');
                    }

                    const normalized = progress / 100;
                    if (innerCircle) {
                        const glow = normalized * 15;
                        innerCircle.style.boxShadow = `0 0 ${glow}px rgba(0,100,150,${0.2 + normalized * 0.5})`;
                    }

                    if (shownStages >= totalStages && elapsed >= MIN_DURATION) {
                        clearInterval(progressTimer);
                        pendingFinish = true;
                        overlay.classList.add('fade-out');
                        if (loadingPercent) loadingPercent.classList.add('glitch');
                        if (loadingLabel) loadingLabel.classList.add('glitch');
                        if (progressRing) progressRing.classList.add('glitch');
                        setTimeout(cleanupOverlay, 2000);
                    } else if (elapsed >= MAX_DURATION && !pendingFinish) {
                        clearInterval(progressTimer);
                        pendingFinish = true;
                        overlay.classList.add('fade-out');
                        setTimeout(cleanupOverlay, 2000);
                    }
                };

                beginAfterGalaxy = () => {
                    startTime = performance.now();
                    progress = 0;
                    shownStages = 0;
                    lastStepTime = startTime;
                    progressTimer = setInterval(tickProgress, 50);
                };

                let lastRafTime = 0;

            // 茶系（落ち葉）

        function createLeafTexture(variant) {

            const shapes = [

                { halfW: 0.25, serr: 15, depth: 0.06, widen: 0.90, tip: 4 }, // 細葉
                { halfW: 0.39, serr: 8, depth: 0.07, widen: 0.80, tip: 4 },  // 丸葉
            ];
            const sh = shapes[variant % shapes.length];

            const cx = S * 0.5;
            const topY = S * 0.06;
            const botY = S * 0.96;
            const len = botY - topY;
            const N = 72;

            // 右半分の輪郭（t: 0=付け根 → 1=先端）。中央が最も広く、鋸歯と尖った先端を加える。
            const right = [];
            for (let i = 0; i <= N; i++) {
                const t = i / N;
                const y = botY - t * len;
                let w = sh.halfW * S * Math.pow(Math.sin(Math.PI * Math.pow(t, sh.widen)), 0.85);
                w *= 1 + sh.depth * Math.sin(t * sh.serr * Math.PI * 2); // 鋸歯
                w *= 1 - 0.55 * Math.pow(t, sh.tip);                     // 先端を尖らせる
                right.push([cx + Math.max(0.5, w), y]);
            }

            const buildPath = () => {
                ctx.beginPath();
                ctx.moveTo(cx, botY);
                for (const p of right) ctx.lineTo(p[0], p[1]);
                for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(cx - (right[i][0] - cx), right[i][1]);
                ctx.closePath();
            };

            // 葉身の内側だけをクリップして、陰影・ムラ・葉脈を描く

            buildPath();
            ctx.clip();

            const grad = ctx.createRadialGradient(cx, S * 0.42, S * 0.05, cx, S * 0.5, S * 0.62);
            grad.addColorStop(0, 'rgb(255,255,255)');
            grad.addColorStop(0.62, 'rgb(233,233,233)');
            grad.addColorStop(1, 'rgb(148,148,148)');

            ctx.fillRect(0, 0, S, S);

                const by = topY + Math.random() * len;
                const r = S * (0.04 + Math.random() * 0.10);
                const dark = Math.random() < 0.55;
                const a = 0.04 + Math.random() * 0.06;
                const g2 = ctx.createRadialGradient(bx, by, 0, bx, by, r);
                g2.addColorStop(0, dark ? 'rgba(96,84,62,' + a + ')' : 'rgba(255,255,255,' + a + ')');
                g2.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.lineTo(cx, topY + S * 0.03);
            ctx.stroke();

            const pairs = 7 + (variant % 2);
            for (let i = 1; i <= pairs; i++) {
                const t = i / (pairs + 1);
                const y0 = botY - t * len;
                const wHere = sh.halfW * S * Math.pow(Math.sin(Math.PI * Math.pow(t, sh.widen)), 0.85);

        // 葉の平面ジオメトリ（主脈に沿ってV字に折り、長手方向に反らせ、わずかにねじる）
        function createLeafGeometry(variant) {

            for (let i = 0; i < pos.count; i++) {

            'attribute vec3 aColor;',
            'attribute float aAlpha;',

            'varying vec3 vColor;',
            'varying float vAlpha;',
            'varying vec3 vNormalW;',

            'uniform vec3 uLightDir;',
            'uniform vec3 uLightColor;',
            'uniform vec3 uAmbient;',
            'uniform float uTranslucency;',
            'varying vec2 vUv;',

            '    #include <encodings_fragment>',

        // 舞い落ちる範囲（x,z は原点まわりの円盤、y は y=0 の平面へ上下どちらからでも集まる）
        const LEAF_FIELD = {

            topY: 300,
            bottomY: -300
        };
        const LEAF_FADE = 70;      // 現れる側（上端／下端の外側）でフェードする高さ
        const LEAF_ZERO_FADE = 70; // y=0 へ消えていく手前でフェードする高さ

        const leafSmooth = (e0, e1, x) => {

        function pickLeafColor(arr, o) {

            const variants = LEAF_COLOR_FAMILIES[fam];

            arr[o] = Math.min(1, c[0] * b);

        function resetLeaf(d, anywhereInField) {

                // 進行方向の外側（上端のさらに上／下端のさらに下）から現れる
                d.y = edge - d.dir * Math.random() * range * 0.2;

            d.fall = 6 + Math.random() * 12;                  // 落下／上昇の速さ
            d.swayAmpX = 4 + Math.random() * 12;              // 横揺れの振幅
            d.swayAmpZ = 4 + Math.random() * 12;

            d.phaseX = Math.random() * Math.PI * 2;
            d.phaseZ = Math.random() * Math.PI * 2;
            d.spinX = (Math.random() - 0.5) * 2.0;            // くるくる回る速さ

            d.rotY = Math.random() * Math.PI * 2;
            d.rotZ = Math.random() * Math.PI * 2;

            d.windPhase = Math.random() * Math.PI * 2;

        const leafGroup = new THREE.Group();

        const leafDummy = new THREE.Object3D();
        const shapeRatios = [0.42, 0.30, 0.28];

        for (let s = 0; s < shapeRatios.length; s++) {
            let count = Math.round(LEAF_COUNT * shapeRatios[s]);
            if (s === shapeRatios.length - 1) {
                count = LEAF_COUNT - leafSystems.reduce((acc, sys) => acc + sys.count, 0);
            }

            const geometry = createLeafGeometry(s);
            const colorsArr = new Float32Array(count * 3);
            const alphasArr = new Float32Array(count);
            const data = [];
            for (let i = 0; i < count; i++) {
                const d = {};
                resetLeaf(d, true);
                pickLeafColor(colorsArr, i * 3);
                data.push(d);
            }
            geometry.setAttribute('aColor', new THREE.InstancedBufferAttribute(colorsArr, 3));
            geometry.setAttribute('aAlpha', new THREE.InstancedBufferAttribute(alphasArr, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: Object.assign({ uMap: { value: createLeafTexture(s) } }, leafUniforms),
                vertexShader: LEAF_VERT,
                fragmentShader: LEAF_FRAG,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            const mesh = new THREE.InstancedMesh(geometry, material, count);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            mesh.frustumCulled = false;
            leafGroup.add(mesh);

            leafSystems.push({ mesh, geometry, data, alphasArr, count });
        }

        // 毎フレームの更新：上下どちらからでも y=0 の平面へ向かって進みながら、ゆらゆらの横揺れと
        // くるくる回転で舞い落ちる。現れる側（上端／下端の外側）と y=0 の手前でフェードさせる。
        function updateLeaves(delta, time) {
            for (let s = 0; s < leafSystems.length; s++) {
                const sys = leafSystems[s];
                const data = sys.data;
                const alphas = sys.alphasArr;

                for (let i = 0; i < sys.count; i++) {
                    const d = data[i];
                    // dir=-1: 上から落下（y 減少）, dir=+1: 下から上昇（y 増加）。どちらも y=0 へ。
                    d.y += d.dir * d.fall * delta;

                    // 風によるゆらゆらとした横揺れ（x と z で別位相）
                    const swayX = Math.sin(time * d.swayFreqX + d.phaseX) * d.swayAmpX;
                    const swayZ = Math.cos(time * d.swayFreqZ + d.phaseZ) * d.swayAmpZ;
                    const driftX = Math.sin(time * 0.12 + d.windPhase) * 10; // ゆっくり流れる風

                    // 舞いながらくるくる回る（横揺れに同期して回転を揺らす）
                    d.rotX += d.spinX * delta + Math.sin(time * 2.0 + d.phaseX) * delta * 0.8;
                    d.rotY += d.spinY * delta;
                    d.rotZ += d.spinZ * delta + Math.cos(time * 1.6 + d.phaseZ) * delta * 0.8;

                    // y=0 に到達したら、また上端／下端の外側へ戻して再登場させる
                    if (d.dir < 0 ? d.y <= 0 : d.y >= 0) {
                        resetLeaf(d, false);
                    }

                    // 現れる側（進行方向の外側）でフェードイン、y=0 の手前でフェードアウト
                    const edge = d.dir < 0 ? LEAF_FIELD.topY : LEAF_FIELD.bottomY;
                    const travel = d.dir < 0 ? (edge - d.y) : (d.y - edge);
                    const fadeIn = leafSmooth(0, LEAF_FADE, travel);
                    const fadeOut = leafSmooth(0, LEAF_ZERO_FADE, Math.abs(d.y));
                    alphas[i] = fadeIn * fadeOut;

                    leafDummy.position.set(d.baseX + swayX + driftX, d.y, d.baseZ + swayZ);
                    leafDummy.rotation.set(d.rotX, d.rotY, d.rotZ);
                    leafDummy.scale.setScalar(d.scale);
                    leafDummy.updateMatrix();
                    sys.mesh.setMatrixAt(i, leafDummy.matrix);
                }

                sys.geometry.attributes.aAlpha.needsUpdate = true;

        function Calculate_Bezier(x, p0x, p0y, p1x, p1y, p2x, p2y, p3x, p3y) {
            let t = 0.5;
            const epsilon = 0.0001;
            const maxIterations = 10;
            for (let i = 0; i < maxIterations; i++) {
                let u = 1 - t;
                let tt = t * t;
                let uu = u * u;
                let uuu = uu * u;
                let ttt = tt * t;
                let currentX = uuu * p0x + 3 * uu * t * p1x + 3 * u * tt * p2x + ttt * p3x;
                let dx = -3 * p0x * uu + 3 * p1x * (1 - 4 * t + 3 * tt) + 3 * p2x * (2 * t - 3 * tt) + 3 * p3x * tt;
                if (Math.abs(x - currentX) < epsilon) break;
                t = t - (currentX - x) / dx;
                t = Math.max(0, Math.min(1, t));
            }
            let u = 1 - t;
            let tt = t * t;
            let uu = u * u;
            let uuu = uu * u;
            let ttt = tt * t;
            return uuu * p0y + 3 * uu * t * p1y + 3 * u * tt * p2y + ttt * p3y;
        }

                const progress = (Elapsed - DURATION_INNER) / DURATION_END;
                const distanceFactor = Calculate_Bezier(progress, 0, 0, 1, 0, 0.7, 0.7, 1, 1);

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                          i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
