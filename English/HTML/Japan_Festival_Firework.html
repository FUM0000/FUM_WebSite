    <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">

    <title>Firework</title>
    <meta name="robots" content="index, follow">
</head>

<body>
    <v-app id="App">
        <template>

            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Japanese Culture > Festival > Firework</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" fluid fill-height class="pa-5">

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Explanation</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　HANABI(花火) means fireworks in Japanese. The word literally translates to "flower fire".<br>
                                　HANABI is a beloved summer tradition in Japan, with large-scale fireworks festivals held across the country from July to August.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">History</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　Fireworks were introduced to Japan in the early 18th century during the Edo period.<br>
                                　The first HANABI festival in Japan is said to have been held in 1733 along the Sumida River in Edo (now Tokyo).<br>
                                　Over the centuries, HANABI evolved into a major cultural event and an integral part of Japanese summer.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Types of HANABI</v-col>
                        </v-row>

                        <!-- Warimono (Spherical Fireworks) -->
                        <v-row justify="center" class="mt-4">
                            <v-col cols="auto" class="font-weight-bold text-center">
                                Warimono (Spherical Fireworks)<br>
                                <span class="text-subtitle-2 font-weight-regular">The shell bursts in the upper sky, and stars spread radially from the center.</span>
                            </v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Kiku_1.png'"
                                    :title="'KIKU (Chrysanthemum)'"
                                    :description="'Thin, long trails of light extend uniformly from the center and fade away, resembling a fully bloomed chrysanthemum. Unlike Botan, individual long lines (tails) are clearly visible.'">
                                </card-explanation-image>
                            </v-col>
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Botan_1.png'"
                                    :title="'BOTAN (Peony)'"
                                    :description="'Particles of light spread in a circle and fade away without tails, resembling a full peony viewed from above. Unlike Kiku, it has no tails, giving a softer and rounder impression overall.'">
                                </card-explanation-image>
                            </v-col>
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Yaeshin_1.png'"
                                    :title="'YAESHIN (Double Core)'"
                                    :description="'First one flower blooms, and another flower blooms from its center. A smaller flower appears layered inside a larger one.'">
                                </card-explanation-image>
                            </v-col>
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Chidori_1.png'"
                                    :title="'SENRIN (Thousand Flowers)'"
                                    :description="'Innumerable lights spread densely across the night sky. Rather than a single flower, the sky is filled with light particles. Unlike Kiku, it is characterized by an overwhelming number of stars.'">
                                </card-explanation-image>
                            </v-col>
                        </v-row>

                        <!-- Pokamono (Special Motion Fireworks) -->
                        <v-row justify="center" class="mt-5">
                            <v-col cols="auto" class="font-weight-bold text-center">
                                Pokamono (Special Motion Fireworks)<br>
                                <span class="text-subtitle-2 font-weight-regular">Instead of bursting in a circle, stars perform dynamic movements.</span>
                            </v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Yanagi_1.png'"
                                    :title="'YANAGI (Willow)'"
                                    :description="'Golden or silver light slowly droops downward, flowing like a waterfall like willow branches. Unlike Kiku, it flows downward instead of spreading outward.'">
                                </card-explanation-image>
                            </v-col>
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Hachi_1.png'"
                                    :title="'HACHI (Bee)'"
                                    :description="'Small lights spin and fly around in unpredictable directions, moving like buzzing insects.'">
                                </card-explanation-image>
                            </v-col>
                        </v-row>

                        <!-- Katamono (Shaped Fireworks) -->
                        <v-row justify="center" class="mt-5">
                            <v-col cols="auto" class="font-weight-bold text-center">
                                Katamono (Shaped Fireworks)<br>
                                <span class="text-subtitle-2 font-weight-regular">Designed with calculated star placements to form predetermined shapes.</span>
                            </v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Katamono_1.png'"
                                    :title="'KATAMONO (Shapes)'"
                                    :description="'Fireworks designed to form specific shapes such as hearts, smiles, stars, and rings.'">
                                </card-explanation-image>
                            </v-col>
                        </v-row>

                        <!-- Launch Types -->
                        <v-row justify="center" class="mt-5">
                            <v-col cols="auto" class="font-weight-bold text-center">
                                Launch Types
                            </v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Sutaamain_1.png'"
                                    :title="'STARMINE'"
                                    :description="'Dozens to hundreds of fireworks are launched in rapid succession, continuously filling the night sky. Unlike regular launches, they are performed continuously.'">
                                </card-explanation-image>
                            </v-col>
                            <v-col style="max-width: 256px;">
                                <card-explanation-image :image="'../../Asset/Image/Japan_Life/Festival/Firework/Suijouhanabi_1.png'"
                                    :title="'SUIJOU HANABI (Water Fireworks)'"
                                    :description="'Opened near the water surface of a lake or sea, reflecting on the water. Often staged in semicircular or fan shapes, utilizing the water surface.'">
                                </card-explanation-image>
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Typical Events</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　Many large-scale HANABI festivals are held annually across Japan:<br>
                                　・Sumida River Fireworks Festival (Tokyo) - One of the oldest and most famous<br>
                                　・Nagaoka Fireworks Festival (Niigata) - Known for its massive-scale displays<br>
                                　・Miyajima Fireworks Festival (Hiroshima) - Held over the iconic Itsukushima Shrine<br>
                                　・Omura Bay Fireworks Festival (Nagasaki) - Features fireworks launched over the bay<br>
                                　These events attract millions of visitors each year.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">YUKATA</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　It is traditional to wear YUKATA (light cotton kimono) when attending HANABI festivals.<br>
                                　YUKATA are casual summer garments often in vibrant colors and patterns.<br>
                                　Many people also enjoy festival foods such as yakisoba, takoyaki, and cotton candy while watching the fireworks.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Etiquette</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　・Arrive early to secure a good viewing spot, as popular festivals can be extremely crowded.<br>
                                　・Follow local rules regarding photography and drone usage.<br>
                                　・Take your garbage home with you to keep the area clean.<br>
                                　・Be mindful of others and avoid blocking their view during the show.
                            </v-col>
                        </v-row>

                    </v-container>
                </transition>
            </v-main>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer></main-footer>

        </template>
    </v-app>

</body>

</html>
