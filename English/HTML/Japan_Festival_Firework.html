        <template>

            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Japanese Culture > Festival > Firework</main-system-bar>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" fluid fill-height class="pa-5">

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Explanation</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　HANABI(花火) means fireworks in Japanese. The word literally translates to "flower fire".<br>
                                　HANABI is a beloved summer tradition in Japan, with large-scale fireworks festivals held across the country from July to August.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">History</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　Fireworks were introduced to Japan in the early 18th century during the Edo period.<br>
                                　The first HANABI festival in Japan is said to have been held in 1733 along the Sumida River in Edo (now Tokyo).<br>
                                　Over the centuries, HANABI evolved into a major cultural event and an integral part of Japanese summer.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Features</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　Japanese HANABI are known for their elaborate and artistic designs.<br>
                                　Skilled pyrotechnicians create fireworks with intricate patterns such as hearts, smiley faces, and chrysanthemums.<br>
                                　Some festivals feature synchronized displays set to music, creating a spectacular visual and auditory experience.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Typical Events</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　Many large-scale HANABI festivals are held annually across Japan:<br>
                                　・Sumida River Fireworks Festival (Tokyo) - One of the oldest and most famous<br>
                                　・Nagaoka Fireworks Festival (Niigata) - Known for its massive-scale displays<br>
                                　・Miyajima Fireworks Festival (Hiroshima) - Held over the iconic Itsukushima Shrine<br>
                                　・Omura Bay Fireworks Festival (Nagasaki) - Features fireworks launched over the bay<br>
                                　These events attract millions of visitors each year.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">YUKATA</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　It is traditional to wear YUKATA (light cotton kimono) when attending HANABI festivals.<br>
                                　YUKATA are casual summer garments often in vibrant colors and patterns.<br>
                                　Many people also enjoy festival foods such as yakisoba, takoyaki, and cotton candy while watching the fireworks.
                            </v-col>
                        </v-row>

                        <v-row justify="center" class="mt-5 Highlight">
                            <v-col cols="auto" class="font-weight-medium">Etiquette</v-col>
                        </v-row>
                        <v-row justify="center">
                            <v-col cols="auto" class="font-weight-medium">
                                　・Arrive early to secure a good viewing spot, as popular festivals can be extremely crowded.<br>
                                　・Follow local rules regarding photography and drone usage.<br>
                                　・Take your garbage home with you to keep the area clean.<br>
                                　・Be mindful of others and avoid blocking their view during the show.
                            </v-col>
                        </v-row>

                    </v-container>
