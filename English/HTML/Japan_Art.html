    <style>

        /* ---- Washi/hana-kikkou page background (Japanese cream) ---- */
        .page-washi {

            left: 0;
            width: 100%;
            height: 100%;

            max-width: 860px;
            margin: 26px auto 42px;
            padding: 0 6px;

        .kakejiku-roller {

            margin: 0 auto;

            margin: 2px auto 0;
            width: 90%;
            height: 2px;
            background: rgba(255, 255, 255, 0.28);

            padding: 34px 30px 28px;

            position: relative;
            box-shadow: 0 8px 30px rgba(90, 70, 40, 0.18);

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>

    <script>
        // ---- Canvas helpers ----
        const W = 128, H = 128;

        function setupCanvas(canvas) {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            return ctx;
        }

        const INDIGO = '#23445c';
        const RED = '#b0332e';
        const GOLD = '#c79a2e';
        const GREEN = '#477049';
        const GREY = '#8b99a3';

        function line(ctx, x1, y1, x2, y2, w, color) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineWidth = w;
            ctx.strokeStyle = color || INDIGO;
            ctx.stroke();
        }

        function strokeCircle(ctx, cx, cy, r, w, color) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.lineWidth = w;
            ctx.strokeStyle = color || INDIGO;
            ctx.stroke();
        }

        function fillCircle(ctx, cx, cy, r, color) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = color || INDIGO;
            ctx.fill();
        }

        function strokePoly(ctx, cx, cy, r, sides, rot, w, color) {
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = rot + (i / sides) * Math.PI * 2;
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.lineWidth = w;
            ctx.strokeStyle = color || INDIGO;
            ctx.stroke();
        }

        function diamond(ctx, cx, cy, rx, ry, w, color) {
            ctx.beginPath();
            ctx.moveTo(cx, cy - ry);
            ctx.lineTo(cx + rx, cy);
            ctx.lineTo(cx, cy + ry);
            ctx.lineTo(cx - rx, cy);
            ctx.closePath();
            ctx.lineWidth = w;
            ctx.strokeStyle = color || INDIGO;
            ctx.stroke();
        }

        function fillDiamond(ctx, cx, cy, rx, ry, color) {
            ctx.beginPath();
            ctx.moveTo(cx, cy - ry);
            ctx.lineTo(cx + rx, cy);
            ctx.lineTo(cx, cy + ry);
            ctx.lineTo(cx - rx, cy);
            ctx.closePath();
            ctx.fillStyle = color || INDIGO;
            ctx.fill();
        }

        // Karahana-style petal (pointing -y): rounded sides, tip notched into three lobes
        function karahanaPetal(ctx, len, wide, fill, strokeW) {
            const L = len, w = wide;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(w * 0.9, -L * 0.18, w * 1.05, -L * 0.55, w * 0.95, -L * 0.82);
            ctx.quadraticCurveTo(w * 0.8, -L * 0.94, w * 0.42, -L * 0.88);
            ctx.quadraticCurveTo(w * 0.12, -L * 0.86, 0, -L * 1.02);
            ctx.quadraticCurveTo(-w * 0.12, -L * 0.86, -w * 0.42, -L * 0.88);
            ctx.quadraticCurveTo(-w * 0.8, -L * 0.94, -w * 0.95, -L * 0.82);
            ctx.bezierCurveTo(-w * 1.05, -L * 0.55, -w * 0.9, -L * 0.18, 0, 0);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            ctx.strokeStyle = INDIGO;
            ctx.lineWidth = strokeW || 1.4;
            ctx.stroke();
        }

        // Hollyhock (aoi) leaf, a heart pointing +x, cleft at the base (toward the flower)
        function aoiLeaf(ctx) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-2, -5, -9, -5, -12, -1);
            ctx.bezierCurveTo(-14, 3, -11, 8, -5, 10);
            ctx.quadraticCurveTo(0, 12, 3, 17);
            ctx.quadraticCurveTo(1.5, 12, 5, 10);
            ctx.bezierCurveTo(11, 8, 14, 3, 12, -1);
            ctx.bezierCurveTo(9, -5, 2, -5, 0, 0);
            ctx.closePath();
            ctx.fillStyle = 'rgba(71,112,73,0.25)';
            ctx.fill();
            ctx.strokeStyle = INDIGO;
            ctx.lineWidth = 1.4;
            ctx.stroke();
            line(ctx, 0, 0, 3, 16, 1.1, INDIGO);
            line(ctx, 0, 0, -8, 6, 1.1, INDIGO);
            line(ctx, 0, 0, -2, 6, 1.1, INDIGO);
            line(ctx, 0, 0, 2, 6, 1.1, INDIGO);
            line(ctx, 0, 0, 8, 6, 1.1, INDIGO);
        }

        // ---- Pattern draw functions (128x128 space) ----

        function drawTouHana(ctx) {
            const cx = 64, cy = 64;
            strokeCircle(ctx, cx, cy, 49, 1.2, INDIGO);
            strokeCircle(ctx, cx, cy, 46.5, 0.8, GOLD);
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(a);
                ctx.beginPath();
                ctx.moveTo(0, -45);
                ctx.quadraticCurveTo(8, -37, 6, -28);
                ctx.quadraticCurveTo(4.5, -22, 0, -20);
                ctx.quadraticCurveTo(-4.5, -22, -6, -28);
                ctx.quadraticCurveTo(-8, -37, 0, -45);
                ctx.closePath();
                ctx.fillStyle = 'rgba(199,154,46,0.18)';
                ctx.fill();
                ctx.strokeStyle = INDIGO;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();

                    <p>
                        A monyo is a decorative motif or pattern used on textiles, ceramics,
                        lacquerware, and architecture. Each carries a meaning: shippo (seven
                        treasures) and asanoha (hemp leaf) convey wishes for prosperity and good
                        growth; uroko (scales) guarded against harm; and seigaiha (ocean
                        waves) evoke calm and fortune. Originally signs of rank, they later became the
                        vocabulary of Japan's most beloved visual culture. Below, each
                        pattern is drawn live for you.
                    </p>`,
                subsections: Sections
            }
        ];

        // ---- Vue app ----
        let vue = new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Common],
            data: {
                ArtCategories: ArtCategories,
                Ready_Page: false
            },
            methods: {
                ScrollTo(id) {
                    const el = document.getElementById(id);
                    if (el) {
                        const y = el.getBoundingClientRect().top + window.pageYOffset - 70;
                        window.scrollTo({ top: y, behavior: 'smooth' });
                    }
                }
            },
            mounted() {
                const drawAll = () => {
                    document.querySelectorAll('canvas.pattern-canvas').forEach((cv) => {
                        const fn = Patterns[cv.getAttribute('data-key')];
                        if (fn) {
                            const ctx = setupCanvas(cv);
                            fn(ctx);
                        }
                    });
                };
                this.$nextTick(() => {
                    drawAll();
                    this.$nextTick(drawAll);
                });
                window.addEventListener('resize', drawAll);
            }
        });
