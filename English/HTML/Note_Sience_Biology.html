  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">

  <title>生物</title>
    <meta name="robots" content="index, follow">

<body>
  <v-app id="App" v-cloak>
    <template>
      <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Note > サイエンス > 生物</main-system-bar>

      <v-main id="Main">
        <transition name="Fade_Page">
          <v-container v-show="Ready_Page" fluid class="pa-5">
            <v-row justify="center">
              <v-col cols="12" md="6">
                <v-card class="mt-6">
                  <v-card-title class="content-text"><span>生物</span></v-card-title>
                  <v-card-text>
                    <p class="mb-3">植物の栽培から、生命を支えるエネルギーの原理までを根本から学ぶ。</p>
                    <v-text-field v-model="searchQuery" label="学習内容を検索" prepend-inner-icon="mdi-magnify" clearable
                      outlined dense @input="filterTreeview"></v-text-field>
                  </v-card-text>
                </v-card>

                <v-card class="mt-6 mb-6">
                  <v-card-title class="content-text d-flex justify-space-between align-center">
                    <span>生物の活動とエネルギー</span>
                    <div class="stepper-next">
                      <v-btn color="primary" @click="Count_Energy = Count_Energy + 1"
                        v-if="Count_Energy < EnergySections.length">次へ</v-btn>
                    </div>
                  </v-card-title>
                  <v-card-text>
                    <v-stepper v-model="Count_Energy">
                      <v-stepper-header>
                        <template v-for="(section, index) in EnergySections">
                          <v-stepper-step :key="'energy-step-' + index" :complete="Count_Energy > index + 1"
                            :step="index + 1" @click="Count_Energy = index + 1">{{ section.title }}</v-stepper-step>
                          <v-divider v-if="index < EnergySections.length - 1"
                            :key="'energy-divider-' + index"></v-divider>
                        </template>
                      </v-stepper-header>

                      <v-stepper-items>
                        <v-stepper-content v-for="(section, index) in EnergySections" :key="'energy-content-' + index"
                          :step="index + 1">
                          <v-card class="mb-12">
                            <v-card-text>
                              <v-card-title class="text-subtitle-2 font-weight-bold">{{ section.title }}</v-card-title>
                              <v-treeview :items="section.filtered" item-key="name" activatable open-on-click dense
                                :open.sync="section.open">
                                <template v-slot:label="{ item }">
                                  <span :class="{ 'search-highlight': item.matches }">{{ item.name }}</span>
                                </template>
                              </v-treeview>
                            </v-card-text>
                          </v-card>
                          <div class="button-container">
                            <v-btn v-if="index > 0" text @click="Count_Energy = index">戻る</v-btn>
                          </div>
                        </v-stepper-content>
                      </v-stepper-items>
                    </v-stepper>
                  </v-card-text>
                </v-card>

                
                <v-card class="mt-6">
                  <v-card-title class="content-text d-flex justify-space-between align-center">
                    <span>植物</span>
                    <div class="stepper-next">
                      <v-btn color="primary" @click="Count_Plant = Count_Plant + 1"
                        v-if="Count_Plant < PlantSections.length">次へ</v-btn>
                    </div>
                  </v-card-title>
                  <v-card-text>
                    <v-stepper v-model="Count_Plant">
                      <v-stepper-header>
                        <template v-for="(section, index) in PlantSections">
                          <v-stepper-step :key="'plant-step-' + index" :complete="Count_Plant > index + 1"
                            :step="index + 1" @click="Count_Plant = index + 1">{{ section.title }}</v-stepper-step>
                          <v-divider v-if="index < PlantSections.length - 1" :key="'plant-divider-' + index"></v-divider>
                        </template>
                      </v-stepper-header>

                      <v-stepper-items>
                        <v-stepper-content v-for="(section, index) in PlantSections" :key="'plant-content-' + index"
                          :step="index + 1">
                          <v-card class="mb-12">
                            <v-card-text>
                              <v-card-title class="text-subtitle-2 font-weight-bold">{{ section.title }}</v-card-title>
                              <v-treeview :items="section.filtered" item-key="name" activatable open-on-click dense
                                :open.sync="section.open">
                                <template v-slot:label="{ item }">
                                  <span :class="{ 'search-highlight': item.matches }">{{ item.name }}</span>
                                </template>
                              </v-treeview>
                            </v-card-text>
                          </v-card>
                          <div class="button-container">
                            <v-btn v-if="index > 0" text @click="Count_Plant = index">戻る</v-btn>
                          </div>
                        </v-stepper-content>
                      </v-stepper-items>
                    </v-stepper>
                  </v-card-text>
                </v-card>

              </v-col>
            </v-row>
          </v-container>
        </transition>
      </v-main>

      <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
      <main-footer></main-footer>
    </template>
  </v-app>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
  <script src="../../Asset/Javascript/Common.js?v=1.03"></script>

  <script>
    new Vue({
      el: '#App',
      vuetify: new Vuetify(),
      mixins: [window.Mixins_Common],
      data: {
        Count_Plant: 1,
        Count_Energy: 1,
        searchQuery: '',
        PlantSections: [
          {
            title: '植物のしくみ', open: [], filtered: [], items: [
              { name: '根', children: [
                { name: '水と養分を吸収する' },
                { name: '呼吸のため酸素が必要（過湿で根腐れ）' },

              { name: '茎', children: [
                { name: '道管: 水とミネラルを上へ運ぶ' },
                { name: '師管: 光合成でできた糖を運ぶ' },
              ]},
              { name: '葉', children: [
                { name: '光合成: 光 + CO2 + 水 → 糖 + O2' },
                { name: '蒸散: 気孔から水蒸気を出し吸水を促す' },
                { name: '気孔: 昼は開き夜は閉じる' },
              ]},
              { name: '成長の原理', children: [
                { name: '光・水・CO2・養分・適温が必要' },
                { name: '呼吸は昼も夜も行われる' },
                { name: '肥料の三要素: 窒素(N)・リン(P)・カリウム(K)' },
              ]},
              { name: '土壌と微生物', children: [
                { name: '微生物が有機物を分解して養分にする' },
                { name: '団粒構造で水はけと保水を両立する' },
              ]},
            ]
          },
          {
            title: '育てる基本', open: [], filtered: [], items: [
              { name: '全般', children: [
                { name: '水はけ' },
                { name: '栄養' },
                { name: '日当たり' },
                { name: '土に空気を送る' },
                { name: '土壌改良', children: [
                  { name: '納豆菌' },
                  { name: '乳酸菌' },
                  { name: '砂糖' },
                ]},
                { name: '防虫抗菌', children: [
                  { name: 'ニンニク唐辛子アルコール水' },
                ]},
              ]},
            ]
          },
          {
            title: '野菜', open: [], filtered: [], items: [
              { name: '野菜', children: [
                { name: '発芽', children: [
                  { name: 'ニンニク', children: [
                    { name: '皮をむく' },
                    { name: '一晩水につける', children: [{ name: '三分の一程度浸水' }] },
                  ]},
                  { name: '枝豆', children: [
                    { name: '豆もやしを半分に切る' },
                    { name: '豆の半分を埋める' },
                  ]},
                ]},
                { name: '注意事項', children: [
                  { name: 'ほうれん草', children: [
                    { name: '暑さを避ける' },
                    { name: '石灰多め' },
                    { name: '肥料切れをさせない' },
                  ]},
                  { name: '玉ねぎ', children: [
                    { name: '小さい状態で越冬' },
                    { name: '病気の予防を徹底' },
                  ]},
                  { name: 'とうもろこし', children: [{ name: '15度以上' }] },
                  { name: 'ビーツ', children: [{ name: '猛暑の種まき不可' }] },
                ]},
              ]},
            ]
          },
          {
            title: '観葉植物', open: [], filtered: [], items: [
              { name: '観葉植物', children: [
                { name: '多肉植物', children: [
                  { name: '適した季節' },
                  { name: '夏型の冬は葉水のみ' },
                  { name: '成長期に週１で液肥' },
                ]},
              ]},
            ]
          },
          {
            title: '殖やし方', open: [], filtered: [], items: [
              { name: '山椒の挿し木', children: [
                { name: '3月もしくは 6月 7月' },
                { name: '一年生枝' },
              ]},
              { name: '水耕栽培', children: [
                { name: 'スポンジとカップやパック' },
                { name: '発泡スチロールと糸' },
              ]},
              { name: '殖やし方の原理', children: [
                { name: '挿し木: 成長点と発根を利用する' },
                { name: '水耕栽培: 養分を水に溶かして根から吸わせる' },
              ]},
            ]
          },
          {
            title: '雑草', open: [], filtered: [], items: [
              { name: '雑草', children: [
                { name: '熱湯で枯らせる' },
                { name: '原理: 土の中の埋土種子が長期間生き残る' },
              ]},
            ]
          },
        ],
        EnergySections: [
          {
            title: 'エネルギーの原理', open: [], filtered: [], items: [
              { name: 'エネルギーの原理', children: [
                { name: '保存則: 総量は変わらず形が変わるだけ' },
                { name: '単位: ジュール(J)、1 cal = 4.184 J' },
                { name: '生命はエントロピー増大に逆らい秩序を保つ' },
                { name: '根源は太陽の光エネルギー' },
                { name: '流れ: 光 → 化学 → 機械・浸透圧・電気 → 熱' },
              ]},
            ]
          },
          {
            title: '光合成', open: [], filtered: [], items: [
              { name: '光合成', children: [
                { name: '式: 6CO2 + 6H2O + 光 → C6H12O6 + 6O2' },
                { name: '場: 葉緑体（チラコイド膜・ストロマ）' },
                { name: '光反応: 水を分解しO2を放出、ATPとNADPHを生産' },
                { name: 'カルビン回路: ATPとNADPHでCO2を糖に固定' },
                { name: '吸熱反応: 光エネルギーを化学結合に蓄える' },
              ]},
            ]
          },
          {
            title: '呼吸', open: [], filtered: [], items: [
              { name: '呼吸', children: [
                { name: '式: C6H12O6 + 6O2 → 6CO2 + 6H2O + 最大約38ATP' },
                { name: '解糖系: 細胞質でグルコース → ピルビン酸 + 2ATP' },
                { name: 'クエン酸回路: ミトコンドリアで 2ATP + NADH/FADH2' },
                { name: '電子伝達系: O2で酸化し約34ATP、水を生成' },
                { name: '発熱反応（異化）: 化学エネルギーを取り出す' },
                { name: '嫌気条件: 発酵では2ATPのみ' },
              ]},
            ]
          },
          {
            title: 'ATP', open: [], filtered: [], items: [
              { name: 'ATP（エネルギーの通貨）', children: [
                { name: '構造: アデノシン + リン酸3個（アデノシン三リン酸）' },
                { name: 'ATP → ADP + リン酸 + 約30.5 kJ/mol' },
                { name: '適度な量・即利用・再利用が可能' },
                { name: '使われ方: 筋収縮・能動輸送・物質合成・発光' },
                { name: '成人は1日に数十kgのATPを合成しては再利用する' },
              ]},
            ]
          },
          {
            title: '活動とエネルギー', open: [], filtered: [], items: [
              { name: '活動をエネルギー単位に分解', children: [
                { name: '細胞の仕事', children: [
                  { name: '筋収縮: アクチンとミオシンがATPを消費' },
                  { name: 'Na+/K+ポンプ: ATP 1個でNa+ 3個出し K+ 2個入れる' },
                  { name: 'タンパク質合成: アミノ酸1個あたり約4ATP相当' },
                ]},
                { name: '個体の活動', children: [
                  { name: '立つ・歩く・走る' },
                  { name: '考える: 脳は全体の約20%のエネルギーを使う' },
                  { name: '体温維持（発熱）' },
                ]},
                { name: '基礎代謝: 安静時も心臓・肺・脳が消費する' },
                { name: '概算: 成人1日 約2000 kcal ≒ 約8400 kJ' },
              ]},
            ]
          },
          {
            title: '代謝の全体像', open: [], filtered: [], items: [
              { name: '代謝の全体像', children: [
                { name: '同化: エネルギーを蓄える合成（光合成・タンパク質合成）' },
                { name: '異化: エネルギーを取り出す分解（呼吸・発酵）' },
                { name: '物質は循環するが、エネルギーは一方通行' },
                { name: '使われたエネルギーは最終的に熱として放散される' },
                { name: '食物連鎖: 各段階で約90%が熱として失われる（約10%が次へ）' },
              ]},
            ]
          },
        ]
      },
      created() {
        this.PlantSections.forEach((section) => {
          section.filtered = JSON.parse(JSON.stringify(section.items));
        });
        this.EnergySections.forEach((section) => {
          section.filtered = JSON.parse(JSON.stringify(section.items));
        });
      },
      methods: {
        collectAllNodeIds(items) {
          const ids = [];
          const collect = (nodes) => {
            nodes.forEach((node) => {
              ids.push(node.name);
              if (node.children) {
                collect(node.children);
              }
            });
          };
          collect(items);
          return ids;
        },
        filterTree(items, query) {
          return items.reduce((acc, item) => {
            const itemCopy = { ...item };
            const matches = item.name.toLowerCase().includes(query);

            if (item.children) {
              itemCopy.children = this.filterTree(item.children, query);
              if (itemCopy.children.length > 0 || matches) {
                itemCopy.matches = matches;
                acc.push(itemCopy);
              }
            } else if (matches) {
              itemCopy.matches = true;
              acc.push(itemCopy);
            }
            return acc;
          }, []);
        },
        filterSection(section) {
          const query = this.searchQuery ? this.searchQuery.toLowerCase().trim() : '';
          if (!query) {
            section.filtered = JSON.parse(JSON.stringify(section.items));
            section.open = [];
            return;
          }
          section.filtered = this.filterTree(JSON.parse(JSON.stringify(section.items)), query);
          section.open = this.collectAllNodeIds(section.filtered);
        },
        filterTreeview() {
          this.PlantSections.forEach((section) => this.filterSection(section));
          this.EnergySections.forEach((section) => this.filterSection(section));
        }
      }
    });
  </script>
