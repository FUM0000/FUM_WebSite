<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>

    <link rel="icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="../../Asset/CSS/common_word_japanese.css" rel="stylesheet" />

    <title>Word - Asking</title>
    <meta name="robots" content="index, follow">

    <style>
        .LP_SectionTitle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.08), rgba(25, 118, 210, 0.02));
            border-left: 3px solid #1976D2;
            border-radius: 0 8px 8px 0;
            margin: 0 auto 14px;
            max-width: 720px;
        }
        .LP_SectionTitle .v-icon { color: #1976D2; }
        .LP_SectionTitle span { font-weight: 700; font-size: 1.05rem; }
        .LP_Title {
            margin: 0 auto 12px;
            max-width: 720px;
            padding: 0 4px;
        }
        .LP_Title h2 {
            margin: 0;
            font-family: 'Outfit', 'Space Mono', 'Zen Kaku Gothic New', sans-serif;
            font-weight: 800;
            letter-spacing: -0.02em;
            font-size: 1.45rem;
            color: #162033;
        }
        .LP_Title p {
            margin: 6px 0 0;
            font-size: 0.95rem;
            line-height: 1.8;
            color: rgba(22, 32, 51, 0.72);
        }
        .LP_Card {
            display: flex;
            flex-direction: column;
            border-radius: 14px !important;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.07) !important;
            overflow: hidden;
            max-width: 720px;
            margin: 0 auto;
        }
        .LP_TopNav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 10px 16px 6px !important;
        }
        .LP_Count {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1976D2;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .LP_Stage {
            flex-grow: 1;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
        }
        .LP_Point {
            display: flex;
            gap: 18px;
            align-items: center;
            width: 100%;
        }
        .LP_PointBadge {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.05rem;
            color: white;
            background: linear-gradient(135deg, #1976D2, #42A5F5);
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
        }
        .LP_PointText {
            flex: 1;
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .LP_Highlight { color: #D32F2F; font-weight: 700; }
        .LP_Nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px 14px !important;
        }
        .LP_Dots { display: flex; gap: 7px; align-items: center; }
        .LP_Dot {
            width: 10px; height: 10px; border-radius: 50%; border: none;
            cursor: pointer; background: #B0BEC5; padding: 0; transition: all 0.25s ease;
        }
        .LP_Dot:hover { background: #78909C; transform: scale(1.2); }
        .LP_Dot.Active { width: 26px; border-radius: 8px; background: #1976D2; }
        .slide-enter-active, .slide-leave-active { transition: opacity 0.25s ease, transform 0.25s ease; }
        .slide-left-enter { opacity: 0; transform: translateX(48px); }
        .slide-left-leave-to { opacity: 0; transform: translateX(-48px); }
        .slide-right-enter { opacity: 0; transform: translateX(-48px); }
        .slide-right-leave-to { opacity: 0; transform: translateX(48px); }
        @media (max-width: 600px) {
            .LP_Point { flex-direction: column; text-align: center; gap: 12px; }
            .LP_Stage { padding: 12px 20px; }
        }
    </style>
</head>

<body>

    <v-app id="App">
        <template>
            
            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Japanese Language > Basic > Word - Asking</main-system-bar>
            
            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" class="lp-page">

                        <v-row>
                            <v-col class="d-flex justify-end">
                                <v-switch v-model="Switch" :label="`Switch All　`" inset hide-details="false" />
                            </v-col>
                        </v-row>
                        <v-row>
                            <v-col cols="12" md="3" lg="3" v-for="list in List" :key="list.id">
                                <card-word-general :showall="Switch" :japanese="list.japanese" :english="list.english">
                                    <template v-slot:first>{{ list.japanese }}<br>
                                        <font size="5">{{ list.reading }}</font>
                                    </template>
                                    <template v-slot:second>{{ list.english }}</template>
                                </card-word-general>
                            </v-col>
                        </v-row>

                        <!-- Explanation -->
                        <v-col cols="12" id="LP_Section1">
                            <div class="LP_Title">
                                <h2>Word - Asking</h2>
                                <p>Japanese question words and how to use them in conversation.</p>
                            </div>
                            <div class="LP_SectionTitle">
                                <v-icon small>mdi-lightbulb-outline</v-icon>
                                <span>Explanation</span>
                            </div>
                            <v-card class="LP_Card" @click.native="Active = 1">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_Explain" :disabled="Page_Explain === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_Explain + 1 }} / {{ List_Explain.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_Explain">
                                            <span class="d-none d-sm-inline">{{ Page_Explain === List_Explain.length - 1 ? 'Next Section' : 'Next' }}</span>
                                            <v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_Explain" mode="out-in">
                                            <div :key="Page_Explain" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_Explain + 1 }}</div>
                                                <div class="LP_PointText" v-html="List_Explain[Page_Explain].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_Explain" :key="'e'+i" class="LP_Dot"
                                                :class="{ Active: Page_Explain === i }" @click="Go_Explain(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                        </v-col>

                        <!-- Conjugation -->
                        <v-col cols="12" id="LP_Section2">
                            <div class="LP_SectionTitle">
                                <v-icon small>mdi-sync</v-icon>
                                <span>Conjugation</span>
                            </div>
                            <v-card class="LP_Card" @click.native="Active = 2">
                                    <v-card-actions class="LP_TopNav">
                                        <v-btn small outlined color="primary" @click="Prev_Conj" :disabled="Page_Conj === 0">
                                            <v-icon left small>mdi-chevron-left</v-icon><span class="d-none d-sm-inline">Prev</span>
                                        </v-btn>
                                        <span class="LP_Count">{{ Page_Conj + 1 }} / {{ List_Conj.length }}</span>
                                        <v-btn small outlined color="primary" @click="Next_Conj"
                                            :disabled="Page_Conj === List_Conj.length - 1">
                                            <span class="d-none d-sm-inline">Next</span><v-icon right small>mdi-chevron-right</v-icon>
                                        </v-btn>
                                    </v-card-actions>
                                    <v-card-text class="LP_Stage">
                                        <transition :name="SlideName_Conj" mode="out-in">
                                            <div :key="Page_Conj" class="LP_Point">
                                                <div class="LP_PointBadge">{{ Page_Conj + 1 }}</div>
                                                <div class="LP_PointText" v-html="List_Conj[Page_Conj].text"></div>
                                            </div>
                                        </transition>
                                    </v-card-text>
                                    <div class="LP_Nav">
                                        <div class="LP_Dots">
                                            <button v-for="(p, i) in List_Conj" :key="'j'+i" class="LP_Dot"
                                                :class="{ Active: Page_Conj === i }" @click="Go_Conj(i)"></button>
                                        </div>
                                    </div>
                                </v-card>
                        </v-col>
                    </v-row>

                        <div style="height: 160px;"></div>

                    </v-container>
                </transition>
            </v-main>

            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
            <main-footer></main-footer>
            
        </template>
    </v-app>
    
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <script src="../../Asset/Javascript/Common.js?v=1.03"></script>
    <script src="../../Asset/Javascript/Word.js"></script>
    
    <script>

        let vue = new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            mixins: [window.Mixins_Word],
            data: {
                Active: 1,
                Page_Explain: 0, Page_Conj: 0,
                Direction_Explain: 'slide-left', Direction_Conj: 'slide-left',
                List_Explain: [
                    { text: `Unlike English, Japanese 5w1h is replaced by the grammatical part of each object.<br>Here are some examples. <span class="LP_Highlight">()</span> indicate the grammar that is meant.` },
                    { text: `あなたは何(object)<span class="LP_Highlight">を</span>たべる？<br>anata wa nani <span class="LP_Highlight">o</span> taberu?<br>What do you eat?` },
                    { text: `いつ(when)あなたはくる？<br>itsu anata wa kuru?<br>When are you coming?` },
                    { text: `あなたのいぬはどこ(where)<span class="LP_Highlight">に</span>いる？<br>anata no inu wa doko <span class="LP_Highlight">ni</span> iru?<br>Where is your dog?<br><br><v-btn rounded outlined href="./Japanese_Basic_Grammar.html">Check "in" Grammar</v-btn>` },
                    { text: `あなたはだれ(with)<span class="LP_Highlight">と</span>あう？<br>anata wa dare <span class="LP_Highlight">to</span> au?<br>Who are you meeting with?<br><br><v-btn rounded outlined href="./Japanese_Basic_Grammar.html">Check "with" Grammar</v-btn>` },
                    { text: `あなたはどれ(object)<span class="LP_Highlight">を</span>かう？<br>anata wa dore <span class="LP_Highlight">o</span> kau?<br>Which one will you buy?` },
                    { text: `これはどう(adverb)いう？<br>kore wa dou iu?<br>How do you say this?` },
                ],
                List_Conj: [
                    { text: `Unlike in English, some Japanese words such as what and which unfortunately need to be conjugated when combined with <span class="LP_Highlight">nouns</span>.<br>Here are some examples.` },
                    { text: `あなたは<span class="LP_Highlight">どんな</span>スポーツをする？<br>anata wa <span class="LP_Highlight">donna</span> supootsu o suru?<br>What sports do you play?` },
                    { text: `わたしたちは<span class="LP_Highlight">どの</span>レストランにいく？<br>watashitachi wa <span class="LP_Highlight">dono</span> resutoran ni iku?<br>Which restaurant do we go to?` },
                ],
            },
            computed: {
                Progress_Explain() { return (this.Page_Explain + 1) / this.List_Explain.length * 100; },
                Progress_Conj() { return (this.Page_Conj + 1) / this.List_Conj.length * 100; },
                SlideName_Explain() { return this.Direction_Explain; },
                SlideName_Conj() { return this.Direction_Conj; },
            },
            methods: {
                Go_Explain(i) {
                    const next = Math.max(0, Math.min(this.List_Explain.length - 1, i));
                    this.Direction_Explain = next >= this.Page_Explain ? 'slide-left' : 'slide-right';
                    this.Page_Explain = next;
                },
                Prev_Explain() { this.Active = 1; this.Go_Explain(this.Page_Explain - 1); },
                Next_Explain() {
                    this.Active = 1;
                    if (this.Page_Explain < this.List_Explain.length - 1) this.Go_Explain(this.Page_Explain + 1);
                    else { this.Active = 2; this.ScrollTo('LP_Section2'); }
                },
                Go_Conj(i) {
                    const next = Math.max(0, Math.min(this.List_Conj.length - 1, i));
                    this.Direction_Conj = next >= this.Page_Conj ? 'slide-left' : 'slide-right';
                    this.Page_Conj = next;
                },
                Prev_Conj() { this.Active = 2; this.Go_Conj(this.Page_Conj - 1); },
                Next_Conj() { this.Active = 2; this.Go_Conj(this.Page_Conj + 1); },
                ScrollTo(id) {
                    const el = document.getElementById(id);
                    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 72, behavior: 'smooth' });
                },
                Handle_Key(e) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        if (this.Active === 1) {
                            if (this.Page_Explain < this.List_Explain.length - 1) this.Go_Explain(this.Page_Explain + 1);
                            else { this.Active = 2; this.ScrollTo('LP_Section2'); }
                        } else if (this.Page_Conj < this.List_Conj.length - 1) {
                            this.Go_Conj(this.Page_Conj + 1);
                        }
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        if (this.Active === 2) {
                            if (this.Page_Conj > 0) this.Go_Conj(this.Page_Conj - 1);
                            else { this.Active = 1; this.ScrollTo('LP_Section1'); }
                        } else if (this.Page_Explain > 0) {
                            this.Go_Explain(this.Page_Explain - 1);
                        }
                    }
                },
            },
            mounted() {
                this.$nextTick(() => { window.addEventListener('keydown', this.Handle_Key); });
            },
            beforeDestroy() {
                window.removeEventListener('keydown', this.Handle_Key);
            },
            created: function () {
                let japanese = [
                    "なに",
                    "だれ",
                    "どこ",
                    "いつ",
                    "どれ(どっち)",
                    "どの",
                    "どちら",
                    "どう(どうやって)",
                    "なんで(なぜ)",
                    "どうして",
                    "何時",
                    "何曜日",
                    "いくつ",
                    "いくら",
                    "どんな",
                ];
                let reading = [
                    "nani",
                    "dare",
                    "doko",
                    "itsu",
                    "dore(docchi)",
                    "dono",
                    "dochira",
                    "dou(douyatte)",
                    "nande(naze)",
                    "doushite",
                    "nanji",
                    "nanyoubi",
                    "ikutsu",
                    "ikura",
                    "donna",
                ];
                let english = [
                    "What",
                    "Who",
                    "Where",
                    "When",
                    "Which",
                    "Which ~ (before noun)",
                    "Which (polite)",
                    "How",
                    "Why",
                    "Why (polite)",
                    "What time",
                    "What day",
                    "How many",
                    "How much",
                    "What kind of",
                ];

                this.CreateList(japanese, reading, english);
                this.list = this.List;
            },
        })

    </script>

</body>

</html>
