      created() {
        var assignIds = function (items, prefix) {
          if (!prefix) prefix = '';
          items.forEach(function (item, index) {
            item.id = prefix + index;
            if (item.children) {
              assignIds(item.children, item.id + '-');
            }
          });
        };
        assignIds(this.Colony);
        this.filteredSociety = JSON.parse(JSON.stringify(this.Colony));
        assignIds(this.Environment);
        this.filteredEnvironment = JSON.parse(JSON.stringify(this.Environment));
      },
      methods: {
        collectAllNodeIds: function (items) {
          var ids = [];
          var collect = function (nodes) {
            nodes.forEach(function (node) {
              ids.push(node.id);
              if (node.children) {
                collect(node.children);
              }
            });
          };
          collect(items);
          return ids;
        },
        updateOpenNodesEnvironment: function (newOpen) {
          this.openNodesEnvironment = newOpen;
        },
        updateOpenNodesSociety: function (newOpen) {
          this.openNodesSociety = newOpen;
        },
        filterTreeview: function () {
          var query = this.searchQuery ? this.searchQuery.toLowerCase().trim() : '';
          if (!query) {
            this.filteredEnvironment = JSON.parse(JSON.stringify(this.Environment));
            this.openNodesEnvironment = [];
            this.filteredSociety = JSON.parse(JSON.stringify(this.Colony));
            this.openNodesSociety = [];
            return;
          }

          var filterTree = function (items) {
            return items.reduce(function (acc, item) {
              var itemCopy = Object.assign({}, item);
              var matches = item.name.toLowerCase().indexOf(query) !== -1;

              if (item.children) {
                itemCopy.children = filterTree(item.children);
                if (itemCopy.children.length > 0 || matches) {
                  itemCopy.matches = matches;
                  acc.push(itemCopy);
                }
              } else if (matches) {
                itemCopy.matches = true;
                acc.push(itemCopy);
              }
              return acc;
            }, []);
          };

          this.filteredEnvironment = filterTree(JSON.parse(JSON.stringify(this.Environment)));
          this.filteredSociety = filterTree(JSON.parse(JSON.stringify(this.Colony)));

          this.openNodesEnvironment = this.collectAllNodeIds(this.filteredEnvironment);
          this.openNodesSociety = this.collectAllNodeIds(this.filteredSociety);
        }
      }
