    <title>Blog</title>

    <style>
        h3 {
            margin-bottom: 0.5em;
        }

        .v-application .pb-4 {
            padding-bottom: 0px !important;
        }

        .v-card__text {
            padding-top: 0px !important;
        }

        .v-card__actions {
            align-items: center;
            display: flex;
            padding: 8px;
            justify-content: center;
        }

        .v-card {
            padding: 32px;
        }

        @media (max-width: 600px) {
            .v-card {
                padding: 8px;
            }
        }

<body>
    <canvas id="interactive-ring" aria-hidden="true"></canvas>
    <v-app id="App">
        <template>

            <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">About Me > Blog</main-system-bar>
            <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>

            <v-main id="Main">
                <transition name="Fade_Page">
                    <v-container v-show="Ready_Page" fluid class="pa-5">

                        <v-row>
                            <v-col cols="12" md="4" order="first" order-md="last">
                                <v-card class="mb-4">
                                    <v-card-title>About Me</v-card-title>
                                    <v-card-text>
                                        <v-row>
                                            <v-col cols="auto">
                                                <v-img lazy-src="../../Asset/Image/Icon_1_1.jpg"
                                                    src="../../Asset/Image/Icon_1_1.jpg"
                                                    style="border-radius: 50%; width: 5em; height: 5em;"></v-img>
                                            </v-col>
                                            <v-col>Hello. I'm FUM. i write articles about the world and Japan.</v-col>
                                        </v-row>
                                    </v-card-text>
                                </v-card>
                                <v-card class="mb-4">
                                    <v-date-picker v-model="selectedDate" @click:date="dateSelected"
                                        @update:picker-date="updatePickerDate" full-width no-title :events="postDates"
                                        event-color="primary" class="custom-date-picker"></v-date-picker>
                                    <v-card-text class="text-center py-0">
                                        <v-icon small style="color: #1976d2 !important;">mdi-circle</v-icon>
                                        <span class="ml-1 caption">Dates with posts</span>
                                    </v-card-text>
                                    <v-card-actions>
                                        <v-btn text color="primary" @click="showAllPosts">Show All</v-btn>
                                        <v-btn text color="primary" @click="showCurrentMonthPosts">Show Month</v-btn>
                                    </v-card-actions>
                                </v-card>
                                <v-card>
                                    <v-card-title>Themes</v-card-title>
                                    <v-card-text>
                                        <v-chip-group v-model="selectedThemes" column multiple>
                                            <v-chip v-for="theme in themes" :key="theme" :value="theme" filter outlined>
                                                {{ theme }}
                                            </v-chip>
                                        </v-chip-group>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                            <v-col cols="12" md="8" order="last" order-md="first">
                                <v-card class="all-posts-section">
                                    <v-card-title class="text-h5 mb-4">
                                        {{ pageTitle }}
                                        <v-chip v-if="selectedThemes.length > 0" class="ml-2" small color="primary">
                                            {{ filteredThemesText }}
                                        </v-chip>
                                    </v-card-title>
                                    <template v-if="filteredPosts.length > 0">
                                        <v-card v-for="post in filteredPosts" :key="post.id" class="mb-6 pb-1 blog-card"
                                            :class="{ 'story-locked-card': post.locked }"
                                            :id="'post-card-' + post.id">
                                            <template v-if="post.locked">
                                                <v-card-actions class="justify-center pt-8 pb-0">
                                                    <v-icon x-large color="#9edcff">mdi-lock-clock</v-icon>
                                                </v-card-actions>
                                                <v-card-title class="text-h6 justify-center pt-2 text-center">
                                                    {{ post.title }}
                                                    <v-chip small class="ml-2" color="#9edcff">Story {{ post.episode }}/7</v-chip>
                                                </v-card-title>
                                                <v-card-subtitle class="text-center pb-2">
                                                    <v-icon x-small color="#9edcff">mdi-calendar-clock</v-icon>
                                                    Opens {{ post.releaseText }}
                                                </v-card-subtitle>
                                                <v-card-text class="text-center caption pa-0 pb-6 story-locked-excerpt">
                                                    {{ post.excerpt }}
                                                </v-card-text>
                                            </template>
                                            <template v-else>
                                            <v-img v-if="post.image" :src="post.image" height="auto" style="max-height: 480px"></v-img>
                                            <v-card-title class="text-h6 pt-4">
                                                {{ post.title }}
                                                <v-chip v-if="post.episode" small class="ml-2" color="primary">Story {{ post.episode }}/7</v-chip>
                                            </v-card-title>
                                            <v-card-subtitle class="pb-2">{{ post.date }}</v-card-subtitle>
                                            <v-chip-group style="padding-left: 16px; padding-bottom: 16px;">
                                                <v-chip v-for="theme in post.themes" :key="theme" small>
                                                    {{ theme }}
                                                </v-chip>
                                            </v-chip-group>
                                            <v-card-text :key="'collapsed'">
                                                {{ post.excerpt }}
                                            </v-card-text>
                                            <v-card-actions class="pt-0 mb-2">
                                                <v-btn text @click="togglePost(post.id)">
                                                    {{ expandedPosts.includes(post.id) ? 'Close' : 'Read More' }}
                                                </v-btn>
                                            </v-card-actions>
                                            <v-card-text class="text-body-1 pb-4">
                                                <transition-group name="fade-slide" mode="out-in">
                                                    <div v-if="expandedPosts.includes(post.id)" :key="'expanded'">
                                                        <!-- 投稿ID=3 (大量絶滅) の場合、本文を分割してグラフを挿入 -->
                                                        <template v-if="post.id === 3">
                                                            <div v-html="post.content_part1"></div>
                                                            <div class="my-6">
                                                                <apexchart type="bar" height="350"
                                                                    :options="chartOptions" :series="chartSeries">
                                                                </apexchart>
                                                                <p class="caption text-right mt-1"><em>Source: Various
                                                                        scientific sources</em></p>
                                                            </div>
                                                            <div v-html="post.content_part2"></div>
                                                        </template>
                                                        <template v-else>
                                                            <div v-html="post.content"></div>
                                                        </template>
                                                        <div class="text-right mt-4 mb-4 mr-2">
                                                            <v-btn icon color="primary"
                                                                @click="scrollToCardTop(post.id)"
                                                                title="Scroll to top of card">
                                                                <v-icon style="color: #1976d2 !important;">mdi-arrow-up</v-icon>
                                                            </v-btn>
                                                        </div>
                                                    </div>
                                                </transition-group>
                                            </v-card-text>
                                            </template>
                                        </v-card>
                                    </template>
                                    <v-card-text v-else class="text-h6">
                                        No posts available for this period or themes.
                                    </v-card-text>
                                </v-card>
                            </v-col>
                        </v-row>

                    </v-container>
                </transition>
            </v-main>

            <main-footer></main-footer>

        </template>
    </v-app>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <script src="../../Asset/Javascript/Common.js?v=1.03"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>


    <script>
        new Vue({
            el: '#App',
            vuetify: new Vuetify(),
            components: {
                apexchart: VueApexCharts,
            },
            mixins: [window.Mixins_Common],
            data: {
                selectedDate: null,
                showCurrentMonth: false,
                pickerDate: new Date(),
                expandedPosts: [],
                selectedThemes: [],
                themes: [
                    'Cooking',
                    'Culture',
                    'Food',
                    'Health',
                    'History',
                    'Japan',
                    'Science',
                    'Greeting',
                    'Story',
                ],
                storyPosts: [],
                storyFiles: [
                    {
                        episode: 1,
                        title: '第1話「輪郭」',
                        date: '2026-09-19',
                        file: '../../Asset/Data/Story/七日目の円/第1話_輪郭.md',
                        excerpt: '　Day 1 of the series — a boy who draws a circle every morning, and the quiet oddness of a perfectly managed city.',
                    },
                    {
                        episode: 2,
                        title: '第2話「満たされる」',
                        date: '2026-09-20',
                        file: '../../Asset/Data/Story/七日目の円/第2話_満たされる.md',
                        excerpt: '　Day 2 — the sweetness of a full life begins to reveal a small poison.',
                    },
                    {
                        episode: 3,
                        title: '第3話「反響」',
                        date: '2026-09-21',
                        file: '../../Asset/Data/Story/七日目の円/第3話_反響.md',
                        excerpt: '　Day 3 — a voice comes from the bridge at dawn, carrying a strange question about the circle.',
                    },
                    {
                        episode: 4,
                        title: '第4話「八分目という名の鎖」',
                        date: '2026-09-22',
                        file: '../../Asset/Data/Story/七日目の円/第4話_八分目という名の鎖.md',
                        excerpt: '　Day 4 — the rule of "eight-part fullness" turns out to be shaped like a chain.',
                    },
                    {
                        episode: 5,
                        title: '第5話「臨童」',
                        date: '2026-09-23',
                        file: '../../Asset/Data/Story/七日目の円/第5話_臨童.md',
                        excerpt: '　Day 5 — the sphere calls the boy inside. A sea of memories spreads out before him.',
                    },
                    {
                        episode: 6,
                        title: '第6話「満ちる」',
                        date: '2026-09-24',
                        file: '../../Asset/Data/Story/七日目の円/第6話_満ちる.md',
                        excerpt: '　Day 6 — on the wall, the boy draws a circle that is complete.',
                    },
                    {
                        episode: 7,
                        title: '第7話「満ちない円」',
                        date: '2026-09-25',
                        file: '../../Asset/Data/Story/七日目の円/第7話_満ちない円.md',
                        excerpt: '　Day 7 — outside the ring. A rain-filled morning, and an unfinished circle.',
                    },
                ],
                blogPosts: [],
                blogFiles: [
                    '../../Asset/Data/Blog/2024-07.json',
                    '../../Asset/Data/Blog/2024-08.json',
                    '../../Asset/Data/Blog/2025-06.json',
                    '../../Asset/Data/Blog/2025-07.json',
                    '../../Asset/Data/Blog/2026-01.json',
                    '../../Asset/Data/Blog/2026-02.json',
                    '../../Asset/Data/Blog/2026-03.json',
                    '../../Asset/Data/Blog/2026-10.json',
                    '../../Asset/Data/Blog/2026-11.json',
                    '../../Asset/Data/Blog/2026-12.json',
                ],
                chartSeries: [{ name: 'Species Lost', data: [96, 85, 80, 76, 75] }],
            },
            computed: {
                isMobile() {
                    // Vuetify's breakpoint utility to check for mobile screens
                    return this.$vuetify.breakpoint.smAndDown;
                },
                chartOptions() {
                    // Return different options based on screen size
                    if (this.isMobile) {
                        // Options for Mobile (Vertical Bar Chart)
                        return {
                            chart: { type: 'bar', height: 400, toolbar: { show: false }, foreColor: '#333' },
                            plotOptions: { bar: { borderRadius: 4, horizontal: false } },
                            dataLabels: { enabled: false }, // Labels inside bars can be cluttered on mobile
                            xaxis: {
                                categories: [
                                    'Permian-Triassic', // Shortened for mobile
                                    'Ordovician-Silurian',
                                    'Triassic-Jurassic',
                                    'Cretaceous-Paleogene', // Shortened for mobile
                                    'Late Devonian',
                                ],
                                labels: {
                                    rotate: -45,
                                    rotateAlways: true,
                                    trim: true,
                                    style: { fontSize: '10px' }
                                },
                            },
                            yaxis: {
                                title: { text: 'Estimated Species Lost (%)' }
                            },
                            tooltip: { y: { formatter: (val) => val + "% of all species" } },
                            fill: { opacity: 1 },
                            colors: ['#c0392b'],
                            title: { text: 'Severity of Mass Extinctions', align: 'center', style: { fontSize: '14px', color: '#263238' } },
                        };
                    } else {
                        // Options for Desktop (Horizontal Bar Chart)
                        return {
                            chart: { type: 'bar', height: 350, toolbar: { show: false }, foreColor: '#333' },
                            plotOptions: { bar: { borderRadius: 4, horizontal: true, } },
                            dataLabels: {
                                enabled: true,
                                formatter: (val) => val + "%",
                                offsetX: -10,
                                style: { fontSize: '12px', colors: ["#fff"] }
                            },
                            xaxis: {
                                categories: [
                                    'Permian-Triassic ("The Great Dying")',
                                    'Ordovician-Silurian',
                                    'Triassic-Jurassic',
                                    'Cretaceous-Paleogene (Dinosaur Extinction)',
                                    'Late Devonian',
                                ],
                                title: { text: 'Estimated Percentage of Species Lost', style: { color: '#666' } }
                            },
                            tooltip: { y: { formatter: (val) => val + "% of all species" } },
                            fill: { opacity: 1 },
                            colors: ['#c0392b'],
                            title: { text: 'Severity of The "Big Five" Mass Extinctions', align: 'center', style: { fontSize: '16px', color: '#263238' } },
                        };
                    }
                },
                filteredPosts() {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    const dateGate = (post) => {
                        if (this.selectedDate) {
                            return new Date(post.date).toDateString() === new Date(this.selectedDate).toDateString();
                        }
                        if (this.showCurrentMonth) {
                            return new Date(post.date).getMonth() === this.pickerDate.getMonth() &&
                                new Date(post.date).getFullYear() === this.pickerDate.getFullYear();
                        }
                        return true;
                    };
                    const themeGate = (post) => this.selectedThemes.length === 0 ||
                        this.selectedThemes.some(theme => post.themes.includes(theme));

                    const standard = this.blogPosts.filter(post => {
                        const postDate = new Date(post.date);
                        postDate.setHours(0, 0, 0, 0);
                        return postDate <= today && dateGate(post) && themeGate(post);
                    });

                    const stories = this.storyPosts.filter(post => {
                        if (post.locked) return false;
                        if (!themeGate(post)) return false;
                        return dateGate(post);
                    });

                    const allPosts = [...standard, ...stories];
                    allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                    return allPosts;
                },
                pageTitle() {
                    if (this.selectedDate) {
                        return `Posts for ${this.formattedDate}`;
                    } else if (this.showCurrentMonth) {
                        return `Posts for ${this.pickerDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long' })}`;
                    } else {
                        return 'All Posts';
                    }
                },
                formattedDate() {
                    if (!this.selectedDate) return '';
                    const date = new Date(this.selectedDate);
                    return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                },
                postDates() {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const blog = this.blogPosts
                        .filter(post => {
                            const postDate = new Date(post.date);
                            postDate.setHours(0, 0, 0, 0);
                            return postDate <= today;
                        })
                        .map(post => post.date);
                    const stories = this.storyPosts
                        .filter(post => !post.locked)
                        .map(post => post.date);
                    return [...blog, ...stories];
                },
                filteredThemesText() {
                    const count = this.selectedThemes.length;
                    if (count === 0) return 'All Themes';
                    if (count === 1) return '1 Theme Selected';
                    return `${count} Themes Selected`;
                },
            },
            methods: {
                dateSelected(date) {
                    this.selectedDate = date;
                    this.showCurrentMonth = false;
                },
                updatePickerDate(date) {
                    this.pickerDate = new Date(date);
                },
                showAllPosts() {
                    this.selectedDate = null;
                    this.showCurrentMonth = false;
                },
                showCurrentMonthPosts() {
                    this.selectedDate = null;
                    this.showCurrentMonth = true;
                },
                togglePost(postId) {
                    const index = this.expandedPosts.indexOf(postId);
                    if (index > -1) {
                        // 既に配列にあれば削除 (閉じる)
                        this.expandedPosts.splice(index, 1);
                    } else {
                        // なければ追加 (開く)
                        this.expandedPosts.push(postId);
                    }
                },
                scrollToCardTop(postId) {
                    const cardElement = document.getElementById(`post-card-${postId}`);
                    if (cardElement) {
                        cardElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                },
                formatReleaseText(date) {
                    const d = new Date(date);
                    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric' }) + ' 0:00';
                },
                renderMarkdown(md) {
                    if (!md) return '';
                    let text = md.replace(/^\uFEFF/, '');
                    // 本文の先頭にある "# 第X話「...」" タイトル行を除去 (タイトルはカード側で表示)
                    text = text.replace(/^#[^\r\n]*\r?\n?/, '');
                    if (window.marked) {
                        // 小説の改行レイアウトを保つため、行内改行を <br> として出力
                        window.marked.setOptions({ breaks: true, gfm: true });
                        return window.marked.parse(text);
                    }
                    // marked が読めない場合の簡易変換 (改行ベース)
                    return text
                        .split(/\n{2,}/)
                        .map(block => '<p>' + block.replace(/\n/g, '<br>') + '</p>')
                        .join('');
                },

                loadBlog() {
                    Promise.all(
                        this.blogFiles.map(file =>
                            fetch(file)
                                .then(res => {
                                    if (!res.ok) throw new Error('HTTP ' + res.status);
                                    return res.json();
                                })
                                .catch(err => {
                                    console.error('Failed to load blog file: ' + file, err);
                                    return [];
                                })
                        )
                    ).then(lists => {
                        this.blogPosts = [].concat(...lists);
                    });
                },
                loadStory() {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    this.storyPosts = this.storyFiles.map(item => {
                        const postDate = new Date(item.date);
                        postDate.setHours(0, 0, 0, 0);
                        return {
                            id: 100 + item.episode,
                            episode: item.episode,
                            title: item.title,
                            date: item.date,
                            excerpt: item.excerpt,
                            themes: ['Story'],
                            image: null,
                            locked: postDate > today,
                            releaseText: this.formatReleaseText(item.date),
                            content: '',
                        };
                    });
                    this.storyFiles.forEach((item, index) => {
                        fetch(item.file)
                            .then(res => {
                                if (!res.ok) throw new Error('HTTP ' + res.status);
                                return res.text();
                            })
                            .then(md => {
                                this.storyPosts[index].content = this.renderMarkdown(md);
                            })
                            .catch(err => {
                                console.error('Failed to load story file: ' + item.file, err);
                            });
                    });
                },
            },
            mounted() {
                this.loadBlog();
                this.loadStory();
            },
        })
    </script>

    <script>
        (function () {
            const canvas = document.getElementById('interactive-ring');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = 0;
            let height = 0;
            const particles = [];

            function randomParticle() {
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: 0.5 + Math.random() * 1.2,
                    alpha: 0.2 + Math.random() * 0.35,
                    phase: Math.random() * Math.PI * 2,
                    age: 0,
                    life: 260 + Math.random() * 380
                };
            }

            function resetParticle(p) {
                p.x = Math.random() * width;
                p.y = Math.random() * height;
                p.vx = (Math.random() - 0.5) * 0.3;
                p.vy = (Math.random() - 0.5) * 0.3;
                p.size = 0.5 + Math.random() * 1.2;
                p.alpha = 0.2 + Math.random() * 0.35;
                p.phase = Math.random() * Math.PI * 2;
                p.age = 0;
                p.life = 260 + Math.random() * 380;
            }

            function createScene() {
                particles.length = 0;
                const isMobile = width < 768;
                const particleCount = isMobile ? 64 : 64;
                for (let i = 0; i < particleCount; i++) {
                    const p = randomParticle();
                    p.age = Math.random() * p.life;
                    particles.push(p);
                }
            }

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                createScene();
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, width, height);
            }

            function fieldForce(x, y, t) {
                const c1x = width * (0.5 + Math.sin(t * 0.28) * 0.24);
                const c1y = height * (0.5 + Math.cos(t * 0.34) * 0.20);
                const c2x = width * (0.5 + Math.sin(t * 0.41 + 1.3) * 0.27);
                const c2y = height * (0.5 + Math.cos(t * 0.23 + 0.7) * 0.22);

                const dx1 = c1x - x;
                const dy1 = c1y - y;
                const dx2 = c2x - x;
                const dy2 = c2y - y;

                const d1 = dx1 * dx1 + dy1 * dy1 + 140;
                const d2 = dx2 * dx2 + dy2 * dy2 + 140;

                const g = 90;
                const f1x = (dx1 / d1) * g;
                const f1y = (dy1 / d1) * g;
                const f2x = -(dx2 / d2) * g * 0.75;
                const f2y = -(dy2 / d2) * g * 0.75;

                const rot = Math.sin(t * 0.52) * 0.06;
                const rx = -(y - height * 0.5) * rot / Math.max(height, 1);
                const ry = (x - width * 0.5) * rot / Math.max(width, 1);

                const wave = Math.sin((x * 0.008) + (y * 0.006) + t * 1.4) * 0.04;
                const wx = Math.cos(t * 0.8 + y * 0.004) * wave;
                const wy = Math.sin(t * 0.9 + x * 0.004) * wave;

                return { x: f1x + f2x + rx + wx, y: f1y + f2y + ry + wy };
            }

            function animate(now) {
                requestAnimationFrame(animate);
                const t = now * 0.001;

                ctx.fillStyle = 'rgba(2, 8, 20, 0.22)';
                ctx.fillRect(0, 0, width, height);
                ctx.globalCompositeOperation = 'screen';

                const phasePulse = 0.55 + Math.sin(t * 0.42) * 0.45;
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const prevX = p.x;
                    const prevY = p.y;
                    const f = fieldForce(p.x, p.y, t + p.phase);
                    p.age += 1;

                    const lifeProgress = p.age / p.life;
                    if (lifeProgress >= 1) {
                        resetParticle(p);
                        continue;
                    }

                    const fadeIn = Math.min(1, lifeProgress / 0.18);
                    const fadeOut = Math.min(1, (1 - lifeProgress) / 0.24);
                    const lifeEnvelope = Math.max(0, Math.min(fadeIn, fadeOut));

                    p.vx = (p.vx + f.x) * 0.965;
                    p.vy = (p.vy + f.y) * 0.965;
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < -20 || p.x > width + 20 || p.y < -20 || p.y > height + 20) {
                        resetParticle(p);
                        continue;
                    }

                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(p.x, p.y);
                    ctx.lineWidth = p.size;
                    ctx.strokeStyle = `hsla(${205 + phasePulse * 30}, 85%, ${48 + phasePulse * 16}%, ${p.alpha * (0.6 + phasePulse * 0.4) * lifeEnvelope})`;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = `hsla(${200 + phasePulse * 40}, 95%, 62%, ${0.24 * lifeEnvelope})`;
                    ctx.stroke();
                }

                ctx.shadowBlur = 0;
                ctx.globalCompositeOperation = 'source-over';
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(animate);
        })();
    </script>
