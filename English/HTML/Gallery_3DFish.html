    <script type="module">

        import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
        import {
            Mobile_or_Desktop,

            FC_Input_Joystick,

        const Scene = new THREE.Scene();
        const Renderer = new THREE.WebGLRenderer({ canvas: document.querySelector("#Canvas"), antialias: true });
        Renderer.setPixelRatio(window.devicePixelRatio);

        const FISH_COUNT = 25;
        const WORLD_BOUNDS = 30;
        const FISH_COLORS = [
            [1.0, 0.45, 0.1],
            [0.1, 0.7, 0.9],
            [1.0, 0.85, 0.2],
            [0.2, 0.9, 0.5],
            [0.95, 0.25, 0.4],
            [0.5, 0.3, 0.95],
            [1.0, 0.6, 0.8],
            [0.3, 0.95, 0.85],
            [0.85, 0.55, 1.0],
            [0.95, 0.95, 0.4],
        ];

        class C_FishGeometry {
            static _catmullRom(p0, p1, p2, p3, t) {
                const t2 = t * t, t3 = t2 * t;
                return 0.5 * ((2*p1) + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t2 + (-p0+3*p1-3*p2+p3)*t3);
            }

            static _sampleProfile(t) {
                const pts = [0.14, 0.24, 0.32, 0.38, 0.40, 0.41, 0.39, 0.34, 0.25, 0.16, 0.09, 0.03, 0.00];
                const n = pts.length - 1;
                const seg = Math.min(Math.floor(t * n), n - 1);
                const lt = t * n - seg;
                return this._catmullRom(pts[Math.max(0,seg-1)], pts[seg], pts[Math.min(n,seg+1)], pts[Math.min(n,seg+2)], lt);
            }

            static createBodyBuffer(segmentsX, segmentsY) {
                const positions = [], normals = [], indices = [];
                for (let ix = 0; ix <= segmentsX; ix++) {
                    const t = ix / segmentsX;
                    const x = (t - 0.5) * 2.0;
                    const radius = this._sampleProfile(t);
                    for (let iy = 0; iy <= segmentsY; iy++) {
                        const angle = (iy / segmentsY) * Math.PI * 2;
                        positions.push(x, Math.sin(angle) * radius, Math.cos(angle) * radius * 0.6);
                        normals.push(0, Math.sin(angle), Math.cos(angle));
                    }
                }
                for (let ix = 0; ix < segmentsX; ix++) {
                    for (let iy = 0; iy < segmentsY; iy++) {
                        const a = ix*(segmentsY+1)+iy, b = a+1, c = (ix+1)*(segmentsY+1)+iy, d = c+1;
                        indices.push(a,c,b, b,c,d);
                    }
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();
                return geometry;
            }

            static _subdivideTriangle(v0, v1, v2, steps) {
                const pts = [];
                for (let i = 0; i <= steps; i++) {
                    for (let j = 0; j <= steps - i; j++) {
                        const u = i/steps, v = j/steps, w = 1-u-v;
                        pts.push(v0[0]*w+v1[0]*u+v2[0]*v, v0[1]*w+v1[1]*u+v2[1]*v, v0[2]*w+v1[2]*u+v2[2]*v);
                    }
                }
                return pts;
            }

            static _makeGeom(positions) {
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                g.computeVertexNormals();
                return g;
            }

            static createTailGeometry() {
                const s = 5, p = [];
                p.push(...this._subdivideTriangle([0,0,0], [0.55,0.5,0], [0.1,0.1,0], s));
                p.push(...this._subdivideTriangle([0,0,0], [0.55,-0.5,0], [0.1,-0.1,0], s));
                p.push(...this._subdivideTriangle([0.1,0.1,0], [0,0,0], [0.1,-0.1,0], s));
                return this._makeGeom(p);
            }

            static createDorsalFinGeometry() {
                const s = 3, p = [];
                p.push(...this._subdivideTriangle([-0.12,0,0], [0.12,0.12,0], [0.12,0,0], s));
                p.push(...this._subdivideTriangle([0.12,0.12,0], [-0.05,0.06,0], [0.12,0,0], s));
                return this._makeGeom(p);
            }

            static createPectoralFinGeometry() {
                return this._makeGeom(this._subdivideTriangle([0,0,0], [-0.18,-0.06,0.14], [0.06,-0.08,0.05], 4));
            }

            static createPelvicFinGeometry() {
                return this._makeGeom(this._subdivideTriangle([0,0,0], [-0.06,-0.1,0.08], [0.06,-0.1,0.08], 3));
            }

            static createAnalFinGeometry() {
                return this._makeGeom(this._subdivideTriangle([0,0,0], [-0.08,-0.1,0], [0.12,-0.12,0], 3));
            }
        }

        class C_Fish {
            _mesh = null;
            _bodyMesh = null;
            _tailMesh = null;
            _dorsalMesh = null;
            _group = null;

            _position = new THREE.Vector3();
            _velocity = new THREE.Vector3();
            _acceleration = new THREE.Vector3();

            _phase = 0;
            _tailPhase = 0;
            _bodyWavePhase = 0;

            _colorIndex = 0;
            _scaleValue = 1.0;
            _speed = 0;

            _bodyOriginalPositions = null;
            _tailOriginalPositions = null;

            get Group() { return this._group; }
            get Position() { return this._position; }
            get Velocity() { return this._velocity; }

            _bodyPoints = null;
            _tailPoints = null;
            _dorsalPoints = null;
            _pectoralLeftPoints = null;
            _pectoralRightPoints = null;
            _pelvicLeftPoints = null;
            _pelvicRightPoints = null;
            _analPoints = null;

            constructor(bodyGeometry, tailGeometry, dorsalGeometry, pectoralGeometry, pelvicGeometry, analGeometry, colorRGB, scale) {
                this._colorIndex = Math.floor(Math.random() * FISH_COLORS.length);
                this._scaleValue = scale || (0.6 + Math.random() * 0.8);
                this._speed = 0.8 + Math.random() * 0.6;
                this._phase = Math.random() * Math.PI * 2;
                this._tailPhase = Math.random() * Math.PI * 2;
                this._bodyWavePhase = Math.random() * Math.PI * 2;

                const color = colorRGB || FISH_COLORS[this._colorIndex];

                this._group = new THREE.Group();

                const bodyColor = new THREE.Color(color[0], color[1], color[2]);
                const bodyMat = new THREE.MeshBasicMaterial({ color: bodyColor, transparent: true, opacity: 0, depthWrite: false });
                this._bodyMesh = new THREE.Mesh(bodyGeometry.clone(), bodyMat);
                this._bodyOriginalPositions = this._bodyMesh.geometry.attributes.position.array.slice();

                const tailColor = new THREE.Color(color[0] * 0.85, color[1] * 0.85, color[2] * 0.85);
                const tailMat = new THREE.MeshBasicMaterial({ color: tailColor, transparent: true, opacity: 0, depthWrite: false });
                this._tailMesh = new THREE.Mesh(tailGeometry.clone(), tailMat);
                this._tailOriginalPositions = this._tailMesh.geometry.attributes.position.array.slice();

                const dorsalColor = new THREE.Color(Math.min(1, color[0]*1.1), Math.min(1, color[1]*1.1), Math.min(1, color[2]*1.1));
                const finColor = new THREE.Color(color[0]*0.9, color[1]*0.9, color[2]*0.9);

                const ptsMat = (c) => new THREE.PointsMaterial({
                    color: c, size: 0.025, transparent: true, opacity: 0.95, sizeAttenuation: true, depthWrite: false,
                });

                this._bodyPoints = new THREE.Points(this._bodyMesh.geometry, ptsMat(bodyColor));
                this._tailPoints = new THREE.Points(this._tailMesh.geometry, ptsMat(tailColor));
                this._tailPoints.position.set(0.85, 0, 0);

                this._dorsalPoints = new THREE.Points(dorsalGeometry, ptsMat(dorsalColor));
                this._dorsalPoints.position.set(0.2, 0.35, 0);

                this._pectoralLeftPoints = new THREE.Points(pectoralGeometry, ptsMat(finColor));
                this._pectoralLeftPoints.position.set(-0.6, -0.05, 0.22);

                this._pectoralRightPoints = new THREE.Points(pectoralGeometry, ptsMat(finColor));
                this._pectoralRightPoints.position.set(-0.6, -0.05, -0.22);
                this._pectoralRightPoints.scale.z = -1;

                this._pelvicLeftPoints = new THREE.Points(pelvicGeometry, ptsMat(finColor));
                this._pelvicLeftPoints.position.set(-0.3, -0.35, 0.10);

                this._pelvicRightPoints = new THREE.Points(pelvicGeometry, ptsMat(finColor));
                this._pelvicRightPoints.position.set(-0.3, -0.35, -0.10);
                this._pelvicRightPoints.scale.z = -1;

                this._analPoints = new THREE.Points(analGeometry, ptsMat(finColor));
                this._analPoints.position.set(0.44, -0.18, 0);

                this._group.add(this._bodyPoints);
                this._group.add(this._tailPoints);
                this._group.add(this._dorsalPoints);
                this._group.add(this._pectoralLeftPoints);
                this._group.add(this._pectoralRightPoints);
                this._group.add(this._pelvicLeftPoints);
                this._group.add(this._pelvicRightPoints);
                this._group.add(this._analPoints);

                this._group.scale.setScalar(this._scaleValue);
            }

            Initialize(position) {
                this._position.copy(position);
                const angle = Math.random() * Math.PI * 2;
                this._velocity.set(
                    Math.cos(angle) * this._speed,
                    (Math.random() - 0.5) * 0.1,
                    Math.sin(angle) * this._speed
                );
                this._group.position.copy(this._position);
                this._UpdateRotation();
            }

            _UpdateRotation() {
                if (this._velocity.lengthSq() > 0.001) {
                    const targetAngle = Math.atan2(this._velocity.x, this._velocity.z);
                    let current = this._group.rotation.y;
                    let diff = targetAngle - current;

                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;

                    this._group.rotation.y += diff * 0.1;

                    const tilt = -this._velocity.y * 0.3;
                    this._group.rotation.z = THREE.MathUtils.lerp(this._group.rotation.z, tilt, 0.05);
                }
            }

            ApplyBoidRules(neighbors, time) {
                const separation = new THREE.Vector3();
                const alignment = new THREE.Vector3();
                const cohesion = new THREE.Vector3();
                let separationCount = 0;
                let alignCount = 0;
                let cohesionCount = 0;

                const separationRadius = 2.0;
                const alignmentRadius = 5.0;
                const cohesionRadius = 6.0;

                for (const other of neighbors) {
                    if (other === this) continue;
                    const dist = this._position.distanceTo(other._position);

                    if (dist < separationRadius && dist > 0.001) {
                        const diff = new THREE.Vector3().subVectors(this._position, other._position);
                        diff.divideScalar(dist * dist);
                        separation.add(diff);
                        separationCount++;
                    }

                    if (dist < alignmentRadius) {
                        alignment.add(other._velocity);
                        alignCount++;
                    }

                    if (dist < cohesionRadius) {
                        cohesion.add(other._position);
                        cohesionCount++;
                    }
                }

                if (separationCount > 0) {
                    separation.divideScalar(separationCount);
                    separation.normalize().multiplyScalar(0.15);
                }
                if (alignCount > 0) {
                    alignment.divideScalar(alignCount);
                    alignment.normalize().multiplyScalar(0.08);
                }
                if (cohesionCount > 0) {
                    cohesion.divideScalar(cohesionCount);
                    cohesion.sub(this._position);
                    cohesion.normalize().multiplyScalar(0.04);
                }

                this._acceleration.add(separation);
                this._acceleration.add(alignment);
                this._acceleration.add(cohesion);
            }

            ApplyBounds(time) {
                const steer = new THREE.Vector3();
                const margin = 5.0;
                const turnForce = 0.08;

                if (this._position.x > WORLD_BOUNDS - margin) {
                    steer.x -= turnForce;
                } else if (this._position.x < -WORLD_BOUNDS + margin) {
                    steer.x += turnForce;
                }
                if (this._position.y > 8) {
                    steer.y -= turnForce;
                } else if (this._position.y < -6) {
                    steer.y += turnForce;
                }
                if (this._position.z > WORLD_BOUNDS - margin) {
                    steer.z -= turnForce;
                } else if (this._position.z < -WORLD_BOUNDS + margin) {
                    steer.z += turnForce;
                }

                this._acceleration.add(steer);
            }

            Update(time, deltaTime) {
                this._phase += deltaTime;
                this._tailPhase += deltaTime * 8.0;
                this._bodyWavePhase += deltaTime * 3.0;

                this._velocity.add(this._acceleration);
                this._acceleration.set(0, 0, 0);

                const maxSpeed = this._speed * 1.5;
                const currentSpeed = this._velocity.length();
                if (currentSpeed > maxSpeed) {
                    this._velocity.normalize().multiplyScalar(maxSpeed);
                }
                if (currentSpeed < this._speed * 0.3) {
                    this._velocity.normalize().multiplyScalar(this._speed * 0.3);
                }

                this._position.addScaledVector(this._velocity, deltaTime);
                this._group.position.copy(this._position);

                this._UpdateRotation();
                this._AnimateTail(time);
                this._AnimateBody(time);
                this._AnimateDorsalFin(time);
                this._AnimateFins(time);
            }

            _AnimateTail(time) {
                const posAttr = this._tailMesh.geometry.attributes.position;
                const orig = this._tailOriginalPositions;
                const count = posAttr.count;

                for (let i = 0; i < count; i++) {
                    const ox = orig[i * 3];
                    const oy = orig[i * 3 + 1];
                    const oz = orig[i * 3 + 2];

                    const tailFactor = Math.min(ox / 0.55, 1.0);
                    const wagAmount = tailFactor * 0.4 * Math.sin(this._tailPhase + tailFactor * 2.0);

                    posAttr.setX(i, ox);
                    posAttr.setY(i, oy);
                    posAttr.setZ(i, oz + wagAmount);
                }
                posAttr.needsUpdate = true;
                this._tailMesh.geometry.computeVertexNormals();
            }

            _AnimateBody(time) {
                const posAttr = this._bodyMesh.geometry.attributes.position;
                const orig = this._bodyOriginalPositions;
                const count = posAttr.count;

                for (let i = 0; i < count; i++) {
                    const ox = orig[i * 3];
                    const oy = orig[i * 3 + 1];
                    const oz = orig[i * 3 + 2];

                    const t = (ox + 1.0) / 2.0;
                    const wave = Math.sin(this._bodyWavePhase + t * 4.0) * 0.02 * t;

                    posAttr.setX(i, ox);
                    posAttr.setY(i, oy + wave);
                    posAttr.setZ(i, oz);
                }
                posAttr.needsUpdate = true;
                this._bodyMesh.geometry.computeVertexNormals();
            }

            _AnimateDorsalFin(time) {
                const finWave = Math.sin(this._bodyWavePhase * 1.5) * 0.05;
                this._dorsalPoints.rotation.z = finWave;
            }

            _AnimateFins(time) {
                const flap = Math.sin(this._bodyWavePhase * 2.0) * 0.15;
                this._pectoralLeftPoints.rotation.x = flap;
                this._pectoralRightPoints.rotation.x = -flap;
                this._pelvicLeftPoints.rotation.x = flap * 0.5;
                this._pelvicRightPoints.rotation.x = -flap * 0.5;
                this._analPoints.rotation.z = Math.sin(this._bodyWavePhase * 1.5) * 0.03;
            }
        }

        class C_BubbleSystem {
            _scene = null;
            _count = 0;
            _positions = null;
            _velocities = null;
            _sizes = null;
            _lifetimes = null;
            _maxLifetimes = null;
            _geometry = null;
            _material = null;
            _points = null;
            _texture = null;

            constructor(scene, count) {
                this._scene = scene;
                this._count = count;

                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
                grad.addColorStop(0, 'rgba(200, 240, 255, 0.9)');
                grad.addColorStop(0.3, 'rgba(150, 220, 255, 0.4)');
                grad.addColorStop(0.7, 'rgba(100, 180, 255, 0.1)');
                grad.addColorStop(1, 'rgba(80, 160, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(32, 32, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(200, 240, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(28, 26, 8, 0, Math.PI * 2);
                ctx.stroke();
                this._texture = new THREE.CanvasTexture(canvas);

                this._positions = new Float32Array(count * 3);
                this._velocities = new Float32Array(count);
                this._sizes = new Float32Array(count);
                this._lifetimes = new Float32Array(count);
                this._maxLifetimes = new Float32Array(count);

                for (let i = 0; i < count; i++) {
                    this._ResetBubble(i, true);
                }

                this._geometry = new THREE.BufferGeometry();
                this._geometry.setAttribute('position', new THREE.BufferAttribute(this._positions, 3));
                this._geometry.setAttribute('size', new THREE.BufferAttribute(this._sizes, 1));

                this._material = new THREE.ShaderMaterial({
                    uniforms: {
                        uTexture: { value: this._texture },
                        uTime: { value: 0 },
                    },
                    vertexShader: `
                        attribute float size;
                        uniform float uTime;
                        varying float vAlpha;
                        void main() {
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = clamp(size * (200.0 / -mvPosition.z), 1.0, 16.0);
                            gl_Position = projectionMatrix * mvPosition;
                            vAlpha = 0.6 + 0.4 * sin(uTime * 2.0 + position.y);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D uTexture;
                        varying float vAlpha;
                        void main() {
                            vec4 tex = texture2D(uTexture, gl_PointCoord);
                            gl_FragColor = vec4(tex.rgb, tex.a * vAlpha);
                        }
                    `,
                    transparent: true,
                    depthWrite: false,
                    fog: false,
                });

                this._points = new THREE.Points(this._geometry, this._material);
                this._points.frustumCulled = false;
                this._scene.add(this._points);
            }

            _ResetBubble(i, initial) {
                this._positions[i * 3] = (Math.random() - 0.5) * WORLD_BOUNDS * 2;
                this._positions[i * 3 + 1] = initial ? Math.random() * 15 - 6 : -6 + Math.random() * 2;
                this._positions[i * 3 + 2] = (Math.random() - 0.5) * WORLD_BOUNDS * 2;
                this._velocities[i] = 0.3 + Math.random() * 0.6;
                this._sizes[i] = 0.08 + Math.random() * 0.15;
                this._maxLifetimes[i] = 8 + Math.random() * 12;
                this._lifetimes[i] = 0;
            }

            Update(time, deltaTime) {
                this._material.uniforms.uTime.value = time;

                for (let i = 0; i < this._count; i++) {
                    this._lifetimes[i] += deltaTime;
                    if (this._lifetimes[i] >= this._maxLifetimes[i]) {
                        this._ResetBubble(i, false);
                        continue;
                    }

                    this._positions[i * 3] += Math.sin(time * 0.8 + i * 1.3) * deltaTime * 0.15;
                    this._positions[i * 3 + 1] += this._velocities[i] * deltaTime;
                    this._positions[i * 3 + 2] += Math.cos(time * 0.6 + i * 0.9) * deltaTime * 0.1;

                    if (this._positions[i * 3 + 1] > 10) {
                        this._ResetBubble(i, false);
                    }
                }

                this._geometry.attributes.position.needsUpdate = true;
                this._geometry.attributes.size.needsUpdate = true;
            }

            destructor() {
                this._scene.remove(this._points);
                this._geometry.dispose();
                this._material.dispose();
            }
        }

        class C_UnderwaterLight {
            constructor(scene) {
                const ambient = new THREE.AmbientLight(0x1a3a5c, 0.6);
                scene.add(ambient);

                const sunLight = new THREE.DirectionalLight(0x4488cc, 0.7);
                sunLight.position.set(5, 20, 5);
                scene.add(sunLight);

                const fillLight = new THREE.DirectionalLight(0x2255aa, 0.3);
                fillLight.position.set(-10, 5, -10);
                scene.add(fillLight);

                const causticLight = new THREE.PointLight(0x336699, 0.5, 40);
                causticLight.position.set(0, 12, 0);
                scene.add(causticLight);
            }
        }

        class C_Manager extends FC_Manager {
            _JOYSTICK_LEFT = new FC_Input_Joystick(document.getElementById("Joystick_Left"));
            _JOYSTICK_RIGHT = new FC_Input_Joystick(document.getElementById("Joystick_Right"));
            _SENSIVILITY = Mobile_or_Desktop() ? 0.0003 : 0.00015;
            _Input_Keyboard = new FC_Input_Keyboard();

            _Input_Look = new THREE.Vector2(0, 0);
            _MouseDelta = new THREE.Vector2(0, 0);
            _RotateLook = new THREE.Vector2(0, 0);

            _UI_Home = null;
            _Button_Home = null;
            _Fishes = [];
            _BubbleSystem = null;
            _CameraLook = { x: 0, y: 0 };
            _isDragging = false;
            _previousMousePosition = { x: 0, y: 0 };
            _cameraZoom = 15;
            _cameraTargetZoom = 15;

            constructor() { super(Scene, Renderer); }

            Initialize() {
                super.Initialize();

                Camera.Initialize();
                Camera.Target = { Position: new THREE.Vector3(0, 0, 0) };
                Camera.Position = new THREE.Vector3(0, 0, 15);
                Camera._Yaw = 0;
                Camera._Pitch = 0;
                Camera._Forward = new THREE.Vector3(0, 0, -1);

                this._UI_Home = new FC_TextPlane(Scene, Camera, "HOME", "#8FBFFF", new THREE.Vector2(4.8, 1.2).multiplyScalar(FC_Manager.UI_SIZE_MULTIPLY), false, false);
                this._UI_Home.Initialize();
                this._UI_Home.Fog = false;
                this._UI_Home.Depth_Test = true;

                const sphereGlassMat = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uOpacity: { value: 0.04 },
                        uBaseColor: { value: new THREE.Color(0.3, 0.6, 1.0) },
                        uFresnelColor: { value: new THREE.Color(0.5, 0.75, 1.0) },
                        uSpecularColor: { value: new THREE.Color(0.9, 0.95, 1.0) },
                        uFresnelPower: { value: 2.8 },
                        uSpecularPower: { value: 96.0 },
                        uEdgeGlowIntensity: { value: 0.8 },
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        void main() {
                            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                            vec4 mvPosition = viewMatrix * worldPosition;
                            vViewPosition = -mvPosition.xyz;
                            vNormal = normalize(normalMatrix * normal);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        uniform float uOpacity;
                        uniform vec3 uBaseColor;
                        uniform vec3 uFresnelColor;
                        uniform vec3 uSpecularColor;
                        uniform float uFresnelPower;
                        uniform float uSpecularPower;
                        uniform float uEdgeGlowIntensity;
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        void main() {
                            vec3 viewDir = normalize(vViewPosition);
                            vec3 normal = normalize(vNormal);
                            float NdotV = abs(dot(viewDir, normal));
                            float fresnel = pow(1.0 - NdotV, uFresnelPower);
                            vec3 lightDir = normalize(vec3(1.0, 1.0, 0.5));
                            vec3 halfVec = normalize(viewDir + lightDir);
                            float spec = pow(max(dot(normal, halfVec), 0.0), uSpecularPower);
                            vec3 color = uBaseColor * 0.1 + uFresnelColor * fresnel * 0.5 + uSpecularColor * spec * 0.3;
                            float alpha = uOpacity + fresnel * 0.35 + spec * 0.15;
                            gl_FragColor = vec4(color, clamp(alpha, 0.0, 0.5));
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    fog: false,
                });

                this._Button_Home = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 32, 32),
                    sphereGlassMat.clone()
                );
                this._Button_Home.userData.buttonType = 'home';
                this._UI_Home.Mesh_Front.userData.buttonType = 'home';
                this._UI_Home.Mesh_Back.userData.buttonType = 'home';
                Scene.add(this._Button_Home);

                this._BubbleSystem = new C_BubbleSystem(Scene, 80);

                this._CreateFishes();

                this.Loaded = true;
            }

            _CreateFishes() {
                const bodyGeom = C_FishGeometry.createBodyBuffer(20, 12);
                const tailGeom = C_FishGeometry.createTailGeometry();
                const dorsalGeom = C_FishGeometry.createDorsalFinGeometry();
                const pectoralGeom = C_FishGeometry.createPectoralFinGeometry();
                const pelvicGeom = C_FishGeometry.createPelvicFinGeometry();
                const analGeom = C_FishGeometry.createAnalFinGeometry();

                for (let i = 0; i < FISH_COUNT; i++) {
                    const fish = new C_Fish(bodyGeom, tailGeom, dorsalGeom, pectoralGeom, pelvicGeom, analGeom);
                    const pos = new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 8,
                        (Math.random() - 0.5) * 20
                    );
                    fish.Initialize(pos);
                    this._Fishes.push(fish);
                    Scene.add(fish.Group);
                }
            }

            Update() {
                if (!this._Flag_Loaded) {
                    this._Flag_Loaded = true;
                    this.Fade(true);
                    this._State = "Playing";
                }
                if (this._Flag_Loaded) {
                    this._Input_Look = this._JOYSTICK_RIGHT.getInput();

                    switch (this._State) {
                        case "Playing": this.Update_Playing(); break;
                    }
                    this.Update_System();
                }
                Renderer.render(Scene, Camera.Object);
                requestAnimationFrame(this.Update.bind(this));
            }

            Update_System() {
                this._Timer_Input.Update();
                const t = performance.now() / 1000;

                if (this._Button_Home && this._Button_Home.material.uniforms) {
                    this._Button_Home.material.uniforms.uTime.value = t;
                }
            }

            Update_Playing() {
                this._Input_Keyboard.Update();

                this._Input_Look = this._JOYSTICK_RIGHT.getInput();
                if (this._Input_Look.length() > 0 && this._Input_Keyboard.Input_Look.length() == 0) {
                    this._Input_Look.multiplyScalar(100);
                }
                if (this._Input_Keyboard.Input_Look.length() > 0) {
                    this._Input_Look = this._Input_Keyboard.Input_Look;
                }

                this._RotateLook.x = this._Input_Look.x + this._MouseDelta.x;
                this._RotateLook.y = this._Input_Look.y + this._MouseDelta.y;
                this._MouseDelta.set(0, 0);

                this._cameraZoom += (this._cameraTargetZoom - this._cameraZoom) * 0.08;

                Camera._Yaw -= this._RotateLook.x * this._SENSIVILITY;
                Camera._Pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1,
                    Camera._Pitch - this._RotateLook.y * this._SENSIVILITY));

                const quat = new THREE.Quaternion();
                quat.setFromEuler(new THREE.Euler(Camera._Pitch, Camera._Yaw, 0, 'YXZ'));
                Camera._Forward.copy(new THREE.Vector3(0, 0, 1)).applyQuaternion(quat).normalize();

                const targetPos = new THREE.Vector3(0, 0, 0);
                if (this._Fishes.length > 0) {
                    let avgX = 0, avgY = 0, avgZ = 0;
                    for (const fish of this._Fishes) {
                        avgX += fish.Position.x;
                        avgY += fish.Position.y;
                        avgZ += fish.Position.z;
                    }
                    avgX /= this._Fishes.length;
                    avgY /= this._Fishes.length;
                    avgZ /= this._Fishes.length;
                    targetPos.set(avgX, avgY, avgZ);
                }

                const camOffset = Camera._Forward.clone().multiplyScalar(-this._cameraZoom);
                const desiredPos = targetPos.clone().add(camOffset);

                Camera.Position.lerp(desiredPos, 0.04);
                Camera.LookAt = targetPos;

                if (this._UI_Home && this._Button_Home) {
                    const forward = Camera._Forward.clone();
                    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                    const up = new THREE.Vector3().crossVectors(right, forward).normalize();

                    const homeScreenOffset = new THREE.Vector3()
                        .addScaledVector(right, this._cameraZoom * 0.72)
                        .addScaledVector(up, this._cameraZoom * 0.45);

                    const homePos = Camera.Position.clone()
                        .addScaledVector(forward, this._cameraZoom * 1.4)
                        .add(homeScreenOffset);

                    this._UI_Home.Position = homePos;
                    this._UI_Home.LookAt(Camera.Position);
                    this._Button_Home.position.copy(homePos);
                }

                const time = performance.now() / 1000;
                const dt = FC_Environment.TIME_DELTA;

                for (const fish of this._Fishes) {
                    fish.ApplyBoidRules(this._Fishes, time);
                    fish.ApplyBounds(time);
                }

                for (const fish of this._Fishes) {
                    fish.Update(time, dt);
                }

                if (this._BubbleSystem) {
                    this._BubbleSystem.Update(time, dt);
                }

                const fishCountEl = document.getElementById('UI_FishCount');
                if (fishCountEl) {
                    fishCountEl.textContent = `Fish: ${FISH_COUNT}`;
                }
            }
        }

        const Environment = new FC_Environment();
        const Camera = new FC_Camera_Controller(Renderer);
        const Light_Ambient = new FC_Light_Ambient(Scene);
        const Light_Directional = new FC_Light_Directional(Scene);
        const UnderwaterLight = new C_UnderwaterLight(Scene);
        window.addEventListener('resize', Camera.Resize_Screen, false);

        const Manager = new C_Manager();
        Manager.Initialize();
        Manager.Update();

        function getScreenXY(event) {
            switch (event.type) {
                case "touchstart":
                    return { x: event.touches[0].clientX, y: event.touches[0].clientY };
                case "touchend":
                    return { x: event.changedTouches[0].clientX, y: event.changedTouches[0].clientY };
                case "pointerdown":
                case "pointerup":
                case "mousedown":
                case "mouseup":
                    return { x: event.clientX, y: event.clientY };
                default:
                    return null;
            }
        }

        function getButtonTypeFromRaycast(raycaster) {
            const targets = [Manager._Button_Home].filter(Boolean);
            const hits = raycaster.intersectObjects(targets, false);
            if (hits.length === 0) return null;
            return hits[0].object.userData.buttonType || null;
        }

        let PressedButtonType = null;

        function PointerDown(event) {
            if (Manager.Timer_Input.Flag_Finished) {
                const point = getScreenXY(event);
                if (!point) return;

                const screen_position = new THREE.Vector2(
                    (point.x / window.innerWidth) * 2 - 1,
                    -(point.y / window.innerHeight) * 2 + 1
                );
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(screen_position, Camera.Object);
                PressedButtonType = getButtonTypeFromRaycast(raycaster);

                Manager._isDragging = true;
                Manager._previousMousePosition = { x: point.x, y: point.y };

                Manager.Timer_Input.Restart();
            }
        }

        function PointerUp(event) {
            const point = getScreenXY(event);
            if (!point) return;

            const screen_position = new THREE.Vector2(
                (point.x / window.innerWidth) * 2 - 1,
                -(point.y / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(screen_position, Camera.Object);
            const releasedButtonType = getButtonTypeFromRaycast(raycaster);

            if (PressedButtonType && PressedButtonType === releasedButtonType) {
                if (releasedButtonType === 'home') {
                    window.location.href = '../../English/HTML/index.html';
                }
            }

            PressedButtonType = null;
            Manager._isDragging = false;
        }

        document.addEventListener('mousemove', (event) => {
            if (Manager._isDragging) {
                const dx = event.clientX - Manager._previousMousePosition.x;
                const dy = event.clientY - Manager._previousMousePosition.y;
                Manager._MouseDelta.x = dx * 3;
                Manager._MouseDelta.y = dy * 3;
                Manager._previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        });

        document.addEventListener('wheel', (event) => {
            Manager._cameraTargetZoom += event.deltaY * 0.01;
            Manager._cameraTargetZoom = Math.max(5, Math.min(35, Manager._cameraTargetZoom));
        });

        const fishCountDiv = document.createElement('div');
        fishCountDiv.id = 'UI_FishCount';
        fishCountDiv.textContent = `Fish: ${FISH_COUNT}`;
        document.body.appendChild(fishCountDiv);

    </script>
