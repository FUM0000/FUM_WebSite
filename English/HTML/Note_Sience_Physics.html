  <script>
    new Vue({
      el: '#App',
      vuetify: new Vuetify(),
      mixins: [window.Mixins_Common],
      data: {
        Category: null,
        SubItem: null,
        Loading: false,
        OrbitPlaying: true,
        SpeedExpr: '365*24*60',
        SpeedMultiplier: 525600,
        SpeedError: '',
        SizeExpr: '1000',
        SizeMultiplier: 1000,
        SizeError: '',
        SunSizeExpr: '10',
        SunSizeMultiplier: 10,
        SunSizeError: ''
      },
      methods: {
        SelectCategory(cat) {
          this.Category = cat;
          if (cat === 'astronomy') {
            this.Loading = true;
            this.$nextTick(() => {
              setTimeout(() => {
                this.Loading = false;
                this.$nextTick(() => {
                  if (typeof window.initOrbit === 'function') {
                    window.initOrbit();
                  }
                });
              }, 500);
            });
          }
        },
        GoBack() {
          if (this.Category === 'astronomy') {
            if (typeof window.cleanupOrbit === 'function') {
              window.cleanupOrbit();
            }
            window.OrbitPlaying = true;
          }
          this.Category = null;
          this.SubItem = null;
        },
        SafeEval(expr) {
          if (!/^[\d+\-*/().\s]+$/.test(expr)) return null;
          try { return Function('return (' + expr + ')')(); } catch { return null; }
        },
        ApplySpeed() {
          this.SpeedError = '';
          const result = this.SafeEval(this.SpeedExpr);
          if (result === null || result <= 0 || !isFinite(result)) {
            this.SpeedError = '無効な式';
            return;
          }
          this.SpeedMultiplier = Math.round(result);
          window.OrbitSpeedMultiplier = this.SpeedMultiplier;
        },
        SetSpeedPreset(val, expr) {
          this.SpeedExpr = expr;
          this.SpeedMultiplier = val;
          this.SpeedError = '';
          window.OrbitSpeedMultiplier = val;
        },
        ApplySize() {
          this.SizeError = '';
          const result = this.SafeEval(this.SizeExpr);
          if (result === null || result <= 0 || !isFinite(result)) {
            this.SizeError = '無効な式';
            return;
          }
          this.SizeMultiplier = result;
          if (window.SetSizeMultiplier) {
            window.SetSizeMultiplier(result);
          }
        },
        SetSizePreset(val, expr) {
          this.SizeExpr = expr;
          this.SizeMultiplier = val;
          this.SizeError = '';
          if (window.SetSizeMultiplier) {
            window.SetSizeMultiplier(val);
          }
        },
        ApplySunSize() {
          this.SunSizeError = '';
          const result = this.SafeEval(this.SunSizeExpr);
          if (result === null || result <= 0 || !isFinite(result)) {
            this.SunSizeError = '無効な式';
            return;
          }
          this.SunSizeMultiplier = result;
          if (window.SetSunSizeMultiplier) {
            window.SetSunSizeMultiplier(result);
          }
        },
        SetSunSizePreset(val, expr) {
          this.SunSizeExpr = expr;
          this.SunSizeMultiplier = val;
          this.SunSizeError = '';
          if (window.SetSunSizeMultiplier) {
            window.SetSunSizeMultiplier(val);
          }
        },
        ToggleOrbitAnimation() {
          this.OrbitPlaying = !this.OrbitPlaying;
          window.OrbitPlaying = this.OrbitPlaying;
        },
        ResetOrbitCamera() {
          if (window.ResetOrbitCameraFn) {
            window.ResetOrbitCameraFn();
          }
        }
      }
    });
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.1/examples/jsm/controls/OrbitControls.js';

    function parseHex(c) { return parseInt(c.slice(1), 16); }

    let orbitRenderer = null;
    let orbitAnimFrameId = null;
    let orbitScene = null;
    let orbitCamera = null;
    let orbitControls = null;
    let orbitPlanetMeshes = [];
    let orbitSunMesh = null;
    let orbitGlowMesh = null;
    let orbitData = null;
    let orbitContainer = null;

    window.cleanupOrbit = function() {
      if (orbitAnimFrameId) {
        cancelAnimationFrame(orbitAnimFrameId);
        orbitAnimFrameId = null;
      }
      if (orbitRenderer) {
        orbitRenderer.dispose();
        if (orbitRenderer.domElement && orbitRenderer.domElement.parentNode) {
          orbitRenderer.domElement.parentNode.removeChild(orbitRenderer.domElement);
        }
        orbitRenderer = null;
      }
      orbitScene = null;
      orbitCamera = null;
      orbitControls = null;
      orbitPlanetMeshes = [];
      orbitSunMesh = null;
      orbitGlowMesh = null;
      orbitData = null;
      orbitContainer = null;
    };

    window.initOrbit = async function() {
      window.cleanupOrbit();

      const container = document.getElementById('OrbitContainer');
      if (!container) {
        setTimeout(() => { if (typeof window.initOrbit === 'function') window.initOrbit(); }, 200);
        return;
      }
      orbitContainer = container;

      const resp = await fetch('../../Asset/Python/Data/Planet_Orbit.json');
      const data = await resp.json();
      orbitData = data;

      const sunVisRadius = data.sun.radius;
      const glowVisRadius = sunVisRadius * 1.8;

      const width = container.clientWidth;
      const height = container.clientHeight;

      const scene = new THREE.Scene();
      orbitScene = scene;
      scene.background = new THREE.Color(0x0a0a1a);

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 200);
      orbitCamera = camera;
      camera.position.set(3, 2, 4);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      orbitRenderer = renderer;
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      orbitControls = controls;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0, 0);

      const ambientLight = new THREE.AmbientLight(0x404060);
      scene.add(ambientLight);

      const sunLight = new THREE.PointLight(0xffffff, 2, 100);
      sunLight.position.set(data.sun.x, data.sun.y, data.sun.z);
      scene.add(sunLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const sunGeo = new THREE.SphereGeometry(1, 32, 32);
      const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff6600, emissiveIntensity: 0.8 });
      const sunMesh = new THREE.Mesh(sunGeo, sunMat);
      orbitSunMesh = sunMesh;
      sunMesh.position.set(data.sun.x, data.sun.y, data.sun.z);
      sunMesh.scale.set(sunVisRadius, sunVisRadius, sunVisRadius);
      scene.add(sunMesh);

      const glowGeo = new THREE.SphereGeometry(1, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.15 });
      const glowMesh = new THREE.Mesh(glowGeo, glowMat);
      orbitGlowMesh = glowMesh;
      glowMesh.position.copy(sunMesh.position);
      glowMesh.scale.set(glowVisRadius, glowVisRadius, glowVisRadius);
      scene.add(glowMesh);

      const planetMeshes = [];
      orbitPlanetMeshes = planetMeshes;

      for (const planet of data.planets) {
        const color = parseHex(planet.color);
        const geo = new THREE.SphereGeometry(1, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.set(planet.radius, planet.radius, planet.radius);
        scene.add(mesh);

        const pts = planet.orbit.map(p => new THREE.Vector3(p.x, p.y, p.z));
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const orbitMat = new THREE.LineBasicMaterial({ color, opacity: 0.3, transparent: true });
        const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
        scene.add(orbitLine);

        planetMeshes.push({ mesh, points: pts, angle: Math.random() });
      }

      window.SetSunSizeMultiplier = function(mult) {
        const s = Math.max(mult, 0.001);
        if (orbitSunMesh) orbitSunMesh.scale.set(sunVisRadius * s, sunVisRadius * s, sunVisRadius * s);
        if (orbitGlowMesh) orbitGlowMesh.scale.set(glowVisRadius * s, glowVisRadius * s, glowVisRadius * s);
      };

      window.SetSizeMultiplier = function(mult) {
        const s = Math.max(mult, 0.001);
        for (let i = 0; i < orbitPlanetMeshes.length; i++) {
          const r = data.planets[i].radius;
          orbitPlanetMeshes[i].mesh.scale.set(r * s, r * s, r * s);
        }
      };

      if (window.SetSizeMultiplier) window.SetSizeMultiplier(1000);
      if (window.SetSunSizeMultiplier) window.SetSunSizeMultiplier(10);

      window.OrbitPlaying = true;
      window.OrbitSpeedMultiplier = 525600;

      const FRAMES_PER_SEC = 60;

      function getSpeed(periodDays) {
        const M = window.OrbitSpeedMultiplier || 525600;
        return M / (FRAMES_PER_SEC * periodDays * 24 * 60 * 60);
      }

      window.ResetOrbitCameraFn = function() {
        if (orbitCamera && orbitControls) {
          orbitCamera.position.set(3, 2, 4);
          orbitControls.target.set(0, 0, 0);
          orbitControls.update();
        }
      };

      function animate() {
        orbitAnimFrameId = requestAnimationFrame(animate);

        if (window.OrbitPlaying) {
          for (let i = 0; i < orbitPlanetMeshes.length; i++) {
            const pm = orbitPlanetMeshes[i];
            const period = data.planets[i].period_days;
            pm.angle += getSpeed(period);
            if (pm.angle >= 1) pm.angle -= 1;

            const idx = Math.floor(pm.angle * (pm.points.length - 1));
            pm.mesh.position.copy(pm.points[idx]);
          }
        }

        if (orbitControls) orbitControls.update();
        if (orbitRenderer && orbitScene && orbitCamera) orbitRenderer.render(orbitScene, orbitCamera);
      }

      animate();

      const resizeObserver = new ResizeObserver(() => {
        if (!orbitContainer) return;
        const w = orbitContainer.clientWidth;
        const h = orbitContainer.clientHeight;
        if (orbitCamera) {
          orbitCamera.aspect = w / h;
          orbitCamera.updateProjectionMatrix();
        }
        if (orbitRenderer) orbitRenderer.setSize(w, h);
      });
      resizeObserver.observe(container);
    };
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';

    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;

      const W = window.innerWidth;
      const H = window.innerHeight;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020208);

      const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
      camera.position.set(12, 7, 12);
      camera.lookAt(0, -0.6, 0);

      // Multiple gravity wells (Sun + planets) — deeper for clarity
      const wells = [
        [ 0.0,  0.0, 3.8, 3.5],  // Sun
        [ 5.5,  1.2, 1.0, 1.4],  // Jupiter
        [-3.8,  4.8, 0.7, 1.2],  // Saturn
        [-4.2, -4.8, 0.55, 1.0], // Neptune
        [ 2.6, -2.2, 0.3, 0.6],  // Earth
      ];

      function totalY(x, z) {
        let y = 0;
        for (const [cx, cz, A, s] of wells) {
          const dx = x - cx;
          const dz = z - cz;
          const r2 = dx * dx + dz * dz;
          y -= A * Math.exp(-r2 / (2 * s * s));
        }
        return y;
      }

      // Grid
      const size = 32;
      const N = 100;
      const half = size / 2;
      const step = size / N;

      const pts = [];
      for (let i = 0; i <= N; i++) {
        pts[i] = [];
        const x = -half + i * step;
        for (let j = 0; j <= N; j++) {
          const z = -half + j * step;
          pts[i][j] = [x, totalY(x, z), z];
        }
      }

      const pos = [];
      for (let j = 0; j <= N; j++) {
        for (let i = 0; i < N; i++) {
          const a = pts[i][j], b = pts[i + 1][j];
          pos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        }
      }
      for (let i = 0; i <= N; i++) {
        for (let j = 0; j < N; j++) {
          const a = pts[i][j], b = pts[i][j + 1];
          pos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        }
      }

      const gridGeo = new THREE.BufferGeometry();
      gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const gridMat = new THREE.LineBasicMaterial({
        color: 0x4080c0,
        transparent: true,
        opacity: 0.26
      });
      const grid = new THREE.LineSegments(gridGeo, gridMat);
      scene.add(grid);

      // Subtle lighting for spheres
      const ambient = new THREE.AmbientLight(0x203060, 0.25);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0x8090c0, 0.35);
      dirLight.position.set(8, 12, 6);
      scene.add(dirLight);
      const fillLight = new THREE.DirectionalLight(0x405080, 0.12);
      fillLight.position.set(-6, 4, -8);
      scene.add(fillLight);

      // Deep indigo-black spheres at well bottoms
      const sphereMat = new THREE.MeshStandardMaterial({
        color: 0x06081a,
        roughness: 0.4,
        metalness: 0.15
      });

      for (const [cx, cz, A, s] of wells) {
        const r = Math.max(0.12, A * 0.18);
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), sphereMat);
        sphere.position.set(cx, totalY(cx, cz) + r, cz);
        scene.add(sphere);
      }

      // Orbit rings (barely visible, follow the curved surface)
      const orbitRadii = [2.6, 4.2, 5.8, 7.0];
      const ringMat = new THREE.LineBasicMaterial({
        color: 0x4080c0,
        transparent: true,
        opacity: 0.06
      });
      const ringSegs = 80;
      for (const r of orbitRadii) {
        const rpos = [];
        for (let k = 0; k <= ringSegs; k++) {
          const theta = (k / ringSegs) * Math.PI * 2;
          const x = r * Math.cos(theta);
          const z = r * Math.sin(theta);
          rpos.push(x, totalY(x, z), z);
        }
        const rgeo = new THREE.BufferGeometry();
        rgeo.setAttribute('position', new THREE.Float32BufferAttribute(rpos, 3));
        const ring = new THREE.Line(rgeo, ringMat);
        scene.add(ring);
      }

      // Fog: distant grid fades into the background
      scene.fog = new THREE.Fog(0x020208, 14, 32);

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.render(scene, camera);
      }
      window.addEventListener('resize', resize);

      renderer.render(scene, camera);
    })();
  </script>
</body>
