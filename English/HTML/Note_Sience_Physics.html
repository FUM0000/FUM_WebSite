<html>

<head>
  <meta charset="UTF-8">
  <meta name="author" content="F U M">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-B89KY0993B');
  </script>

  <link rel="icon" type="image/x-icon" href="../../Asset/Image/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../../Asset/Image/Icon_1_2.jpg">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="../../Asset/CSS/Common.css?v=1.0" rel="stylesheet" />
  <link href="../../Asset/CSS/Learning.css" rel="stylesheet" />

  <title>物理</title>

  <style>

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    .v-card {
      background-color: rgba(10, 12, 30, 0.88) !important;
      border: 1px solid rgba(80, 120, 255, 0.12) !important;
      backdrop-filter: blur(4px);
    }

    .v-card .v-card__title,
    .v-card .v-card__text,
    .v-card .v-card__text span {
      color: #d0d8e8 !important;
    }

    .v-card .v-btn {
      color: #b0c8e0 !important;
    }

    .v-card .v-btn--outlined {
      border-color: rgba(80, 120, 255, 0.25) !important;
    }

    .content-text {
      color: #80b0ff !important;
      font-weight: 500;
    }

    #OrbitContainer {
      width: 100%;
      height: 500px;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    #SimContainer {
      width: 100%;
      height: 460px;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: radial-gradient(circle at 50% 30%, #0c1226 0%, #05070f 75%);
      cursor: grab;
    }
    #SimContainer:active { cursor: grabbing; }

    @media (max-width: 600px) {
      #SimContainer { height: 340px; }
    }

    .sim-card {
      cursor: pointer;
      transition: all 0.25s ease;
      border-color: rgba(80, 120, 255, 0.2) !important;
      background: rgba(12, 18, 40, 0.7) !important;
      text-align: center;
      height: 100%;
    }
    .sim-card:hover {
      border-color: rgba(80, 120, 255, 0.5) !important;
      background: rgba(16, 26, 56, 0.95) !important;
    }
    .sim-card.active {
      border-color: #80b0ff !important;
      background: rgba(30, 46, 90, 0.85) !important;
      box-shadow: 0 0 18px rgba(80, 120, 255, 0.25) !important;
    }
    .sim-card .v-card__title { font-size: 1.05rem; justify-content: center; }

    .hint-text {
      color: #6078a8;
      font-size: 12px;
    }

    .param-label {
      color: #80b0ff;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    .param-value {
      color: #ffffff;
      font-weight: 500;
    }

    .telemetry-chip {
      background: rgba(80, 120, 255, 0.08) !important;
      border: 1px solid rgba(80, 120, 255, 0.15) !important;
      border-radius: 4px;
      padding: 5px 9px;
      margin-bottom: 6px;
    }
    .telemetry-chip .t-key {
      color: #6078a8;
      font-size: 11px;
    }
    .telemetry-chip .t-val {
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
    }

    .formula-box {
      background: rgba(80, 120, 255, 0.07) !important;
      border: 1px solid rgba(80, 120, 255, 0.18) !important;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      color: #b8d0ff !important;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 10px 12px;
    }

    .v-slider--horizontal { margin-top: 4px; }

    .speed-input {
      max-width: 200px;
    }

    .category-card {
      cursor: pointer;
      transition: all 0.3s ease;
      border-color: rgba(80, 120, 255, 0.2) !important;
    }
    .category-card:hover {
      border-color: rgba(80, 120, 255, 0.5) !important;
      background-color: rgba(20, 30, 60, 0.9) !important;
    }
    .category-card .v-card__title {
      font-size: 1.2rem;
    }

    .loading-text {
      color: #b0c8e0;
    }

    .back-btn {
      background: rgba(80, 120, 255, 0.08) !important;
      border: 1px solid rgba(80, 120, 255, 0.2) !important;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(80, 120, 255, 0.2) !important;
      border-color: rgba(80, 120, 255, 0.4) !important;
    }

    .v-application,
    .v-application--wrap,
    .v-main,
    .v-main__wrap,
    .container,
    .container.fill-height {
      background: transparent !important;
    }
    #App { position: relative; z-index: 1; }
  </style>
    <meta name="robots" content="index, follow">
</head>

<body>
  <canvas id="bg-canvas"></canvas>
  <v-app id="App" v-cloak>
    <template>
      <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Note > サイエンス > 物理</main-system-bar>

      <v-main id="Main">
        <transition name="Fade_Page">
          <v-container v-show="Ready_Page" fluid class="pa-5">

            <v-overlay :value="Loading" opacity="0.85" z-index="100">
              <v-progress-circular indeterminate size="64" color="primary" width="4"></v-progress-circular>
              <div class="mt-4 loading-text text-h6">読み込み中...</div>
            </v-overlay>

            <v-row v-if="!Category" justify="center">
              <v-col xs="12" md="6">
                <v-card class="mt-6">
                  <v-card-title class="content-text text-h5">物理</v-card-title>
                  <v-card-text>
                    <v-row>
                      <v-col cols="12" sm="6">
                        <v-card outlined class="category-card pa-3" @click="SelectCategory('mechanics')">
                          <v-icon large color="#80b0ff">mdi-rotate-3d</v-icon>
                          <v-card-title class="pa-0 mt-2">力学</v-card-title>
                          <v-card-text class="pa-0 mt-1 caption" style="color:#7088b0;">
                            固体力学・流体力学ほか
                          </v-card-text>
                        </v-card>
                      </v-col>
                      <v-col cols="12" sm="6" class="pb-0">
                        <v-card outlined class="category-card pa-3" @click="SelectCategory('astronomy')">
                          <v-icon large color="#80b0ff">mdi-telescope</v-icon>
                          <v-card-title class="pa-0 mt-2">天文学</v-card-title>
                          <v-card-text class="pa-0 mt-1 caption" style="color:#7088b0;">
                            太陽と地球の楕円軌道
                          </v-card-text>
                        </v-card>
                      </v-col>
                    </v-row>
                  </v-card-text>
                </v-card>
              </v-col>
            </v-row>

            <v-row v-else-if="Category === 'mechanics'" justify="center">
              <v-col xs="12" :class="SubItem === 'sim' ? 'md-9' : 'md-6'">
                <v-card class="mt-6">
                  <v-card-title class="content-text d-flex align-center pa-4">
                    <v-btn icon small class="mr-3 back-btn" @click="GoBack">
                      <v-icon>mdi-arrow-left</v-icon>
                    </v-btn>
                    <span>力学</span>
                  </v-card-title>
                  <v-card-text>
                    <v-row v-if="SubItem !== 'sim'">
                      <v-col cols="12" sm="6">
                        <v-card outlined class="category-card pa-3" @click="SubItem = 'solid'">
                          <v-icon large color="#80b0ff">mdi-cube-outline</v-icon>
                          <v-card-title class="pa-0 mt-2">固体力学</v-card-title>
                          <v-card-text class="pa-0 mt-1 caption" style="color:#7088b0;">
                            準備中
                          </v-card-text>
                        </v-card>
                      </v-col>
                      <v-col cols="12" sm="6">
                        <v-card outlined class="category-card pa-3" @click="SubItem = 'fluid'">
                          <v-icon large color="#80b0ff">mdi-water</v-icon>
                          <v-card-title class="pa-0 mt-2">流体力学</v-card-title>
                          <v-card-text class="pa-0 mt-1 caption" style="color:#7088b0;">
                            準備中
                          </v-card-text>
                        </v-card>
                      </v-col>
                      <v-col cols="12" class="mt-3">
                        <v-card outlined class="category-card pa-3" style="border-color:rgba(128,176,255,0.4);background:rgba(80,120,255,0.06);"
                          @click="SubItem = 'sim'">
                          <v-row no-gutters align="center">
                            <v-col cols="auto" class="pr-3">
                              <v-icon large color="#80b0ff">mdi-rocket-launch-outline</v-icon>
                            </v-col>
                            <v-col>
                              <v-card-title class="pa-0">物理シミュレーション</v-card-title>
                              <v-card-text class="pa-0 mt-1 caption" style="color:#7088b0;">
                                Three.js で力学の法則を 3D で自由に触って学べます
                              </v-card-text>
                            </v-col>
                            <v-col cols="auto">
                              <v-icon color="#80b0ff">mdi-chevron-right</v-icon>
                            </v-col>
                          </v-row>
                        </v-card>
                      </v-col>
                    </v-row>

                    <v-card v-if="SubItem === 'solid' || SubItem === 'fluid'" outlined class="pa-6 text-center" style="border-color:rgba(80,120,255,0.15);background:transparent;">
                      <v-icon large color="#506090">mdi-wrench-outline</v-icon>
                      <p class="mt-3 mb-0" style="color:#7088b0;">準備中</p>
                    </v-card>

                    <div v-if="SubItem === 'sim'">
                      <v-row dense>
                        <v-col cols="6" sm="4" md="4" v-for="s in SimList" :key="s.id">
                          <v-card outlined class="sim-card pa-2" :class="{ active: Active === s.id }" @click="SelectSim(s.id)">
                            <v-icon large :color="Active === s.id ? '#80b0ff' : '#506090'" style="margin-top:8px;">{{ s.icon }}</v-icon>
                            <v-card-title class="pa-0 mt-1">{{ s.title }}</v-card-title>
                            <v-card-text class="pa-0 pb-2 caption" style="color:#7088b0;">{{ s.sub }}</v-card-text>
                          </v-card>
                        </v-col>
                      </v-row>

                      <div id="SimContainer" class="mt-3"></div>

                      <v-row class="mt-2 align-center" no-gutters>
                        <v-col cols="auto">
                          <v-btn small outlined @click="TogglePlay">
                            <v-icon small>{{ Playing ? 'mdi-pause' : 'mdi-play' }}</v-icon>
                            {{ Playing ? '一時停止' : '再生' }}
                          </v-btn>
                          <v-btn small outlined class="ml-2" @click="ResetSimulation">
                            <v-icon small>mdi-restart</v-icon>
                            リセット
                          </v-btn>
                          <v-btn v-if="Active === 'projectile'" small outlined class="ml-2" color="#80b0ff" @click="LaunchProjectile">
                            <v-icon small>mdi-eject</v-icon>
                            発射
                          </v-btn>
                          <v-btn v-if="Active === 'projectile'" small outlined class="ml-2" @click="ClearProjectiles">
                            <v-icon small>mdi-broom</v-icon>
                            履歴を消す
                          </v-btn>
                        </v-col>
                      </v-row>

                      <div class="hint-text mt-1 mb-2">
                        <v-icon small style="color:#6078a8;">mdi-gesture</v-icon>
                        マウスドラッグで回転 / ホイールでズーム / 右ドラッグで移動（スマホは指で自由に操作）
                      </div>

                      <v-sheet outlined class="pa-2 mb-3" style="border-color:rgba(80,120,255,0.2);background:transparent;">
                        <div class="caption mb-1" style="color:#80b0ff;">ベクトルと軌跡の意味（色）</div>
                        <div>
                          <v-chip x-small outlined class="mr-1 mb-1" style="color:#fff;border-color:rgba(80,120,255,0.3);">
                            <v-icon x-small color="#ff5566" style="margin-right:3px;">mdi-circle</v-icon>速度
                          </v-chip>
                          <v-chip x-small outlined class="mr-1 mb-1" style="color:#fff;border-color:rgba(80,120,255,0.3);">
                            <v-icon x-small color="#33dd66" style="margin-right:3px;">mdi-circle</v-icon>加速度
                          </v-chip>
                          <v-chip x-small outlined class="mr-1 mb-1" style="color:#fff;border-color:rgba(80,120,255,0.3);">
                            <v-icon x-small color="#55aaff" style="margin-right:3px;">mdi-circle</v-icon>力
                          </v-chip>
                          <v-chip x-small outlined class="mr-1 mb-1" style="color:#fff;border-color:rgba(80,120,255,0.3);">
                            <v-icon x-small color="#88ccff" style="margin-right:3px;">mdi-circle</v-icon>発射方向
                          </v-chip>
                          <v-chip x-small outlined class="mr-1 mb-1" style="color:#fff;border-color:rgba(80,120,255,0.3);">
                            <v-icon x-small color="#ffb84d" style="margin-right:3px;">mdi-circle</v-icon>軌跡・物体
                          </v-chip>
                        </div>
                      </v-sheet>

                      <v-row dense>
                        <v-col cols="12" lg="5">
                          <v-sheet outlined class="pa-3 mb-3" style="border-color:rgba(80,120,255,0.2);background:transparent;">
                            <div class="caption mb-2" style="color:#80b0ff;">パラメータ</div>

                            <div v-if="Active === 'projectile'">
                              <div class="param-label"><span>初速度 v₀</span><span class="param-value">{{ Params.projectile.v0 }} m/s</span></div>
                              <v-slider :value="Params.projectile.v0" @input="SetPair('projectile','v0',$event)" min="1" max="50" step="1" dense></v-slider>
                              <div class="param-label"><span>仰角 θ</span><span class="param-value">{{ Params.projectile.angle }}°</span></div>
                              <v-slider :value="Params.projectile.angle" @input="SetPair('projectile','angle',$event)" min="0" max="90" step="1" dense></v-slider>
                              <div class="param-label"><span>方角 φ</span><span class="param-value">{{ Params.projectile.azimuth }}°</span></div>
                              <v-slider :value="Params.projectile.azimuth" @input="SetPair('projectile','azimuth',$event)" min="-180" max="180" step="1" dense></v-slider>
                            </div>

                            <div v-else-if="Active === 'pendulum'">
                              <div class="param-label"><span>糸の長さ L</span><span class="param-value">{{ Params.pendulum.L }} m</span></div>
                              <v-slider :value="Params.pendulum.L" @input="SetPair('pendulum','L',$event)" min="0.5" max="2.5" step="0.1" dense></v-slider>
                              <div class="param-label"><span>初期角度 θ₀</span><span class="param-value">{{ Params.pendulum.theta0 }}°</span></div>
                              <v-slider :value="Params.pendulum.theta0" @input="SetPair('pendulum','theta0',$event)" min="5" max="90" step="1" dense></v-slider>
                              <div class="param-label"><span>重力 g</span><span class="param-value">{{ Params.pendulum.g }} m/s²</span></div>
                              <v-slider :value="Params.pendulum.g" @input="SetPair('pendulum','g',$event)" min="1" max="20" step="0.1" dense></v-slider>
                            </div>

                            <div v-else-if="Active === 'spring'">
                              <div class="param-label"><span>質量 m</span><span class="param-value">{{ Params.spring.m }} kg</span></div>
                              <v-slider :value="Params.spring.m" @input="SetPair('spring','m',$event)" min="0.5" max="10" step="0.1" dense></v-slider>
                              <div class="param-label"><span>バネ定数 k</span><span class="param-value">{{ Params.spring.k }} N/m</span></div>
                              <v-slider :value="Params.spring.k" @input="SetPair('spring','k',$event)" min="1" max="50" step="0.5" dense></v-slider>
                              <div class="param-label"><span>初期変位 x₀</span><span class="param-value">{{ Params.spring.x0 > 0 ? '+' : '' }}{{ Params.spring.x0 }} m</span></div>
                              <v-slider :value="Params.spring.x0" @input="SetPair('spring','x0',$event)" min="-2" max="2" step="0.1" dense></v-slider>
                              <div class="param-label"><span>空気抵抗 c</span><span class="param-value">{{ Params.spring.damping }} N·s/m</span></div>
                              <v-slider :value="Params.spring.damping" @input="SetPair('spring','damping',$event)" min="0" max="2" step="0.05" dense></v-slider>
                            </div>

                            <div v-else-if="Active === 'collision'">
                              <div class="param-label"><span>質量 m₁</span><span class="param-value">{{ Params.collision.m1 }} kg</span></div>
                              <v-slider :value="Params.collision.m1" @input="SetPair('collision','m1',$event)" min="0.5" max="10" step="0.1" dense></v-slider>
                              <div class="param-label"><span>質量 m₂</span><span class="param-value">{{ Params.collision.m2 }} kg</span></div>
                              <v-slider :value="Params.collision.m2" @input="SetPair('collision','m2',$event)" min="0.5" max="10" step="0.1" dense></v-slider>
                              <div class="param-label"><span>初速度 v₁</span><span class="param-value">{{ Params.collision.v1 > 0 ? '+' : '' }}{{ Params.collision.v1 }} m/s</span></div>
                              <v-slider :value="Params.collision.v1" @input="SetPair('collision','v1',$event)" min="-10" max="10" step="0.5" dense></v-slider>
                              <div class="param-label"><span>初速度 v₂</span><span class="param-value">{{ Params.collision.v2 > 0 ? '+' : '' }}{{ Params.collision.v2 }} m/s</span></div>
                              <v-slider :value="Params.collision.v2" @input="SetPair('collision','v2',$event)" min="-10" max="10" step="0.5" dense></v-slider>
                              <div class="param-label"><span>反発係数 e</span><span class="param-value">{{ Params.collision.e }} <span class="hint-text">(1 = 完全弾性)</span></span></div>
                              <v-slider :value="Params.collision.e" @input="SetPair('collision','e',$event)" min="0" max="1" step="0.05" dense></v-slider>
                            </div>

                            <div v-else-if="Active === 'circular'">
                              <div class="param-label"><span>半径 r</span><span class="param-value">{{ Params.circular.r }} m</span></div>
                              <v-slider :value="Params.circular.r" @input="SetPair('circular','r',$event)" min="0.6" max="3" step="0.1" dense></v-slider>
                              <div class="param-label"><span>角速度 ω</span><span class="param-value">{{ Params.circular.omega }} rad/s</span></div>
                              <v-slider :value="Params.circular.omega" @input="SetPair('circular','omega',$event)" min="0.5" max="4" step="0.1" dense></v-slider>
                              <div class="param-label"><span>質点の質量 m</span><span class="param-value">{{ Params.circular.mass }} kg</span></div>
                              <v-slider :value="Params.circular.mass" @input="SetPair('circular','mass',$event)" min="0.1" max="5" step="0.1" dense></v-slider>
                            </div>
                          </v-sheet>
                        </v-col>

                        <v-col cols="12" lg="4">
                          <v-sheet outlined class="pa-3 mb-3" style="border-color:rgba(80,120,255,0.2);background:transparent;">
                            <div class="caption mb-2" style="color:#80b0ff;">観測値</div>
                            <v-row no-gutters>
                              <v-col cols="6">
                                <div v-for="(chip, i) in TelemetryChips('A')" :key="i" class="telemetry-chip">
                                  <div class="t-key">{{ chip.k }}</div>
                                  <div class="t-val">{{ chip.v }}</div>
                                </div>
                              </v-col>
                              <v-col cols="6">
                                <div v-for="(chip, i) in TelemetryChips('B')" :key="i" class="telemetry-chip">
                                  <div class="t-key">{{ chip.k }}</div>
                                  <div class="t-val">{{ chip.v }}</div>
                                </div>
                              </v-col>
                            </v-row>
                          </v-sheet>
                        </v-col>

                        <v-col cols="12" lg="3">
                          <v-sheet outlined class="pa-3 mb-2" style="border-color:rgba(80,120,255,0.2);background:transparent;">
                            <div class="caption mb-2" style="color:#80b0ff;">法則</div>
                            <div class="formula-box">
                              <div v-for="(line, i) in Formula(Active)" :key="i">{{ line }}</div>
                            </div>
                          </v-sheet>
                        </v-col>
                      </v-row>
                    </div>

                  </v-card-text>
                </v-card>
              </v-col>
            </v-row>

                  </v-card-text>
                </v-card>
              </v-col>
            </v-row>

            <v-row v-else-if="Category === 'astronomy'" justify="center">
              <v-col xs="12" md="6">
                <v-card class="mt-6">
                  <v-card-title class="content-text d-flex align-center pa-4">
                    <v-btn icon small class="mr-3 back-btn" @click="GoBack">
                      <v-icon>mdi-arrow-left</v-icon>
                    </v-btn>
                    <span>太陽と地球の楕円軌道</span>
                  </v-card-title>
                  <v-card-text class="pb-0">
                    <div id="OrbitContainer"></div>
                    <v-row class="mt-2" no-gutters>
                      <v-col class="text-center">
                        <v-btn small outlined @click="ToggleOrbitAnimation">
                          <v-icon small>{{ OrbitPlaying ? 'mdi-pause' : 'mdi-play' }}</v-icon>
                          {{ OrbitPlaying ? '一時停止' : '再生' }}
                        </v-btn>
                        <v-btn small outlined @click="ResetOrbitCamera" class="ml-2">
                          <v-icon small>mdi-camera</v-icon>
                          視点リセット
                        </v-btn>
                      </v-col>
                    </v-row>

                    <v-divider class="my-3" style="border-color:rgba(80,120,255,0.15);"></v-divider>

  <script>
    new Vue({
      el: '#App',
      vuetify: new Vuetify(),
      mixins: [window.Mixins_Common],
      data: {
        Category: null,
        SubItem: null,
        Loading: false,
        OrbitPlaying: true,
        SpeedExpr: '365*24*60',
        SpeedMultiplier: 525600,
        SpeedError: '',
        SizeExpr: '1000',
        SizeMultiplier: 1000,
        SizeError: '',
        SunSizeExpr: '10',
        SunSizeMultiplier: 10,
        SunSizeError: '',
        Active: 'projectile',
        Playing: true,
        SimList: [
          { id: 'projectile', title: '投射運動', sub: '自由落下・斜方投射', icon: 'mdi-eject' },
          { id: 'pendulum',   title: '振り子',  sub: '重力による周期運動', icon: 'mdi-swing' },
          { id: 'spring',     title: 'バネ',    sub: '単振動 (SHM)',       icon: 'mdi-sine-wave' },
          { id: 'collision',  title: '衝突',    sub: '運動量保存',          icon: 'mdi-swap-horizontal' },
          { id: 'circular',   title: '円運動',  sub: '等速円運動',          icon: 'mdi-sync' }
        ],
        Params: {
          projectile: { v0: 25, angle: 45, azimuth: 0 },
          pendulum:   { L: 1.5, theta0: 60, g: 9.8 },
          spring:     { m: 2, k: 10, x0: 1, damping: 0 },
          collision:  { m1: 3, v1: 3, m2: 2, v2: -2, e: 1 },
          circular:   { r: 1.5, omega: 2, mass: 1 }
        },
        Telemetry: {}
      },
      created() {
        window.SimParams = window.SimParams || {};
        const P = this.Params;
        Object.keys(P).forEach(sim => {
          window.SimParams[sim] = Object.assign({}, P[sim]);
        });
      },
      mounted() {
        this._telemetryTimer = setInterval(() => {
          if (window.SimTelemetry) {
            this.Telemetry = Object.assign({}, window.SimTelemetry);
          }
        }, 250);
      },
      beforeDestroy() {
        if (this._telemetryTimer) clearInterval(this._telemetryTimer);
        if (typeof window.CleanupSimFn === 'function') {
          window.CleanupSimFn();
        }
      },
      watch: {
        SubItem(val, old) {
          if (old === 'sim' && val !== 'sim') {
            if (typeof window.CleanupSimFn === 'function') {
              window.CleanupSimFn();
            }
            window.SimTelemetry = {};
          }
          if (val === 'sim') {
            this.Active = 'projectile';
            this.Playing = true;
            this.Loading = true;
            this.$nextTick(() => {
              setTimeout(() => {
                this.Loading = false;
                this.$nextTick(() => {
                  if (typeof window.InitSimFn === 'function') {
                    window.InitSimFn('projectile');
                  }
                });
              }, 350);
            });
          }
        }
      },
      methods: {
        SelectCategory(cat) {
          this.Category = cat;
          if (cat === 'astronomy') {
            this.Loading = true;
            this.$nextTick(() => {
              setTimeout(() => {
                this.Loading = false;
                this.$nextTick(() => {
                  if (typeof window.initOrbit === 'function') {
                    window.initOrbit();
                  }
                });
              }, 500);
            });
          }
        },
        Num(v) {
          if (v === undefined || v === null || isNaN(v)) return '—';
          return Number(v).toFixed(2);
        },
        SetPair(sim, key, val) {
          this.Params[sim][key] = val;
          if (!window.SimParams) window.SimParams = {};
          window.SimParams[sim][key] = val;
          if (typeof window.NotifyParamChanged === 'function') {
            window.NotifyParamChanged();
          }
        },
        TogglePlay() {
          this.Playing = !this.Playing;
          if (window.SetSimPlaying) window.SetSimPlaying(this.Playing);
        },
        SelectSim(id) {
          if (this.Active === id) return;
          this.Active = id;
          this.Playing = true;
          if (window.SetSimPlaying) window.SetSimPlaying(true);
          if (typeof window.InitSimFn === 'function') {
            window.InitSimFn(id);
          }
        },
        ResetSimulation() {
          this.Playing = true;
          if (window.SetSimPlaying) window.SetSimPlaying(true);
          if (typeof window.ResetSimFn === 'function') window.ResetSimFn();
        },
        LaunchProjectile() {
          if (typeof window.LaunchSimFn === 'function') window.LaunchSimFn();
        },
        ClearProjectiles() {
          if (typeof window.ClearProjectilesFn === 'function') window.ClearProjectilesFn();
        },
        Formula(id) {
          const map = {
            projectile: [
              '水平: vx = v₀·cosθ（一定）',
              '鉛直: vy = v₀·sinθ − g·t',
              '滞空時間: T = 2·v₀·sinθ / g',
              '到達距離: R = v₀²·sin2θ / g'
            ],
            pendulum: [
              'θ″ = −(g/L)·sinθ',
              '周期: T = 2π·√(L/g)',
              'E = ½mv² + mgh（保存）'
            ],
            spring: [
              '復元力: F = −k·x',
              'ω = √(k/m)',
              '周期: T = 2π·√(m/k)',
              'E = ½mv² + ½kx²（保存）'
            ],
            collision: [
              '運動量保存: m₁v₁ + m₂v₂ = 一定',
              'e = (v₂′-v₁′)/(v₁-v₂)',
              'e=1: 完全弾性（運動Eも保存）',
              'e<1: 非弾性（熱などで散逸）'
            ],
            circular: [
              'v = r·ω',
              'a = r·ω² = v²/r',
              'F = m·v²/r（向心力）',
              'T = 2π/ω'
            ]
          };
          return map[id] || [];
        },
        TelemetryChips(col) {
          if (!this.Telemetry) return [];
          const t = this.Telemetry;
          const rows = {
            projectile: {
              A: [
                { k: '速さ v', v: this.Num(t.speed) },
                { k: '高さ h', v: this.Num(t.height) + ' m' },
                { k: '水平距離', v: this.Num(t.range) + ' m' }
              ],
              B: [
                { k: '最高点', v: this.Num(t.apex) + ' m' },
                { k: '滞空時間', v: this.Num(t.flightTime) + ' s' },
                { k: '到達距離', v: this.Num(t.landedRange) + ' m' }
              ]
            },
            pendulum: {
              A: [
                { k: '角度 θ', v: this.Num(t.theta) + '°' },
                { k: '速さ v', v: this.Num(t.speed) + ' m/s' },
                { k: '接線加速度', v: this.Num(t.aTan) + ' m/s²' }
              ],
              B: [
                { k: '運動E', v: this.Num(t.ke) + ' J' },
                { k: '位置E', v: this.Num(t.pe) + ' J' },
                { k: '周期 T', v: this.Num(t.period) + ' s' }
              ]
            },
            spring: {
              A: [
                { k: '位置 x', v: this.Num(t.x) + ' m' },
                { k: '速さ v', v: this.Num(t.v) + ' m/s' },
                { k: '復元力 F', v: this.Num(t.f) + ' N' }
              ],
              B: [
                { k: '運動E', v: this.Num(t.ke) + ' J' },
                { k: '弾性E', v: this.Num(t.pe) + ' J' },
                { k: '周期 T', v: this.Num(t.period) + ' s' }
              ]
            },
            collision: {
              A: [
                { k: '質量 m₁', v: this.Num(t.m1) + ' kg' },
                { k: '速さ v₁', v: this.Num(t.v1) + ' m/s' },
                { k: '運動量 p₁', v: this.Num(t.p1) + ' kg·m/s' }
              ],
              B: [
                { k: '質量 m₂', v: this.Num(t.m2) + ' kg' },
                { k: '速さ v₂', v: this.Num(t.v2) + ' m/s' },
                { k: '総運動量', v: this.Num(t.pTotal) + ' kg·m/s' }
              ]
            },
            circular: {
              A: [
                { k: '速さ v', v: this.Num(t.speed) + ' m/s' },
                { k: '向心加速度', v: this.Num(t.accel) + ' m/s²' },
                { k: '角速度 ω', v: this.Num(t.omega) + ' rad/s' }
              ],
              B: [
                { k: '周期 T', v: this.Num(t.period) + ' s' },
                { k: '半径 r', v: this.Num(t.r) + ' m' },
                { k: '向心力 F', v: this.Num(t.force) + ' N' }
              ]
            }
          };
          const group = rows[this.Active] || { A: [], B: [] };
          return group[col] || [];
        },
        GoBack() {
          if (this.Category === 'astronomy') {
            if (typeof window.cleanupOrbit === 'function') {
              window.cleanupOrbit();
            }
            window.OrbitPlaying = true;
          }
          this.Category = null;
          this.SubItem = null;
        },
        SafeEval(expr) {
          if (!/^[\d+\-*/().\s]+$/.test(expr)) return null;
          try { return Function('return (' + expr + ')')(); } catch { return null; }
        },
        ApplySpeed() {
          this.SpeedError = '';
          const result = this.SafeEval(this.SpeedExpr);
          if (result === null || result <= 0 || !isFinite(result)) {
            this.SpeedError = '無効な式';
            return;
          }
          this.SpeedMultiplier = Math.round(result);
          window.OrbitSpeedMultiplier = this.SpeedMultiplier;
        },
        SetSpeedPreset(val, expr) {
          this.SpeedExpr = expr;
          this.SpeedMultiplier = val;
          this.SpeedError = '';
          window.OrbitSpeedMultiplier = val;
        },
        ApplySize() {
          this.SizeError = '';
          const result = this.SafeEval(this.SizeExpr);
          if (result === null || result <= 0 || !isFinite(result)) {
            this.SizeError = '無効な式';
            return;
          }
          this.SizeMultiplier = result;
          if (window.SetSizeMultiplier) {
            window.SetSizeMultiplier(result);
          }
        },
        SetSizePreset(val, expr) {
          this.SizeExpr = expr;
          this.SizeMultiplier = val;
          this.SizeError = '';
          if (window.SetSizeMultiplier) {
            window.SetSizeMultiplier(val);
          }
        },
        ApplySunSize() {
          this.SunSizeError = '';
          const result = this.SafeEval(this.SunSizeExpr);
          if (result === null || result <= 0 || !isFinite(result)) {
            this.SunSizeError = '無効な式';
            return;
          }
          this.SunSizeMultiplier = result;
          if (window.SetSunSizeMultiplier) {
            window.SetSunSizeMultiplier(result);
          }
        },
        SetSunSizePreset(val, expr) {
          this.SunSizeExpr = expr;
          this.SunSizeMultiplier = val;
          this.SunSizeError = '';
          if (window.SetSunSizeMultiplier) {
            window.SetSunSizeMultiplier(val);
          }
        },
        ToggleOrbitAnimation() {
          this.OrbitPlaying = !this.OrbitPlaying;
          window.OrbitPlaying = this.OrbitPlaying;
        },
        ResetOrbitCamera() {
          if (window.ResetOrbitCameraFn) {
            window.ResetOrbitCameraFn();
          }
        }
      }
    });
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.1/examples/jsm/controls/OrbitControls.js';

    function parseHex(c) { return parseInt(c.slice(1), 16); }

    let orbitRenderer = null;
    let orbitAnimFrameId = null;
    let orbitScene = null;
    let orbitCamera = null;
    let orbitControls = null;
    let orbitPlanetMeshes = [];
    let orbitSunMesh = null;
    let orbitGlowMesh = null;
    let orbitData = null;
    let orbitContainer = null;

    window.cleanupOrbit = function() {
      if (orbitAnimFrameId) {
        cancelAnimationFrame(orbitAnimFrameId);
        orbitAnimFrameId = null;
      }
      if (orbitRenderer) {
        orbitRenderer.dispose();
        if (orbitRenderer.domElement && orbitRenderer.domElement.parentNode) {
          orbitRenderer.domElement.parentNode.removeChild(orbitRenderer.domElement);
        }
        orbitRenderer = null;
      }
      orbitScene = null;
      orbitCamera = null;
      orbitControls = null;
      orbitPlanetMeshes = [];
      orbitSunMesh = null;
      orbitGlowMesh = null;
      orbitData = null;
      orbitContainer = null;
    };

    window.initOrbit = async function() {
      window.cleanupOrbit();

      const container = document.getElementById('OrbitContainer');
      if (!container) {
        setTimeout(() => { if (typeof window.initOrbit === 'function') window.initOrbit(); }, 200);
        return;
      }
      orbitContainer = container;

      const resp = await fetch('../../Asset/Python/Data/Planet_Orbit.json');
      const data = await resp.json();
      orbitData = data;

      const sunVisRadius = data.sun.radius;
      const glowVisRadius = sunVisRadius * 1.8;

      const width = container.clientWidth;
      const height = container.clientHeight;

      const scene = new THREE.Scene();
      orbitScene = scene;
      scene.background = new THREE.Color(0x0a0a1a);

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 200);
      orbitCamera = camera;
      camera.position.set(3, 2, 4);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      orbitRenderer = renderer;
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      orbitControls = controls;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0, 0);

      const ambientLight = new THREE.AmbientLight(0x404060);
      scene.add(ambientLight);

      const sunLight = new THREE.PointLight(0xffffff, 2, 100);
      sunLight.position.set(data.sun.x, data.sun.y, data.sun.z);
      scene.add(sunLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const sunGeo = new THREE.SphereGeometry(1, 32, 32);
      const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff6600, emissiveIntensity: 0.8 });
      const sunMesh = new THREE.Mesh(sunGeo, sunMat);
      orbitSunMesh = sunMesh;
      sunMesh.position.set(data.sun.x, data.sun.y, data.sun.z);
      sunMesh.scale.set(sunVisRadius, sunVisRadius, sunVisRadius);
      scene.add(sunMesh);

      const glowGeo = new THREE.SphereGeometry(1, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.15 });
      const glowMesh = new THREE.Mesh(glowGeo, glowMat);
      orbitGlowMesh = glowMesh;
      glowMesh.position.copy(sunMesh.position);
      glowMesh.scale.set(glowVisRadius, glowVisRadius, glowVisRadius);
      scene.add(glowMesh);

      const planetMeshes = [];
      orbitPlanetMeshes = planetMeshes;

      for (const planet of data.planets) {
        const color = parseHex(planet.color);
        const geo = new THREE.SphereGeometry(1, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.set(planet.radius, planet.radius, planet.radius);
        scene.add(mesh);

        const pts = planet.orbit.map(p => new THREE.Vector3(p.x, p.y, p.z));
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const orbitMat = new THREE.LineBasicMaterial({ color, opacity: 0.3, transparent: true });
        const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
        scene.add(orbitLine);

        planetMeshes.push({ mesh, points: pts, angle: Math.random() });
      }

      window.SetSunSizeMultiplier = function(mult) {
        const s = Math.max(mult, 0.001);
        if (orbitSunMesh) orbitSunMesh.scale.set(sunVisRadius * s, sunVisRadius * s, sunVisRadius * s);
        if (orbitGlowMesh) orbitGlowMesh.scale.set(glowVisRadius * s, glowVisRadius * s, glowVisRadius * s);
      };

      window.SetSizeMultiplier = function(mult) {
        const s = Math.max(mult, 0.001);
        for (let i = 0; i < orbitPlanetMeshes.length; i++) {
          const r = data.planets[i].radius;
          orbitPlanetMeshes[i].mesh.scale.set(r * s, r * s, r * s);
        }
      };

      if (window.SetSizeMultiplier) window.SetSizeMultiplier(1000);
      if (window.SetSunSizeMultiplier) window.SetSunSizeMultiplier(10);

      window.OrbitPlaying = true;
      window.OrbitSpeedMultiplier = 525600;

      const FRAMES_PER_SEC = 60;

      function getSpeed(periodDays) {
        const M = window.OrbitSpeedMultiplier || 525600;
        return M / (FRAMES_PER_SEC * periodDays * 24 * 60 * 60);
      }

      window.ResetOrbitCameraFn = function() {
        if (orbitCamera && orbitControls) {
          orbitCamera.position.set(3, 2, 4);
          orbitControls.target.set(0, 0, 0);
          orbitControls.update();
        }
      };

      function animate() {
        orbitAnimFrameId = requestAnimationFrame(animate);

        if (window.OrbitPlaying) {
          for (let i = 0; i < orbitPlanetMeshes.length; i++) {
            const pm = orbitPlanetMeshes[i];
            const period = data.planets[i].period_days;
            pm.angle += getSpeed(period);
            if (pm.angle >= 1) pm.angle -= 1;

            const idx = Math.floor(pm.angle * (pm.points.length - 1));
            pm.mesh.position.copy(pm.points[idx]);
          }
        }

        if (orbitControls) orbitControls.update();
        if (orbitRenderer && orbitScene && orbitCamera) orbitRenderer.render(orbitScene, orbitCamera);
      }

      animate();

      const resizeObserver = new ResizeObserver(() => {
        if (!orbitContainer) return;
        const w = orbitContainer.clientWidth;
        const h = orbitContainer.clientHeight;
        if (orbitCamera) {
          orbitCamera.aspect = w / h;
          orbitCamera.updateProjectionMatrix();
        }
        if (orbitRenderer) orbitRenderer.setSize(w, h);
      });
      resizeObserver.observe(container);
    };
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';

    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;

      const W = window.innerWidth;
      const H = window.innerHeight;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020208);

      const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
      camera.position.set(12, 7, 12);
      camera.lookAt(0, -0.6, 0);

      // Multiple gravity wells (Sun + planets) — deeper for clarity
      const wells = [
        [ 0.0,  0.0, 3.8, 3.5],  // Sun
        [ 5.5,  1.2, 1.0, 1.4],  // Jupiter
        [-3.8,  4.8, 0.7, 1.2],  // Saturn
        [-4.2, -4.8, 0.55, 1.0], // Neptune
        [ 2.6, -2.2, 0.3, 0.6],  // Earth
      ];

      function totalY(x, z) {
        let y = 0;
        for (const [cx, cz, A, s] of wells) {
          const dx = x - cx;
          const dz = z - cz;
          const r2 = dx * dx + dz * dz;
          y -= A * Math.exp(-r2 / (2 * s * s));
        }
        return y;
      }

      // Grid
      const size = 32;
      const N = 100;
      const half = size / 2;
      const step = size / N;

      const pts = [];
      for (let i = 0; i <= N; i++) {
        pts[i] = [];
        const x = -half + i * step;
        for (let j = 0; j <= N; j++) {
          const z = -half + j * step;
          pts[i][j] = [x, totalY(x, z), z];
        }
      }

      const pos = [];
      for (let j = 0; j <= N; j++) {
        for (let i = 0; i < N; i++) {
          const a = pts[i][j], b = pts[i + 1][j];
          pos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        }
      }
      for (let i = 0; i <= N; i++) {
        for (let j = 0; j < N; j++) {
          const a = pts[i][j], b = pts[i][j + 1];
          pos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        }
      }

      const gridGeo = new THREE.BufferGeometry();
      gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const gridMat = new THREE.LineBasicMaterial({
        color: 0x4080c0,
        transparent: true,
        opacity: 0.26
      });
      const grid = new THREE.LineSegments(gridGeo, gridMat);
      scene.add(grid);

      // Subtle lighting for spheres
      const ambient = new THREE.AmbientLight(0x203060, 0.25);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0x8090c0, 0.35);
      dirLight.position.set(8, 12, 6);
      scene.add(dirLight);
      const fillLight = new THREE.DirectionalLight(0x405080, 0.12);
      fillLight.position.set(-6, 4, -8);
      scene.add(fillLight);

      // Deep indigo-black spheres at well bottoms
      const sphereMat = new THREE.MeshStandardMaterial({
        color: 0x06081a,
        roughness: 0.4,
        metalness: 0.15
      });

      for (const [cx, cz, A, s] of wells) {
        const r = Math.max(0.12, A * 0.18);
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), sphereMat);
        sphere.position.set(cx, totalY(cx, cz) + r, cz);
        scene.add(sphere);
      }

      // Orbit rings (barely visible, follow the curved surface)
      const orbitRadii = [2.6, 4.2, 5.8, 7.0];
      const ringMat = new THREE.LineBasicMaterial({
        color: 0x4080c0,
        transparent: true,
        opacity: 0.06
      });
      const ringSegs = 80;
      for (const r of orbitRadii) {
        const rpos = [];
        for (let k = 0; k <= ringSegs; k++) {
          const theta = (k / ringSegs) * Math.PI * 2;
          const x = r * Math.cos(theta);
          const z = r * Math.sin(theta);
          rpos.push(x, totalY(x, z), z);
        }
        const rgeo = new THREE.BufferGeometry();
        rgeo.setAttribute('position', new THREE.Float32BufferAttribute(rpos, 3));
        const ring = new THREE.Line(rgeo, ringMat);
        scene.add(ring);
      }

      // Fog: distant grid fades into the background
      scene.fog = new THREE.Fog(0x020208, 14, 32);

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.render(scene, camera);
      }
      window.addEventListener('resize', resize);

      renderer.render(scene, camera);
    })();
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.1/examples/jsm/controls/OrbitControls.js';

    // ベクトルの色 = 意味 (UI の凡例と対応)
    const C = {
      velocity:     0xff5566, // 赤    → 速度
      acceleration: 0x33dd66, // 緑    → 加速度
      force:        0x55aaff, // 青    → 力
      preview:      0x88ccff, // シアン → 発射方向
      trail:        0xffb84d  // オレンジ → 軌跡
    };
    const LIGHT_RED   = '#ff9aa8';
    const LIGHT_GREEN = '#7fee9d';
    const LIGHT_BLUE  = '#7bb8ff';
    const LIGHT_WHITE = '#cfe4ff';

    const G = 9.8;
    const STEP = 1 / 120;
    const LABEL_UPDATE = 0.12;
    const LABEL_FONT = 'bold 40px "Space Mono", "Zen Kaku Gothic New", monospace';

    let renderer = null;
    let scene = null;
    let camera = null;
    let controls = null;
    let container = null;
    let clock = null;
    let animId = null;
    let resizeObs = null;
    let activeSim = null;
    let playing = true;
    let acc = 0;
    let labelTimer = 0;

    function P(sim) {
      return (window.SimParams && window.SimParams[sim]) || {};
    }

    function stdMaterial(color, opts) {
      return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.5, metalness: 0.1 }, opts || {}));
    }

    function makeLights() {
      scene.add(new THREE.AmbientLight(0x7080b0, 0.5));
      const dir = new THREE.DirectionalLight(0xffffff, 0.9);
      dir.position.set(10, 18, 8);
      scene.add(dir);
      const fill = new THREE.DirectionalLight(0x6090ff, 0.25);
      fill.position.set(-8, 4, -10);
      scene.add(fill);
    }

    function makeGround(size, divisions) {
      const grid = new THREE.GridHelper(size, divisions, 0x4058a0, 0x233458);
      grid.material.transparent = true;
      grid.material.opacity = 0.55;
      scene.add(grid);
    }

    function makeArrow(color, length) {
      const l = length || 1;
      return new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), l, color, Math.min(l * 0.2, 0.6), Math.min(l * 0.1, 0.3));
    }

    function setArrow(arrow, origin, dir, len) {
      arrow.position.copy(origin);
      const l = Math.max(Math.abs(len), 0.001);
      const d = dir.clone();
      if (d.lengthSq() < 1e-9) d.set(1, 0, 0);
      d.normalize();
      arrow.setDirection(d);
      arrow.setLength(l, Math.min(l * 0.22, 0.6), Math.min(l * 0.12, 0.3));
    }

    function makeTrail(color, maxPoints) {
      const geo = new THREE.BufferGeometry();
      const arr = new Float32Array(maxPoints * 3);
      geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      geo.setDrawRange(0, 0);
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.65 });
      const line = new THREE.Line(geo, mat);
      line.frustumCulled = false;
      scene.add(line);
      return { line, geo, arr, count: 0, max: maxPoints };
    }

    function trailPush(t, p) {
      if (!t) return;
      if (t.count < t.max) {
        t.arr[t.count * 3] = p.x;
        t.arr[t.count * 3 + 1] = p.y;
        t.arr[t.count * 3 + 2] = p.z;
        t.count++;
      } else {
        for (let i = 1; i < t.max; i++) {
          t.arr[(i - 1) * 3] = t.arr[i * 3];
          t.arr[(i - 1) * 3 + 1] = t.arr[i * 3 + 1];
          t.arr[(i - 1) * 3 + 2] = t.arr[i * 3 + 2];
        }
        t.arr[(t.max - 1) * 3] = p.x;
        t.arr[(t.max - 1) * 3 + 1] = p.y;
        t.arr[(t.max - 1) * 3 + 2] = p.z;
      }
      t.geo.setDrawRange(0, t.count);
      t.geo.attributes.position.needsUpdate = true;
    }

    function setRod(rod, a, b, baseLen) {
      const dir = b.clone().sub(a);
      const len = dir.length();
      rod.position.copy(a).add(b).multiplyScalar(0.5);
      rod.scale.set(1, len / baseLen, 1);
      rod.lookAt(b);
      rod.rotateX(Math.PI / 2);
    }

    function makeCylinder(color, radius, height) {
      return new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 16), stdMaterial(color));
    }

    // ---- 3D 空間内の数値ラベル（スプライト）----
    function makeTextSprite(text, color, w, h) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = LABEL_FONT;
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(w || 2.6, h || 0.62, 1);
      setTextSprite(spr, text || '', color || LIGHT_WHITE);
      return spr;
    }

    function setTextSprite(spr, text, color) {
      const img = spr.material.map.image;
      const ctx = img.getContext('2d');
      ctx.clearRect(0, 0, img.width, img.height);
      ctx.font = LABEL_FONT;
      ctx.fillStyle = 'rgba(6, 10, 24, 0.78)';
      ctx.fillRect(0, 0, img.width, img.height);
      ctx.fillStyle = color || LIGHT_WHITE;
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = 8;
      ctx.fillText(text, 16, img.height / 2 + 1);
      ctx.shadowBlur = 0;
      spr.material.map.needsUpdate = true;
    }

    // ============================================================
    // 1. 投射運動 Projectile
    // ============================================================
    let proj = null;

    function initProjectile() {
      proj = {
        list: [],
        launchArrow: null,
        pallete: [0xff6a7a, 0x31c4ff, 0x66ff99, 0xffb84d, 0xc78bff, 0x5ce1e6],
        colorIdx: 0
      };
      makeGround(80, 40);

      const pad = makeCylinder(0x3a5aa0, 0.35, 0.16);
      pad.position.set(0, 0.08, 0);
      scene.add(pad);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.02, 8, 40),
        new THREE.MeshBasicMaterial({ color: C.preview, transparent: true, opacity: 0.5 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.set(0, 0.18, 0);
      scene.add(ring);

      proj.launchArrow = makeArrow(C.preview, 4);
      scene.add(proj.launchArrow);
    }

    function projectileDir(params) {
      const elev = params.angle * Math.PI / 180;
      const azim = params.azimuth * Math.PI / 180;
      return new THREE.Vector3(
        Math.cos(elev) * Math.cos(azim),
        Math.sin(elev),
        Math.cos(elev) * Math.sin(azim)
      );
    }

    function updateProjectilePreview(params) {
      if (!proj || !proj.launchArrow) return;
      const dir = projectileDir(params || P('projectile'));
      proj.launchArrow.position.set(0, 0.25, 0);
      proj.launchArrow.setDirection(dir);
      proj.launchArrow.setLength(3.2, 0.6, 0.3);
    }

    function removeItemArrowsAndLabels(item) {
      if (item.vArrow) scene.remove(item.vArrow);
      if (item.aArrow) scene.remove(item.aArrow);
      item.vArrow = null;
      item.aArrow = null;
      if (item.labels) {
        item.labels.forEach(l => scene.remove(l));
        item.labels = null;
      }
    }

    function launchProjectile() {
      if (!proj) return;
      const params = P('projectile');
      const dir = projectileDir(params);
      const color = proj.pallete[proj.colorIdx % proj.pallete.length];
      proj.colorIdx++;

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), stdMaterial(color));
      mesh.position.set(0, 0.22, 0);
      scene.add(mesh);

      const labels = [
        makeTextSprite('v -- m/s', LIGHT_RED),
        makeTextSprite('a -- m/s²', LIGHT_GREEN),
        makeTextSprite('h -- m', LIGHT_WHITE)
      ];
      labels.forEach(l => scene.add(l));

      const item = {
        mesh,
        vel: dir.clone().multiplyScalar(params.v0),
        r: 0.22,
        landed: false,
        apex: 0.22,
        flightTime: 0,
        trail: makeTrail(C.trail, 260),
        vArrow: makeArrow(C.velocity, 2),
        aArrow: makeArrow(C.acceleration, 2),
        labels
      };
      scene.add(item.vArrow);
      scene.add(item.aArrow);

      if (proj.list.length) {
        removeItemArrowsAndLabels(proj.list[proj.list.length - 1]);
      }

      proj.list.push(item);
      if (proj.list.length > 14) {
        const old = proj.list.shift();
        scene.remove(old.mesh);
        scene.remove(old.trail.line);
        removeItemArrowsAndLabels(old);
      }
    }

    function clearProjectiles() {
      if (!proj) return;
      proj.list.forEach(item => {
        scene.remove(item.mesh);
        scene.remove(item.trail.line);
        removeItemArrowsAndLabels(item);
      });
      proj.list = [];
      window.SimTelemetry = {};
    }

    function updateProjectile(dt) {
      const params = P('projectile');
      updateProjectilePreview(params);
      window.SimTelemetry = {};
      if (!proj.list.length) return;

      for (const item of proj.list) {
        if (item.landed) continue;
        item.vel.y -= G * dt;
        item.mesh.position.addScaledVector(item.vel, dt);
        item.flightTime += dt;
        if (item.mesh.position.y > item.apex) item.apex = item.mesh.position.y;

        if (item.mesh.position.y <= item.r && item.vel.y < 0) {
          item.mesh.position.y = item.r;
          item.vel.multiplyScalar(0);
          item.landed = true;
          trailPush(item.trail, item.mesh.position);
        } else {
          trailPush(item.trail, item.mesh.position);
        }
      }

      const cur = proj.list[proj.list.length - 1];
      const bp = cur.mesh.position;
      cur.labels[0].position.set(bp.x, bp.y + 0.6, bp.z);
      cur.labels[1].position.set(bp.x, bp.y + 1.15, bp.z);
      cur.labels[2].position.set(bp.x, bp.y + 1.7, bp.z);

      if (!cur.landed) {
        setArrow(cur.vArrow, bp, cur.vel.clone().normalize(), cur.vel.length() * 0.5);
        setArrow(cur.aArrow, bp, new THREE.Vector3(0, -1, 0), G * 0.5);
      } else {
        setArrow(cur.vArrow, bp, new THREE.Vector3(1, 0, 0), 0.001);
        setArrow(cur.aArrow, bp, new THREE.Vector3(1, 0, 0), 0.001);
      }

      window.SimTelemetry = {
        speed: cur.vel.length(),
        height: bp.y,
        range: bp.x,
        apex: cur.apex,
        flightTime: cur.flightTime,
        landedRange: cur.landed ? bp.x : 0
      };
    }

    function relabelProjectile() {
      const cur = proj && proj.list[proj.list.length - 1];
      if (!cur) return;
      const v = cur.vel.length();
      setTextSprite(cur.labels[0], 'v ' + v.toFixed(1) + ' m/s', LIGHT_RED);
      setTextSprite(cur.labels[1], 'a ' + G.toFixed(1) + ' m/s²', LIGHT_GREEN);
      setTextSprite(cur.labels[2], 'h ' + cur.mesh.position.y.toFixed(1) + ' m', LIGHT_WHITE);
    }

    // ============================================================
    // 2. 振り子 Pendulum
    // ============================================================
    let pend = null;

    function initPendulum() {
      pend = {
        theta: 0,
        omega: 0,
        bob: null,
        rod: null,
        trail: null,
        vArrow: null,
        aArrow: null,
        labels: null
      };
      makeGround(16, 8);

      const stand = new THREE.Group();
      const baseGeo = new THREE.CylinderGeometry(0.5, 0.6, 0.12, 24);
      const base = new THREE.Mesh(baseGeo, stdMaterial(0x2a4480));
      base.position.y = 0.06;

      const pole = makeCylinder(0x3a5aa0, 0.05, 3.1);

      const beam = makeCylinder(0x3a5aa0, 0.04, 1.6);

      scene.add(stand);

      scene.add(pend.vArrow);
      scene.add(pend.aArrow);

      const labels = [
        makeTextSprite('v -- m/s', LIGHT_RED),

        makeTextSprite('θ --°', LIGHT_WHITE),
        makeTextSprite('T -- s', LIGHT_WHITE)
      ];
      labels.forEach(l => scene.add(l));
      pend.labels = labels;
    }

    function resetPendulum() {
      if (!pend) return;
      const p = P('pendulum');
      pend.theta = p.theta0 * Math.PI / 180;
      pend.omega = 0;
    }

    function updatePendulum(dt) {
      const p = P('pendulum');
      const pivot = new THREE.Vector3(0, 3.1, 0);
      const alpha = -(p.g / p.L) * Math.sin(pend.theta);
      pend.omega += alpha * dt;
      pend.theta += pend.omega * dt;

      const bobPos = new THREE.Vector3(
        pivot.x + p.L * Math.sin(pend.theta),
        pivot.y - p.L * Math.cos(pend.theta),
        pivot.z
      );

      setRod(pend.rod, pivot, bobPos, 1);
      pend.bob.position.copy(bobPos);
      trailPush(pend.trail, bobPos);

      const speed = p.L * Math.abs(pend.omega);
      const vDir = new THREE.Vector3(Math.cos(pend.theta), Math.sin(pend.theta), 0).multiplyScalar(pend.omega >= 0 ? 1 : -1);
      setArrow(pend.vArrow, bobPos, vDir, speed * 0.6);

      const aTan = -(p.g) * Math.sin(pend.theta);
      const aDir = new THREE.Vector3(Math.cos(pend.theta), Math.sin(pend.theta), 0).multiplyScalar(aTan >= 0 ? 1 : -1);
      setArrow(pend.aArrow, bobPos, aDir, Math.abs(aTan) * 0.3);

      pend.labels[0].position.set(bobPos.x, bobPos.y + 0.6, bobPos.z);
      pend.labels[1].position.set(bobPos.x, bobPos.y + 1.15, bobPos.z);
      pend.labels[2].position.set(0, 3.6, 0);
      pend.labels[3].position.set(-1.7, 0.5, 0);

      const lowestY = pivot.y - p.L;
      const ke = 0.5 * 1 * speed * speed;
      const pe = p.g * (bobPos.y - lowestY);
      const period = 2 * Math.PI * Math.sqrt(p.L / p.g);

      window.SimTelemetry = {
        theta: pend.theta * 180 / Math.PI,
        omega: pend.omega,
        speed,
        aTan: Math.abs(aTan),
        ke,
        pe,
        period
      };
    }

    function relabelPendulum() {
      if (!pend) return;
      const p = P('pendulum');
      const speed = p.L * Math.abs(pend.omega);
      const aTan = Math.abs(-(p.g) * Math.sin(pend.theta));
      const thetaDeg = pend.theta * 180 / Math.PI;
      const period = 2 * Math.PI * Math.sqrt(p.L / p.g);
      setTextSprite(pend.labels[0], 'v ' + speed.toFixed(1) + ' m/s', LIGHT_RED);
      setTextSprite(pend.labels[1], 'a ' + aTan.toFixed(1) + ' m/s²', LIGHT_GREEN);
      setTextSprite(pend.labels[2], 'θ ' + thetaDeg.toFixed(1) + '°', LIGHT_WHITE);
      setTextSprite(pend.labels[3], 'T ' + period.toFixed(2) + ' s', LIGHT_WHITE);
    }

    // ============================================================
    // 3. バネ Spring (SHM)
    // ============================================================
    let spr = null;
    const ANCHOR_X = -3.4;
    const MAX_X = 3.4;

    function initSpring() {
      spr = {
        x: 0,
        v: 0,
        mass: null,
        springLine: null,
        vArrow: null,
        fArrow: null,
        labels: null
      };
      makeGround(12, 6);

      const rail = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.06, 0.1), stdMaterial(0x2a4480));
      rail.position.set(0, 0.58, 0);
      scene.add(rail);

      const anchorPost = makeCylinder(0x3a5aa0, 0.04, 0.7);
      anchorPost.position.set(ANCHOR_X, 0.35, 0);
      scene.add(anchorPost);

      const eqTick = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, 0.16, 0.16),
        new THREE.MeshBasicMaterial({ color: C.preview, transparent: true, opacity: 0.8 })
      );
      eqTick.position.set(0, 0.68, 0);
      scene.add(eqTick);

      const mass = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42), stdMaterial(0xff6a7a, { metalness: 0.3 }));
      mass.position.y = 0.58;
      scene.add(mass);
      spr.mass = mass;

      spr.springLine = buildSpringLine(ANCHOR_X, 0);
      scene.add(spr.springLine);

      spr.vArrow = makeArrow(C.velocity, 1);
      spr.fArrow = makeArrow(C.force, 1);
      scene.add(spr.vArrow);
      scene.add(spr.fArrow);

      const labels = [
        makeTextSprite('v -- m/s', LIGHT_RED),
        makeTextSprite('F -- N', LIGHT_BLUE),
        makeTextSprite('x -- m', LIGHT_WHITE),
        makeTextSprite('T -- s', LIGHT_WHITE)
      ];
      labels.forEach(l => scene.add(l));
      spr.labels = labels;
    }

    function buildSpringLine(ax, bx) {
      const coils = 14;
      const segs = 140;
      const arr = new Float32Array((segs + 1) * 3);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: C.preview }));
      writeSpringLine(line, ax, bx, segs, coils);
      return line;
    }

    function writeSpringLine(line, ax, bx, segs, coils) {
      const attr = line.geometry.attributes.position;
      const arr = attr.array;
      const radius = 0.16;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const x = ax + (bx - ax) * t;
        const ang = t * coils * Math.PI * 2;
        arr[i * 3] = x;
        arr[i * 3 + 1] = Math.sin(ang) * radius;
        arr[i * 3 + 2] = Math.cos(ang) * radius;
      }
      attr.needsUpdate = true;
    }

    function updateSpringGeometry() {
      if (!spr) return;
      writeSpringLine(spr.springLine, ANCHOR_X, spr.mass.position.x, 140, 14);
    }

    function resetSpring() {
      if (!spr) return;
      const p = P('spring');
      spr.x = p.x0;
      spr.v = 0;
    }

    function updateSpring(dt) {
      const p = P('spring');
      const F = -p.k * spr.x - p.damping * spr.v;
      spr.v += (F / p.m) * dt;
      spr.x += spr.v * dt;

      if (spr.x > MAX_X - 0.2) { spr.x = MAX_X - 0.2; spr.v = -Math.abs(spr.v) * 0.6; }
      if (spr.x < -MAX_X + 0.2) { spr.x = -MAX_X + 0.2; spr.v = Math.abs(spr.v) * 0.6; }

      spr.mass.position.set(spr.x, 0.58, 0);
      updateSpringGeometry();

      setArrow(spr.vArrow, new THREE.Vector3(spr.x, 0.9, 0), new THREE.Vector3(Math.sign(spr.v), 0, 0), Math.abs(spr.v) * 0.3);
      setArrow(spr.fArrow, new THREE.Vector3(spr.x, 0.25, 0), new THREE.Vector3(Math.sign(F), 0, 0), Math.abs(F) * 0.09);

      spr.labels[0].position.set(spr.x, 1.2, 0);
      spr.labels[1].position.set(spr.x, 1.75, 0);
      spr.labels[2].position.set(spr.x, 0.14, 0);
      spr.labels[3].position.set(2.9, 0.5, 0);

      const ke = 0.5 * p.m * spr.v * spr.v;
      const pe = 0.5 * p.k * spr.x * spr.x;
      const period = 2 * Math.PI * Math.sqrt(p.m / p.k);

      window.SimTelemetry = {
        x: spr.x,
        v: spr.v,
        f: F,
        ke,
        pe,
        period
      };
    }

    function relabelSpring() {
      if (!spr) return;
      const p = P('spring');
      const F = -p.k * spr.x - p.damping * spr.v;
      setTextSprite(spr.labels[0], 'v ' + spr.v.toFixed(1) + ' m/s', LIGHT_RED);
      setTextSprite(spr.labels[1], 'F ' + F.toFixed(1) + ' N', LIGHT_BLUE);
      setTextSprite(spr.labels[2], 'x ' + spr.x.toFixed(2) + ' m', LIGHT_WHITE);
      setTextSprite(spr.labels[3], 'T ' + (2 * Math.PI * Math.sqrt(p.m / p.k)).toFixed(2) + ' s', LIGHT_WHITE);
    }

    // ============================================================
    // 4. 衝突 Collision / Momentum
    // ============================================================
    let col = null;

    function initCollision() {
      col = {
        x1: -4, x2: 4, v1r: 0, v2r: 0, m1: 0, m2: 0, r1: 0.3, r2: 0.3,
        b1: null, b2: null, vArrow1: null, vArrow2: null,
        collided: false, count: 0, finished: false,
        labels1: null, labels2: null, labelC: null
      };
      makeGround(18, 6);

      const centerMark = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, 0.12, 2.4),
        new THREE.MeshBasicMaterial({ color: C.preview, transparent: true, opacity: 0.5 })
      );
      centerMark.position.y = 0.06;
      scene.add(centerMark);

      col.b1 = new THREE.Mesh(new THREE.SphereGeometry(col.r1, 24, 24), stdMaterial(0xff6a7a, { metalness: 0.3 }));
      col.b2 = new THREE.Mesh(new THREE.SphereGeometry(col.r2, 24, 24), stdMaterial(0x31c4ff, { metalness: 0.3 }));
      col.b1.position.set(col.x1, col.r1, 0);
      col.b2.position.set(col.x2, col.r2, 0);
      scene.add(col.b1);
      scene.add(col.b2);

      col.vArrow1 = makeArrow(C.velocity, 1);
      col.vArrow2 = makeArrow(C.velocity, 1);
      scene.add(col.vArrow1);
      scene.add(col.vArrow2);

      col.labels1 = [
        makeTextSprite('v1 -- m/s', LIGHT_RED),
        makeTextSprite('p1 -- kg·m/s', LIGHT_WHITE)
      ];
      col.labels2 = [
        makeTextSprite('v2 -- m/s', LIGHT_RED),
        makeTextSprite('p2 -- kg·m/s', LIGHT_WHITE)
      ];
      col.labelC = makeTextSprite('Σp -- kg·m/s', LIGHT_WHITE);
      col.labels1.forEach(l => scene.add(l));
      col.labels2.forEach(l => scene.add(l));
      scene.add(col.labelC);
    }

    function collideRadii(m) {
      return 0.28 * Math.pow(Math.max(m, 0.1), 1 / 3);
    }

    function resetCollision() {
      if (!col) return;
      const c = P('collision');
      col.m1 = c.m1;
      col.m2 = c.m2;
      col.r1 = collideRadii(col.m1);
      col.r2 = collideRadii(col.m2);
      col.x1 = -4;
      col.x2 = 4;
      col.v1r = c.v1;
      col.v2r = c.v2;
      col.collided = false;
      col.finished = false;
      col.b1.scale.set(col.r1 / 0.28, col.r1 / 0.28, col.r1 / 0.28);
      col.b2.scale.set(col.r2 / 0.28, col.r2 / 0.28, col.r2 / 0.28);
      col.b1.position.set(col.x1, col.r1, 0);
      col.b2.position.set(col.x2, col.r2, 0);
    }

    function updateCollision(dt) {
      const c = P('collision');
      if (!col.collided && !col.finished) {
        col.x1 += col.v1r * dt;
        col.x2 += col.v2r * dt;
        col.b1.position.set(col.x1, col.r1, 0);
        col.b2.position.set(col.x2, col.r2, 0);

        if (col.x2 - col.x1 <= col.r1 + col.r2) {
          const e = c.e;
          const div = (col.m1 + col.m2);
          col.v1r = ((col.m1 - e * col.m2) * col.v1r + (1 + e) * col.m2 * col.v2r) / div;
          col.v2r = ((col.m2 - e * col.m1) * col.v2r + (1 + e) * col.m1 * col.v1r) / div;
          col.x1 = col.x2 - (col.r1 + col.r2) - 0.001;
          col.b1.position.set(col.x1, col.r1, 0);
          col.collided = true;
          col.count++;
        }
        if (col.x1 < -7.5 || col.x2 > 7.5) col.finished = true;
      }

      setArrow(col.vArrow1, col.b1.position.clone().add(new THREE.Vector3(0, col.r1 + 0.15, 0)),
        new THREE.Vector3(Math.sign(col.v1r), 0, 0), Math.abs(col.v1r) * 0.3);
      setArrow(col.vArrow2, col.b2.position.clone().add(new THREE.Vector3(0, col.r2 + 0.15, 0)),
        new THREE.Vector3(Math.sign(col.v2r), 0, 0), Math.abs(col.v2r) * 0.3);

      col.labels1[0].position.set(col.x1, col.r1 + 0.65, 0);
      col.labels1[1].position.set(col.x1, col.r1 + 1.2, 0);
      col.labels2[0].position.set(col.x2, col.r2 + 0.65, 0);
      col.labels2[1].position.set(col.x2, col.r2 + 1.2, 0);
      col.labelC.position.set(0, 1.9, 0);

      window.SimTelemetry = {
        m1: col.m1, m2: col.m2,
        v1: col.v1r, v2: col.v2r,
        p1: col.m1 * col.v1r, p2: col.m2 * col.v2r,
        pTotal: col.m1 * col.v1r + col.m2 * col.v2r
      };
    }

    function relabelCollision() {
      if (!col) return;
      setTextSprite(col.labels1[0], 'v¹ ' + col.v1r.toFixed(1) + ' m/s', LIGHT_RED);
      setTextSprite(col.labels1[1], 'p¹ ' + (col.m1 * col.v1r).toFixed(1) + ' kg·m/s', LIGHT_WHITE);
      setTextSprite(col.labels2[0], 'v² ' + col.v2r.toFixed(1) + ' m/s', LIGHT_RED);
      setTextSprite(col.labels2[1], 'p² ' + (col.m2 * col.v2r).toFixed(1) + ' kg·m/s', LIGHT_WHITE);
      setTextSprite(col.labelC, 'Σp ' + (col.m1 * col.v1r + col.m2 * col.v2r).toFixed(1) + ' kg·m/s', LIGHT_WHITE);
    }

    // ============================================================
    // 5. 等速円運動 Uniform Circular Motion
    // ============================================================
    let circ = null;

    function initCircular() {
      circ = {
        phi: 0,
        ring: null,
        ball: null,
        spoke: null,
        trail: null,
        vArrow: null,
        aArrow: null,
        labels: null
      };
      makeGround(16, 8);

      const pole = makeCylinder(0x2a4480, 0.04, 2.1);
      pole.position.y = 1.05;
      scene.add(pole);

      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), stdMaterial(0x80b0ff));
      cap.position.y = 2.0;
      scene.add(cap);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1, 0.035, 8, 96),
        new THREE.MeshBasicMaterial({ color: C.preview, transparent: true, opacity: 0.55 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 2.0;
      scene.add(ring);
      circ.ring = ring;

      const spoke = makeCylinder(0x506090, 0.018, 1);
      spoke.position.y = 2.0;
      scene.add(spoke);
      circ.spoke = spoke;

      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 20), stdMaterial(0xffb84d, { metalness: 0.35 }));
      ball.position.y = 2.0;
      scene.add(ball);
      circ.ball = ball;

      circ.trail = makeTrail(C.trail, 240);

      circ.vArrow = makeArrow(C.velocity, 1);
      circ.aArrow = makeArrow(C.acceleration, 1);
      scene.add(circ.vArrow);
      scene.add(circ.aArrow);

      const labels = [
        makeTextSprite('v -- m/s', LIGHT_RED),
        makeTextSprite('a -- m/s²', LIGHT_GREEN),
        makeTextSprite('F -- N', LIGHT_BLUE)
      ];
      labels.forEach(l => scene.add(l));
      circ.labels = labels;
    }

    function rebuildRing() {
      if (!circ) return;
      const p = P('circular');
      circ.ring.geometry.dispose();
      circ.ring.geometry = new THREE.TorusGeometry(p.r, 0.035, 8, 96);
      circ.ring.rotation.x = Math.PI / 2;
      circ.ring.position.y = 2.0;
    }

    function resetCircular() {
      if (!circ) return;
      circ.phi = 0;
    }

    function updateCircular(dt) {
      const p = P('circular');
      const r = p.r;
      circ.phi += p.omega * dt;

      const pos = new THREE.Vector3(r * Math.cos(circ.phi), 2.0, r * Math.sin(circ.phi));
      circ.ball.position.copy(pos);

      setRod(circ.spoke, new THREE.Vector3(0, 2.0, 0), pos, 1);
      trailPush(circ.trail, pos);

      const tangent = new THREE.Vector3(-Math.sin(circ.phi), 0, Math.cos(circ.phi));
      const centerDir = new THREE.Vector3(-Math.cos(circ.phi), 0, -Math.sin(circ.phi));
      setArrow(circ.vArrow, pos, tangent, r * p.omega);
      setArrow(circ.aArrow, pos, centerDir, r * p.omega * p.omega);

      circ.labels[0].position.set(pos.x, 2.55, pos.z);
      circ.labels[1].position.set(pos.x, 3.1, pos.z);
      circ.labels[2].position.set(0, 2.6, 0);

      const T = 2 * Math.PI / p.omega;
      window.SimTelemetry = {
        r,
        omega: p.omega,
        period: T,
        speed: r * p.omega,
        accel: r * p.omega * p.omega,
        force: p.mass * r * p.omega * p.omega
      };
    }

    function relabelCircular() {
      if (!circ) return;
      const p = P('circular');
      const r = p.r;
      const v = r * p.omega;
      const a = r * p.omega * p.omega;
      const F = p.mass * a;
      setTextSprite(circ.labels[0], 'v ' + v.toFixed(2) + ' m/s', LIGHT_RED);
      setTextSprite(circ.labels[1], 'a ' + a.toFixed(2) + ' m/s²', LIGHT_GREEN);
      setTextSprite(circ.labels[2], 'F ' + F.toFixed(2) + ' N', LIGHT_BLUE);
    }

    // ============================================================
    // Shared lifecycle
    // ============================================================
    function disposeScene() {
      if (scene) {
        scene.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach(m => {
              if (!m) return;
              if (m.map) m.map.dispose();
              m.dispose();
            });
          }
        });
      }
      scene = null;
    }

    function teardown() {
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
        renderer = null;
      }
      if (resizeObs) {
        resizeObs.disconnect();
        resizeObs = null;
      }
      controls = null;
      camera = null;
      clock = null;
      activeSim = null;
      acc = 0;
      labelTimer = 0;
      proj = null;
      pend = null;
      spr = null;
      col = null;
      circ = null;
      disposeScene();
    }

    function resetSim() {
      switch (activeSim) {
        case 'projectile': clearProjectiles(); break;
        case 'pendulum': resetPendulum(); break;
        case 'spring': resetSpring(); break;
        case 'collision': resetCollision(); break;
        case 'circular': resetCircular(); break;
      }
    }

    function notifyParamsChanged() {
      switch (activeSim) {
        case 'projectile':
          updateProjectilePreview();
          break;
        case 'spring':
          updateSpringGeometry();
          break;
        case 'collision':
          resetCollision();
          window.SimTelemetry = {};
          break;
        case 'circular':
          rebuildRing();
          trailReset();
          break;
      }
    }

    function trailReset() {
      if (circ && circ.trail) {
        circ.trail.arr.fill(0);
        circ.trail.count = 0;
        circ.trail.geo.setDrawRange(0, 0);
      }
    }

    function relabel() {
      if (activeSim === 'projectile') relabelProjectile();
      else if (activeSim === 'pendulum') relabelPendulum();
      else if (activeSim === 'spring') relabelSpring();
      else if (activeSim === 'collision') relabelCollision();
      else if (activeSim === 'circular') relabelCircular();
    }

    function initSim(id) {
      teardown();

      const el = document.getElementById('SimContainer');
      if (!el) {
        setTimeout(() => { if (typeof window.InitSimFn === 'function') window.InitSimFn(id); }, 150);
        return;
      }
      container = el;

      const width = el.clientWidth;
      const height = el.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070a16);

      camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 300);
      clock = new THREE.Clock();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      el.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 1.5;
      controls.maxDistance = 120;

      makeLights();
      activeSim = id;
      playing = true;
      acc = 0;

      const camLook = {
        projectile: { pos: [30, 16, 34], target: [10, 0, 0] },
        pendulum:   { pos: [5, 3.2, 6],  target: [0, 2, 0] },
        spring:     { pos: [6.5, 2.4, 6], target: [0, 0.58, 0] },
        collision:  { pos: [9, 4, 10],    target: [0, 0.25, 0] },
        circular:   { pos: [5.5, 4, 6.5], target: [0, 1, 0] }
      };
      const cfg = camLook[id] || camLook.projectile;
      camera.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
      controls.target.set(cfg.target[0], cfg.target[1], cfg.target[2]);
      controls.update();

      if (id === 'projectile') initProjectile();
      else if (id === 'pendulum') { initPendulum(); resetPendulum(); }
      else if (id === 'spring') { initSpring(); resetSpring(); }
      else if (id === 'collision') { initCollision(); resetCollision(); }
      else if (id === 'circular') { initCircular(); resetCircular(); }

      window.SimTelemetry = {};
      labelTimer = LABEL_UPDATE;

      resizeObs = new ResizeObserver(() => {
        if (!container || !camera || !renderer) return;
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });
      resizeObs.observe(container);

      animate();
    }

    function animate() {
      animId = requestAnimationFrame(animate);
      const dtReal = Math.min(clock.getDelta(), 0.05);

      if (playing && activeSim && scene) {
        if (activeSim === 'projectile') {
          updateProjectile(dtReal);
        } else {
          acc += dtReal;
          while (acc >= STEP) {
            acc -= STEP;
            if (activeSim === 'pendulum') updatePendulum(STEP);
            else if (activeSim === 'spring') updateSpring(STEP);
            else if (activeSim === 'collision') updateCollision(STEP);
            else if (activeSim === 'circular') updateCircular(STEP);
          }
        }
      }

      if (scene) {
        labelTimer += dtReal;
        if (labelTimer >= LABEL_UPDATE && activeSim) {
          labelTimer = 0;
          relabel();
        }
      }

      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.InitSimFn = initSim;
    window.CleanupSimFn = teardown;
    window.ResetSimFn = resetSim;
    window.LaunchSimFn = launchProjectile;
    window.ClearProjectilesFn = clearProjectiles;
    window.SetSimPlaying = function(v) { playing = v; };
    window.NotifyParamChanged = notifyParamsChanged;
  </script>
</body>
