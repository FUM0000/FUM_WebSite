<body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">フォント</h1>
  <v-app id="App" v-cloak>
    <template>
      <main-system-bar :drawer="Drawer" @change-drawer="ChangeDrawer">Note > コンピュータ > フォント</main-system-bar>

      <v-main id="Main">
        <transition name="Fade_Page">
          <v-container v-show="Ready_Page" fluid fill-height class="pa-5" style="display: flex; align-content: center;">
            <v-row justify="center">
              <v-col xs="12" md="6">
                <v-card class="mt-6">
                  <v-card-title class="content-text d-flex justify-space-between align-center">
                    <span>フォント</span>
                    <div class="stepper-next">
                      <v-btn color="primary" @click="Count_Step_1 = Count_Step_1 + 1" v-if="Count_Step_1 < 3">次へ</v-btn>
                    </div>
                  </v-card-title>
                  <v-card-text>
                    <v-text-field v-model="searchQuery" label="フォントを検索" prepend-inner-icon="mdi-magnify" clearable
                      outlined dense class="mb-4" @input="filterTreeview"></v-text-field>

                    <v-stepper v-model="Count_Step_1">
                      <v-stepper-header>
                        <v-stepper-step :complete="Count_Step_1 > 1" step="1" @click="Count_Step_1 = 1"></v-stepper-step>
                        <v-divider></v-divider>
                        <v-stepper-step :complete="Count_Step_1 > 2" step="2" @click="Count_Step_1 = 2"></v-stepper-step>
<v-divider></v-divider>
                        <v-stepper-step :complete="Count_Step_1 > 3" step="3" @click="Count_Step_1 = 3"></v-stepper-step>
</v-stepper-header>

                      <v-stepper-items>
                        <v-stepper-content step="1">
                          <v-card class="mb-12">
                            <v-card-text>
                              <v-card-title class="text-subtitle-2 font-weight-bold">日本語</v-card-title>
                              <v-treeview :items="filteredFontJapanese" item-key="name" activatable open-on-click
                                dense :open.sync="openNodesFontJapanese" @update:open="updateOpenNodesFontJapanese">
                                <template v-slot:label="{ item }">
                                  <span :class="{ 'search-highlight': item.matches }">{{ item.name }}</span>
                                </template>
                              </v-treeview>
                            </v-card-text>
                          </v-card>

                        </v-stepper-content>

                        <v-stepper-content step="2">
                          <v-card class="mb-12">
                            <v-card-text>
                              <v-card-title class="text-subtitle-2 font-weight-bold">英語</v-card-title>
                              <v-treeview :items="filteredFontEnglish" item-key="name" activatable open-on-click dense
                                :open.sync="openNodesFontEnglish" @update:open="updateOpenNodesFontEnglish">
                                <template v-slot:label="{ item }">
                                  <span :class="{ 'search-highlight': item.matches }">{{ item.name }}</span>
                                </template>
                              </v-treeview>
                            </v-card-text>
</v-card>
                          <div class="button-container">
                            <v-btn text @click="Count_Step_1 = 1">戻る</v-btn>
                          </div>
                        </v-stepper-content>

                        <v-stepper-content step="3">
                          <v-card class="mb-12">
                            <v-card-text>
                              <v-card-title class="text-subtitle-2 font-weight-bold">その他</v-card-title>
                              <v-treeview :items="filteredFontOther" item-key="name" activatable open-on-click
                                dense :open.sync="openNodesFontOther" @update:open="updateOpenNodesFontOther">
                                <template v-slot:label="{ item }">
                                  <span :class="{ 'search-highlight': item.matches }">{{ item.name }}</span>
                                </template>
                              </v-treeview>
                            </v-card-text>
                          </v-card>
                          <div class="button-container">
                            <v-btn text @click="Count_Step_1 = 2">戻る</v-btn>
                          </div>
                        </v-stepper-content>
                      </v-stepper-items>
                    </v-stepper>
                  </v-card-text>
                </v-card>
              </v-col>
            </v-row>
          </v-container>
        </transition>
      </v-main>

      <main-navigation :drawer="Drawer" @change-drawer="ChangeDrawer"></main-navigation>
      <main-footer></main-footer>
    </template>
  </v-app>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js" integrity="sha384-smVS78N63G0uFpVH9bKdb+2YIW7Q9eFrle79imo+AWW6YLluQxAEK7kxLOt1bNex" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@2.7.2/dist/vuetify.js" integrity="sha384-IufsRL4FQ+k4aWgxYvH6I1RoIrzL8Ynna+E/AavDQE9hD+UBZQLSTX2+7pPQWNsr" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha384-fJU6sGmyn07b+uD1nMk7/iSb4yvaowcueiQhfVgQuD98rfva8mcr1eSvjchfpMrH" crossorigin="anonymous"></script>
  <script src="../../Asset/Javascript/Common.js?v=1.04"></script>

  <script>
    new Vue({
      el: '#App',
      vuetify: new Vuetify(),
      mixins: [window.Mixins_Common],
      data: {
        Count_Step_1: 1,
        dialog: false,
        searchQuery: '',
        filteredFontJapanese: [],
        filteredFontEnglish: [],
        filteredFontOther: [],
        openNodesFontJapanese: [],
        openNodesFontEnglish: [],
        openNodesFontOther: [],
        FontJapanese: [
          {
            name: '日本語', children: [
              { name: 'Zen Kaku Gothic New：ゴジック、等幅。美しい漢字。' },
              { name: 'Zen Old Mincho　　　：セリフ。美しいプロポーション。' },
              { name: 'Noto Serif JP　　　　：セリフ。Zenより安定。' },
            ]
          },
        ],
        FontEnglish: [
          {
            name: '英語', children: [
              { name: 'Space Mono　　：等幅。少しサイバー感。' },
              { name: 'Source Sans 3　：丸っこくてフォーマル。' },
              { name: 'Nabla　　　　　：なめらかな3D。' },
              { name: 'Noto Serif　　　：セリフ。美しいプロポーション。' },
            ]
          },
        ],
        FontOther: [
          {
            name: 'その他', children: [
              { name: 'Redacted Script：読めない文字。コピペで読める。' },
            ]
          },
        ],
      },
      created() {
        this.filteredFontJapanese = JSON.parse(JSON.stringify(this.FontJapanese));
        this.filteredFontEnglish = JSON.parse(JSON.stringify(this.FontEnglish));
        this.filteredFontOther = JSON.parse(JSON.stringify(this.FontOther));
      },
      methods: {
        collectAllNodeIds(items) {
          const ids = [];
          const collect = (nodes) => {
            nodes.forEach((node) => {
              ids.push(node.name);
              if (node.children) {
                collect(node.children);
              }
            });
          };
          collect(items);
          return ids;
        },
        updateOpenNodesFontJapanese(newOpen) {
          this.openNodesFontJapanese = newOpen;
        },
        updateOpenNodesFontEnglish(newOpen) {
          this.openNodesFontEnglish = newOpen;
        },
        updateOpenNodesFontOther(newOpen) {
          this.openNodesFontOther = newOpen;
        },
        filterTreeview() {
          const query = this.searchQuery ? this.searchQuery.toLowerCase().trim() : '';
          if (!query) {
            this.filteredFontJapanese = JSON.parse(JSON.stringify(this.FontJapanese));
            this.filteredFontEnglish = JSON.parse(JSON.stringify(this.FontEnglish));
            this.filteredFontOther = JSON.parse(JSON.stringify(this.FontOther));
            this.openNodesFontJapanese = [];
            this.openNodesFontEnglish = [];
            this.openNodesFontOther = [];
            return;
          }

          const filterTree = (items) => {
            return items.reduce((acc, item) => {
              const itemCopy = { ...item };
              const matches = item.name.toLowerCase().includes(query);

              if (item.children) {
                itemCopy.children = filterTree(item.children);
                if (itemCopy.children.length > 0 || matches) {
                  itemCopy.matches = matches;
                  acc.push(itemCopy);
                }
              } else if (matches) {
                itemCopy.matches = true;
                acc.push(itemCopy);
              }
              return acc;
            }, []);
          };

          this.filteredFontJapanese = filterTree(JSON.parse(JSON.stringify(this.FontJapanese)));
          this.filteredFontEnglish = filterTree(JSON.parse(JSON.stringify(this.FontEnglish)));
          this.filteredFontOther = filterTree(JSON.parse(JSON.stringify(this.FontOther)));

          this.openNodesFontJapanese = this.collectAllNodeIds(this.filteredFontJapanese);
          this.openNodesFontEnglish = this.collectAllNodeIds(this.filteredFontEnglish);
          this.openNodesFontOther = this.collectAllNodeIds(this.filteredFontOther);
        }
      }
    });
  </script>
</body>

</html>
