    <script type="module">

        // Setup Threejs
        import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
        import { FBXLoader } from "https://unpkg.com/three@0.126.1/examples/jsm/loaders/FBXLoader.js";
        import { EffectComposer } from 'https://unpkg.com/three@0.126.1/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://unpkg.com/three@0.126.1/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://unpkg.com/three@0.126.1/examples/jsm/postprocessing/UnrealBloomPass.js';
        import {
            Mobile_or_Desktop,
            RandomNumber_Between,
            Shousuu_Kirisute,
            Radians_to_Degrees,
            Alpha_Change,
            FC_Input_Joystick,
            FC_Input_Keyboard,
            FC_GameObject,
            FC_Environment,
            FC_Animation,
            FC_Camera,
            FC_Camera_Controller,
            FC_Light_Ambient,
            FC_Light_Directional,

            FC_Manager,
        } from "../../Asset/Javascript/Game.js";
        const Scene = new THREE.Scene();
        const Renderer = new THREE.WebGLRenderer({ canvas: document.querySelector("#Canvas"), antialias: true });
        Scene.fog = new THREE.Fog(0x070B14, 0, 6);
        Renderer.setPixelRatio(window.devicePixelRatio);
        Renderer.setSize(window.innerWidth, window.innerHeight);
        Renderer.setClearColor(new THREE.Color(0x070B14));
        Renderer.toneMapping = THREE.ACESFilmicToneMapping;
        Renderer.toneMappingExposure = 1.0;

        const BLOOM_LAYER = 1;

        const _BloomComposer = new EffectComposer(Renderer);
        _BloomComposer.renderToScreen = false;
        const _FishRenderPass = new RenderPass(Scene, null, null, 0x000000, 1);
        const _BloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.8, 0.2);
        _BloomComposer.addPass(_FishRenderPass);
        _BloomComposer.addPass(_BloomPass);

        const _BloomCompositeMaterial = new THREE.ShaderMaterial({
            uniforms: { tDiffuse: { value: null }, tSceneDepth: { value: null }, tGlowDepth: { value: null } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform sampler2D tSceneDepth;
                uniform sampler2D tGlowDepth;
                varying vec2 vUv;
                void main() {
                    float glowDepth = texture2D(tGlowDepth, vUv).r;
                    float sceneDepth = texture2D(tSceneDepth, vUv).r;
                    if (glowDepth >= 0.9999) {
                        if (sceneDepth >= 0.9999) {
                            gl_FragColor = texture2D(tDiffuse, vUv);
                        } else {
                            discard;
                        }
                        return;
                    }
                    if (sceneDepth + 0.002 < glowDepth) discard;
                    gl_FragColor = texture2D(tDiffuse, vUv);
                }
            `,
            depthTest: false, depthWrite: false, transparent: true,
            blending: THREE.AdditiveBlending,
        });
        const _BloomCompositeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), _BloomCompositeMaterial);
        _BloomCompositeQuad.frustumCulled = false;
        const _BloomCompositeScene = new THREE.Scene();
        _BloomCompositeScene.add(_BloomCompositeQuad);

        const _SceneTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
        _SceneTarget.depthTexture = new THREE.DepthTexture(window.innerWidth, window.innerHeight);
        const _BloomDepthTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
        _BloomDepthTarget.depthTexture = new THREE.DepthTexture(window.innerWidth, window.innerHeight);

        const Loader_FBX = new FBXLoader();
        document.addEventListener('pointerdown', function (event) { PointerDown(event); });
        document.addEventListener('touchstart', function (event) { PointerDown(event); });
        document.addEventListener('mousedown', function (event) { PointerDown(event); });
        document.addEventListener('pointerup', function (event) { PointerUp(event); });
        document.addEventListener('touchend', function (event) { PointerUp(event); });
        document.addEventListener('mouseup', function (event) { PointerUp(event); });

        class C_Elevator {

            constructor(scene, floors, floorHeight, elevatorSpeed, floorNames = [], floorDescriptions = []) {
                this.scene = scene;
                this.floors = floors;
                this.floorHeight = floorHeight;
                this.elevatorSpeed = elevatorSpeed;
                this.floorNames = floorNames.length === floors
                    ? floorNames
                    : Array.from({ length: floors }, (_, i) => `F${i + 1}`);
                this.floorDescriptions = floorDescriptions.length === floors
                    ? floorDescriptions
                    : Array.from({ length: floors }, () => "");
                this.currentFloor = 0;
                this.targetFloor = 0;
                this.isMoving = false;
                this.floorButtons = [];
                this.floorLabels = [];
                this.createElevator();
            }

            createElevatorPillar() {
                const radius = 1;
                const height = 100;
                const radialSegments = 32;

                const geometry = new THREE.CylinderGeometry(radius, radius, height, radialSegments);

                this._pillarMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uOpacity: { value: 0.025 },
                        uBaseColor: { value: new THREE.Color(0.4, 0.55, 0.8) },
                        uFresnelColor: { value: new THREE.Color(0.5, 0.7, 1.0) },
                        uSpecularColor: { value: new THREE.Color(0.8, 0.9, 1.0) },
                        uFresnelPower: { value: 3.5 },
                        uSpecularPower: { value: 96.0 },
                        uEdgeGlowIntensity: { value: 0.6 },
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vWorldPosition;
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                            vWorldPosition = worldPosition.xyz;
                            vec4 mvPosition = viewMatrix * worldPosition;
                            vViewPosition = -mvPosition.xyz;
                            vNormal = normalize(normalMatrix * normal);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        uniform float uOpacity;
                        uniform vec3 uBaseColor;
                        uniform vec3 uFresnelColor;
                        uniform vec3 uSpecularColor;
                        uniform float uFresnelPower;
                        uniform float uSpecularPower;
                        uniform float uEdgeGlowIntensity;
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vWorldPosition;
                        varying vec2 vUv;
                        void main() {
                            vec3 viewDir = normalize(vViewPosition);
                            vec3 normal = normalize(vNormal);
                            float NdotV = abs(dot(viewDir, normal));
                            float fresnel = pow(1.0 - NdotV, uFresnelPower);
                            vec3 lightDir1 = normalize(vec3(1.0, 1.0, 0.5));
                            vec3 lightDir2 = normalize(vec3(-0.5, 0.5, -1.0));
                            vec3 halfVec1 = normalize(viewDir + lightDir1);
                            vec3 halfVec2 = normalize(viewDir + lightDir2);
                            float spec1 = pow(max(dot(normal, halfVec1), 0.0), uSpecularPower);
                            float spec2 = pow(max(dot(normal, halfVec2), 0.0), uSpecularPower * 0.5);
                            float caustic = sin(vWorldPosition.y * 3.0 + uTime * 0.8) * 0.5 + 0.5;
                            caustic *= sin(vWorldPosition.x * 2.5 - uTime * 0.5) * 0.5 + 0.5;
                            caustic = pow(caustic, 4.0) * 0.12;
                            float edgeGlow = pow(1.0 - NdotV, 5.0) * uEdgeGlowIntensity;
                            vec3 color = uBaseColor * 0.1;
                            color += uFresnelColor * fresnel * 0.5;
                            color += uSpecularColor * (spec1 * 0.6 + spec2 * 0.3);
                            color += vec3(0.3, 0.5, 0.9) * edgeGlow;
                            color += vec3(0.2, 0.4, 0.7) * caustic;
                            float alpha = uOpacity + fresnel * 0.35 + (spec1 + spec2) * 0.15 + edgeGlow * 0.15;
                            alpha = clamp(alpha, 0.0, 0.55);
                            gl_FragColor = vec4(color, alpha);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    fog: false,
                });

                this.pillar = new THREE.Mesh(geometry, this._pillarMaterial);
                this.scene.add(this.pillar);
            }
            createElevator() {
                const radius = 1;
                const height = 3;
                const radialSegments = 48;

                const geometry = new THREE.CylinderGeometry(radius, radius, height, radialSegments);

                this._glassMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uOpacity: { value: 0.05 },
                        uBaseColor: { value: new THREE.Color(0.45, 0.6, 0.85) },
                        uFresnelColor: { value: new THREE.Color(0.55, 0.75, 1.0) },
                        uSpecularColor: { value: new THREE.Color(0.85, 0.92, 1.0) },
                        uFresnelPower: { value: 3.0 },
                        uSpecularPower: { value: 128.0 },
                        uEdgeGlowIntensity: { value: 1.0 },
                        uRefractionStrength: { value: 0.04 },
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vWorldPosition;
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                            vWorldPosition = worldPosition.xyz;
                            vec4 mvPosition = viewMatrix * worldPosition;
                            vViewPosition = -mvPosition.xyz;
                            vNormal = normalize(normalMatrix * normal);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        uniform float uOpacity;
                        uniform vec3 uBaseColor;
                        uniform vec3 uFresnelColor;
                        uniform vec3 uSpecularColor;
                        uniform float uFresnelPower;
                        uniform float uSpecularPower;
                        uniform float uEdgeGlowIntensity;
                        uniform float uRefractionStrength;
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vWorldPosition;
                        varying vec2 vUv;
                        void main() {
                            vec3 viewDir = normalize(vViewPosition);
                            vec3 normal = normalize(vNormal);
                            float NdotV = abs(dot(viewDir, normal));
                            float fresnel = pow(1.0 - NdotV, uFresnelPower);
                            vec3 refracted = refract(-viewDir, normal, 0.67);
                            vec2 refractOffset = refracted.xy * uRefractionStrength;
                            vec3 lightDir1 = normalize(vec3(1.0, 1.0, 0.5));
                            vec3 lightDir2 = normalize(vec3(-0.5, 0.5, -1.0));
                            vec3 lightDir3 = normalize(vec3(0.0, -0.3, 1.0));
                            vec3 halfVec1 = normalize(viewDir + lightDir1);
                            vec3 halfVec2 = normalize(viewDir + lightDir2);
                            vec3 halfVec3 = normalize(viewDir + lightDir3);
                            float spec1 = pow(max(dot(normal, halfVec1), 0.0), uSpecularPower);
                            float spec2 = pow(max(dot(normal, halfVec2), 0.0), uSpecularPower * 0.5);
                            float spec3 = pow(max(dot(normal, halfVec3), 0.0), uSpecularPower * 0.3);
                            float caustic1 = sin(vWorldPosition.y * 5.0 + uTime * 1.2 + vWorldPosition.x * 3.0) * 0.5 + 0.5;
                            float caustic2 = sin(vWorldPosition.y * 4.0 - uTime * 0.9 + vWorldPosition.z * 2.5) * 0.5 + 0.5;
                            float caustic = pow(caustic1 * caustic2, 3.0) * 0.2;
                            float edgeGlow = pow(1.0 - NdotV, 5.0) * uEdgeGlowIntensity;
                            float shimmer = sin(vWorldPosition.y * 10.0 + uTime * 2.0) * 0.03 + 0.97;
                            vec3 color = uBaseColor * 0.08 * shimmer;
                            color += uFresnelColor * fresnel * 0.4;
                            color += uSpecularColor * (spec1 * 0.5 + spec2 * 0.3 + spec3 * 0.15) * shimmer;
                            color += vec3(0.35, 0.55, 0.95) * edgeGlow;
                            color += vec3(0.3, 0.5, 0.85) * caustic;
                            color += vec3(0.15, 0.25, 0.4) * refractOffset.x;
                            float alpha = uOpacity + fresnel * 0.45 + (spec1 + spec2 + spec3) * 0.18 + edgeGlow * 0.22;
                            alpha = clamp(alpha, 0.0, 0.6);
                            gl_FragColor = vec4(color, alpha);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                });

                this.mesh = new THREE.Mesh(geometry, this._glassMaterial);
                this.scene.add(this.mesh);
                this.mesh.position.set(0, height / 2, 0);

                this.createFloorButtons();
                this.updateButtonVisuals();
            }

            createFloorButtons() {
                this.buttonPanel = new THREE.Group();
                this.buttonPanel.position.set(0, 0, 0);
                this.mesh.add(this.buttonPanel);

                const wallRadius = 0.82;
                const textRadius = wallRadius;
                const panelRadius = wallRadius - 0.03;
                const spacing = 0.19;
                const buttonWidth = 0.05;
                const buttonHeight = 0.05;
                const buttonDepth = 0.01;
                const columns = Math.min(2, this.floors);
                const rows = Math.ceil(this.floors / columns);
                const startY = ((rows - 1) * spacing) / 2;
                const columnGap = 0.42;
                const panelHalfWidth = ((columns - 1) * columnGap) / 2 + 0.23;
                const panelHeight = rows * spacing + 0.18;

                this.createCurvedPanelFrame(0, 0, panelRadius, panelHalfWidth * 2, panelHeight);

                for (let i = 0; i < this.floors; i++) {
                    const col = (columns - 1) - Math.floor(i / rows);
                    const row = i % rows;
                    const y = startY - row * spacing;
                    const xColumnCenter = (col - (columns - 1) / 2) * columnGap;
                    const buttonX = xColumnCenter;
                    const labelX = buttonX - 0.2;
                    const thetaButton = Math.PI + buttonX / wallRadius;
                    const labelText = `${this.floorNames[i]}　${this.floorDescriptions[i]}`;
                    const labelMesh = this.createCurvedWallLabelMesh(labelText, labelX, y, textRadius, 0.47, 0.05);
                    this.buttonPanel.add(labelMesh);
                    this.floorLabels.push(labelMesh);
                    const buttonGeometry = new THREE.BoxGeometry(buttonWidth, buttonHeight, buttonDepth);
                    const buttonMaterial = new THREE.ShaderMaterial({
                        uniforms: {
                            uTime: { value: 0 },
                            uBaseColor: { value: new THREE.Color(0.35, 0.55, 0.8) },
                            uFresnelColor: { value: new THREE.Color(0.6, 0.8, 1.0) },
                            uOpacity: { value: 0.25 },
                        },
                        vertexShader: `
                            varying vec3 vNormal;
                            varying vec3 vViewPos;
                            void main() {
                                vNormal = normalize(normalMatrix * normal);
                                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                                vViewPos = -mv.xyz;
                                gl_Position = projectionMatrix * mv;
                            }
                        `,
                        fragmentShader: `
                            uniform float uTime;
                            uniform vec3 uBaseColor;
                            uniform vec3 uFresnelColor;
                            uniform float uOpacity;
                            varying vec3 vNormal;
                            varying vec3 vViewPos;
                            void main() {
                                vec3 viewDir = normalize(vViewPos);
                                vec3 n = normalize(vNormal);
                                float fresnel = pow(1.0 - abs(dot(viewDir, n)), 2.5);
                                vec3 halfVec = normalize(viewDir + normalize(vec3(0.5, 0.5, 0.3)));
                                float spec = pow(max(dot(n, halfVec), 0.0), 64.0);
                                float pulse = sin(uTime * 2.5) * 0.05 + 0.95;
                                vec3 color = uBaseColor * 0.3 * pulse + uFresnelColor * fresnel * 0.5 + vec3(1.0) * spec * 0.4;
                                float alpha = uOpacity + fresnel * 0.3 + spec * 0.3;
                                gl_FragColor = vec4(color, alpha);
                            }
                        `,
                        transparent: true,
                        side: THREE.DoubleSide,
                        fog: false,
                        depthWrite: false,
                    });
                    const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
                    button.position.set(
                        Math.sin(thetaButton) * wallRadius,
                        y,
                        Math.cos(thetaButton) * wallRadius
                    );
                    button.lookAt(new THREE.Vector3(0, y, 0));
                    const buttonOutline = new THREE.LineSegments(
                        new THREE.EdgesGeometry(buttonGeometry),
                        new THREE.LineBasicMaterial({ color: 0x6699cc, transparent: true, opacity: 0.8, fog: false })
                    );
                    button.add(buttonOutline);
                    button.userData.floor = i;
                    button.userData.outline = buttonOutline;
                    this.buttonPanel.add(button);
                    this.floorButtons.push(button);
                }
            }
            createCurvedPanelFrame(xCenter, yCenter, radius, width, height) {
                const frameMaterial = new THREE.LineBasicMaterial({
                    color: 0x6699cc,
                    transparent: true,
                    opacity: 0.85,
                    fog: false
                });
                const halfWidth = width / 2;
                const halfHeight = height / 2;
                const segments = 48;
                const createHorizontalEdge = (y, reverse = false) => {
                    const points = [];
                    for (let i = 0; i <= segments; i++) {
                        const t = i / segments;
                        const localX = reverse
                            ? halfWidth - t * width
                            : -halfWidth + t * width;
                        const theta = Math.PI - (xCenter + localX) / radius;
                        points.push(new THREE.Vector3(
                            Math.sin(theta) * radius,
                            yCenter + y,
                            Math.cos(theta) * radius
                        ));
                    }
                    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), frameMaterial.clone());
                };
                const createVerticalEdge = (localX) => {
                    const theta = Math.PI + (xCenter + localX) / radius;
                    const x = Math.sin(theta) * radius;
                    const z = Math.cos(theta) * radius;
                    const points = [
                        new THREE.Vector3(x, yCenter - halfHeight, z),
                        new THREE.Vector3(x, yCenter + halfHeight, z)
                    ];
                    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), frameMaterial.clone());
                };
                this.buttonPanel.add(createHorizontalEdge(halfHeight));
                this.buttonPanel.add(createHorizontalEdge(-halfHeight, true));
                this.buttonPanel.add(createVerticalEdge(-halfWidth));
                this.buttonPanel.add(createVerticalEdge(halfWidth));
            }
            createCurvedWallLabelMesh(text, xCenter, y, radius, width, height) {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 128;
                const fontSize = 96;
                context.font = `${fontSize}px Arial`;
                context.textAlign = 'left';
                context.textBaseline = 'middle';
                context.fillStyle = '#8FBFFF';
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
                context.fillText(text, 24, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                const geometry = new THREE.PlaneGeometry(width, height, 40, 1);
                const positions = geometry.attributes.position;

                for (let i = 0; i < positions.count; i++) {
                    const localX = positions.getX(i);
                    const localY = positions.getY(i);
                    const theta = Math.PI + (xCenter + localX) / radius;
                    positions.setX(i, Math.sin(theta) * radius);
                    positions.setY(i, y + localY);
                    positions.setZ(i, Math.cos(theta) * radius);
                }

                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: true,
                    alphaTest: 0.5,
                    fog: false,
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(0, 0, 0);
                mesh.rotation.set(0, 0, 0);
                return mesh;
            }

            updateButtonVisuals() {
                for (let i = 0; i < this.floorButtons.length; i++) {
                    let color = new THREE.Color(0.35, 0.55, 0.8);
                    if (i === this.currentFloor) color = new THREE.Color(0.2, 0.85, 0.45);
                    if (this.isMoving && i === this.targetFloor) color = new THREE.Color(0.9, 0.9, 0.3);
                    if (this._waitingForCat && i === this._pendingTargetFloor) color = new THREE.Color(0.9, 0.9, 0.3);
                    this.floorButtons[i].material.uniforms.uBaseColor.value.copy(color);
                    this.floorButtons[i].material.uniforms.uFresnelColor.value.copy(color).lerp(new THREE.Color(1, 1, 1), 0.5);
                    if (this.floorButtons[i].userData.outline) {
                        this.floorButtons[i].userData.outline.material.color.copy(color);
                    }
                }
            }

            Update(time) {
                if (this._glassMaterial) this._glassMaterial.uniforms.uTime.value = time;
                if (this._pillarMaterial) this._pillarMaterial.uniforms.uTime.value = time;
                for (const btn of this.floorButtons) {
                    if (btn.material.uniforms) btn.material.uniforms.uTime.value = time;
                }
            }

            getFloorFromRaycast(raycaster) {
                const intersects = raycaster.intersectObjects(this.floorButtons, false);
                if (intersects.length === 0) return null;
                return intersects[0].object.userData.floor;
            }

            activateElevator(player, targetFloor = null) {
                if (this.isMoving) return;

                if (targetFloor === null || targetFloor === undefined) {
                    targetFloor = (this.currentFloor + 1) % this.floors;
                }
                if (targetFloor < 0 || targetFloor >= this.floors) return;
                if (targetFloor === this.currentFloor) return;

                const catInElevator = Cat && Cat._Flag_Loaded && Cat._Object &&
                    this.checkCatInElevator(Cat);

                if (!catInElevator) {
                    this._waitingForCat = true;
                    this._pendingTargetFloor = targetFloor;
                    this._pendingPlayer = player;
                    this.updateButtonVisuals();
                    player.Control_Enable = false;
                    return;
                }

                this._startElevator(player, targetFloor);
            }

            _startElevator(player, targetFloor) {
                this.isMoving = true;
                this.targetFloor = targetFloor;
                this._waitingForCat = false;
                this.updateButtonVisuals();
                const targetY = 1.5 + targetFloor * this.floorHeight;

                const moveElevator = () => {
                    const deltaY = (targetY - this.mesh.position.y) * this.elevatorSpeed * FC_Environment.TIME_DELTA;
                    this.mesh.position.y += deltaY;
                    player.Position.y += deltaY;

                    if (Manager && Manager._UI_Home && Manager._UI_Music) {

                        if (Manager._Button_Music) Manager._Button_Music.position.y += deltaY;

                this._pelvicLeftPoints.position.set(-0.3, -0.35, 0.10);
                this._pelvicRightPoints = new THREE.Points(pelvicGeometry, ptsFinMat(finColor));
                this._pelvicRightPoints.position.set(-0.3, -0.35, -0.10);
                this._pelvicRightPoints.scale.z = -1;
                this._analPoints = new THREE.Points(analGeometry, ptsFinMat(finColor));
                this._analPoints.position.set(0.44, -0.18, 0);
                this._group.add(this._bodyPoints);
                this._group.add(this._tailPoints);
                this._group.add(this._dorsalPoints);
                this._group.add(this._pectoralLeftPoints);
                this._group.add(this._pectoralRightPoints);
                this._group.add(this._pelvicLeftPoints);
                this._group.add(this._pelvicRightPoints);
                this._group.add(this._analPoints);
                this._group.scale.setScalar(this._scaleValue * 0.5);
            }
            Initialize(position) {
                this._position.copy(position);
                const angle = Math.random() * Math.PI * 2;
                this._velocity.set(Math.cos(angle) * this._speed, (Math.random() - 0.5) * 0.1, Math.sin(angle) * this._speed);
                this._group.position.copy(this._position);
                this._UpdateRotation(0);
            }
            _UpdateRotation(deltaTime) {
                if (this._velocity.lengthSq() > 0.001) {
                    const targetAngle = Math.atan2(this._velocity.z, -this._velocity.x);
                    let current = this._group.rotation.y;
                    let diff = targetAngle - current;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    this._group.rotation.y += diff * Math.min(1, 8 * deltaTime);
                    const tilt = -this._velocity.y * 0.3;
                    this._group.rotation.z = THREE.MathUtils.lerp(this._group.rotation.z, tilt, Math.min(1, 5 * deltaTime));
                }
            }
            ApplyBoidRules(neighbors, time) {
                const separation = new THREE.Vector3();
                const alignment = new THREE.Vector3();
                const cohesion = new THREE.Vector3();
                let separationCount = 0, alignCount = 0, cohesionCount = 0;
                const separationRadius = 2.0, alignmentRadius = 5.0, cohesionRadius = 6.0;
                for (const other of neighbors) {
                    if (other === this) continue;
                    const dist = this._position.distanceTo(other._position);
                    if (dist < separationRadius && dist > 0.001) {
                        const diff = new THREE.Vector3().subVectors(this._position, other._position);
                        diff.divideScalar(dist * dist);
                        separation.add(diff);
                        separationCount++;
                    }
                    if (dist < alignmentRadius) { alignment.add(other._velocity); alignCount++; }
                    if (dist < cohesionRadius) { cohesion.add(other._position); cohesionCount++; }
                }
                if (separationCount > 0) { separation.divideScalar(separationCount).normalize().multiplyScalar(0.15); }
                if (alignCount > 0) { alignment.divideScalar(alignCount).normalize().multiplyScalar(0.08); }
                if (cohesionCount > 0) { cohesion.divideScalar(cohesionCount).sub(this._position).normalize().multiplyScalar(0.04); }
                this._acceleration.add(separation);
                this._acceleration.add(alignment);
                this._acceleration.add(cohesion);
            }
            ApplyBounds(time, floorY) {
                const steer = new THREE.Vector3();
                const margin = 5.0;
                const turnForce = 0.08;
                const minY = floorY;
                const maxY = floorY + 12;
                this._minY = minY;
                if (this._position.x > FISH_WORLD_BOUNDS - margin) steer.x -= turnForce;
                else if (this._position.x < -FISH_WORLD_BOUNDS + margin) steer.x += turnForce;
                if (this._position.y > maxY) steer.y -= turnForce;
                else if (this._position.y < minY) steer.y += turnForce;
                if (this._position.z > FISH_WORLD_BOUNDS - margin) steer.z -= turnForce;
                else if (this._position.z < -FISH_WORLD_BOUNDS + margin) steer.z += turnForce;
                this._acceleration.add(steer);
            }
            Update(time, deltaTime) {
                this._phase += deltaTime;
                this._tailPhase += deltaTime * 8.0;
                this._bodyWavePhase += deltaTime * 3.0;
                this._velocity.add(this._acceleration);
                this._acceleration.set(0, 0, 0);
                const maxSpeed = this._speed * 1.5;
                const currentSpeed = this._velocity.length();
                if (currentSpeed > maxSpeed) this._velocity.normalize().multiplyScalar(maxSpeed);
                if (currentSpeed < this._speed * 0.3) this._velocity.normalize().multiplyScalar(this._speed * 0.3);
                this._position.addScaledVector(this._velocity, deltaTime);
                this._position.y = Math.max(this._minY, this._position.y);
                this._group.position.copy(this._position);
                this._UpdateRotation(deltaTime);
                this._AnimateTail(time);
                this._AnimateBody(time);
                this._AnimateDorsalFin(time);
                this._AnimateFins(time);
            }
            _AnimateTail(time) {
                const posAttr = this._tailMesh.geometry.attributes.position;
                const orig = this._tailOriginalPositions;
                const count = posAttr.count;
                for (let i = 0; i < count; i++) {
                    const ox = orig[i * 3], oy = orig[i * 3 + 1], oz = orig[i * 3 + 2];
                    const tailFactor = Math.min(ox / 0.55, 1.0);
                    const wagAmount = tailFactor * 0.4 * Math.sin(this._tailPhase + tailFactor * 2.0);
                    posAttr.setX(i, ox); posAttr.setY(i, oy); posAttr.setZ(i, oz + wagAmount);
                }
                posAttr.needsUpdate = true;
                this._tailMesh.geometry.computeVertexNormals();
            }
            _AnimateBody(time) {
                const posAttr = this._bodyMesh.geometry.attributes.position;
                const orig = this._bodyOriginalPositions;
                const count = posAttr.count;
                for (let i = 0; i < count; i++) {
                    const ox = orig[i * 3], oy = orig[i * 3 + 1], oz = orig[i * 3 + 2];
                    const t = (ox + 1.0) / 2.0;
                    const wave = Math.sin(this._bodyWavePhase + t * 4.0) * 0.02 * t;
                    posAttr.setX(i, ox); posAttr.setY(i, oy + wave); posAttr.setZ(i, oz);
                }
                posAttr.needsUpdate = true;
                this._bodyMesh.geometry.computeVertexNormals();
            }
            _AnimateDorsalFin(time) {
                this._dorsalPoints.rotation.z = Math.sin(this._bodyWavePhase * 1.5) * 0.05;
            }
            _AnimateFins(time) {
                const flap = Math.sin(this._bodyWavePhase * 2.0) * 0.15;
                this._pectoralLeftPoints.rotation.x = flap;
                this._pectoralRightPoints.rotation.x = -flap;
                this._pelvicLeftPoints.rotation.x = flap * 0.5;
                this._pelvicRightPoints.rotation.x = -flap * 0.5;
                this._analPoints.rotation.z = Math.sin(this._bodyWavePhase * 1.5) * 0.03;
            }
        }

        class C_BubbleSystem {
            constructor(scene, count, floorY) {
                this._scene = scene;
                this._count = count;
                this._floorY = floorY;
                const canvas = document.createElement('canvas');
                canvas.width = 64; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
                grad.addColorStop(0, 'rgba(200, 240, 255, 0.9)');
                grad.addColorStop(0.3, 'rgba(150, 220, 255, 0.4)');
                grad.addColorStop(0.7, 'rgba(100, 180, 255, 0.1)');
                grad.addColorStop(1, 'rgba(80, 160, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(32, 32, 30, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(200, 240, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(28, 26, 8, 0, Math.PI * 2); ctx.stroke();
                this._texture = new THREE.CanvasTexture(canvas);
                this._positions = new Float32Array(count * 3);
                this._velocities = new Float32Array(count);
                this._sizes = new Float32Array(count);
                this._lifetimes = new Float32Array(count);
                this._maxLifetimes = new Float32Array(count);
                for (let i = 0; i < count; i++) this._ResetBubble(i, true);
                this._geometry = new THREE.BufferGeometry();
                this._geometry.setAttribute('position', new THREE.BufferAttribute(this._positions, 3));
                this._geometry.setAttribute('size', new THREE.BufferAttribute(this._sizes, 1));
                this._material = new THREE.ShaderMaterial({
                    uniforms: { uTexture: { value: this._texture }, uTime: { value: 0 } },
                    vertexShader: `
                        attribute float size;
                        uniform float uTime;
                        varying float vAlpha;
                        void main() {
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = clamp(size * (200.0 / -mvPosition.z), 1.0, 16.0);
                            gl_Position = projectionMatrix * mvPosition;
                            vAlpha = 0.6 + 0.4 * sin(uTime * 2.0 + position.y);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D uTexture;
                        varying float vAlpha;
                        void main() {
                            vec4 tex = texture2D(uTexture, gl_PointCoord);
                            gl_FragColor = vec4(tex.rgb, tex.a * vAlpha);
                        }
                    `,
                    transparent: true, depthWrite: false, fog: false,
                });
                this._points = new THREE.Points(this._geometry, this._material);
                this._points.frustumCulled = false;
                this._points.layers.set(BLOOM_LAYER);
                this._scene.add(this._points);
            }
            _ResetBubble(i, initial) {
                this._positions[i * 3] = (Math.random() - 0.5) * FISH_WORLD_BOUNDS * 2;
                this._positions[i * 3 + 1] = initial ? this._floorY + Math.random() * 15 - 6 : this._floorY - 6 + Math.random() * 2;
                this._positions[i * 3 + 2] = (Math.random() - 0.5) * FISH_WORLD_BOUNDS * 2;
                this._velocities[i] = 0.3 + Math.random() * 0.6;
                this._sizes[i] = 0.08 + Math.random() * 0.15;
                this._maxLifetimes[i] = 8 + Math.random() * 12;
                this._lifetimes[i] = 0;
            }
            Update(time, deltaTime) {
                this._material.uniforms.uTime.value = time;
                for (let i = 0; i < this._count; i++) {
                    this._lifetimes[i] += deltaTime;
                    if (this._lifetimes[i] >= this._maxLifetimes[i]) { this._ResetBubble(i, false); continue; }
                    this._positions[i * 3] += Math.sin(time * 0.8 + i * 1.3) * deltaTime * 0.15;
                    this._positions[i * 3 + 1] += this._velocities[i] * deltaTime;
                    this._positions[i * 3 + 2] += Math.cos(time * 0.6 + i * 0.9) * deltaTime * 0.1;
                    if (this._positions[i * 3 + 1] > this._floorY + 10) this._ResetBubble(i, false);
                }
                this._geometry.attributes.position.needsUpdate = true;
                this._geometry.attributes.size.needsUpdate = true;
            }
            destructor() {
                this._scene.remove(this._points);
                this._geometry.dispose();
                this._material.dispose();
            }
        }

        class C_Cat extends FC_GameObject {

            _Flag_Loaded = false;
            _State = "Walking"; // "Walking", "Running", "Sitting"
            _MoveSpeed = 0.1;
            _RunSpeed = 1.5;
            _Fleeing = false;
            _Timer_Wander = 0;
            _WanderInterval = 5 + Math.random() * 5;
            _WanderDir = new THREE.Vector3(1, 0, 0);
            _AnimationSpeed = 0.01;
            _LastUpdateTime = performance.now();
            _AnimationDelta = 0;
            _PauseAnimation = false;
            _BirthBlend = null;
            _BirthBlendDuration = 2.0;
            _BirthSnapshot = null;

            get Flag_Loaded() { return this._Flag_Loaded; }
            get Position() { return this._Object ? this._Object.position : new THREE.Vector3(); }

            set Position(_vector3) { if (this._Object) this._Object.position.set(_vector3.x, _vector3.y, _vector3.z); }

            constructor() {

                    (_model) => {

                        this._Object = _model;

                        const createRing = (radius, color) => {
                            const segments = 64;
                            const geometry = new THREE.BufferGeometry();
                            const points = [];
                            for (let i = 0; i <= segments; i++) {
                                const theta = (i / segments) * Math.PI * 2;
                                points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
                            }
                            geometry.setFromPoints(points);
                            const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.9, linewidth: 3, fog: false });
                            const ring = new THREE.Line(geometry, material);

                        this._ring3 = createRing(1.5, 0xff3333);
                        this._ring5 = createRing(4.0, 0x3333ff);
                        this._ring3.position.set(0, 0, 0);
                        this._ring5.position.set(0, 0, 0);

                        this._ring5.visible = false;
                        Scene.add(this._ring3);
                        Scene.add(this._ring5);

                        const glowCanvas = document.createElement('canvas');
                        glowCanvas.width = 64; glowCanvas.height = 64;
                        const gCtx = glowCanvas.getContext('2d');
                        const grad = gCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
                        grad.addColorStop(0, 'rgba(255,255,255,1)');
                        grad.addColorStop(0.15, 'rgba(200,220,255,0.7)');
                        grad.addColorStop(0.5, 'rgba(160,200,255,0.2)');
                        grad.addColorStop(1, 'rgba(160,200,255,0)');
                        gCtx.fillStyle = grad;
                        gCtx.fillRect(0, 0, 64, 64);
                        const glowTexture = new THREE.CanvasTexture(glowCanvas);

                        const meshes = [];
                        _model.traverse((child) => { if (child.isMesh) meshes.push(child); });
                        this._SkinnedPointsData = [];
                        for (const mesh of meshes) {
                            const ptsMat = new THREE.PointsMaterial({ color: 0xbbddff, size: 0.002, map: glowTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, sizeAttenuation: true });
                            ptsMat.opacity = 0;
                            const pts = new THREE.Points(mesh.geometry.clone(), ptsMat);
                            mesh.add(pts);
                            mesh.material.transparent = true;
                            mesh.material.opacity = 0;
                            mesh.material.depthWrite = false;
                            if (mesh.isSkinnedMesh) {
                                const pos = mesh.geometry.attributes.position.array.slice();
                                this._SkinnedPointsData.push({
                                    mesh: mesh,
                                    points: pts,
                                    material: ptsMat,
                                    bindPositions: pos,
                                    ptsPositions: pts.geometry.attributes.position.array,
                                    skinIndex: mesh.geometry.attributes.skinIndex,
                                    skinWeight: mesh.geometry.attributes.skinWeight,

                        this._Flag_Loaded = true;

            destructor() { Scene.remove(this._Object); }

            _PlayAnimation(index, loop = true, fadeDuration = 0.3) {
                if (!this._AnimationControler || !this._Object || !this._Object.animations[index]) return;

                const newAction = this._AnimationControler.clipAction(this._Object.animations[index]);
                if (!loop) {
                    newAction.setLoop(THREE.LoopOnce, 1);
                    newAction.clampWhenFinished = true;
                } else {
                    newAction.setLoop(THREE.LoopRepeat);
                }
                newAction.reset();

                if (this._CurrentAction && this._CurrentAction !== newAction) {
                    this._CurrentAction.crossFadeTo(newAction, fadeDuration, true);
                }

                newAction.play();
                this._CurrentAction = newAction;
            }

            CapturePointsSnapshot() {
                if (!this._SkinnedPointsData || this._BirthSnapshot !== null) return;
                this._BirthSnapshot = [];
                for (const data of this._SkinnedPointsData) {
                    this._BirthSnapshot.push(data.ptsPositions.slice());
                }
            }

            BeginBirthBlend(fadeDuration = 0.5) {
                if (this._BirthBlend !== null) return;
                this._BirthBlend = 0;
                this._BirthBlendDuration = fadeDuration;
                this._PauseAnimation = false;
            }

            _PickRandomWanderDir() {
                const angle = Math.random() * Math.PI * 2;
                this._WanderDir.set(Math.cos(angle), 0, Math.sin(angle));
                this._WanderInterval = 5 + Math.random() * 5;
                this._Timer_Wander = 0;
            }

            Update(playerFloor, isPlayerInElevator, playerPos, isCrouched, isMovingInput) {
                if (!this._Flag_Loaded || !this._Object) return;
                if (this._PauseAnimation) {
                    this._LastUpdateTime = performance.now();
                    return;
                }

                const now = performance.now();
                this._AnimationDelta = Math.min((now - this._LastUpdateTime) / 1000, 0.1) * (this._AnimationSpeed * FC_Environment.FPS);
                this._LastUpdateTime = now;

                if (this._BirthBlend !== null) {
                    this._BirthBlend += FC_Environment.TIME_DELTA;
                    if (this._BirthBlend >= this._BirthBlendDuration) {
                        this._BirthBlend = null;
                        this._BirthSnapshot = null;
                    }
                }

                const targetFloorY = playerFloor * 5;
                if (!Manager._Elevator.isMoving && Math.abs(this.Position.y - targetFloorY) > 0.01) {
                    this.Position = new THREE.Vector3(this.Position.x, targetFloorY, this.Position.z);
                }

                const distToPlayer = playerPos ? new THREE.Vector3(playerPos.x, this.Position.y, playerPos.z).distanceTo(this.Position) : 999;
                const elevatorCenter = new THREE.Vector3(0, this.Position.y, 0);
                const distToElevator = this.Position.distanceTo(elevatorCenter);

                let moveDir = new THREE.Vector3();
                let speed = 0;
                let isRunning = false;
                let shouldSit = false;

                if (isPlayerInElevator) {
                    this._Fleeing = false;
                    const toElevator = new THREE.Vector3().subVectors(elevatorCenter, this.Position);
                    toElevator.y = 0;
                    if (toElevator.length() > 0.75) {
                        moveDir.copy(toElevator).normalize();
                        speed = this._RunSpeed;
                        isRunning = true;
                    } else {
                        shouldSit = true;
                    }
                } else if (this._Fleeing || (distToPlayer < 2.0 && isMovingInput && !isCrouched && distToElevator > 0.75)) {
                    this._Fleeing = true;
                    const away = new THREE.Vector3().subVectors(this.Position, playerPos);
                    away.y = 0;
                    if (away.length() < 0.01) away.set(2, 0, 0);
                    moveDir.copy(away).normalize();
                    speed = this._RunSpeed;
                    isRunning = true;
                    if (distToPlayer > 4.0) {
                        this._Fleeing = false;
                    }
                } else if (distToPlayer < 4.0 && isCrouched) {
                    this._Fleeing = false;
                    if (distToPlayer <= 0.2) {
                        shouldSit = true;
                    } else {
                        const toPlayer = new THREE.Vector3().subVectors(playerPos, this.Position);
                        toPlayer.y = 0;
                        moveDir.copy(toPlayer).normalize();
                        speed = this._MoveSpeed;
                    }
                } else {
                    this._Fleeing = false;
                    this._Timer_Wander += FC_Environment.TIME_DELTA;
                    if (this._Timer_Wander >= this._WanderInterval) {
                        this._PickRandomWanderDir();
                    }
                    moveDir.copy(this._WanderDir);
                    speed = this._MoveSpeed;
                }

                if (shouldSit) {
                    if (this._State !== "Sitting") {
                        this._State = "Sitting";
                        this._PlayAnimation(3, false);
                    }
                    this._AnimationControler.update(this._AnimationDelta);
                    this._UpdateSkinnedPoints();
                    return;
                }

                if (isRunning) {
                    if (this._State !== "Running") {
                        this._State = "Running";
                        this._PlayAnimation(2, true);
                    }
                } else {
                    if (this._State === "Sitting" || this._State === "Running") {
                        this._State = "Walking";
                        this._PlayAnimation(0, true);
                    }
                }

                if (speed > 0 && moveDir.length() > 0.001) {
                    const targetPos = this.Position.clone().add(moveDir);
                    const dummy = this._Object.clone();
                    dummy.position.copy(this.Position);
                    dummy.lookAt(targetPos);
                    const targetQuaternion = dummy.quaternion.clone();
                    const rotationSpeed = isRunning ? 2.0 : 0.3;
                    this._Object.quaternion.slerp(targetQuaternion, rotationSpeed * FC_Environment.TIME_DELTA);

                    const forwardDir = new THREE.Vector3(0, 0, 1).applyQuaternion(this._Object.quaternion);
                    this._Object.position.addScaledVector(forwardDir, speed * FC_Environment.TIME_DELTA);
                }

                this._AnimationControler.update(this._AnimationDelta);
                this._UpdateSkinnedPoints();
            }

            _UpdateSkinnedPoints() {
                if (!this._SkinnedPointsData) return;
                const blending = this._BirthSnapshot !== null && this._BirthBlend !== null;
                const blendT = blending ? Math.min(1.0, this._BirthBlend / this._BirthBlendDuration) : 0;
                const blendP = blendT * blendT * (3 - 2 * blendT);
                for (let di = 0; di < this._SkinnedPointsData.length; di++) {
                    const data = this._SkinnedPointsData[di];
                    const snap = blending ? this._BirthSnapshot[di] : null;
                    const mesh = data.mesh;
                    const skeleton = mesh.skeleton;
                    skeleton.update();
                    const bm = skeleton.boneMatrices;
                    const bindM = mesh.bindMatrix.elements;
                    const bindMI = mesh.bindMatrixInverse.elements;
                    const src = data.bindPositions;
                    const dst = data.ptsPositions;
                    const sidx = data.skinIndex.array;
                    const swgt = data.skinWeight.array;
                    const n = src.length / 3;
                    for (let i = 0; i < n; i++) {
                        const i3 = i * 3, i4 = i * 4;
                        const lx = src[i3], ly = src[i3 + 1], lz = src[i3 + 2];
                        const bx = bindM[0] * lx + bindM[4] * ly + bindM[8] * lz + bindM[12];
                        const by = bindM[1] * lx + bindM[5] * ly + bindM[9] * lz + bindM[13];
                        const bz = bindM[2] * lx + bindM[6] * ly + bindM[10] * lz + bindM[14];
                        const bw = bindM[3] * lx + bindM[7] * ly + bindM[11] * lz + bindM[15];
                        let sx = 0, sy = 0, sz = 0, sw = 0;
                        for (let j = 0; j < 4; j++) {
                            const w = swgt[i4 + j];
                            if (w === 0) continue;
                            const idx = sidx[i4 + j] * 16;
                            sx += (bm[idx] * bx + bm[idx + 4] * by + bm[idx + 8] * bz + bm[idx + 12] * bw) * w;
                            sy += (bm[idx + 1] * bx + bm[idx + 5] * by + bm[idx + 9] * bz + bm[idx + 13] * bw) * w;
                            sz += (bm[idx + 2] * bx + bm[idx + 6] * by + bm[idx + 10] * bz + bm[idx + 14] * bw) * w;
                            sw += (bm[idx + 3] * bx + bm[idx + 7] * by + bm[idx + 11] * bz + bm[idx + 15] * bw) * w;
                        }
                        dst[i3] = bindMI[0] * sx + bindMI[4] * sy + bindMI[8] * sz + bindMI[12] * sw;
                        dst[i3 + 1] = bindMI[1] * sx + bindMI[5] * sy + bindMI[9] * sz + bindMI[13] * sw;
                        dst[i3 + 2] = bindMI[2] * sx + bindMI[6] * sy + bindMI[10] * sz + bindMI[14] * sw;
                        if (snap) {
                            dst[i3] = snap[i3] + (dst[i3] - snap[i3]) * blendP;
                            dst[i3 + 1] = snap[i3 + 1] + (dst[i3 + 1] - snap[i3 + 1]) * blendP;
                            dst[i3 + 2] = snap[i3 + 2] + (dst[i3 + 2] - snap[i3 + 2]) * blendP;
                        }
                    }
                    data.points.geometry.attributes.position.needsUpdate = true;
                }
            }

            SetPointsOpacity(opacity) {
                if (!this._SkinnedPointsData) return;
                for (const data of this._SkinnedPointsData) {
                    if (data.material) data.material.opacity = opacity;
                }
            }

            _CollectMorphTargets(maxCount = 500) {
                if (!this._SkinnedPointsData || this._SkinnedPointsData.length === 0) return new Float32Array(0);
                if (this._Object) this._Object.updateMatrixWorld(true);
                let totalVerts = 0;
                for (const data of this._SkinnedPointsData) {
                    totalVerts += data.points.geometry.attributes.position.count;
                }
                if (totalVerts === 0) return new Float32Array(0);
                const stride = Math.max(1, Math.ceil(totalVerts / maxCount));
                const targets = new Float32Array(maxCount * 3);
                let written = 0;
                for (const data of this._SkinnedPointsData) {
                    const arr = data.points.geometry.attributes.position.array;
                    const n = arr.length / 3;
                    const me = data.mesh.matrixWorld.elements;
                    for (let i = 0; i < n; i += stride) {
                        const lx = arr[i * 3], ly = arr[i * 3 + 1], lz = arr[i * 3 + 2];
                        targets[written * 3] = me[0] * lx + me[4] * ly + me[8] * lz + me[12];
                        targets[written * 3 + 1] = me[1] * lx + me[5] * ly + me[9] * lz + me[13];
                        targets[written * 3 + 2] = me[2] * lx + me[6] * ly + me[10] * lz + me[14];
                        written++;
                        if (written >= maxCount) break;
                    }
                    if (written >= maxCount) break;
                }
                return targets.subarray(0, written * 3);
            }
        }

                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vWorldPosition;
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                            vWorldPosition = worldPosition.xyz;
                            vec4 mvPosition = viewMatrix * worldPosition;

                        uniform float uTime;

                        uniform vec3 uBaseColor;

                        void main() {

                            vec3 refracted = refract(-viewDir, normal, 0.67);

                            vec3 lightDir1 = normalize(vec3(1.0, 1.0, 0.5));
                            vec3 lightDir2 = normalize(vec3(-0.5, 0.5, -1.0));

            updateHomeMusicAnchor() {
                if (!this._BalloonHome || !this._BalloonMusic) return;
                const dt = FC_Environment.TIME_DELTA;
                const px = Player.Position.x;
                const py = Player.Position.y;
                const pz = Player.Position.z;

                this._updateBalloon(this._BalloonHome, dt, px, py + 0.5, pz);
                this._updateBalloon(this._BalloonMusic, dt, px, py + 0.5, pz);

                const bx = this._BalloonHome.pos.x - this._BalloonMusic.pos.x;
                const by = this._BalloonHome.pos.y - this._BalloonMusic.pos.y;
                const bz = this._BalloonHome.pos.z - this._BalloonMusic.pos.z;
                const bDist = Math.sqrt(bx * bx + by * by + bz * bz);
                const minDist = 0.225;
                if (bDist < minDist && bDist > 0.001) {
                    const nx = bx / bDist, ny = by / bDist, nz = bz / bDist;
                    const overlap = (minDist - bDist) * 0.5;
                    this._BalloonHome.pos.x += nx * overlap;
                    this._BalloonHome.pos.y += ny * overlap;
                    this._BalloonHome.pos.z += nz * overlap;
                    this._BalloonMusic.pos.x -= nx * overlap;
                    this._BalloonMusic.pos.y -= ny * overlap;
                    this._BalloonMusic.pos.z -= nz * overlap;
                    const relV = (this._BalloonHome.vel.x - this._BalloonMusic.vel.x) * nx
                        + (this._BalloonHome.vel.y - this._BalloonMusic.vel.y) * ny
                        + (this._BalloonHome.vel.z - this._BalloonMusic.vel.z) * nz;
                    if (relV > 0) {
                        this._BalloonHome.vel.x -= nx * relV;
                        this._BalloonHome.vel.y -= ny * relV;
                        this._BalloonHome.vel.z -= nz * relV;
                        this._BalloonMusic.vel.x += nx * relV;
                        this._BalloonMusic.vel.y += ny * relV;
                        this._BalloonMusic.vel.z += nz * relV;
                    }
                }

                this._UI_Home.Position.copy(this._BalloonHome.pos);
                this._UI_Music.Position.copy(this._BalloonMusic.pos);

                if (this._Button_Home) this._Button_Home.position.copy(this._BalloonHome.pos);
                if (this._Button_Music) this._Button_Music.position.copy(this._BalloonMusic.pos);

                const lookTarget = new THREE.Vector3(px, py, pz);
                this._UI_Home.LookAt(lookTarget);
                this._UI_Music.LookAt(lookTarget);
            }
            _updateBalloon(b, dt, playerX, anchorY, playerZ) {
                b.timer += dt;
                if (b.timer >= b.interval) {
                    b.timer = 0;
                    b.interval = 3.0 + Math.random() * 5.0;
                    const angle = Math.random() * Math.PI * 2;
                    const strength = 0.06 + Math.random() * 0.1;
                    b.driftDir.set(
                        Math.cos(angle) * strength,
                        (Math.random() - 0.5) * 0.08,
                        Math.sin(angle) * strength
                    );
                }

                b.driftDir.x += Math.sin(performance.now() * 0.0008 + b.timer) * 0.001;
                b.driftDir.z += Math.cos(performance.now() * 0.0011 + b.timer) * 0.001;

                b.vel.x += b.driftDir.x * dt;
                b.vel.y += b.driftDir.y * dt;
                b.vel.z += b.driftDir.z * dt;

                const damp = Math.pow(0.95, dt * 60);
                b.vel.multiplyScalar(damp);

                b.pos.addScaledVector(b.vel, dt);

                const dx = b.pos.x - playerX;
                const dz = b.pos.z - playerZ;
                const hDist = Math.sqrt(dx * dx + dz * dz);
                if (hDist > 2.0 && hDist > 0.001) {
                    const pull = (2.0 - hDist) / hDist;
                    b.pos.x += dx * pull * 0.5;
                    b.pos.z += dz * pull * 0.5;
                    b.vel.x *= 0.6;
                    b.vel.z *= 0.6;
                }

                const dy = b.pos.y - anchorY;
                if (dy > 0.5) {
                    b.pos.y = anchorY + 0.5;
                    b.vel.y *= 0.3;
                }
            }

            resolvePlayerCollision(player) {
                const half = new THREE.Vector3(0.28, 0.82, 0.28);
                const p = player.Position.clone();
                const playerMin = new THREE.Vector3();
                const playerMax = new THREE.Vector3();
                const playerBox = new THREE.Box3();

                for (let i = 0; i < this._CollisionBoxes.length; i++) {
                    const b = this._CollisionBoxes[i];
                    playerMin.set(p.x - half.x, p.y - half.y, p.z - half.z);
                    playerMax.set(p.x + half.x, p.y + half.y, p.z + half.z);
                    playerBox.min.copy(playerMin);
                    playerBox.max.copy(playerMax);
                    if (!playerBox.intersectsBox(b)) continue;

                    const overlapX = Math.min(playerBox.max.x - b.min.x, b.max.x - playerBox.min.x);
                    const overlapY = Math.min(playerBox.max.y - b.min.y, b.max.y - playerBox.min.y);
                    const overlapZ = Math.min(playerBox.max.z - b.min.z, b.max.z - playerBox.min.z);
                    if (overlapX <= 0 || overlapY <= 0 || overlapZ <= 0) continue;

                    const centerPlayer = playerBox.getCenter(new THREE.Vector3());
                    const centerBox = b.getCenter(new THREE.Vector3());

                    if (overlapX <= overlapY && overlapX <= overlapZ) {
                        p.x += centerPlayer.x < centerBox.x ? -overlapX : overlapX;
                    } else if (overlapY <= overlapX && overlapY <= overlapZ) {
                        p.y += centerPlayer.y < centerBox.y ? -overlapY : overlapY;
                    } else {
                        p.z += centerPlayer.z < centerBox.z ? -overlapZ : overlapZ;
                    }
                }

                if (this._CollisionCylinders) {
                    for (let i = 0; i < this._CollisionCylinders.length; i++) {
                        const c = this._CollisionCylinders[i];
                        const dx = p.x - c.x;
                        const dz = p.z - c.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        const minDist = c.radius + half.x;
                        if (dist < minDist && dist > 0.0001) {
                            const push = (minDist - dist) / dist;
                            p.x += dx * push;
                            p.z += dz * push;
                        }
                    }
                }
                player.Position.copy(p);
            }

                    if (mat.opacity < 0) mat.opacity = 0;

                text_plane.Mesh_Front.position.set(0, y, 0);
                text_plane.Mesh_Back.position.set(0, y, 0);
                text_plane.Mesh_Front.rotation.set(0, 0, 0);
                text_plane.Mesh_Back.rotation.set(0, 0, 0);
            }
            applyAspectRatioToImageObject(image_obj, image_path) {
                const temp_image = new Image();
                temp_image.onload = () => {
                    const width = temp_image.width;
                    const height = temp_image.height;
                    if (!width || !height) return;

                    const scale_x = width >= height ? width / height : 1;
                    const scale_y = width >= height ? 1 : height / width;
                    image_obj.Scale = new THREE.Vector2(scale_x, scale_y);
                    image_obj._FrameScale = new THREE.Vector3(scale_x, 1, scale_y);
                    this.updateFrameInstanceMatrix(image_obj);
                };
                temp_image.onerror = () => {
                    image_obj.Scale = new THREE.Vector2(1, 1);
                    image_obj._FrameScale = new THREE.Vector3(1, 1, 1);
                    this.updateFrameInstanceMatrix(image_obj);
                };
                temp_image.src = image_path;
            }
            updateFrameInstanceMatrix(image_obj) {
                if (!this.instancedMesh) return;

                const index = this._Images.indexOf(image_obj);
                if (index < 0) return;

                const matrix = new THREE.Matrix4();
                const position = new THREE.Vector3().copy(image_obj.Position);
                const quaternion = new THREE.Quaternion().setFromEuler(image_obj.Rotation);
                const local_rotation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
                quaternion.multiply(local_rotation);
                const is_visible = this._CurrentVisibleFrameFloor < 0 || image_obj._FloorIndex === this._CurrentVisibleFrameFloor;
                const scale = is_visible
                    ? (image_obj._FrameScale || new THREE.Vector3(1, 1, 1))
                    : new THREE.Vector3(0, 0, 0);

                matrix.compose(position, quaternion, scale);
                this.instancedMesh.setMatrixAt(index, matrix);
                this.instancedMesh.instanceMatrix.needsUpdate = true;
            }
            getFloorIndexFromY(y) {
                const floor_count = this._Elevator ? this._Elevator.floors : 5;
                const floor_index = Math.round((y - this._Frame_BaseY) / this._Floor_Height);
                return THREE.MathUtils.clamp(floor_index, 0, floor_count - 1);
            }
            updateFrameVisibilityByPlayerFloor() {
                if (!this.instancedMesh) return;
                const player_floor = this.getFloorIndexFromY(Player.Position.y);
                this.updateFrameVisibilityByFloor(player_floor);
            }
            updateFrameVisibilityByFloor(floor_index) {
                if (!this.instancedMesh || floor_index === this._CurrentVisibleFrameFloor) return;
                this._CurrentVisibleFrameFloor = floor_index;

                this.setSakuraVisibility(floor_index === 1);

                const matrix = new THREE.Matrix4();
                const position = new THREE.Vector3();
                const quaternion = new THREE.Quaternion();
                const hidden_scale = new THREE.Vector3(0, 0, 0);
                const local_rotation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);

                for (let i = 0; i < this._Images.length; i++) {
                    const image = this._Images[i];
                    position.copy(image.Position);
                    quaternion.setFromEuler(image.Rotation).multiply(local_rotation);
                    const scale = image._FloorIndex === floor_index
                        ? (image._FrameScale || new THREE.Vector3(1, 1, 1))
                        : hidden_scale;
                    matrix.compose(position, quaternion, scale);
                    this.instancedMesh.setMatrixAt(i, matrix);
                }
                this.instancedMesh.instanceMatrix.needsUpdate = true;
            }

        }

        const Environment = new FC_Environment();
        const Camera = new FC_Camera_Controller(Renderer);
        const _BloomCamera = Camera.Object.clone();
        _BloomCamera.layers.set(BLOOM_LAYER);
        _FishRenderPass.camera = _BloomCamera;
        const Light_Ambient = new FC_Light_Ambient(Scene);
        const Light_Directional = new FC_Light_Directional(Scene);
        window.addEventListener('resize', () => {
            Camera.Resize_Screen();
            _BloomComposer.setSize(window.innerWidth, window.innerHeight);
            const _w = window.innerWidth, _h = window.innerHeight;
            _SceneTarget.setSize(_w, _h);
            _SceneTarget.depthTexture.image.width = _w;
            _SceneTarget.depthTexture.image.height = _h;
            _SceneTarget.depthTexture.needsUpdate = true;
            _BloomDepthTarget.setSize(_w, _h);
            _BloomDepthTarget.depthTexture.image.width = _w;
            _BloomDepthTarget.depthTexture.image.height = _h;
            _BloomDepthTarget.depthTexture.needsUpdate = true;
        }, false);

        const Manager = new C_Manager();
        const Cat = new C_Cat();
        const Player = new FC_Player_Controller(Scene);
        let PressedButtonType = null;
        let isCrouched = false;
        let targetPlayerY = 1.74 - 0.08;

        document.addEventListener('keyup', (event) => {
            if (event.key === 'Control' || event.code === 'ControlLeft' || event.code === 'ControlRight') {
                isCrouched = !isCrouched;
                const floorBaseY = Manager ? Manager.getFloorIndexFromY(Player.Position.y) * 5 : 0;
                const defaultHeight = floorBaseY + (1.74 - 0.08);
                const crouchedHeight = floorBaseY + 0.5;
                targetPlayerY = isCrouched ? crouchedHeight : defaultHeight;
            }
        });

        Manager.Initialize();
        Manager.Update();

        function getScreenXY(event) {
            switch (event.type) {
                case "touchstart":
                    return { x: event.touches[0].clientX, y: event.touches[0].clientY };
                case "touchend":
                    return { x: event.changedTouches[0].clientX, y: event.changedTouches[0].clientY };
                case "pointerdown":
                case "pointerup":
                case "mousedown":
                case "mouseup":
                    return { x: event.clientX, y: event.clientY };
                default:
                    return null;
            }
        }
        function getButtonTypeFromRaycast(raycaster) {
            const targets = [
                Manager._Button_Home,
                Manager._Button_Music
            ].filter(Boolean);
            const hits = raycaster.intersectObjects(targets, false);
            if (hits.length === 0) return null;
            return hits[0].object.userData.buttonType || null;
        }

        function PointerDown(event) {
            if (Manager.Timer_Input.Flag_Finished) {
                const point = getScreenXY(event);
                if (!point) return;
                const screen_x = point.x;
                const screen_y = point.y;

                const screen_position = new THREE.Vector2(
                    (screen_x / window.innerWidth) * 2 - 1,
                    -(screen_y / window.innerHeight) * 2 + 1
                );
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(screen_position, Camera.Object);
                PressedButtonType = getButtonTypeFromRaycast(raycaster);

                switch (Manager.State) {
                    case "Playing":
                        break;
                    case "Waiting_Restart":
                        Manager.Fade(false);
                        setTimeout(() => {
                            Manager.Initialize();
                            Manager.Fade(true);
                        }, 1000);
                        break;
                }

                if (Manager.State === "Playing" && Manager._Elevator.checkPlayerInElevator(Player)) {
                    const selectedFloor = Manager._Elevator.getFloorFromRaycast(raycaster);
                    if (selectedFloor !== null) {
                        Manager._Elevator.activateElevator(Player, selectedFloor);
                    }
                }

                Manager.Timer_Input.Restart();
            }
        }
        function PointerUp(event) {
            const point = getScreenXY(event);
            if (!point) return;

            const screen_position = new THREE.Vector2(
                (point.x / window.innerWidth) * 2 - 1,
                -(point.y / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(screen_position, Camera.Object);
            const releasedButtonType = getButtonTypeFromRaycast(raycaster);

            if (PressedButtonType && PressedButtonType === releasedButtonType) {
                if (releasedButtonType === 'home') {
                    PressedButtonType = null;
                    window.location.href = "./index.html";
                    return;
                }
                if (releasedButtonType === 'music') {
                    PressedButtonType = null;
                    Manager.BGM.Flag_Playing ? Manager.BGM.Stop() : Manager.BGM.Play();
                    return;
                }
            }
            PressedButtonType = null;
        }
    </script>
