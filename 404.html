<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="F U M">
    <meta name="robots" content="noindex, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B89KY0993B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-B89KY0993B');
    </script>

    <link rel="icon" type="image/x-icon" href="Asset/Image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="Asset/Image/Icon_1_2.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <title>404 Not Found | FUM Website</title>
    <meta name="description" content="The page you are looking for could not be found. Return to the FUM Website home page.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: #000;
            color: #e6f4ff;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
        }

        #StarField {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            display: block;
        }

        .NotFound_Wrap {
            position: relative;
            z-index: 1;
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .Code404 {
            font-weight: 800;
            font-size: clamp(6rem, 22vw, 14rem);
            line-height: 1;
            letter-spacing: 0.08em;
            color: transparent;
            -webkit-text-stroke: 2px #00ffcc;
            text-shadow: 0 0 24px rgba(0, 255, 204, 0.35);
            animation: Float_404 5s ease-in-out infinite;
            user-select: none;
        }

        @keyframes Float_404 {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-14px);
            }
        }

        .Signal {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #7f9bb0;
        }

        .Signal_Dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff5252;
            box-shadow: 0 0 8px rgba(255, 82, 82, 0.9);
            animation: Blink_Signal 1.4s step-end infinite;
        }

        @keyframes Blink_Signal {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.15;
            }
        }

        .Message {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 700;
            color: #e6f4ff;
        }

        .SubMessage {
            max-width: 34rem;
            font-size: 0.85rem;
            line-height: 1.8;
            color: #9ab2c4;
        }

        .Actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .Btn_Home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.4rem;
            height: 3.4rem;
            background: #00ffcc;
            color: #001a15;
            border: 1px solid #00ffcc;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .Btn_Home svg {
            width: 1.4rem;
            height: 1.4rem;
            fill: currentColor;
        }

        .Btn_Home:hover,
        .Btn_Home:focus-visible {
            background: transparent;
            color: #00ffcc;
            box-shadow: 0 0 18px rgba(0, 255, 204, 0.45);
        }

        .Frame_Corner {
            position: fixed;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(0, 255, 204, 0.5);
            z-index: 1;
            pointer-events: none;
        }

        .Frame_TL {
            top: 14px;
            left: 14px;
            border-right: none;
            border-bottom: none;
        }

        .Frame_TR {
            top: 14px;
            right: 14px;
            border-left: none;
            border-bottom: none;
        }

        .Frame_BL {
            bottom: 14px;
            left: 14px;
            border-right: none;
            border-top: none;
        }

        .Frame_BR {
            bottom: 14px;
            right: 14px;
            border-left: none;
            border-top: none;
        }

        @media (prefers-reduced-motion: reduce) {

            .Code404,
            .Signal_Dot {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <canvas id="StarField" aria-hidden="true"></canvas>

    <span class="Frame_Corner Frame_TL" aria-hidden="true"></span>
    <span class="Frame_Corner Frame_TR" aria-hidden="true"></span>
    <span class="Frame_Corner Frame_BL" aria-hidden="true"></span>
    <span class="Frame_Corner Frame_BR" aria-hidden="true"></span>

    <main class="NotFound_Wrap">
        <h1 class="Code404">404</h1>

        <p class="Signal">
            <span class="Signal_Dot" aria-hidden="true"></span>
            Signal Lost
        </p>

        <p class="Message">Page not found</p>

        <p class="SubMessage">
            The page you are looking for drifted out of orbit or does not exist.
            Tap the home icon below to return to a stable trajectory.
        </p>

        <nav class="Actions" aria-label="Recovery navigation">
            <a class="Btn_Home" href="English/HTML/index.html" aria-label="Back to Home">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3 2 12h3v8a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-8h3z" />
                </svg>
            </a>
        </nav>
    </main>

    <script>
        (function () {
            'use strict';

            /* ---- 星空キャンバス ---- */
            var canvas = document.getElementById('StarField');
            var ctx = canvas.getContext('2d');
            var stars = [];
            var width = 0;
            var height = 0;
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function Resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                BuildStars();
            }

            function BuildStars() {
                var count = Math.round((width * height) / 6000);
                stars = [];
                for (var i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        r: Math.random() * 1.4 + 0.3,
                        speed: Math.random() * 0.35 + 0.05,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function Draw(time) {
                ctx.clearRect(0, 0, width, height);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    var twinkle = reducedMotion ? 1 : 0.55 + 0.45 * Math.sin(time * 0.0015 + s.phase);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200, 230, 255,' + (twinkle * 0.9).toFixed(3) + ')';
                    ctx.fill();
                    if (!reducedMotion) {
                        s.y += s.speed;
                        if (s.y > height + 2) {
                            s.y = -2;
                            s.x = Math.random() * width;
                        }
                    }
                }
                requestAnimationFrame(Draw);
            }

            window.addEventListener('resize', Resize);
            Resize();
            requestAnimationFrame(Draw);
        })();
    </script>
</body>

</html>
