<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Sakura Tree - Pathfinding Growth</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #1d2633, #0b0f15);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #respawnBtn {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(255, 130, 160, 0.9);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 6px 20px rgba(255, 100, 140, 0.4);
            transition: background 0.2s ease, transform 0.1s ease;
            user-select: none;
        }
        #respawnBtn:hover { background: rgba(255, 150, 180, 1); }
        #respawnBtn:active { transform: translateX(-50%) scale(0.96); }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            pointer-events: none;
            transition: opacity 0.6s ease;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="loading">Blooming Sakura...</div>
    <button id="respawnBtn">Grow New Sakura</button>

    <!-- Three.js and OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0f15, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 5;
        controls.maxDistance = 60;
        controls.target.set(0, 8, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xe8f0ff, 0.65);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.6);
        sunLight.position.set(20, 35, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.45);
        fillLight.position.set(-20, 15, -20);
        scene.add(fillLight);

        // Materials
        const barkMaterial = new THREE.MeshStandardMaterial({
            color: 0x3d3532,
            roughness: 0.85,
            metalness: 0.05
        });

        const blossomMaterial = new THREE.MeshStandardMaterial({
            color: 0xffb7c5,
            roughness: 0.85,
            metalness: 0.0,
            side: THREE.DoubleSide
        });

        let treeGroup = new THREE.Group();
        scene.add(treeGroup);

        // Sakura Pathfinder tailored for umbrella / dome canopy
        class SakuraPathfinder {
            constructor(parent = null) {
                if (!parent) {
                    this.location = new THREE.Vector3(0, 0, 0);
                    this.lastLocation = this.location.clone();
                    this.velocity = new THREE.Vector3(0, 1, 0);
                    this.diameter = 1.1;
                    this.isFinished = false;
                    this.age = 0;
                } else {
                    this.location = parent.location.clone();
                    this.lastLocation = parent.lastLocation.clone();
                    this.velocity = parent.velocity.clone();
                    this.diameter = parent.diameter * 0.65;
                    this.isFinished = parent.isFinished;
                    this.age = parent.age + 1;
                    parent.diameter = this.diameter;
                }
            }

            update() {
                if (this.isFinished) return;

                this.lastLocation.copy(this.location);

                if (this.diameter > 0.09) {
                    this.age++;
                    const bump = new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2
                    );
                    this.velocity.normalize();
                    bump.multiplyScalar(0.35);
                    this.velocity.multiplyScalar(0.7);
                    this.velocity.add(bump);
                    
                    // Sakura architectural shaping: Lower trunk goes straight, upper branches spread horizontally & dome outwards
                    const height = this.location.y;
                    if (height < 4.0) {
                        this.velocity.y += 0.35; // Upward trunk
                    } else {
                        // Spread outward into dome/umbrella shape
                        const radialDist = Math.sqrt(this.location.x * this.location.x + this.location.z * this.location.z);
                        if (radialDist < 7.0) {
                            this.velocity.x *= 1.15;
                            this.velocity.z *= 1.15;
                        }
                        this.velocity.y += 0.08; // Gentle upward/outward arch
                    }
                    this.velocity.normalize();

                    const speed = 0.5 + Math.random() * 0.7;
                    const step = this.velocity.clone().multiplyScalar(speed);
                    this.location.add(step);

                    const dist = this.lastLocation.distanceTo(this.location);
                    if (dist > 0.05) {
                        const segGeo = new THREE.CylinderGeometry(this.diameter * 0.72, this.diameter, dist, 5, 1);
                        segGeo.translate(0, dist / 2, 0);
                        const mesh = new THREE.Mesh(segGeo, barkMaterial);
                        mesh.position.copy(this.lastLocation);
                        const upwards = new THREE.Vector3(0, 1, 0);
                        mesh.quaternion.setFromUnitVectors(upwards, this.location.clone().sub(this.lastLocation).normalize());
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        treeGroup.add(mesh);
                    }

                    // Branching probability based on height & age
                    const branchChance = height > 3.0 ? 0.28 : 0.18;
                    if (Math.random() < branchChance && paths.length < 400) {
                        paths.push(new SakuraPathfinder(this));
                    }
                } else {
                    if (!this.isFinished) {
                        this.isFinished = true;
                        // Dense cloud of sakura blossoms at each terminal tip
                        const clusterCount = 3 + Math.floor(Math.random() * 3);
                        for(let c=0; c<clusterCount; c++) {
                            const blossomGeo = new THREE.IcosahedronGeometry(0.75, 0);
                            const blossom = new THREE.Mesh(blossomGeo, blossomMaterial);
                            
                            const offset = new THREE.Vector3(
                                (Math.random() - 0.5) * 2.2,
                                (Math.random() - 0.5) * 1.2,
                                (Math.random() - 0.5) * 2.2
                            );
                            blossom.position.copy(this.location).add(offset);
                            
                            const shade = 0.8 + Math.random() * 0.35;
                            blossom.material = blossomMaterial.clone();
                            blossom.material.color.setRGB(
                                Math.min(1.0, (255 * shade) / 255),
                                Math.min(1.0, ((180 + Math.random() * 50) * shade) / 255),
                                Math.min(1.0, ((195 + Math.random() * 50) * shade) / 255)
                            );
                            
                            const s = 0.7 + Math.random() * 0.9;
                            blossom.scale.set(s * 1.5, s * 0.75, s * 1.5);
                            blossom.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                            blossom.castShadow = true;
                            treeGroup.add(blossom);
                        }
                    }
                }
            }
        }

        let paths = [];

        function generateTree() {
            scene.remove(treeGroup);
            treeGroup = new THREE.Group();
            scene.add(treeGroup);

            paths = [];
            // Multiple paths starting at base for sturdy trunk structure
            const numPaths = 4;
            for (let i = 0; i < numPaths; i++) {
                const p = new SakuraPathfinder();
                const angle = (i / numPaths) * Math.PI * 2;
                p.location.set(Math.cos(angle)*0.2, 0, Math.sin(angle)*0.2);
                p.lastLocation.copy(p.location);
                paths.push(p);
            }
        }

        generateTree();

        function growFullTree() {
            let active = true;
            let safety = 0;
            while(active && safety < 1200) {
                active = false;
                for (let i = 0; i < paths.length; i++) {
                    if (!paths[i].isFinished) {
                        paths[i].update();
                        active = true;
                    }
                }
                safety++;
            }
        }
        growFullTree();

        // Hide loading indicator safely
        const loadingEl = document.getElementById('loading');
        if (loadingEl) {
            loadingEl.style.opacity = '0';
            setTimeout(() => loadingEl.remove(), 500);
        }

        // Respawn button
        const respawnBtn = document.getElementById('respawnBtn');
        respawnBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            generateTree();
            growFullTree();
        });

        // Render loop with gentle breeze
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            treeGroup.rotation.z = Math.sin(elapsedTime * 1.2) * 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
